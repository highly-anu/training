# The CrossFit benchmark workouts — the Girls and three Heroes — as timed
# standards. Formats from docs/extracted/crossfit-journal.md (Fran, Grace,
# Elizabeth, Helen, Annie, Murph) and the CrossFit Journal's published Girls
# and Heroes (Diane, Isabel, Cindy, DT). The tiers are community-wide
# distributions of Rx results, not a package's own numbers: "entry" is a first
# Rx finish, "elite" is Games-regional pace. Men at Rx loads, women at the
# standard Rx' loads (65/95/85 lb etc.), so times are comparable.

- id: wod_fran_minutes
  name: Fran (time in minutes)
  category: benchmark_wod
  domain: mixed_modal_conditioning
  metric_type: time_minutes
  lower_is_better: true
  description: >
    21-15-9 thrusters (95 lb / 65 lb) and pull-ups, for time. The benchmark
    of benchmarks: a measure of how hard you can go for three to ten minutes.
  test_protocol: >
    Thrusters from the floor, full squat to lockout; pull-ups chin over bar,
    kipping allowed. Record total time.
  levels:
    entry:
      male: 12.0
      female: 13.0
      note: A first unbroken-ish Rx finish.
    intermediate:
      male: 8.0
      female: 9.0
    advanced:
      male: 5.0
      female: 6.0
    elite:
      male: 3.5
      female: 4.0
      note: Sub-3:00 is the record territory.
  goal_relevance:
    - crossfit_performance
    - general_gpp
  sources:
    - crossfit

- id: wod_grace_minutes
  name: Grace (time in minutes)
  category: benchmark_wod
  domain: mixed_modal_conditioning
  metric_type: time_minutes
  lower_is_better: true
  description: >
    30 clean and jerks (135 lb / 95 lb) for time. Barbell cycling under
    fatigue; the test of whether the technique survives the clock.
  test_protocol: >
    Ground to overhead, any style, each rep from the floor. Record total time.
  levels:
    entry:
      male: 7.0
      female: 8.0
    intermediate:
      male: 5.0
      female: 6.0
    advanced:
      male: 3.5
      female: 4.0
    elite:
      male: 2.5
      female: 3.0
  goal_relevance:
    - crossfit_performance
  sources:
    - crossfit

- id: wod_helen_minutes
  name: Helen (time in minutes)
  category: benchmark_wod
  domain: mixed_modal_conditioning
  metric_type: time_minutes
  lower_is_better: true
  description: >
    Three rounds: 400 m run, 21 kettlebell swings (53 lb / 35 lb), 12 pull-ups.
    The aerobic Girl — pacing across three rounds matters more than any one.
  test_protocol: >
    Measured 400 m, swings to overhead (American), pull-ups chin over bar.
    Record total time.
  levels:
    entry:
      male: 16.0
      female: 17.0
    intermediate:
      male: 13.0
      female: 14.0
    advanced:
      male: 11.0
      female: 12.0
    elite:
      male: 9.0
      female: 10.0
  goal_relevance:
    - crossfit_performance
    - general_gpp
  sources:
    - crossfit

