# IKMF kettlebell pentathlon — the five timed events, scored as reps in a
# six-minute single-bell set, in competition order.
# Source: IKMF, https://ikmf-world.com/disciplines/ikmf-pentathlon (Valery
# Fedorenko's event): clean, long cycle press, jerk, half snatch, strict push
# press; six minutes each, five minutes rest after each, multiple hand changes
# allowed, the bell may not be set down. Each event caps the reps that score
# (120 / 60 / 120 / 108 / 120), so `elite` here is the cap and nothing above it
# counts. IKMF ranks the pentathlon by points (reps × a bell-weight
# coefficient), which these tables do not reproduce: entry, intermediate and
# advanced are this app's own tiers at 50 %, 75 % and 90 % of the cap, the same
# for men and women — pick the bell, not the table.

- id: kb_pentathlon_clean_reps
  name: KB Pentathlon — Clean (reps in 6 min)
  category: kettlebell
  domain: strength_endurance
  metric_type: reps
  lower_is_better: false
  description: >
    Single-kettlebell clean for six minutes: swing, catch in the rack, back to the swing. The first event.
  test_protocol: >
    One bell of your choice, six minutes continuous without setting it down,
    hand changes as often as you like. The bell stops in the rack each rep. Five minutes rest before the
    next event.
  levels:
    entry:
      male: 60
      female: 60
      note: Half the cap (10 RPM) — this app's tier.
    intermediate:
      male: 90
      female: 90
      note: 75 % of the cap — this app's tier.
    advanced:
      male: 108
      female: 108
      note: 90 % of the cap — this app's tier.
    elite:
      male: 120
      female: 120
      note: The IKMF cap — 120 reps (20 RPM); nothing above it scores.
  goal_relevance:
    - kettlebell_sport
    - general_gpp
  sources:
    - IKMF
  notes: >
    Reps, not points: IKMF scores reps × a bell-weight coefficient. Trained
    with wk_kb_clean_single.

- id: kb_pentathlon_long_cycle_press_reps
  name: KB Pentathlon — Long Cycle Press (reps in 6 min)
  category: kettlebell
  domain: strength_endurance
  metric_type: reps
  lower_is_better: false
  description: >
    A clean and a strict press every rep, for six minutes. The second event and the slowest.
  test_protocol: >
    One bell of your choice, six minutes continuous without setting it down,
    hand changes as often as you like. A still moment in the rack between clean and press; no knee bend before the press; the bell fixed overhead without sway. Five minutes rest before the
    next event.
  levels:
    entry:
      male: 30
      female: 30
      note: Half the cap (5 RPM) — this app's tier.
    intermediate:
      male: 45
      female: 45
      note: 75 % of the cap — this app's tier.
    advanced:
      male: 54
      female: 54
      note: 90 % of the cap — this app's tier.
    elite:
      male: 60
      female: 60
      note: The IKMF cap — 60 reps (10 RPM); nothing above it scores.
  goal_relevance:
    - kettlebell_sport
    - general_gpp
  sources:
    - IKMF
  notes: >
    Reps, not points: IKMF scores reps × a bell-weight coefficient. Trained
    with wk_kb_long_cycle_press.

