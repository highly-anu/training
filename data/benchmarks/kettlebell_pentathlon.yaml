  category: kettlebell
  domain: strength_endurance
  metric_type: reps
  lower_is_better: false
  description: >
    Snatch to a straight-arm lockout, lower to the rack with a stop, drop from the rack into the next swing. The fourth event.
  test_protocol: >
    One bell of your choice, six minutes continuous without setting it down,
    hand changes as often as you like. A stop in the rack on the way down; the bell caught overhead with a straight arm. Five minutes rest before the
    next event.
  levels:
    entry:
      male: 54
      female: 54
      note: Half the cap (9 RPM) — this app's tier.
    intermediate:
      male: 81
      female: 81
      note: 75 % of the cap — this app's tier.
    advanced:
      male: 97
      female: 97
      note: 90 % of the cap — this app's tier.
    elite:
      male: 108
      female: 108
      note: The IKMF cap — 108 reps (18 RPM); nothing above it scores.
  goal_relevance:
