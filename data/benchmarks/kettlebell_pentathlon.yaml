      male: 144
      female: 144
  goal_relevance:
    - kettlebell_sport
  sources:
    - wildman_kettlebell

- id: kb_pentathlon_long_cycle_reps
  name: KB Pentathlon — Long Cycle Clean & Jerk (reps in 6 min)
  category: kettlebell
  domain: strength_endurance
  metric_type: reps
  lower_is_better: false
  description: >
    Clean and jerk, every rep from the swing. The slowest event and the one
    that decides the pentathlon: the clean costs a breath the jerk does not.
  test_protocol: >
    One bell (16 kg men / 12 kg women), six minutes continuous, hand switch
    allowed once. Count locked-out reps only.
  levels:
    entry:
      male: 27
      female: 27
      note: 4–5 RPM.
    intermediate:
      male: 40
      female: 40
      note: ~7 RPM.
    advanced:
      male: 54
      female: 54
      note: The archetype's target — 8–10 RPM at 1 pood.
    elite:
      male: 66
      female: 66
      note: 11 RPM.
  goal_relevance:
    - kettlebell_sport
  sources:
    - wildman_kettlebell
