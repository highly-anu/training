- id: bench_press_bodyweight_reps
  name: PT Test II — Bench Press at Bodyweight (reps)
  category: tactical
  domain: strength_endurance
  metric_type: reps
  lower_is_better: false
  description: >
    Maximum reps at a bar loaded to bodyweight. Horsemen PT Test II: 10.
  test_protocol: >
    Bar weight equal to bodyweight on the day, touch-and-go not allowed —
    pause the bar on the chest. Count full lockouts.
  levels:
    entry:
      male: 1
      female: 1
      note: One rep at bodyweight — the ×1.0 standard.
    intermediate:
      male: 5
      female: 3
    advanced:
      male: 10
      female: 6
      note: Horsemen PT Test II standard.
    elite:
      male: 15
      female: 10
  goal_relevance:
    - sof_operator
  sources:
    - horsemen_gpp
  notes: >
    Women lift the same bar — their own bodyweight — so the rep tiers sit
    lower; the strength ratio behind them is the same.

