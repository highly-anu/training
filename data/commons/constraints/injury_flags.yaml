# Injury Flags
# Each flag defines excluded movement patterns, excluded exercises, modified exercise substitutions,
# the training phase forced by this flag, and clinical context notes.
# IDs must match the enum in constraints.schema.json.
#
# Every id here names an exercise a package declares (tools/validate_entities.py
# checks it). `excluded_exercises` lists only what the flag's movement patterns
# do not already exclude, or names it for clarity. A `modified_exercises` pair
# is declared together in one package (or a package it borrows from), because a
# program draws only on its own packages: a pair across two packages could never
# be given. Until 2026-10-20 most entries named generic movements ("running",
# "overhead_press") no package declares, so no substitute was ever given.

injury_flags:

  - id: knee_meniscus_post_op
    name: Knee Meniscus Post-Op
    excluded_movement_patterns:
      - squat
      - knee_extension
      - ballistic
      - locomotion
    excluded_exercises:
      - front_squat
      - overhead_squat
      - box_jump
      - depth_jump
      - broad_jump
    modified_exercises:
      - instead_of: run_easy
        use: bike_easy
      - instead_of: run_interval
        use: bike_interval
      - instead_of: run_zone2
        use: bike_zone2
    training_phase_forced: post_op
    notes: >
      Weeks 0-8 post-meniscus surgery. Early phase: quad sets, straight leg raises,
      heel slides, ankle pumps, hamstring sets. Mid phase (cleared by surgeon):
      single-leg press light, step-ups, SL deadlift, stationary bike. Late phase:
      partial-range barbell squat, swimming, elliptical. No bilateral loaded squatting,
      running, or impact until surgical clearance. Upper body and aerobic work
      (swimming, bike) permitted from early post-op.

  - id: shoulder_impingement
    name: Shoulder Impingement
    excluded_movement_patterns:
      - vertical_push
      - ballistic
      - olympic_lift
    excluded_exercises:
      - push_press
      - snatch
      - kipping_pull_up
      - overhead_squat
      - wall_ball
      - handstand_push_up
      - ring_dip
    modified_exercises:
      - instead_of: strict_press
        use: floor_press
      - instead_of: push_press
        use: floor_press
      - instead_of: kipping_pull_up
        use: pull_up
      - instead_of: handstand_push_up
        use: push_up
      - instead_of: overhead_squat
        use: front_squat
    training_phase_forced: rehab
    notes: >
      Sub-acromial impingement reduces supraspinatus clearance during overhead motion.
      Avoid all pressing above shoulder height. Permitted: landmine press (shoulder-friendly
      angle), floor press, face pulls (elbows high, full ROM), eccentric push-ups, isometric
      dip support holds, band pull-aparts, DB external rotation. Priority is rotator cuff
      strengthening and scapular stability before reloading overhead patterns.

  - id: shoulder_instability
    name: Shoulder Instability
    excluded_movement_patterns:
      - vertical_push
      - horizontal_push
      - ballistic
      - olympic_lift
    excluded_exercises:
      - push_press
      - snatch
      - bench_press
      - ring_dip
      - kipping_pull_up
      - kb_snatch
    modified_exercises:
      - instead_of: wk_kb_snatch
        use: kb_deadlift
    training_phase_forced: rehab
    notes: >
      Instability (labrum, hypermobility, or post-dislocation) requires avoiding
      end-range loading in abduction and external rotation. Horizontal pressing
      is also restricted until the joint capsule is stable. Focus on rotator cuff
      activation, scapular retraction, and controlled closed-chain loading (bear crawl,
      TGU with weight below shoulder). Progress to loaded pressing only after demonstrating
      full isometric stability. Distinguish from impingement: instability patients may
      tolerate more range but less end-range load.

  - id: lumbar_disc
    name: Lumbar Disc Injury
    excluded_movement_patterns:
      - hip_hinge
      - rotation
      - ballistic
      - olympic_lift
      - loaded_carry
    excluded_exercises:
      - deadlift
      - romanian_deadlift
      - good_morning
      - barbell_row
      - kb_snatch
      - power_clean
      - sit_up
      - v_sit
      - russian_twist
      - back_extension
      - front_squat
      - overhead_squat
    modified_exercises:
      - instead_of: back_squat
        use: kb_squat_goblet
      - instead_of: barbell_row
        use: db_row_single_arm
      - instead_of: kb_swing_two_hand
        use: kb_squat_goblet
      - instead_of: wk_kb_swing_two_hand
        use: wk_kb_squat_goblet
      - instead_of: sit_up
        use: plank_hold
      - instead_of: sit_up
        use: plank
    training_phase_forced: rehab
    notes: >
      Lumbar disc pathology (herniation, bulge, or degenerative disc disease) with
      active symptoms. Avoid flexion under load and rotational loading. McGill Big Three
      (bird dog, dead bug, side plank) are appropriate. Neutral spine must be maintained
      at all times. Stationary bike and swimming are preferred aerobic modes — running
      is permitted only if asymptomatic. Progress hip hinge loading cautiously under
      symptom monitoring. Kettlebell swings and Olympic lifts are deferred until
      asymptomatic and cleared by a clinician.

  - id: ankle_sprain
    name: Ankle Sprain
    excluded_movement_patterns:
      - locomotion
      - ballistic
    excluded_exercises:
      - box_jump
      - broad_jump
      - depth_jump
      - pistol_squat
      - single_leg_squat_box
    modified_exercises:
      - instead_of: run_easy
        use: bike_easy
      - instead_of: run_interval
        use: bike_interval
      - instead_of: run_zone2
        use: bike_zone2
      - instead_of: pistol_squat
        use: squat_air
      - instead_of: pistol_squat
        use: squat_clinic
      - instead_of: single_leg_squat_box
        use: squat_air
    training_phase_forced: rehab
    notes: >
      Grade I-III lateral ankle sprain. Acute phase: RICE, non-weight-bearing aerobic
      (swimming, upper body ergometer). Sub-acute: seated calf raises, alphabet ankle
      circles, proprioception board work. Return to loading: double-leg squat →
      step-up → single-leg balance → jogging → sprinting. No impact or single-leg
      landing until full proprioceptive control is restored. Peroneal strengthening
      is key for preventing recurrence.

  - id: wrist_injury
    name: Wrist Injury
    excluded_movement_patterns:
      - horizontal_push
      - vertical_push
      - olympic_lift
    excluded_exercises:
      - push_up
      - bench_press
      - push_press
      - snatch
      - kb_snatch
      - plank
      - handstand_push_up
      - front_squat
      - rack_carry_barbell
    modified_exercises:
      - instead_of: front_squat
        use: back_squat
      - instead_of: wk_kb_clean_single
        use: kb_deadlift
      - instead_of: plank
        use: side_plank
    training_phase_forced: rehab
    notes: >
      Covers TFCC tears, scaphoid stress, distal radius fractures, and general
      wrist inflammation. Neutral or fist grip positions reduce wrist extension
      stress. Forearm plank replaces standard plank; push-ups on fists or
      parallettes reduce wrist load. Lower body and aerobic work is unrestricted.
      Barbell front rack is particularly aggravating — safety bar or high-bar
      back squat substitution. Return to full wrist loading requires pain-free
      passive extension to 90 degrees.

  - id: hip_flexor_strain
    name: Hip Flexor Strain
    excluded_movement_patterns:
      - hip_flexion
      - ballistic
      - locomotion
    excluded_exercises:
      - sit_up
      - v_sit
      - flutter_kick
      - mountain_climber
      - power_clean
      - weighted_step_up
      - kb_step_up
      - kb_step_up_double
    modified_exercises:
      - instead_of: run_easy
        use: bike_easy
      - instead_of: run_zone2
        use: bike_zone2
      - instead_of: sit_up
        use: plank_hold
      - instead_of: sit_up
        use: plank
      - instead_of: power_clean
        use: deadlift
      - instead_of: mountain_climber
        use: side_plank
    training_phase_forced: rehab
    notes: >
      Iliopsoas or rectus femoris strain. Avoid active hip flexion under load,
      especially at full hip extension range (lunge bottom position). Running
      is typically aggravating — stationary bike at low resistance is the preferred
      aerobic substitute as it keeps hip ROM limited. Eccentric loading of the hip
      flexor (controlled lengthening) is the rehabilitation approach once acute
      symptoms subside. Strength work above the hip (upper body, upper back) is
      unrestricted.

  - id: tennis_elbow
    name: Tennis Elbow (Lateral Epicondylitis)
    excluded_movement_patterns:
      - horizontal_pull
      - vertical_pull
    excluded_exercises:
      - barbell_row
      - pull_up
      - chin_up
      - kb_snatch
      - rope_climb
      - dead_hang
      - wk_kb_clean_single
      - kb_clean_double
      - farmer_carry_kb
      - farmer_carry_barbell
      - farmer_carry_thick_grip
      - kb_farmer_carry
      - kb_farmer_carry_double
    modified_exercises:
      - instead_of: wk_kb_snatch
        use: kb_deadlift
    training_phase_forced: rehab
    notes: >
      Lateral epicondylitis — extensor origin tendinopathy at the lateral elbow.
      Aggravated by gripping with wrist in neutral-to-extension under load. Pulling
      movements are typically provocative. Eccentric wrist extension (Tyler Twist
      with TheraBand FlexBar) is the primary rehabilitation exercise. Supinated
      grip pulling is better tolerated than pronated. Lower body and pressing work
      is unrestricted. Pain-free grip strength is the return-to-sport criterion.

  - id: golfers_elbow
    name: Golfer's Elbow (Medial Epicondylitis)
    excluded_movement_patterns:
      - horizontal_push
      - vertical_push
      - horizontal_pull
    excluded_exercises:
      - bench_press
      - push_up
      - push_press
      - barbell_row
      - pull_up
      - kb_snatch
      - rope_climb
      - wk_kb_clean_single
      - kb_clean_double
      - kb_swing_two_hand
      - kb_swing_single_arm
      - kb_swing_double
      - wk_kb_swing_two_hand
      - wk_kb_swing_single_arm
      - towel_kb_swing
      - kb_swing_breathing_ladder
      - farmer_carry_kb
      - farmer_carry_barbell
      - farmer_carry_thick_grip
      - kb_farmer_carry
      - kb_farmer_carry_double
    modified_exercises:
      - instead_of: bench_press
        use: floor_press
      - instead_of: wk_kb_swing_two_hand
        use: kb_deadlift
      - instead_of: wk_kb_swing_single_arm
        use: kb_deadlift
    training_phase_forced: rehab
    notes: >
      Medial epicondylitis — flexor-pronator origin tendinopathy at the medial elbow.
      Aggravated by wrist flexion and forearm pronation under load. Both pushing and
      pulling movements can provoke symptoms depending on grip orientation. Eccentric
      wrist flexion exercise is the primary rehab tool. Distinct from tennis elbow —
      medial vs lateral — so supinated pulling that helps lateral epicondylitis may
      aggravate medial. Lower body work is unrestricted.

  - id: neck_strain
    name: Neck Strain
    excluded_movement_patterns:
      - vertical_push
      - vertical_pull
      - loaded_carry
      - olympic_lift
    excluded_exercises:
      - push_press
      - snatch
      - back_squat
      - mf_back_squat
    modified_exercises:
      - instead_of: back_squat
        use: front_squat
      - instead_of: kipping_pull_up
        use: pull_up
      - instead_of: push_jerk
        use: front_squat
    training_phase_forced: rehab
    notes: >
      Acute or chronic cervical strain. Avoid axial loading of the cervical spine
      and forced neck flexion or extension under load. Overhead work places the neck
      in end-range extension; heavy barbell back squat compresses the cervical spine
      through the bar contact point. Low-load cervical isometrics (hand-resist
      gentle push in all directions) and scapular stabilisation (band pull-aparts,
      rows) are appropriate. Aerobic work is generally unrestricted unless head
      positioning (e.g., rower pull-through) is provocative.

  - id: achilles_tendinopathy
    name: Achilles Tendinopathy
    excluded_movement_patterns:
      - locomotion
      - ballistic
    excluded_exercises:
      - box_jump
      - broad_jump
      - depth_jump
    modified_exercises:
      - instead_of: run_easy
        use: bike_easy
      - instead_of: run_interval
        use: bike_interval
      - instead_of: run_zone2
        use: bike_zone2
      - instead_of: squat_jump
        use: kb_squat_goblet
      - instead_of: squat_jump
        use: squat_air
      - instead_of: jump_rope_double_under
        use: row_easy
      - instead_of: jump_rope_double_under
        use: row_erg
    training_phase_forced: rehab
    notes: >
      Mid-portion or insertional Achilles tendinopathy. Avoid compression at
      insertional site (insertional: also restrict deep ankle dorsiflexion).
      Gold-standard rehabilitation: Alfredson protocol — eccentric heel drops on
      a step, 3×15 straight knee + 3×15 bent knee, twice daily. No impact loading
      until pain-free during and 24h after eccentric work. Stationary bike is the
      primary aerobic substitute. Swimming with a pull buoy avoids plantarflexion
      demand. Return to running follows a graded return-to-run protocol.

  - id: patellar_tendinopathy
    name: Patellar Tendinopathy
    excluded_movement_patterns:
      - squat
      - knee_extension
      - ballistic
      - locomotion
    excluded_exercises:
      - front_squat
      - box_jump
      - depth_jump
    modified_exercises:
      - instead_of: run_easy
        use: bike_easy
      - instead_of: run_interval
        use: bike_interval
      - instead_of: run_zone2
        use: bike_zone2
      - instead_of: box_jump
        use: wall_squat
      - instead_of: front_squat
        use: wall_squat
    training_phase_forced: rehab
    notes: >
      Patellar tendon overuse pathology — typically aggravated by eccentric knee
      loading (landing, running downhill, deep squatting). Isometric loading
      (isometric wall sit at 60-70 degrees knee flexion, 5×45 sec) provides
      immediate analgesia and is the first-line rehabilitation tool. Progress to
      isotonic loading (Spanish squat, leg press, slow squats with limited ROM).
      Avoid reactive loading (jumping, bounding) until tendon is pain-free through
      isotonic range. Stationary bike and swimming are preferred aerobic substitutes.
      Distinguish from patellofemoral syndrome — patellar tendinopathy is infrapatellar
      pain, PFPS is retropatellar.
