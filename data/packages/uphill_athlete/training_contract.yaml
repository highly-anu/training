      name: General Strength
      archetype_id: general_strength_circuit
      modality: relative_strength
      training_levels: [intermediate, advanced, elite]
      phases: [transition]
      exposures_per_week: 2
      min_spacing_days: 2
      max_rpe: 8
      progression:
        model: skill_hold
      periods:
      - weeks: 2
        rotation: [gs_1]
      - weeks: 2
        rotation: [gs_2]
      - weeks: 2
        rotation: [gs_3]
      - weeks: 2
        rotation: [gs_4]
      variants:
      - id: gs_1
