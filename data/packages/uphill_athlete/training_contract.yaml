version: 1
sources:
- https://uphillathlete.com/mountaineering/training-for-mountaineering/
- https://www.uphillathlete.com/wp-content/uploads/2020/02/TftNA-General-Strength-routine-V2.-.pdf
- https://www.uphillathlete.com/wp-content/uploads/2020/04/ME-Uphill-Athlete-Workout-.pdf
- https://uphillathlete.com/aerobic-training/when-to-add-intensity-training/
- https://uphillathlete.com/aerobic-training/aerobic-deficiency-syndrome/
tracks:
  full_program:
    training_levels:
    - intermediate
    - advanced
    - elite
    deload_phases:
    - taper
    notes: 'Six days a week: four aerobic, two strength, one off. The aerobic minutes build about 10 % a week
      for three weeks, then a recovery week at half the hardest; the long day is half the week''s aerobic
      time. Stay below your aerobic threshold (AeT) except in the Zone 3 sessions, and add those only once
      your AeT is within 10 % of your anaerobic threshold (AnT). Strength goes from the General Strength
      circuit to heavy lifting to the muscular-endurance workout, once a week in Specific. The taper week
      halves everything and keeps the Zone 3.

      '
    modules:
    # The long day: half the week's aerobic minutes (Training for Mountaineering).
    - id: long_day
      name: Long Day
      archetype_id: long_zone_2
      modality: aerobic_base
      training_levels: [intermediate, advanced, elite]
      exposures_per_week: 1
      min_spacing_days: 1
      max_rpe: 6
      progression:
        model: weekly_volume
        start_minutes: {intermediate: 330, advanced: 420, elite: 510}
        ramp_pct: 10
        build_weeks: 3
        recovery_pct: 50
        ramp_phases: [transition, base, base_intensity]
        share: 0.5
      blocks:
      - role: long
        exercise_id: zone2_hike
        slot_type: time_domain
        duration_sec: 3600
        volume: true
        intensity: zone2
        notes: Below your aerobic threshold, as hilly as you can find; no heavy pack on the long day.
    # The other aerobic days share what the long day and the Zone 3 leave; the
    # pack goes on after four weeks (Training for Mountaineering).
    - id: aerobic
      name: Aerobic
      archetype_id: recovery_jog
      modality: aerobic_base
      training_levels: [intermediate, advanced, elite]
      exposures_per_week: 3
      exposures_by_phase:
        base_intensity: 2
        specific: 1
        taper: 2
      # Specific's back-to-back long days (pod_spec, R20).
      adjacent_to_by_phase:
        specific: long_day
      min_spacing_days: 1
      max_rpe: 6
      progression:
        model: weekly_volume
        start_minutes: {intermediate: 330, advanced: 420, elite: 510}
        ramp_pct: 10
        build_weeks: 3
        recovery_pct: 50
        ramp_phases: [transition, base, base_intensity]
        share: rest
        pack_pct: [[1, 0], [5, 5], [7, 10], [9, 15]]
      blocks:
      - role: aerobic
        exercise_id: zone2_hike
        slot_type: time_domain
        duration_sec: 3600
        volume: true
        intensity: zone2
        notes: Below your aerobic threshold.
    # Zone 3 once the aerobic base allows it: about 5 % of the week's aerobic
    # time a session, one a week, then two (the 10 Percent Test).
    - id: zone_3
      name: Zone 3
      archetype_id: ant_threshold_intervals
      modality: anaerobic_intervals
      training_levels: [intermediate, advanced, elite]
      phases: [base_intensity, specific, taper]
      exposures_per_week: 1
      exposures_by_phase:
        specific: 2
      min_spacing_days: 2
      max_rpe: 8
      progression:
        model: weekly_volume
        start_minutes: {intermediate: 330, advanced: 420, elite: 510}
        ramp_pct: 10
        build_weeks: 3
        recovery_pct: 50
        ramp_phases: [transition, base, base_intensity]
        share: 0.05
      blocks:
      - role: warm_up
        exercise_id: zone2_hike
        slot_type: time_domain
        duration_sec: 900
        intensity: zone2
      - role: zone_3
        exercise_id: uphill_run
        slot_type: time_domain
        duration_sec: 1200
        volume: true
        intensity: moderate
        notes: Uphill between your aerobic and anaerobic thresholds, continuous or in intervals. Only once your
          aerobic threshold is within 10 % of your anaerobic threshold (AnT ÷ AeT heart rate); until then, Zone 2.
      - role: cool_down
        exercise_id: zone2_hike
        slot_type: time_domain
        duration_sec: 600
        intensity: zone1
    # The General Strength routine: a circuit twice a week, one lap for two
    # weeks, two for the next two, up to four in the eighth.
