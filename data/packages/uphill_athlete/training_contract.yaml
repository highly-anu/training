      min_spacing_days: 3
      max_rpe: 9
      deload_keep: 0.5
      progression:
        model: skill_hold
      rotation: [me_1, me_2, me_3, me_4, me_5, me_6, me_7, me_8, me_9, me_10]
      rotation_holds: true
      variants:
      - id: me_1
        name: Muscular Endurance — Workout 1
