        - role: warm_up
          exercise_id: me_warm_up
          slot_type: skill_practice
          duration_sec: 600
          notes: Only once your aerobic threshold is within 10 % of your anaerobic threshold. Expect two stiff days after; keep them easy.
        - role: core
          exercise_id: core_routine
          slot_type: sets_reps
          sets: 2
          reps: 4-6
          rest_sec: 60
          duration_sec: 480
          notes: Four or five of your hardest core exercises, each with enough resistance that four to six reps are all you can do.
        - role: split_jump_squat
          exercise_id: split_jump_squat
          slot_type: sets_reps
          sets: 6
          reps: 10/leg
          rest_sec: 60
          duration_sec: 720
          load_note: Bodyweight only, to learn the movements.
        - role: squat_jump
