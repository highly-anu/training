    # Max strength after the general: heavy, three or four reps, twice a week
    # in Base, maintained once a week in Specific.
    - id: max_strength
      name: Max Strength
      archetype_id: me_max_strength_gym
      modality: max_strength
      training_levels: [intermediate, advanced, elite]
      phases: [base, base_intensity, specific, taper]
      exposures_per_week: 2
      exposures_by_phase:
        specific: 1
        taper: 1
      min_spacing_days: 2
      max_rpe: 9
      deload_keep: 0.5
      progression:
        model: skill_hold
      rotation: [squat, deadlift]
      variants:
      - id: squat
        name: Max Strength — Squat
        blocks:
        - role: lift
          exercise_id: back_squat
          slot_type: sets_reps
          sets: 4
          reps: 3-4
          rest_sec: 180
          duration_sec: 840
          load_note: &heavy 90–95 % of your one-rep max, three or four reps; never more than twice your bodyweight.
        - role: pull
          exercise_id: weighted_pull_up
          slot_type: sets_reps
          sets: 4
          reps: 3-4
          rest_sec: 180
          duration_sec: 840
          load_note: Heavy enough that four reps are all you can do.
        - role: core
          exercise_id: core_routine
          slot_type: sets_reps
          sets: 2
          reps: 4-6
          rest_sec: 60
          duration_sec: 600
          notes: Four or five of your hardest core exercises, four to six reps each.
      - id: deadlift
        name: Max Strength — Deadlift
        blocks:
        - role: lift
          exercise_id: deadlift
          slot_type: sets_reps
          sets: 4
          reps: 3-4
          rest_sec: 180
          duration_sec: 840
          load_note: *heavy
        - role: pull
          exercise_id: weighted_pull_up
          slot_type: sets_reps
          sets: 4
          reps: 3-4
          rest_sec: 180
          duration_sec: 840
          load_note: Heavy enough that four reps are all you can do.
        - role: core
          exercise_id: core_routine
          slot_type: sets_reps
          sets: 2
          reps: 4-6
          rest_sec: 60
          duration_sec: 600
          notes: Four or five of your hardest core exercises, four to six reps each.
    # The muscular-endurance workout, once a week in Specific, its ten
