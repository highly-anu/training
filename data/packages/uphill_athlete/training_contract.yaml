          exercise_id: turkish_get_up
          slot_type: sets_reps
          sets: 1
          reps: 5/hand
          rest_sec: 20
          duration_sec: 80
          load_note: Make it harder whenever you can do more than ten; never to failure.
          notes: Change hands while lying down; five each hand, then heavier.
        - role: push_up
          exercise_id: push_up
          slot_type: sets_reps
          sets: 1
          reps: up to 10
          rest_sec: 20
          duration_sec: 80
          load_note: Make it harder whenever you can do more than ten; never to failure.
        - role: split_squat
          exercise_id: split_bench_squat
          slot_type: sets_reps
          sets: 1
          reps: up to 10/leg
          rest_sec: 20
          duration_sec: 80
          load_note: Make it harder whenever you can do more than ten; never to failure.
        - role: dip
