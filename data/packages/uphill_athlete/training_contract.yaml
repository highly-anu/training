          rest_sec: 20
          duration_sec: 80
          load_note: Make it harder whenever you can do more than ten; never to failure.
        - role: step_up
          exercise_id: box_step_up
          slot_type: sets_reps
          sets: 1
          reps: up to 10/leg
          rest_sec: 20
          duration_sec: 80
          load_note: Make it harder whenever you can do more than ten; never to failure.
          notes: A box 75 % of knee height; balance on the top before stepping down.
        - role: pull_up
          exercise_id: pull_up
          slot_type: sets_reps
          sets: 1
          reps: up to 10
          rest_sec: 20
          duration_sec: 80
          load_note: Make it harder whenever you can do more than ten; never to failure.
        - role: squat
          exercise_id: front_squat
          slot_type: sets_reps
          sets: 1
          reps: up to 10
          rest_sec: 20
          duration_sec: 80
          load_note: Make it harder whenever you can do more than ten; never to failure.
          notes: A broomstick first, then the bar, back neutral.
        - role: leg_raise
          exercise_id: hanging_leg_raise
          slot_type: sets_reps
          sets: 1
          reps: up to 10
          rest_sec: 20
          duration_sec: 80
          load_note: Make it harder whenever you can do more than ten; never to failure.
          notes: No swinging; bent knees first.
