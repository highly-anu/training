# What progress means for Uphill Athlete. Volume-based: the aerobic minutes
# the weekly ramp builds, the long day, how fast the aerobic pace becomes at
# the same heart rate, and the strength sequence.
id: uphill_athlete

progress:
  - id: aerobic_volume
    label: Aerobic volume
    primitive: duration
    headline: true
    scope: {modalities: [aerobic_base]}
    expected: {load_field: duration_minutes}

  - id: long_day
    label: Long day
    primitive: duration
    scope: {archetypes: [long_zone_2]}
    expected: {load_field: duration_minutes}

  - id: intensity_split
    label: Intensity split vs plan
    primitive: zone_minutes
    expected: {framework_field: intensity_distribution}

  - id: aerobic_efficiency
    label: Aerobic efficiency
    primitive: aerobic_efficiency
    scope: {modalities: [aerobic_base]}

  - id: muscular_endurance
    label: Muscular endurance workouts
    primitive: session_completion
    scope: {archetypes: [me_weighted_box_step_ups]}

  - id: strength_base
    label: Max strength
    primitive: set_load
    scope:
      archetypes: [me_max_strength_gym]
      slot_types: [sets_reps]
      exclude_slot_roles: ["*_core"]
      # Built in Base; Specific only maintains it.
      frameworks: [uphill_base_phase, uphill_base_intensity_phase]
    expected: prescribed
