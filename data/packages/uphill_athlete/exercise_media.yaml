  coaching_focus: Stay below your aerobic threshold the whole way -- if you cannot breathe through your
    nose or talk in full sentences, slow down, even to a walk on the hills.
  common_errors:
  - Drifting above the aerobic threshold on climbs -- the hill sets the pace, not your legs
  - Running the flats to make up time, which turns an easy day into a moderate one
  cue_points:
  - Hike or run as hilly a route as you can find
  - Walk the steep sections and keep the heart rate under your AeT
  - Eat and drink on anything over ninety minutes
