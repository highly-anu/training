id: uphill_specific_phase
name: "Specific Phase (Uphill Athlete)"
source_philosophy: uphill_athlete

goals_served:
  - aerobic_base
  - anaerobic_intervals
  - strength_endurance
  - max_strength

sessions_per_week:
  aerobic_base: 2
  anaerobic_intervals: 2
  strength_endurance: 1
  max_strength: 1
modality_priority:
  committed: [aerobic_base, strength_endurance]
  core: [anaerobic_intervals, max_strength]
  supplementary: []

intensity_distribution:
  zone1_2_pct: 0.65
  zone3_pct: 0.1
  zone4_5_pct: 0.0
  max_effort_pct: 0.25

allocation_mode: exclusive
progression_model: volume_block
applicable_when:
  training_level:
    - intermediate
    - advanced
    - elite
  days_per_week_min: 6
  days_per_week_max: 7
# Six days a week, the day off first (Training for Mountaineering: "Most
# athletes take these on Monday").
cadence_options:
  6: [[2, 3, 4, 5, 6, 7]]
  7: [[1, 2, 3, 4, 5, 6, 7]]

# Build three weeks, then a recovery week at half the hardest (the
# contract's weekly_volume ramp); strength keeps half its sets.
deload_protocol:
  frequency_weeks: 4
  volume_reduction_pct: 0.5
  intensity_change: maintain

sources:
  - "Uphill Athlete, Training for Mountaineering (Steve House, 2021)"

notes: |
  Two Zone 3 sessions, the muscular-endurance workout once a week, max
  strength kept once, the long day.

expectations:
  min_weeks: 2
  ideal_weeks: 8
  min_days_per_week: 6
  ideal_days_per_week: 6
  min_session_minutes: 60
  ideal_session_minutes: 360
  ideal_long_session_minutes: 360
  supports_split_days: false
