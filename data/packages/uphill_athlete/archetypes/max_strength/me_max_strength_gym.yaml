id: me_max_strength_gym
name: Max Strength
modality: max_strength
category: strength
training_levels:
- intermediate
- advanced
- elite
duration_estimate_minutes: 38
required_equipment:
- barbell
- rack
- plates
- pull_up_bar
applicable_phases:
- base
- specific
- taper
slots:
- role: lift
  slot_type: sets_reps
  sets: 4
  reps: 3-4
  rest_sec: 180
  exercise_filter:
    exercise_ids: [back_squat, deadlift]
- role: pull
  slot_type: sets_reps
  sets: 4
  reps: 3-4
  rest_sec: 180
  exercise_filter:
    exercise_ids: [weighted_pull_up]
- role: core
  slot_type: sets_reps
  sets: 2
  reps: 4-6
  exercise_filter:
    exercise_ids: [core_routine]
sources:
- "Uphill Athlete podcast, Training for Mountaineering: Strength (2023)"
- "Uphill Athlete, Training for Mountaineering (Steve House, 2021)"
notes: >
  After the general strength: three or four reps at 90–95 % of the one-rep
  max, never past twice bodyweight in the squat or deadlift, and the core
  routine. Twice a week in Base, maintained once a week in Specific.
