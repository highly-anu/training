id: ant_threshold_intervals
name: Zone 3 Uphill
modality: anaerobic_intervals
category: conditioning
training_levels:
- intermediate
- advanced
- elite
duration_estimate_minutes: 50
applicable_phases:
- base
- specific
- taper
slots:
- role: warm_up
  slot_type: time_domain
  duration_minutes: 15
  intensity: zone2
  exercise_filter:
    exercise_ids: [zone2_hike]
- role: zone_3
  slot_type: time_domain
  duration_minutes: 20
  intensity: zone3
  exercise_filter:
    exercise_ids: [uphill_run]
- role: cool_down
  slot_type: time_domain
  duration_minutes: 10
  intensity: zone1
  exercise_filter:
    exercise_ids: [zone2_hike]
sources:
- "Uphill Athlete, When and How to Add High-Intensity Training: The 10 Percent Test"
notes: >
  Uphill between the aerobic and anaerobic thresholds, about 5 % of the
  week's aerobic time: one a week, then two. Only once the aerobic threshold
  is within 10 % of the anaerobic (AnT ÷ AeT heart rate); hard sessions 48
  hours apart.
