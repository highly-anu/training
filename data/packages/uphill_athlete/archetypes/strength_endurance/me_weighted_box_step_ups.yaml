id: me_weighted_box_step_ups
name: Muscular Endurance
modality: strength_endurance
category: conditioning
training_levels:
- intermediate
- advanced
- elite
duration_estimate_minutes: 90
required_equipment:
- box
- kettlebell
applicable_phases:
- specific
slots:
- role: split_jump_squat
  slot_type: sets_reps
  sets: 6
  reps: 10
  exercise_filter:
    exercise_ids: [split_jump_squat]
- role: squat_jump
  slot_type: sets_reps
  sets: 6
  reps: 10
  exercise_filter:
    exercise_ids: [squat_jump]
- role: box_step_up
  slot_type: sets_reps
  sets: 6
  reps: 10
  exercise_filter:
    exercise_ids: [box_step_up]
- role: front_lunge
  slot_type: sets_reps
  sets: 6
  reps: 10
  exercise_filter:
    exercise_ids: [front_lunge]
sources:
- "Uphill Athlete, Muscular Endurance Workout (PDF)"
notes: >
  Uphill Athlete's gym muscular-endurance workout: split jump squats, squat
  jumps, box step-ups and front lunges, ten reps a set, each exercise's sets
  done before the next. Bodyweight for the first workouts, then a vest of up
  to 10 % of bodyweight rising to 20 % by the tenth, with goblet squat to
  press and swings added. Once a week when the rest of the training is high.
