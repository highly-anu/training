# Uphill Athlete's exercises: the aerobic work, the General Strength routine,
# the max-strength lifts and the muscular-endurance workout, as the sources
# name them (docs/package-fidelity/uphill_athlete.md).
exercises:
  # ── Aerobic ─────────────────────────────────────────────────────────────────
  - id: zone2_hike
    name: "Zone 1–2 Hike or Run"
    category: aerobic
    modality:
      - aerobic_base
      - durability
    equipment:
      - open_space
    effort: medium
    bilateral: true
    movement_patterns:
      - locomotion
      - aerobic_monostructural
    typical_volume:
      duration_sec: 3600
    notes: "Below your aerobic threshold (AeT): hiking, running or skiing, as hilly as you can find. Zone 1 is 10–20 % under AeT, Zone 2 the last 10 % up to it."

  - id: uphill_run
    name: "Zone 3 Uphill"
    category: aerobic
    modality:
      - aerobic_base
      - anaerobic_intervals
    equipment:
      - open_space
    effort: high
    bilateral: true
    movement_patterns:
      - locomotion
      - aerobic_monostructural
    typical_volume:
      duration_sec: 1200
    notes: "Uphill between your aerobic and anaerobic thresholds (Zone 3): hiking or running, continuous or in intervals."

  # ── General Strength routine ─────────────────────────────────────────────────
  - id: turkish_get_up
    name: "Turkish Get-Up"
    category: kettlebell
    modality:
      - relative_strength
      - mobility
    equipment:
      - kettlebell
    effort: medium
    bilateral: false
    movement_patterns:
      - get_up
      - core_stability
    typical_volume:
      reps: 5
    notes: "Shoulder and hip mobility and core more than leg strength. Too light a weight lets you cheat the form. Five each hand, then heavier."

  - id: push_up
    name: "Push-Up"
    category: bodyweight
    modality:
      - relative_strength
    equipment: []
    effort: medium
    bilateral: true
    movement_patterns:
      - horizontal_push
    contraindicated_with:
      - wrist_injury
    typical_volume:
      reps: 10
    notes: "Hands to feet in one line. At ten, raise one foot; then a vest or a ball under the feet."

  - id: split_bench_squat
    name: "Split Bench Squat"
    category: bodyweight
    modality:
      - relative_strength
    equipment: []
    effort: medium
    bilateral: false
    movement_patterns:
      - squat
      - lunge
    contraindicated_with:
      - knee_meniscus_post_op
    typical_volume:
      reps: 10
    notes: "Split stance, hips pulled up over the front leg, the back leg only for balance. At ten, rear foot on a bench, then a pack or vest."

  - id: dip
    name: "Dip"
    category: bodyweight
    modality:
      - relative_strength
    equipment: []
    effort: medium
    bilateral: true
    movement_patterns:
      - vertical_push
    contraindicated_with:
      - shoulder_impingement
      - shoulder_instability
    typical_volume:
      reps: 10
    notes: "Full range, down to a stretch in the chest; a bench or box makes it easier, parallel bars harder. At ten, add resistance."

  - id: box_step_up
    name: "Box Step-Up"
    category: bodyweight
    modality:
      - relative_strength
      - strength_endurance
    equipment:
      - box
    effort: medium
    bilateral: false
    movement_patterns:
      - step_up
      - knee_extension
    contraindicated_with:
      - knee_meniscus_post_op
      - patellar_tendinopathy
    typical_volume:
      reps: 10
    notes: "A box 75 % of the height of your knee. Step up and balance fully on the loaded leg before stepping down. At ten, a pack or a vest."

  - id: pull_up
    name: "Pull-Up"
    category: bodyweight
    modality:
      - relative_strength
    equipment:
      - pull_up_bar
    effort: medium
    bilateral: true
    movement_patterns:
      - vertical_pull
    contraindicated_with:
      - tennis_elbow
      - golfers_elbow
    typical_volume:
      reps: 10
    notes: "Full hang to chin over the bar. At fifteen, a variation or weight."

  - id: front_squat
    sessions_per_week: 2
    name: "Front Squat"
    category: barbell
    modality:
      - relative_strength
      - max_strength
    equipment:
      - barbell
      - rack
      - plates
    effort: medium
    bilateral: true
    movement_patterns:
      - squat
    contraindicated_with:
      - knee_meniscus_post_op
      - lumbar_disc
    typical_volume:
      reps: 10
    notes: "Start with a broomstick across the front of the shoulders and a neutral lower back; the barbell once that holds. At ten, more weight."

  - id: hanging_leg_raise
    name: "Hanging Leg Raise"
    category: bodyweight
    modality:
      - relative_strength
    equipment:
      - pull_up_bar
    effort: medium
    bilateral: true
    movement_patterns:
      - hip_flexion
      - core_flexion
    contraindicated_with:
      - shoulder_instability
    typical_volume:
      reps: 10
    notes: "No swinging. Bent knees first; work to straight legs under control. At ten straight, shoes, then boots."

  # ── Max strength and core ───────────────────────────────────────────────────
  - id: back_squat
    sessions_per_week: 3
    name: "Back Squat"
    category: barbell
    modality:
      - max_strength
    equipment:
      - barbell
      - rack
      - plates
    effort: high
    bilateral: true
    movement_patterns:
      - squat
    contraindicated_with:
      - knee_meniscus_post_op
      - lumbar_disc
    typical_volume:
      reps: 4
    notes: "Heavy and few: three or four reps at 90–95 % of your one-rep max. Never past twice your bodyweight."

  - id: deadlift
    sessions_per_week: 1
    name: "Deadlift"
    category: barbell
    modality:
      - max_strength
    equipment:
      - barbell
      - plates
    effort: high
    bilateral: true
    movement_patterns:
      - hip_hinge
    contraindicated_with:
      - lumbar_disc
    typical_volume:
      reps: 4
    notes: "Heavy and few: three or four reps at 90–95 % of your one-rep max. Never past twice your bodyweight."

  - id: weighted_pull_up
    name: "Weighted Pull-Up"
    category: bodyweight
    modality:
      - max_strength
      - relative_strength
    equipment:
      - pull_up_bar
    effort: high
    bilateral: true
    movement_patterns:
      - vertical_pull
    contraindicated_with:
      - tennis_elbow
      - golfers_elbow
    typical_volume:
      reps: 4
    notes: "Upper-body pulling strength for ice tools and scrambling."

  - id: core_routine
    name: "Core Routine"
    category: bodyweight
    modality:
      - relative_strength
    equipment: []
    effort: high
    bilateral: true
    movement_patterns:
      - core_stability
      - core_flexion
    typical_volume:
      reps: 6
    notes: "Four or five of your hardest core exercises (Uphill Athlete's Killer Core), with enough resistance that four to six reps are all you can do."

  # ── Muscular endurance (the gym workout) ────────────────────────────────────
  - id: split_jump_squat
    name: "Split Jump Squat"
    category: bodyweight
    modality:
      - strength_endurance
      - power
    equipment: []
    effort: high
    bilateral: false
    movement_patterns:
      - lunge
      - jump
    contraindicated_with:
      - knee_meniscus_post_op
      - patellar_tendinopathy
      - achilles_tendinopathy
    typical_volume:
      reps: 10
    notes: "Ten each leg. If unsure, start with a short 30 cm split; deepen it as you get stronger."

  - id: squat_jump
    name: "Squat Jump"
    category: bodyweight
    modality:
      - strength_endurance
      - power
    equipment: []
    effort: high
    bilateral: true
    movement_patterns:
      - squat
      - jump
    contraindicated_with:
      - knee_meniscus_post_op
      - patellar_tendinopathy
      - achilles_tendinopathy
    typical_volume:
      reps: 10
    notes: "Squat and jump; one rep every one to two seconds, never rushed."

  - id: front_lunge
    name: "Front Lunge"
    category: bodyweight
    modality:
      - strength_endurance
    equipment: []
    effort: medium
    bilateral: false
    movement_patterns:
      - lunge
    contraindicated_with:
      - knee_meniscus_post_op
    typical_volume:
      reps: 10
    notes: "Ten each leg, all the right then all the left. New to lunges: the static lunge for two or three workouts, then stepping."

  - id: goblet_squat_press
    name: "Goblet Squat to Overhead Press"
    category: kettlebell
    modality:
      - strength_endurance
    equipment:
      - kettlebell
    effort: high
    bilateral: true
    movement_patterns:
      - squat
      - vertical_push
    contraindicated_with:
      - knee_meniscus_post_op
      - shoulder_impingement
    typical_volume:
      reps: 10
    notes: "A goblet squat, then press the bell overhead."

  - id: kb_swing
    name: "Two-Hand Kettlebell Swing"
    category: kettlebell
    modality:
      - strength_endurance
      - power
    equipment:
      - kettlebell
    effort: high
    bilateral: true
    movement_patterns:
      - hip_hinge
      - ballistic
    contraindicated_with:
      - lumbar_disc
    typical_volume:
      reps: 10
    notes: "Hip snap, not a squat; the bell floats to chest height."

  - id: me_warm_up
    name: "Warm-Up: Dynamic Stretch, Air Squats, Get-Ups, Burpees"
    category: bodyweight
    modality:
      - mobility
    equipment: []
    effort: low
    bilateral: true
    movement_patterns:
      - squat
      - get_up
    contraindicated_with: []
    typical_volume:
      duration_sec: 600
    notes: "Five minutes of dynamic stretching, then 20 air squats, 10 Turkish get-ups and 10 burpees."
