id: uphill_athlete
name: "Uphill Athlete — Steve House & Scott Johnston"
core_principles:
  - aerobic_base_is_foundation
  - continuity_over_intensity
  - build_three_weeks_then_recover
  - individualization_via_aet_ant_testing
  - aerobic_deficiency_must_be_fixed_first
  - general_then_max_then_muscular_endurance_strength
  - muscular_endurance_is_the_mountain_specific_quality
  - recovery_is_training
scope:
  - aerobic_base
  - anaerobic_intervals
  - relative_strength
  - max_strength
  - strength_endurance
bias:
  - aerobic_base
  - strength_endurance
avoid_with:
  - mixed_modal_conditioning
required_equipment:
  - box
  - barbell
  - rack
  - plates
  - kettlebell
  - pull_up_bar
  - open_space
intensity_model: polarized_80_20_uphill
progression_philosophy: volume_based
sources:
  - "Uphill Athlete, Training for Mountaineering (Steve House, 2021)"
  - "Uphill Athlete, The General Strength Routine and the Muscular Endurance Workout (PDFs)"
  - "Uphill Athlete, Aerobic Deficiency; When and How to Add High-Intensity Training; Heart Rate Drift Test"
  - "Uphill Athlete podcasts on mountaineering training (2023)"
notes: |
  Mountain endurance built on a large aerobic base. Most of the training is
  below the aerobic threshold (AeT); the long day is half the week's aerobic
  time; volume builds for three weeks and then recovers at about half.
  The aerobic threshold is found with the heart-rate drift test, and the gap
  to the anaerobic threshold (AnT ÷ AeT heart rate) decides when intensity
  may enter: with a gap over 10 % — aerobic deficiency — the athlete stays in
  Zones 1–2 until it closes. Strength goes from general to max to muscular
  endurance, which is what mountains ask of the legs.

# Every exercise of the training contract is the package's own
# (training_contract.yaml); it borrows nothing.
self_contained: true

expectations:
  min_weeks: 8
  ideal_weeks: 29  # 8 transition + 4 + 8 base + 8 specific + 1 taper
  min_days_per_week: 6
  ideal_days_per_week: 6
  min_session_minutes: 60
  ideal_session_minutes: 360
  supports_split_days: false

# One track: Transition, Base, Specific, Taper, written as a training
# contract (training_contract.yaml): the weekly ramp, the long day, the
# strength sequence and the muscular-endurance progression.
primary_track_id: full_program
tracks:
  - id: full_program
    name: "Mountain Objective"
    description: >
      The progression toward a mountain objective: Transition, Base, Specific,
      Taper, six days a week. Give it an event date and the phases are counted
      back from the objective.
    phases:
      - id: transition
        name: "Transition"
        kind: transition
        weeks: 8
        framework_id: uphill_transition_phase
        focus: "Aerobic re-entry and general strength"
        description: >
          Four aerobic days below the aerobic threshold, the long day half of
          them, and the General Strength circuit twice a week: one lap for two
          weeks, two for the next two, up to four. No pack for the first four
          weeks. No intensity.
        adaptations:
          - "Aerobic base below AeT"
          - "General strength"
        intensity: "Zones 1–2 only"
        checks:
          max_zone: 2
      - id: base
        name: "Base"
        kind: base
        weeks: 4
        framework_id: uphill_base_phase
        focus: "Aerobic volume and max strength"
        description: >
          The aerobic minutes keep building — about 10 % a week for three weeks,
          then a recovery week at half — and strength turns heavy: three or four
          reps at 90–95 % of the one-rep max, twice a week.
        adaptations:
          - "Aerobic capacity"
          - "Max strength"
        intensity: "Zones 1–2"
        checks:
          max_zone: 2
          volume_change_per_week: [0.0, 0.10]
      - id: base_intensity
        name: "Base with Zone 3"
        kind: base
        weeks: 8
        framework_id: uphill_base_intensity_phase
        focus: "Aerobic volume, a first Zone 3 session"
        description: >
          After twelve weeks without intensity, one Zone 3 session a week
          (about 5 % of the aerobic time) — once the aerobic threshold is
          within 10 % of the anaerobic. The rest as in Base.
        adaptations:
          - "Aerobic capacity"
          - "A rising aerobic threshold"
          - "Max strength"
        intensity: "Mostly Zones 1–2; one Zone 3 session"
        checks:
          volume_change_per_week: [0.0, 0.10]
      - id: specific
        name: "Specific"
        kind: specific
        weeks: 8
        framework_id: uphill_specific_phase
        focus: "Muscular endurance and Zone 3"
        description: >
          Two Zone 3 sessions a week, the muscular-endurance workout once a week
          (ten workouts from bodyweight to a vest of 20 % of bodyweight), max
          strength kept once a week, and the long day.
        adaptations:
          - "Mountain-specific muscular endurance"
          - "Zone 3 durability"
        intensity: "Mostly Zones 1–2; two Zone 3 sessions"
        checks:
          modalities_required: [anaerobic_intervals, strength_endurance]
      - id: taper
        name: "Taper"
        kind: taper
        weeks: 1
        framework_id: uphill_taper_phase
        focus: "Arrive rested"
        description: >
          One week before a climb of two or three days: half the training time
          of the hardest week, the Zone 3 kept.
        adaptations:
          - "Fatigue dissipates while fitness is kept"
        intensity: "Half the time; Zone 3 kept"
