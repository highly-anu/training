db_incline_press:
  animation:
    external_id: Hammer_Grip_Incline_DB_Bench_Press
    gif_alt: DB Incline Press
    gif_source: free_exercise_db
    gif_url: https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Hammer_Grip_Incline_DB_Bench_Press/0.jpg
    type: gif
  coaching_focus: Let the elbows track naturally -- do not force a fixed elbow path; dumbbells allow the
    elbows to move to whatever angle is pain-free for each individual.
  common_errors:
  - Elbows flaring excessively wide -- a 45-75 degree elbow angle is appropriate; full flare increases
    impingement risk
  - Not controlling the descent -- the eccentric builds chest strength; dropping the weights eliminates
    the training stimulus
  - Bouncing at the bottom -- each rep starts from a controlled bottom position, not from a bounce off
    the chest
  cue_points:
  - Set the bench at 30-45 degrees -- lower angle (30 degrees) is more shoulder-friendly; higher angle
    (45) is more deltoid-focused
  - Start with dumbbells at shoulder level with a neutral or slightly pronated grip
  - Press up and slightly inward -- the dumbbells converge slightly at the top but do not touch
  - Lower to a 90-degree elbow angle and feel the chest stretch at the bottom
  - Maintain scapular retraction throughout -- do not let the shoulders roll forward at the top
  description: The dumbbell incline press at 30-45 degrees is the Marcus Filly shoulder-friendly pressing
    alternative -- the incline angle reduces subacromial impingement risk compared to flat bench while
    still training the chest and shoulder pressing pattern. Dumbbells allow natural rotation of the wrist
    and elbow path, reducing joint stress further. It serves as the primary pressing movement when shoulder
    symptoms warrant a more neutral plane.
  muscle_diagram:
    highlight_primary:
    - chest
    - shoulders
    highlight_secondary:
    - triceps
    - serratus_anterior
  muscles_primary:
  - chest
  - shoulders
  - triceps
  muscles_secondary:
  - serratus_anterior
  - core
  - upper_trapezius
db_lateral_raise:
  animation:
    type: none
  coaching_focus: Lead with the elbow, not the hand -- raise the arm by driving the elbow up and out;
    if the hand leads, the exercise becomes a shrug instead of a lateral raise.
  common_errors:
  - Shrugging the upper trap -- this indicates the load is too heavy; reduce weight and focus on pure
    lateral deltoid
  - Swinging the weights -- momentum defeats the isolation; keep the torso still and use only the deltoid
  - Arms crossing above shoulder height -- stop at shoulder level; going higher involves the traps and
    reduces deltoid tension
  cue_points:
  - Stand with a slight forward lean (about 10 degrees) -- this positions the lateral deltoid for optimal
    isolation
  - Hold the dumbbells with a neutral grip beside the hips
  - Drive the elbows up and out to shoulder height -- the thumbs point down slightly at the top (as if
    pouring a pitcher)
  - Pause 1 second at the top with elbows at shoulder height
  - Lower slowly over 3 seconds -- the eccentric lateral raise builds more strength than the concentric
  description: The dumbbell lateral raise is the Marcus Filly Functional Bodybuilding lateral deltoid
    isolation exercise -- a slight forward lean of the torso allows full lateral deltoid engagement without
    supraspinatus impingement. Light load and strict form with no swinging maintain the isolation. It
    is used to maintain shoulder width and structural integrity alongside posterior rotator cuff work.
  muscle_diagram:
    highlight_primary:
    - shoulders
    highlight_secondary:
    - trapezius
  muscles_primary:
  - lateral_deltoid
  muscles_secondary:
  - upper_trapezius
  - serratus_anterior
