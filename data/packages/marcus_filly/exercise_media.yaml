mf_back_squat:
  animation:
    type: none
  coaching_focus: Three full seconds on every descent -- count them out; if you cannot maintain 3 seconds,
    the load is too heavy for the Marcus Filly protocol.
  common_errors:
  - Treating the pause as a bounce -- the bottom position is a true pause with full tension maintained,
    not a stretch reflex
  - Exceeding RPE 8 -- grinding reps defeats the tissue-resilience purpose; reduce load
  - Ignoring the eccentric tempo -- the 3-second descent is not optional; it is the defining feature of
    the Marcus Filly squat protocol
  cue_points:
  - Set RPE at 7-8 -- should feel heavy but 2-3 reps remain at the top of each set
  - Brace 360-degree tension before unracking -- belly, sides, and back
  - 'Descend in exactly 3 seconds: count "1-2-3" on the way down'
  - Brief pause at the bottom (no bounce) before driving the floor away on the concentric
  - 'Progression: add 2.5-5 kg when the RPE drops below 7 across two consecutive sessions'
  description: The Marcus Filly back squat uses a 3-second eccentric descent and RPE-based autoregulation
    -- RPE 7-8 load with 2-3 reps left in the tank per set. The controlled descent builds tissue resilience
    and eccentric strength without grinding to failure. No bounce at the bottom; a brief pause before
    the concentric eliminates elastic energy and develops bottom-position strength.
  muscle_diagram:
    highlight_primary:
    - quadriceps
    - glutes
    highlight_secondary:
    - erector_spinae
    - hamstrings
  muscles_primary:
  - quadriceps
  - glutes
  - erector_spinae
  muscles_secondary:
  - hamstrings
  - adductors
  - core
pull_up:
  animation:
    type: none
  coaching_focus: Dead hang fully at the bottom -- if you do not reach full elbow extension, you are doing
    a partial ROM exercise, not a pull-up.
  common_errors:
  - 'Half reps: not reaching full extension at the bottom caps strength development and creates poor movement
    habits'
  - 'Kipping under a strict prescription: kipping is a separate skill; mixing them unknowingly trains
    neither'
  - 'Chin in front of, not over, the bar: the standard is chin over -- partial top-range reps do not count'
  cue_points:
  - 'Start from a dead hang: shoulders fully elevated (passive) or actively depressed before initiating'
  - Drive the elbows down and back -- think of pulling the bar to the sternum, not the hands up
  - Chin clears the bar at the top; do not tuck the chin or crane the neck forward
  - Return to full dead hang at the bottom -- partial descents reduce the strength stimulus and build
    a false ceiling
  - Squeeze glutes and brace the core throughout -- no swinging or kipping in the strict variant
  description: The strict pull-up is the foundational upper-body vertical pulling test -- a dead-hang
    start with full elbow extension at the bottom, chin clearing the bar at the top. Marcus Filly treats
    it as the primary pulling strength metric; Gym Jones programs it at high volume in Murph-style sessions.
    Relative strength in this movement reliably predicts overall athletic capacity.
  muscle_diagram:
    highlight_primary:
    - upper_back
    - lats
    - biceps
    highlight_secondary:
    - core
    - forearms
    - deltoids
  muscles_primary:
  - upper_back
  - lats
  - biceps
  muscles_secondary:
  - core
  - forearms
  - deltoids
