dip:
  animation:
    external_id: Parallel_Bar_Dip
    gif_alt: Dip (Bar / Parallel Bars)
    gif_source: free_exercise_db
    gif_url: https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Parallel_Bar_Dip/0.jpg
    type: gif
  coaching_focus: At the bottom, the upper arms must reach parallel -- any shallower and you are training
    a fraction of the movement and missing the strength stimulus.
  common_errors:
  - 'Shallow dips: upper arms never reach parallel -- build false strength that fails when the full range
    is tested'
  - 'Excessive forward lean: leaning too far forward shifts too much load to the anterior shoulder capsule;
    moderate lean is correct'
  - 'Swinging the body: initiating with a hip kick or torso swing; dips should be initiated from the shoulder,
    not the hips'
  cue_points:
  - Mount the bars with arms straight, scapulae depressed and retracted -- establish the support position
    before descending
  - Bend the knees slightly and cross the feet to reduce swinging
  - Descend with elbows tracking back -- not flaring excessively wide
  - Reach the bottom with upper arms parallel to the floor; a slight forward lean increases the pec demand
  - Press to full lockout, not 95% -- the last 5% of extension is where the triceps and lockout strength
    develop
  description: The parallel bar dip is a fundamental vertical pressing movement -- lowering the body between
    two bars until the upper arms are parallel to the floor, then pressing to full lockout. A slight forward
    lean shifts emphasis to the pectorals; a more upright torso emphasizes the triceps. Marcus Filly treats
    dips as one of the two primary bodyweight push movements alongside push-up variants. Full range of
    motion requires significant shoulder mobility.
  muscle_diagram:
    highlight_primary:
    - pec
    - triceps
    - deltoids
    highlight_secondary:
    - core
    - serratus
  muscles_primary:
  - pec
  - triceps
  - deltoids
  muscles_secondary:
  - core
  - serratus
