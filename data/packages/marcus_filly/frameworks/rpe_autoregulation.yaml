id: rpe_autoregulation
name: Persist 3x (Functional Bodybuilding)
source_philosophy: marcus_filly

goals_served:
  - max_strength
  - strength_endurance

# Three full-body sessions a week (the 3x tracks' sample weeks); the training
# contract (training_contract.yaml) writes each day as printed.
sessions_per_week:
  max_strength: 3
modality_priority:
  committed: [max_strength]
  core: []
  supplementary: []

intensity_distribution:
  zone1_2_pct: 0.15
  zone3_pct: 0.0
  zone4_5_pct: 0.25
  max_effort_pct: 0.60

# Loads chosen by the athlete: to the top of the reps, then a little more
# (Choosing Loads); RPE 7 leaves three in reserve.
progression_model: rpe_autoregulation

applicable_when:
  training_level:
    - intermediate
    - advanced
    - elite
  days_per_week_min: 3
  days_per_week_max: 5

# Three days, a rest day between where the week allows.
cadence_options:
  3: [[1, 3, 5]]
  4: [[1, 2, 4, 5]]
  5: [[1, 2, 3, 5, 6]]

# No deload_protocol: the Bridge week after two six-week cycles is the
# contract's (`periods`).

sources:
  - "Functional Bodybuilding, Persist sample weeks and Help Center (2023–2025)"
  - "Marcus Filly, Deload Week; Workout Tempo (functional-bodybuilding.com)"

notes: >
  Three full-body days, each a warm-up, strength intensity, strength balance,
  conditioning or a finisher, and a cooldown, about an hour. Tempo on the
  strength work; loads chosen by reps and RPE. Six-week cycles; after two, a
  Bridge week at RPE 6–7.

expectations:
  min_weeks: 6
  ideal_weeks: 13
  min_days_per_week: 3
  ideal_days_per_week: 3
  min_session_minutes: 60
  ideal_session_minutes: 60
  supports_split_days: false
