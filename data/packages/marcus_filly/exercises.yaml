# Marcus Filly's exercises: those of the published Persist sample weeks
# (training_contract.yaml), the warm-up, cooldown and conditioning pieces
# as one entry each whose block note writes the day's content.
exercises:
  - id: mf_back_squat
    name: "Back Squat"
    category: barbell
    modality:
      - max_strength
    equipment:
      - barbell
      - rack
      - plates
    effort: high
    bilateral: true
    movement_patterns:
      - squat
    contraindicated_with:
      - knee_meniscus_post_op
      - lumbar_disc
    sources:
      - "Functional Bodybuilding, Persist sample weeks"
    notes: "Bar on the upper back, sit down between the heels, stand tall."

  - id: dip
    name: "Strict Bar Dip"
    category: bodyweight
    modality:
      - relative_strength
    equipment: []
    effort: medium
    bilateral: true
    movement_patterns:
      - vertical_push
    contraindicated_with:
      - shoulder_impingement
      - shoulder_instability
    sources:
      - "Functional Bodybuilding, Persist sample weeks"
    notes: "On parallel bars, no kip: down until the shoulders are below the elbows, then press to lockout."

  - id: pull_up
    name: "Pronated Strict Pull-Up"
    category: bodyweight
    modality:
      - relative_strength
    equipment:
      - pull_up_bar
    effort: medium
    bilateral: true
    movement_patterns:
      - vertical_pull
    contraindicated_with:
      - tennis_elbow
      - golfers_elbow
    sources:
      - "Functional Bodybuilding, Persist sample weeks"
    notes: "Palms away, shoulder-width grip, no kip."

  - id: db_incline_press
    name: "Incline Dumbbell Bench Press (45°)"
    category: accessory
    modality:
      - max_strength
    equipment:
      - dumbbell
    effort: medium
    bilateral: true
    movement_patterns:
      - horizontal_push
    contraindicated_with:
      - shoulder_impingement
    sources:
      - "Functional Bodybuilding, Persist sample weeks"
    notes: "A bench at 45 degrees; dumbbells to the chest, press to lockout."

  - id: db_lateral_raise
    name: "Dumbbell Lateral Raise"
    category: accessory
    modality:
      - strength_endurance
    equipment:
      - dumbbell
    effort: medium
    bilateral: true
    movement_patterns:
      - shoulder_abduction
    contraindicated_with:
      - shoulder_impingement
    sources:
      - "Functional Bodybuilding, Persist sample weeks"
    notes: "Raise the dumbbells out to the side to shoulder height, under control."

  - id: incline_bench_press
    name: "Incline Bench Press (45°)"
    category: barbell
    modality:
      - max_strength
    equipment:
      - barbell
      - rack
      - plates
    effort: high
    bilateral: true
    movement_patterns:
      - horizontal_push
    contraindicated_with:
      - shoulder_impingement
    sources:
      - "Functional Bodybuilding, Persist sample weeks"
    notes: "A barbell bench press on a 45-degree incline."

  - id: tripod_row
    name: "Tripod Row"
    category: accessory
    modality:
      - strength_endurance
    equipment:
      - dumbbell
    effort: medium
    bilateral: true
    movement_patterns:
      - horizontal_pull
    contraindicated_with: []
    sources:
      - "Functional Bodybuilding, Persist sample weeks"
    notes: "One hand braced on a bench, row the dumbbell to the hip with the other; one arm, then the other."

  - id: db_suitcase_drop_lunge
    name: "Dumbbell Suitcase Drop Lunge"
    category: accessory
    modality:
      - strength_endurance
    equipment:
      - dumbbell
    effort: medium
    bilateral: true
    movement_patterns:
      - lunge
    contraindicated_with:
      - knee_meniscus_post_op
    sources:
      - "Functional Bodybuilding, Persist sample weeks"
    notes: "A dumbbell in each hand at the sides; step back and drop the back knee, alternating legs."

  - id: lat_pulldown
    name: "Pronated Lat Pulldown"
    category: accessory
    modality:
      - strength_endurance
    equipment:
      - cable_machine
    effort: medium
    bilateral: true
    movement_patterns:
      - vertical_pull
    contraindicated_with: []
    sources:
      - "Functional Bodybuilding, Persist sample weeks"
    notes: "Palms away, shoulder-width grip, bar to the top of the chest."

  - id: back_supported_db_strict_press
    name: "Back-Supported Pronated Dumbbell Strict Press"
    category: accessory
    modality:
      - max_strength
    equipment:
      - dumbbell
    effort: medium
    bilateral: true
    movement_patterns:
      - vertical_push
    contraindicated_with:
      - shoulder_impingement
    sources:
      - "Functional Bodybuilding, Persist sample weeks"
    notes: "Seated with the back supported, palms forward, press overhead."

  - id: stiff_leg_deadlift
    name: "Stiff-Leg Deadlift"
    category: barbell
    modality:
      - max_strength
    equipment:
      - barbell
      - plates
    effort: high
    bilateral: true
    movement_patterns:
      - hip_hinge
    contraindicated_with:
      - lumbar_disc
    sources:
      - "Functional Bodybuilding, Persist sample weeks"
    notes: "Legs nearly straight, hinge from the hips with a flat back, the bar close to the legs."

  - id: cable_tricep_pushdown
    name: "Straight-Bar Cable Tricep Pushdown"
    category: accessory
    modality:
      - strength_endurance
    equipment:
      - cable_machine
    effort: medium
    bilateral: true
    movement_patterns:
      - elbow_extension
    contraindicated_with: []
    sources:
      - "Functional Bodybuilding, Persist sample weeks"
    notes: "Elbows pinned at the sides, push the bar down to straight arms."

  - id: barbell_skull_crusher
    name: "Barbell Skull Crusher"
    category: barbell
    modality:
      - strength_endurance
    equipment:
      - barbell
    effort: high
    bilateral: true
    movement_patterns:
      - elbow_extension
    contraindicated_with: []
    sources:
      - "Functional Bodybuilding, Persist sample weeks"
    notes: "Lying on a bench, lower the bar toward the forehead by bending the elbows, then extend."

  - id: cable_bicep_curl
    name: "Straight-Bar Cable Bicep Curl"
    category: accessory
    modality:
      - strength_endurance
    equipment:
      - cable_machine
    effort: medium
    bilateral: true
    movement_patterns:
      - elbow_flexion
    contraindicated_with: []
    sources:
      - "Functional Bodybuilding, Persist sample weeks"
    notes: "Elbows at the sides, curl the bar to the shoulders."

  - id: barbell_bicep_curl
    name: "Barbell Bicep Curl"
    category: barbell
    modality:
      - strength_endurance
    equipment:
      - barbell
    effort: high
    bilateral: true
    movement_patterns:
      - elbow_flexion
    contraindicated_with: []
    sources:
      - "Functional Bodybuilding, Persist sample weeks"
    notes: "Elbows at the sides, curl the bar to the shoulders."

  - id: suitcase_curtsy_squat
    name: "Suitcase Curtsy Squat"
    category: accessory
    modality:
      - strength_endurance
    equipment:
      - dumbbell
    effort: medium
    bilateral: true
    movement_patterns:
      - squat
      - lunge
    contraindicated_with:
      - knee_meniscus_post_op
    sources:
      - "Functional Bodybuilding, Persist sample weeks"
    notes: "A dumbbell at the side; step one leg behind and across, and squat."

  - id: banded_reverse_crunch
    name: "Banded Reverse Crunch"
    category: bodyweight
    modality:
      - strength_endurance
    equipment:
      - resistance_band
    effort: medium
    bilateral: true
    movement_patterns:
      - core_flexion
    contraindicated_with: []
    sources:
      - "Functional Bodybuilding, Persist sample weeks"
    notes: "On the back, against a band, curl the hips off the floor."

  - id: wide_grip_cable_row
    name: "Wide-Grip Seated Cable Row"
    category: accessory
    modality:
      - strength_endurance
    equipment:
      - cable_machine
    effort: medium
    bilateral: true
    movement_patterns:
      - horizontal_pull
    contraindicated_with: []
    sources:
      - "Functional Bodybuilding, Persist sample weeks"
    notes: "Wide grip, chest tall, pull the handle to the ribs."

  - id: incline_db_prone_row
    name: "Incline Dumbbell Prone Row"
    category: accessory
    modality:
      - strength_endurance
    equipment:
      - dumbbell
    effort: medium
    bilateral: true
    movement_patterns:
      - horizontal_pull
    contraindicated_with: []
    sources:
      - "Functional Bodybuilding, Persist sample weeks"
    notes: "Chest on an incline bench, row both dumbbells."

  - id: db_front_raise
    name: "Dumbbell Front Raise"
    category: accessory
    modality:
      - strength_endurance
    equipment:
      - dumbbell
    effort: medium
    bilateral: true
    movement_patterns:
      - shoulder_flexion
    contraindicated_with:
      - shoulder_impingement
    sources:
      - "Functional Bodybuilding, Persist sample weeks"
    notes: "Raise the dumbbells in front to shoulder height."

  - id: bc_gliding_hamstring_curl
    name: "Gliding Hamstring Curl"
    category: bodyweight
    modality:
      - strength_endurance
    equipment: []
    effort: medium
    bilateral: true
    movement_patterns:
      - knee_flexion
    contraindicated_with: []
    sources:
      - "Functional Bodybuilding, Persist sample weeks"
    notes: "On the back, heels on sliders, hips up; curl the heels in and slide them out."

  - id: db_full_raise
    name: "Dumbbell Full Raise"
    category: accessory
    modality:
      - strength_endurance
    equipment:
      - dumbbell
    effort: medium
    bilateral: true
    movement_patterns:
      - shoulder_flexion
    contraindicated_with:
      - shoulder_impingement
    sources:
      - "Functional Bodybuilding, Persist sample weeks"
    notes: "Raise the dumbbells in front all the way overhead."

  - id: landmine_single_leg_hip_thrust
    name: "Landmine Single-Leg Hip Thrust"
    category: barbell
    modality:
      - max_strength
    equipment:
      - barbell
      - plates
    effort: high
    bilateral: true
    movement_patterns:
      - hip_extension
    contraindicated_with:
      - lumbar_disc
    sources:
      - "Functional Bodybuilding, Persist sample weeks"
    notes: "Shoulders on a bench, the landmine across the hips, drive up on one leg."

  - id: suitcase_ffe_split_squat
    name: "Suitcase Front-Foot-Elevated Split Squat"
    category: accessory
    modality:
      - strength_endurance
    equipment:
      - dumbbell
    effort: medium
    bilateral: true
    movement_patterns:
      - lunge
    contraindicated_with:
      - knee_meniscus_post_op
    sources:
      - "Functional Bodybuilding, Persist sample weeks"
    notes: "Front foot on a plate or step, a dumbbell in each hand, sink the back knee."

  - id: tib_raise
    name: "Anterior Tib Raise"
    category: bodyweight
    modality:
      - strength_endurance
    equipment: []
    effort: medium
    bilateral: true
    movement_patterns:
      - ankle_dorsiflexion
    contraindicated_with: []
    sources:
      - "Functional Bodybuilding, Persist sample weeks"
    notes: "Back against a wall, heels forward, lift the toes; or a tib bar."

  - id: fbb_warm_up
    name: "Warm-Up"
    category: mobility
    modality:
      - mobility
    equipment: []
    effort: medium
    bilateral: true
    movement_patterns:
      - locomotion
    contraindicated_with: []
    sources:
      - "Functional Bodybuilding, Persist sample weeks"
    notes: "The day's warm-up, as its note writes it."

  - id: fbb_cooldown
    name: "Cooldown"
    category: mobility
    modality:
      - mobility
    equipment: []
    effort: medium
    bilateral: true
    movement_patterns:
      - stretching
    contraindicated_with: []
    sources:
      - "Functional Bodybuilding, Persist sample weeks"
    notes: "The day's stretches, as its note writes them."

  - id: fbb_conditioning
    name: "Conditioning"
    category: accessory
    modality:
      - mixed_modal_conditioning
    equipment: []
    effort: medium
    bilateral: true
    movement_patterns:
      - locomotion
      - squat
      - hip_hinge
    contraindicated_with: []
    sources:
      - "Functional Bodybuilding, Persist sample weeks"
    notes: "The day's conditioning piece, as its note writes it: the pace is the intent it names."
