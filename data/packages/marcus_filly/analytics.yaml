# What progress means for Functional Bodybuilding: the loads the athlete
# chooses for the reps (Choosing Loads: to the top of the reps, then a little
# more), and the load at the target RPE where the day writes one.
id: marcus_filly

# The elite's mark: the back squat to bodyweight, estimated from the program's
# own back squat, at its ladder's elite rung (I8; docs/logic/levels.md).
elite_standards: [back_squat_bw_ratio]

progress:
  - id: working_load
    label: Working load
    primitive: set_load
    headline: true
    scope:
      modalities: [max_strength]
      slot_types: [sets_reps]
    expected: prescribed

  - id: load_at_rpe
    label: Load at target RPE
    primitive: load_at_rpe
    scope:
      modalities: [max_strength]
      slot_types: [sets_reps]
    expected: prescribed
