id: marcus_filly
name: "Marcus Filly / Functional Bodybuilding"
core_principles:
  - rpe_based_autoregulation_prevents_overtraining
  - aesthetics_and_function_are_compatible_goals
  - shoulder_and_joint_health_require_dedicated_maintenance
  - controlled_eccentrics_and_isometrics_build_tissue_resilience
  - sustainable_training_over_max_intensity
  - tempo_and_intent_matter_as_much_as_load
  - concurrent_training_managed_through_fatigue_awareness
scope:
  - max_strength
  - relative_strength
  - mixed_modal_conditioning
  - rehab
bias:
  - strength_endurance
  - durability
  - rehab
avoid_with: []
required_equipment:
  - barbell
  - dumbbell
  - pull_up_bar
  - rings
  - resistance_band
intensity_model: autoregulation_rpe
progression_philosophy: feel_based
sources:
  - "Marcus Filly — Functional Bodybuilding methodology and programming"
  - "plan.md section 10 (Rehab Protocol: Shoulder)"
notes: >
  RPE governs load selection session-to-session; athlete rates perceived effort
  and adjusts accordingly rather than following fixed percentages. Tempo prescriptions
  (e.g. 3-1-1, slow eccentric) are a hallmark — they increase time under tension
  without requiring heavier loads, making the method compatible with joint-sensitive
  populations. Rehab integration is first-class: isometric holds, eccentric
  push-ups, landmine presses, face pulls, and band pull-aparts are programmed
  alongside performance work. Shoulder protocol: dip support holds, side plank with
  lat activation, landmine press, eccentric push-up on parallettes, face pull
  (thumbs-up, elbows high), elbow-out rows, DB external rotation, band pull-aparts.
  Useful for injury rehab → return to sport transitions.

# Every modality this philosophy's frameworks prescribe has an archetype in
# this package; generation never needs to reach into another philosophy.
self_contained: true

# One repeating phase: Functional Bodybuilding autoregulates week to week
# rather than by fixed blocks. Phase text is drafted from this package's own
# notes and framework notes — review before relying on it.
primary_track_id: functional_bodybuilding
tracks:
  - id: functional_bodybuilding
    name: "Functional Bodybuilding"
    description: >
      Strength and muscle with joint health built in: RPE sets the load,
      tempo sets the time under tension, and rehab work sits alongside the
      performance work.
    phases:
      - id: autoregulated_block
        name: "Autoregulated Block"
        kind: build
        weeks: 12
        repeatable: true
        framework_id: rpe_autoregulation
        focus: "RPE-led strength with tempo"
        description: >
          Load is chosen by RPE each session instead of fixed percentages, so
          an under-recovered day self-adjusts downward. Tempo prescriptions and
          controlled eccentrics add time under tension without heavier loads.
          When several sessions in a row come in at RPE 9–10 at weights that
          used to feel like 7–8, deload then rather than waiting for the
          calendar.
        adaptations:
          - "Strength and muscle"
          - "Tissue resilience from eccentrics and isometrics"
          - "Shoulder and joint health"
        intensity: "RPE 7–9, tempo-controlled"
