id: marcus_filly
name: "Marcus Filly / Functional Bodybuilding"
core_principles:
  - full_body_sessions_by_movement_pattern
  - tempo_and_intent_matter_as_much_as_load
  - loads_chosen_by_reps_and_rpe
  - strength_balance_beside_strength_intensity
  - quality_first_conditioning
  - six_week_cycles_and_a_bridge_week
scope:
  - max_strength
  - strength_endurance
  - mixed_modal_conditioning
bias:
  - max_strength
avoid_with: []
required_equipment:
  - barbell
  - rack
  - plates
  - dumbbell
  - pull_up_bar
  - resistance_band
intensity_model: autoregulation_rpe
progression_philosophy: feel_based
sources:
  - "Functional Bodybuilding Help Center: How to Read Tempo, RPE, Choosing Loads, Persist Track Summary, the Persist sample weeks"
  - "Marcus Filly, Workout Tempo; Deload Week; 5 Ways To Build Functional Muscle (functional-bodybuilding.com)"
notes: >
  Functional Bodybuilding trains movement patterns rather than body parts, in
  full-body sessions: a warm-up, strength intensity, strength balance (the
  unilateral and smaller work), conditioning or a finisher, and a cooldown.
  Tempo is written down, hold, up, pause (20X1). Loads are the athlete's: work
  to the top of the reps, then add a little; RPE 7 leaves three reps in
  reserve. Persist runs six-week cycles, and after two a Bridge week deloads
  everything to RPE 6–7.

# Every exercise of the training contract is the package's own.
self_contained: true

# Two tracks, Persist's two 3x tracks as their sample weeks print them
# (training_contract.yaml).
primary_track_id: functional_bodybuilding
tracks:
  - id: functional_bodybuilding
    name: "Pump Condition (3x)"
    description: >
      Persist's Full Body Pump Condition, three days a week: strength,
      strength balance and a conditioning piece each day.
    phases:
      - id: persist
        name: "Persist Cycles"
        kind: build
        weeks: 13
        repeatable: true
        former_ids: [autoregulated_block]
        framework_id: rpe_autoregulation
        focus: "Strength, balance and conditioning in every session"
        description: >
          Two six-week cycles of the same three days — tempo on the strength
          work, loads chosen by reps and RPE — then the Bridge week at RPE 6–7.
        adaptations:
          - "Strength and muscle"
          - "Structural balance"
          - "Conditioning"
        intensity: "RPE 7–9; conditioning at a named effort"
  - id: pump_lift
    name: "Pump Lift (3x)"
    description: >
      Persist's Full Body Pump Lift, three days a week: lifting and muscle
      pumps, no conditioning — a finisher closes each day.
    phases:
      - id: persist_lift
        name: "Persist Cycles"
        kind: build
        weeks: 13
        repeatable: true
        framework_id: rpe_autoregulation
        focus: "Strength and muscle, no conditioning"
        description: >
          Two six-week cycles of the same three days, a finisher in place of
          conditioning, then the Bridge week at RPE 6–7.
        adaptations:
          - "Strength and muscle"
          - "Structural balance"
        intensity: "RPE 7–10 on the finishers"
