  scaling_down: []
  typical_volume:
    sets: 1
    reps: 6
  sources: ["Built to Move 21-Day Challenge, Days #8, #11, #14, #17, #21; Built to Move, Vital Sign 8"]
  notes: >
    Standing on one leg, reach the other foot out along the three lines of a Y
    — forward, and back to each side — as far as you can while staying
    balanced; then switch legs. Day #8's physical practice, shown in its video.

- id: balance_play
  name: Balance Play
  category: mobility
  modality: [mobility]
  equipment: []
  effort: low
  bilateral: false
  movement_patterns: [balance]
  requires: []
  unlocks: []
  contraindicated_with: []
  progressions:
