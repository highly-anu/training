# Kelly & Juliet Starrett — the tests and physical practices the Built to Move
# 21-Day Challenge names (docs/package-fidelity/kelly_starrett.md). The
# follow-along mobilizations are the challenge's own videos, one exercise that
# points at each day's page: the pages do not name them.
exercises:

# ── The ten vital signs' movement tests ──────────────────────────────────────
- id: sit_and_rise_test
  name: Sit-and-Rise Test
  category: mobility
  modality: [mobility]
  equipment: []
  effort: low
  bilateral: true
  movement_patterns: [squat, hip_flexion]
  requires: []
  unlocks: []
  contraindicated_with: []
  progressions:
    volume: retest
  scaling_down: []
  typical_volume:
    sets: 1
    reps: 1
  sources: ["Built to Move 21-Day Challenge, Day #1; Built to Move, Vital Sign 1"]
  notes: >
    Sit down cross-legged on the floor and stand back up without using your
    hands. Start at 10 and take a point off for each assist — a hand, a knee,
    the side of a leg, a wall, a loss of balance. The test asks whether your
    hips have the range to get down to the floor and up.

- id: breath_hold_test
  name: Breath-Hold Test
  category: mobility
  modality: [mobility]
  equipment: []
  effort: low
  bilateral: true
  movement_patterns: [breathing]
  requires: []
  unlocks: []
  contraindicated_with: []
  progressions:
    volume: retest
  scaling_down: []
  typical_volume:
    sets: 1
    reps: 1
  sources: ["Built to Move 21-Day Challenge, Day #2; Built to Move, Vital Sign 2"]
  notes: >
    After a normal breath out, pinch the nose and time how long until you feel
    you must breathe: a gauge of your tolerance of CO2, a benchmark to retest
    against rather than a lab test.

- id: couch_test
  name: Couch Test
  category: mobility
  modality: [mobility]
  equipment: []
  effort: low
  bilateral: false
  movement_patterns: [hip_extension]
  requires: []
  unlocks: []
  contraindicated_with: []
  progressions:
    volume: retest
  scaling_down: []
  typical_volume:
    sets: 1
    duration_sec: 60
  sources: ["Built to Move 21-Day Challenge, Day #3; Built to Move, Vital Sign 3"]
  notes: >
    Back knee against the base of a couch or wall, shin up it, front foot
    planted; then bring the torso upright. How far you get is how well you
    extend your hips. An easy one to do at the end of the day.

- id: airport_scanner_test
  name: Airport Scanner Arms-Raise Test
  category: mobility
  modality: [mobility]
  equipment: []
  effort: low
  bilateral: true
  movement_patterns: [shoulder_flexion]
  requires: []
  unlocks: []
  contraindicated_with: []
  progressions:
    volume: retest
  scaling_down: []
  typical_volume:
    sets: 1
    reps: 1
  sources: ["Built to Move 21-Day Challenge, Day #5; Built to Move, Vital Sign 5"]
  notes: >
    Face down, arms overhead, a light dowel or broomstick in the hands;
    forehead and belly stay down while the arms lift as high as they can for
    five breaths, elbows straight. It measures shoulder flexion.

- id: shoulder_rotation_test
  name: Shoulder Rotation Test
  category: mobility
  modality: [mobility]
  equipment: []
  effort: low
  bilateral: true
  movement_patterns: [shoulder_external_rotation]
  requires: []
  unlocks: []
  contraindicated_with: []
  progressions:
    volume: retest
  scaling_down: []
  typical_volume:
    sets: 1
    reps: 1
  sources: ["Built to Move 21-Day Challenge, Day #5; Built to Move, Vital Sign 5"]
  notes: >
    On your back, elbows and shoulders at ninety degrees, backs of the hands
    toward the floor; press them down as hard as you can for five breaths. It
    measures shoulder external rotation.

- id: squat_test
  name: Squat Test
  category: mobility
  modality: [mobility]
  equipment: []
  effort: low
  bilateral: true
  movement_patterns: [squat]
  requires: []
  unlocks: []
  contraindicated_with: []
  progressions:
    volume: retest
  scaling_down: []
  typical_volume:
    sets: 1
    reps: 1
  sources: ["Built to Move 21-Day Challenge, Day #7; Built to Move, Vital Sign 7"]
  notes: >
    Feet hip width or wider, barefoot or in comfortable shoes: whichever squat
    position you can reach, hold it for five breaths. Don't worry about the
    shape of the spine.

- id: solec_test
  name: SOLEC Test (Stand On One Leg, Eyes Closed)
  category: mobility
  modality: [mobility]
  equipment: []
  effort: low
  bilateral: false
  movement_patterns: [balance]
  requires: []
  unlocks: []
  contraindicated_with: []
  progressions:
    volume: retest
  scaling_down: []
  typical_volume:
    sets: 1
    duration_sec: 30
  sources: ["Built to Move 21-Day Challenge, Day #8; Built to Move, Vital Sign 8"]
  notes: >
    Stand on one leg with the eyes closed. Balance rests on the inner ear, the
    body's own sense of position and the eyes; this takes the eyes away.

- id: old_man_balance_test
  name: Old Man Balance Test
  category: mobility
  modality: [mobility]
  equipment: []
  effort: low
  bilateral: false
  movement_patterns: [balance]
  requires: []
  unlocks: []
  contraindicated_with: []
  progressions:
    volume: practise_it
  scaling_down: []
  typical_volume:
    sets: 1
    reps: 1
  sources: ["Built to Move 21-Day Challenge, Days #8, #12, #18; Built to Move, Vital Sign 8"]
  notes: >
    Standing on one leg, pick up a sock, put it on, then the shoe, and tie it;
    then the other side, counting each time the free foot touches down. "We are
    confident that EVERYONE can pass it — with practice."

# ── The physical practices ───────────────────────────────────────────────────
- id: floor_sitting
  name: Floor-Sitting Positions
  category: mobility
  modality: [mobility]
  equipment: []
  effort: low
  bilateral: true
  movement_patterns: [hip_flexion, hip_external_rotation]
  requires: []
  unlocks: []
  contraindicated_with: []
  progressions:
    volume: more_time_on_the_floor
  scaling_down: []
  typical_volume:
    duration_sec: 300
  sources: ["Built to Move 21-Day Challenge, Day #1; Built to Move, Vital Sign 1"]
  notes: >
    Cross-legged, 90/90, long sitting, one-leg-up: sit on the floor in these
    positions throughout your day, moving between them — the practice that
    improves the Sit-and-Rise Test.

