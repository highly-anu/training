  typical_volume:
    sets: 1
    reps: 10
  sources: ["Built to Move 21-Day Challenge, Days #7-21; Built to Move, Vital Sign 7"]
  notes: >
    Sit down to a chair and stand back up. The challenge adds one a day: 8 on
