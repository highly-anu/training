  scaling_down: []
  typical_volume:
    duration_sec: 180
  sources: ["Built to Move 21-Day Challenge, Days #9, #10, #13, #15, #16, #20; Built to Move, Vital Sign 8"]
  notes: >
    Play at balancing — on one foot, eyes open or closed, on a line or an
    uneven surface. The challenge names the practice; its examples are in the
    book's Vital Sign 8, which was not read.

