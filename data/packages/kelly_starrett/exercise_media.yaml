airport_scanner_test:
  animation:
    type: none
  coaching_focus: Forehead and belly stay on the floor, elbows straight.
  common_errors:
  - Lifting the head or chest
  - Bending the elbows
  cue_points:
  - Thumbs up, dowel in the hands
  - Forehead and belly down
  - Lift and breathe five times
  description: Face down, arms overhead holding a light dowel, lifting the arms as high as they
    go for five breaths.
  muscle_diagram:
    highlight_primary:
    - shoulders
    - lats
    highlight_secondary:
    - upper_back
  muscles_primary:
  - shoulders
  - lats
  muscles_secondary:
  - upper_back
balance_play:
  animation:
    type: none
  coaching_focus: Little and often.
  common_errors:
  - Practising only when it is easy
  cue_points:
  - One foot
  - Eyes closed to make it harder
  - Try a line or an uneven surface
  description: 'Playing at balance: on one foot, eyes open or closed, on a line or an uneven
    surface.'
  muscle_diagram:
    highlight_primary:
    - calves
    highlight_secondary:
    - glutes
  muscles_primary:
  - calves
  muscles_secondary:
  - glutes
breath_hold_test:
  animation:
    type: none
  coaching_focus: A calm, normal exhale before the hold.
  common_errors:
  - Taking a big breath first
  - Holding past the urge
  cue_points:
  - Sit or stand still
  - Normal breath out
  - Stop at the first real urge to breathe
  description: After a normal breath out, pinch the nose and time how long until you must breathe.
  muscle_diagram:
    highlight_primary:
    - core
    highlight_secondary: []
  muscles_primary:
  - core
  muscles_secondary: []
couch_test:
  animation:
    type: none
  coaching_focus: Squeeze the glute of the back leg and keep the ribs down.
  common_errors:
  - Arching the low back to fake it
  - Letting the back hip drift
  cue_points:
  - Shin up the couch
  - Glute on
  - Bring the torso upright only as far as you can
  description: Back knee at the base of a couch or wall, shin up it, front foot planted; the
    torso brought upright.
  muscle_diagram:
    highlight_primary:
    - hip_flexors
    - rectus_femoris
    highlight_secondary:
    - quadriceps
  muscles_primary:
  - hip_flexors
  - rectus_femoris
  muscles_secondary:
  - quadriceps
floor_sitting:
  animation:
    type: none
  coaching_focus: Change positions often; sit tall.
  common_errors:
  - Slumping in one position for an hour
  cue_points:
  - Cross-legged
  - 90/90
  - Long sitting
  - One leg up
  description: Sitting on the floor — cross-legged, 90/90, long sitting, one-leg-up — and moving
    between the positions.
  muscle_diagram:
    highlight_primary:
    - hip_flexors
    - adductors
    highlight_secondary:
    - hamstrings
    - glutes
  muscles_primary:
  - hip_flexors
  - adductors
  muscles_secondary:
  - hamstrings
  - glutes
follow_along_mobilization:
  animation:
    type: none
  coaching_focus: Breathe through each position; if you can't breathe in it, you don't own it.
  common_errors:
  - Holding the breath through a mobilization
  cue_points:
  - Open the day's page
  - Follow the video
  - Breathe in each position
  description: The day's follow-along mobilization videos from the Built to Move 21-Day Challenge.
  muscle_diagram:
    highlight_primary:
    - hip_flexors
    - shoulders
    highlight_secondary: []
  muscles_primary:
  - hip_flexors
  - shoulders
  muscles_secondary: []
old_man_balance_test:
  animation:
    type: none
  coaching_focus: Stay on the standing leg the whole time.
  common_errors:
  - Hopping
  - Leaning on a wall
  cue_points:
  - Socks and shoes on the floor in front
  - Stand on one leg to reach and dress
  - Count the touches
  description: On one leg, put on a sock and a shoe and tie it, then the other side.
  muscle_diagram:
    highlight_primary:
    - glutes
    - calves
    highlight_secondary:
    - core
  muscles_primary:
  - glutes
  - calves
  muscles_secondary:
  - core
shoulder_rotation_test:
  animation:
    type: none
  coaching_focus: Elbows and shoulders at ninety degrees.
  common_errors:
  - Arching off the floor
  - Letting the elbows slide
  cue_points:
  - Arms in a field goal
  - Press the backs of the hands down
  - Five breaths
  description: On your back, arms in a 'field goal', pressing the backs of the hands into the
    floor for five breaths.
  muscle_diagram:
    highlight_primary:
    - rotator_cuff
    - infraspinatus
    highlight_secondary:
    - teres_minor
  muscles_primary:
  - rotator_cuff
  - infraspinatus
  muscles_secondary:
  - teres_minor
sit_and_rise_test:
  animation:
    type: none
  coaching_focus: Down and up with no hands, knees or walls.
  common_errors:
  - Rushing it and falling
  - Not counting a hand brushing the floor
  cue_points:
  - Cross your feet and lower yourself
  - Rise without a hand or knee down
  - Count each assist
  description: 'Sit down cross-legged on the floor and stand back up without your hands: a point
    off for each assist.'
  muscle_diagram:
    highlight_primary:
    - hip_flexors
    - quadriceps
    highlight_secondary:
    - glutes
    - adductors
  muscles_primary:
  - hip_flexors
  - quadriceps
  muscles_secondary:
  - glutes
  - adductors
sit_stand:
  animation:
    type: none
  coaching_focus: Control the sit, stand all the way up.
  common_errors:
  - Dropping into the chair
  - Pushing off the knees
  cue_points:
  - Feet under the knees
  - Sit down under control
  - Stand tall
  description: Sit down to a chair and stand up again.
  muscle_diagram:
    highlight_primary:
    - quadriceps
    - glutes
    highlight_secondary: []
  muscles_primary:
  - quadriceps
  - glutes
  muscles_secondary: []
solec_test:
  animation:
    type: none
  coaching_focus: Quiet foot, quiet body.
  common_errors:
  - Opening the eyes to catch yourself
  - Leaning on something
  cue_points:
  - Lift one foot
  - Close the eyes
  - Time it, then switch legs
  description: Stand on one leg with the eyes closed.
  muscle_diagram:
    highlight_primary:
    - calves
    highlight_secondary:
    - glutes
    - core
  muscles_primary:
  - calves
  muscles_secondary:
  - glutes
  - core
squat_test:
  animation:
    type: none
  coaching_focus: Breathe in the bottom; the shape of the spine does not matter.
  common_errors:
  - Holding the breath
  - Forcing a depth you cannot breathe in
  cue_points:
  - Feet hip width or wider
  - Sit as low as you can
  - Hold for five breaths
  description: The deepest squat position you can reach, held for five breaths.
  muscle_diagram:
    highlight_primary:
    - quadriceps
    - glutes
    highlight_secondary:
    - adductors
    - calves
  muscles_primary:
  - quadriceps
  - glutes
  muscles_secondary:
  - adductors
  - calves
y_balance:
  animation:
    type: none
  coaching_focus: Reach far while the standing foot stays planted.
  common_errors:
  - Putting weight on the reaching foot
  - Rushing
  cue_points:
  - Stand on one leg
  - Reach forward, then back to each side
  - Switch legs
  description: On one leg, reaching the other foot out along the three lines of a Y.
  muscle_diagram:
    highlight_primary:
    - glutes
    - quadriceps
    highlight_secondary:
    - calves
    - core
  muscles_primary:
  - glutes
  - quadriceps
  muscles_secondary:
  - calves
  - core
