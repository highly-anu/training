id: kelly_starrett
name: "Kelly Starrett / Supple Leopard"
core_principles:
  - movement_quality_is_testable_and_correctable
  - tissue_prep_before_training_reduces_injury_risk
  - global_and_local_joint_mobility_have_distinct_protocols
  - breathing_and_bracing_are_mechanical_skills_not_assumptions
  - upstream_and_downstream_joints_affect_target_joint_function
  - mobilization_is_not_stretching_it_is_position_restoration
  - motor_control_must_be_established_before_adding_load
scope:
  - mobility
  - rehab
bias:
  - mobility
  - rehab
avoid_with: []
required_equipment:
  - resistance_band
intensity_model: skill_based
progression_philosophy: range_based
sources:
  - "Becoming a Supple Leopard (Starrett & Cordoza, 2013)"
  - "Ready to Run (Starrett, 2014)"
  - "Deskbound (Starrett, 2016)"
notes: >
  Not a standalone training program — functions as a mobility and movement quality
  layer applied on top of any other methodology. Primary tools: banded joint
  distraction, soft tissue work (lacrosse ball / foam roller), contract-relax
  mobilizations, and positional assessments. Ten physical archetypes (hip extension,
  internal rotation, ankle, thoracic spine, etc.) each have a testing standard and
  a prescribed mobilization sequence. Breathing and bracing sequence (360 degrees
  of air, IAP) is a prerequisite for any loaded movement. Tissue prep is prescribed
  before sessions (2 min minimum per target joint); mobilization is also effective
  post-session and throughout the day. Resistance bands are the core tool for joint
  distraction work; no heavy equipment required.

# Every modality this philosophy's frameworks prescribe has an archetype in
# this package; generation never needs to reach into another philosophy.
self_contained: true

# One track from passive to loaded range, then maintenance. Phase text is
# drafted from this package's own notes and framework notes — review before
# relying on it.
primary_track_id: supple_leopard
tracks:
  - id: supple_leopard
    name: "Supple Leopard Mobility"
    description: >
      A mobility and movement-quality layer: restore positions, own them
      under load, then keep them. Built to sit on top of any other training.
    phases:
      - id: restore
        name: "Restore"
        kind: base
        weeks: 6
        framework_id: kelly_starrett_mobility
        focus: "Screen and restore positions"
        description: >
          Test each target position against its standard, then restore it:
          tissue prep (two minutes minimum per region), banded joint
          distraction and contract-relax mobilizations. Breathing and bracing
          — 360 degrees of air — is established before anything is loaded.
        adaptations:
          - "Passive range in the limiting positions"
          - "Breathing and bracing"
        intensity: "Low; position-driven"
      - id: load_the_range
        name: "Load the Range"
        kind: build
        weeks: 6
        framework_id: kelly_starrett_mobility
        focus: "Active range under light load"
        description: >
          Progress from passive range to active range under light load, so the
          restored positions hold when they are asked to work.
        adaptations:
          - "Active control at end range"
          - "Positions that hold under load"
        intensity: "Light load"
      - id: maintain
        name: "Maintain"
        kind: maintenance
        weeks: 4
        repeatable: true
        framework_id: kelly_starrett_mobility
        focus: "Daily maintenance"
        description: >
          Keep the positions with tissue prep before and after sessions and
          short mobilizations through the day, alongside whatever else is
          being trained.
        adaptations:
          - "Retained range"
          - "Tissue health"
        intensity: "Low, frequent"
