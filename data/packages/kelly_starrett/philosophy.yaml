id: kelly_starrett
name: "Kelly Starrett / Built to Move"
core_principles:
  - ten_vital_signs_each_with_a_test_and_a_physical_practice
  - test_then_practice_then_retest
  - mobility_is_daily_practice_not_a_workout
  - moving_enough_is_not_working_out
  - get_up_and_down_off_the_floor
  - if_you_cannot_breathe_in_a_position_you_do_not_own_it
  - restore_hip_extension
  - habits_stacked_until_they_stick
scope:
  - mobility
bias:
  - mobility
avoid_with: []
required_equipment: []
intensity_model: skill_based
progression_philosophy: range_based
sources:
  - "Kelly & Juliet Starrett, Built to Move 21-Day Challenge (The Ready State, 2023)"
  - "Kelly & Juliet Starrett, Built to Move (Knopf, 2023) — not read"
notes: >
  Kelly and Juliet Starrett's Built to Move: ten vital signs — getting up and
  down off the floor, breathing, hip extension, walking, neck and shoulders,
  eating, squatting, balance, a movement-rich environment, sleep — each with a
  test and a physical practice ("10 tests + 10 physical practices = 10 ways to
  make your body work better"), and daily follow-along mobilizations "to help
  you recover from the day's activities so you can go again tomorrow". Their
  21-Day Challenge takes one vital sign a day for ten days, then stacks the
  practices for eleven more into habits "to be mixed into each day for the rest
  of your days". It sits beside any other training: working out is not the
  same as moving enough.

# Every modality this philosophy's frameworks prescribe has an archetype in
# this package; generation never needs to reach into another philosophy.
self_contained: true

# One track: the challenge as written, day by day, then its last day's
# practices every day (docs/package-fidelity/kelly_starrett.md).
primary_track_id: built_to_move
tracks:
  - id: built_to_move
    name: "Built to Move"
    description: >
      The Starretts' 21-Day Challenge, day by day — a vital sign a day for ten
      days, its test, its practice and the day's mobilizations, then eleven
      days stacking the practices — and the habits after it, every day.
    phases:
      - id: challenge
        name: "21-Day Challenge"
        kind: base
        weeks: 3
        framework_id: built_to_move
        focus: "Ten vital signs, then the habits stacked"
        description: >
          Days 1-10: the sit-and-rise, breath-hold, couch, steps, shoulder,
          food, squat, balance, sitting and sleep tests, each with its physical
          practice. Days 11-21: the practices stacked — floor sitting, 8,000 to
          10,000 steps, sit-stands one more each day, balance, standing at work,
          sleep — with each day's follow-along mobilizations.
        adaptations:
          - "Hip, shoulder and ankle range for everyday positions"
          - "Balance"
          - "Daily movement habits"
        intensity: "Low; every day"
        week_templates:
          - [challenge, challenge, challenge, challenge, challenge, challenge, challenge]
      - id: habits
        name: "Everyday Practices"
        kind: maintenance
        weeks: 4
        repeatable: true
        framework_id: built_to_move
        focus: "Mixed into each day for the rest of your days"
        description: >
          The practices the challenge built, every day: floor sitting, 21
          sit-stands, the Y balance and the follow-along mobilizations, beside
          the steps, food, standing and sleep habits.
        adaptations:
          - "Retained range and balance"
          - "Movement habits that stick"
        intensity: "Low; every day"
        week_templates:
          - [habits, habits, habits, habits, habits, habits, habits]
