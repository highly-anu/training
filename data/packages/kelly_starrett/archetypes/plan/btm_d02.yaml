id: btm_d02
name: 'Built to Move — Day 2: Breathe Easy'
modality: mobility
category: recovery
training_levels:
- novice
- intermediate
- advanced
- elite
duration_estimate_minutes: 20
pool_only: true
slots:
- role: test_breath_hold
  slot_type: skill_practice
  duration_minutes: 4
  exercise_filter:
    exercise_ids:
    - breath_hold_test
    ordered: true
  notes: 'Breath-Hold Test: your tolerance of CO2, a benchmark to retest against.'
- role: floor_sitting
  slot_type: skill_practice
  duration_minutes: 5
  exercise_filter:
    exercise_ids:
    - floor_sitting
    ordered: true
  notes: 'Floor-sitting positions: cross-legged, 90/90, long sitting, one-leg-up — here, and throughout
    your day.'
- role: mobilizations
  slot_type: skill_practice
  duration_minutes: 9
  sets: 3
  exercise_filter:
    exercise_ids:
    - follow_along_mobilization
    ordered: true
  notes: 'Day #2''s 3 follow-along mobilizations (a roller or large ball, a small ball): https://thereadystate.com/built-to-move-21-day-challenge-day-2/'
required_equipment: []
sources:
- 'Kelly & Juliet Starrett, Built to Move 21-Day Challenge (The Ready State), Day #2; Built to Move, Vital
  Sign 2: Breathe Easy'
notes: 'Today''s practice: nose-only breathing — find stretches of the day to breathe through the nose
  only; the Morning Spin-Up mobilization is a go-to for each morning. Through the day: floor sitting;
  nose-only breathing. Extra credit: tape your mouth closed for sleep, ten minutes, then twenty, up to
  a full night.'
