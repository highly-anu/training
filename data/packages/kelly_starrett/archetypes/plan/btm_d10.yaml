notes: 'Hours count: how many hours you actually sleep. Follow the sleep hygiene practices: same sleep
  and wake times, move through the day, careful with caffeine, no technology in the bedroom, little or
  no alcohol, cool down, wind down, a dark quiet room, overestimate the time in bed, keep the routine
  when travelling. Through the day: floor sitting; nose-only breathing; walk 8,000-10,000 steps (try three
  post-meal walks); eat 800 g of fruits and vegetables and your protein; accumulate 40 min of standing
  or dynamic sitting while working.'
