notes: 'The final day: these are essential habits, to be mixed into each day for the rest of your days.
  Through the day: floor sitting; nose-only breathing at work; walk 8,000-10,000 steps (intentional walking),
  breathing through the nose; eat 800 g of fruits and vegetables and your protein; accumulate 2 h 30 min
  of standing or dynamic sitting while working; follow the sleep hygiene practices. Extra credit: rucking.'
