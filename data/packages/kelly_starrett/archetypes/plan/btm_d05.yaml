id: btm_d05
name: 'Built to Move — Day 5: Future-Proof Your Neck and Shoulders'
modality: mobility
category: recovery
training_levels:
- novice
- intermediate
- advanced
- elite
duration_estimate_minutes: 25
pool_only: true
slots:
- role: test_airport_scanner
  slot_type: skill_practice
  duration_minutes: 4
  exercise_filter:
    exercise_ids:
    - airport_scanner_test
    ordered: true
  notes: 'Airport Scanner Arms-Raise Test: shoulder flexion (a PVC pipe or light broomstick).'
- role: test_shoulder_rotation
  slot_type: skill_practice
  duration_minutes: 4
  exercise_filter:
    exercise_ids:
    - shoulder_rotation_test
    ordered: true
  notes: 'Shoulder Rotation Test: shoulder external rotation.'
- role: floor_sitting
  slot_type: skill_practice
  duration_minutes: 5
  exercise_filter:
    exercise_ids:
    - floor_sitting
    ordered: true
  notes: 'Floor-sitting positions: cross-legged, 90/90, long sitting, one-leg-up — here, and throughout
    your day.'
- role: mobilizations
  slot_type: skill_practice
  duration_minutes: 9
  sets: 3
  exercise_filter:
    exercise_ids:
    - follow_along_mobilization
    ordered: true
  notes: 'Day #5''s 3 follow-along mobilizations (a wall or counter, a smash ball): https://thereadystate.com/built-to-move-21-day-challenge-day-5/'
required_equipment: []
sources:
- 'Kelly & Juliet Starrett, Built to Move 21-Day Challenge (The Ready State), Day #5; Built to Move, Vital
  Sign 5: Future-Proof Your Neck and Shoulders'
notes: 'Two shoulder tests, then mobilizations for the neck, shoulders and upper back. Through the day:
  floor sitting; nose-only breathing; walk 8,000-10,000 steps, intentionally. Extra credit: practise the
  worm push-up technique.'
