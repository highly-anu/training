id: btm_d08
name: 'Built to Move — Day 8: Find Your Balance'
modality: mobility
category: recovery
training_levels:
- novice
- intermediate
- advanced
- elite
duration_estimate_minutes: 30
pool_only: true
slots:
- role: test_solec
  slot_type: skill_practice
  duration_minutes: 4
  exercise_filter:
    exercise_ids:
    - solec_test
    ordered: true
  notes: 'SOLEC Test: stand on one leg, eyes closed — the inner ear and the body''s own sense of position,
    without the eyes.'
- role: test_old_man_balance
  slot_type: skill_practice
  duration_minutes: 4
  exercise_filter:
    exercise_ids:
    - old_man_balance_test
    ordered: true
  notes: 'Old Man Balance Test: put on socks and shoes standing on one leg.'
- role: floor_sitting
  slot_type: skill_practice
  duration_minutes: 5
  exercise_filter:
    exercise_ids:
    - floor_sitting
    ordered: true
  notes: 'Floor-sitting positions: cross-legged, 90/90, long sitting, one-leg-up — here, and throughout
    your day.'
- role: sit_stands
  slot_type: sets_reps
  sets: 1
  reps: 8
  exercise_filter:
    exercise_ids:
    - sit_stand
    ordered: true
  notes: 8 sit-stands.
- role: balance
  slot_type: skill_practice
  duration_minutes: 3
  exercise_filter:
    exercise_ids:
    - y_balance
    ordered: true
  notes: Y Balance.
- role: mobilizations
  slot_type: skill_practice
  duration_minutes: 9
  sets: 3
  exercise_filter:
    exercise_ids:
    - follow_along_mobilization
    ordered: true
  notes: 'Day #8''s 3 follow-along mobilizations (no equipment): https://thereadystate.com/built-to-move-21-day-challenge-day-8/'
required_equipment: []
sources:
- 'Kelly & Juliet Starrett, Built to Move 21-Day Challenge (The Ready State), Day #8; Built to Move, Vital
  Sign 8: Find Your Balance'
notes: 'Two balance tests, then the Y Balance. Through the day: floor sitting; nose-only breathing; walk
  8,000-10,000 steps (try three post-meal walks); eat 800 g of fruits and vegetables and your protein.
  Extra credit: jump rope or bouncing.'
