notes: 'Sitting inventory: track your sitting hours on a weekday. Accumulate 30 minutes of standing or
  dynamic sitting while working. Through the day: floor sitting; nose-only breathing; walk 8,000-10,000
  steps (try three post-meal walks); eat 800 g of fruits and vegetables and your protein. Extra credit:
  rucking, or the worm push-up technique.'
