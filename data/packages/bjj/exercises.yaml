# BJJ / grappling exercise library.
#
# The package shipped with archetypes but no exercises at all, so every slot in
# bjj_class and grappling_sc resolved zero in-package candidates and was filled
# from whichever philosophy happened to own a matching movement.
#
# Scope: mat work, the competitor's conditioning, and the lifts of StrengthLog's
# strength program for BJJ (training_contract.yaml), each with the substitutes
# the contract declares for an athlete without the implement or with an injury.
exercises:

# ── Mat work ─────────────────────────────────────────────────────────────────
- id: bjj_drilling
  name: Positional Drilling
  category: skill
  modality:
  - combat_sport
  equipment:
  - open_space
  effort: medium
  bilateral: true
  movement_patterns:
  - locomotion
  - rotation
  requires: []
  unlocks:
  - bjj_positional_sparring
  contraindicated_with: []
  progressions:
    volume: increase_duration
  scaling_down: []
  typical_volume:
    duration_sec: 1200
  sources:
  - BJJ
  notes: 'Repetition of a technique with a cooperative partner, at a pace that
    allows correction. Drilling precedes live work: a movement that falls apart
    cooperatively will not survive resistance. Volume, not intensity.'

- id: bjj_positional_sparring
  name: Positional Sparring
  category: skill
  modality:
  - combat_sport
  equipment:
  - open_space
  effort: high
  bilateral: true
  movement_patterns:
  - rotation
  - isometric
  - locomotion
  requires:
  - bjj_drilling
  unlocks:
  - bjj_live_rolling
  contraindicated_with: []
  progressions:
    volume: add_rounds
  scaling_down:
  - bjj_drilling
  typical_volume:
    sets: 6
    duration_sec: 180
  sources:
  - BJJ
  notes: 'Live resistance from a fixed starting position, reset on escape or
    submission. Gives the intensity of rolling with the repetition of drilling,
    and lets a specific position be trained rather than whatever the roll happens
    to produce.'

- id: bjj_live_rolling
  name: Live Rolling (Sparring)
  category: skill
  modality:
  - combat_sport
  equipment:
  - open_space
  effort: max
  bilateral: true
  movement_patterns:
  - rotation
  - isometric
  - locomotion
  requires:
  - bjj_positional_sparring
  unlocks: []
  contraindicated_with:
  - shoulder_instability
  - knee_meniscus_acute
  - cervical_radiculopathy
  progressions:
    volume: add_rounds
  scaling_down:
  - bjj_positional_sparring
  typical_volume:
    sets: 5
    duration_sec: 300
  sources:
  - BJJ
  notes: 'Full rounds from standing or seated. Both the training stimulus and the
    test — there is no substitute for it, and no amount of S&C replaces mat time.
    Tap early: the joints have to last decades, and a competitive round is not
    worth a shoulder.'

- id: bjj_takedown_practice
  name: Takedown Entries
  category: skill
  modality:
  - combat_sport
  - power
  equipment:
  - open_space
  effort: high
  bilateral: true
  movement_patterns:
  - hip_hinge
  - locomotion
  requires:
  - bjj_drilling
  unlocks: []
  contraindicated_with:
  - knee_meniscus_acute
  - cervical_radiculopathy
  progressions:
    volume: add_reps_per_set
  scaling_down:
  - bjj_drilling
  typical_volume:
    sets: 5
    reps: 10
  sources:
  - BJJ
  notes: 'Penetration steps, level changes and grip fighting into a takedown
    entry. Trained separately from ground work because the standing exchange is
    where most injuries happen and it needs volume at controlled intensity.'

# ── Grappling-specific conditioning ──────────────────────────────────────────
- id: bjj_shrimp_drill
  name: Shrimp / Hip Escape Drill
  category: bodyweight
  modality:
  - strength_endurance
  - combat_sport
  equipment:
  - open_space
  effort: medium
  bilateral: true
  movement_patterns:
  - hip_flexion
  - rotation
  - locomotion
  requires: []
  unlocks: []
  contraindicated_with: []
  progressions:
    volume: increase_distance
  scaling_down: []
  typical_volume:
    sets: 4
    distance_m: 15
  sources:
  - BJJ
  notes: 'The foundational escape movement, drilled down the mat and back. Also
    the cheapest conditioning in the sport: it trains the exact hip pattern used
    under an opponent, at a heart rate that keeps climbing.'

- id: bjj_sprawl_interval
  name: Sprawl Intervals
  category: bodyweight
  modality:
  - anaerobic_intervals
  - combat_sport
  equipment:
  - open_space
  effort: high
  bilateral: true
  movement_patterns:
  - hip_hinge
  - horizontal_push
  - locomotion
  requires: []
  unlocks: []
  contraindicated_with:
  - lumbar_disc
  progressions:
    volume: add_sets
  scaling_down:
  - bjj_shrimp_drill
  typical_volume:
    sets: 8
    duration_sec: 30
  sources:
  - BJJ
  notes: 'Repeated sprawls on a short clock. Reproduces the specific gasser of a
    scramble — explosive hip drop, immediate recovery to the feet, repeat — which
    is what actually runs a grappler out of air in the last minute of a round.'

- id: bjj_shuttle_sprint
  name: Mat Shuttle Sprint
  category: aerobic
  modality:
  - anaerobic_intervals
  equipment:
  - open_space
  effort: high
  bilateral: true
  movement_patterns:
  - locomotion
  - aerobic_monostructural
  requires: []
  unlocks: []
  contraindicated_with:
  - ankle_sprain
  - patellar_tendinopathy
  progressions:
    volume: add_sets
  scaling_down: []
  typical_volume:
    sets: 10
    distance_m: 20
  sources:
  - BJJ
  notes: 'Short shuttles with direction changes, matched to the work:rest of a
    competition round. Trains the repeated-effort capacity that separates a strong
    first round from a usable fifth.'

- id: bjj_bear_crawl
  name: Bear Crawl
  category: bodyweight
  modality:
  - strength_endurance
  equipment:
  - open_space
  effort: medium
  bilateral: true
  movement_patterns:
  - locomotion
  - isometric
  - horizontal_push
  requires: []
  unlocks: []
  contraindicated_with:
  - shoulder_impingement
  progressions:
    volume: increase_distance
  scaling_down: []
  typical_volume:
    sets: 4
    distance_m: 20
  sources:
  - BJJ
  notes: 'Knees just off the floor, hips low. Shoulder endurance in a loaded
    position close to the one held while passing guard.'

# ── Pulling and grip ─────────────────────────────────────────────────────────
- id: pull_up
  name: Pull-Up
  category: bodyweight
  modality:
  - relative_strength
  - strength_endurance
  equipment:
  - pull_up_bar
  effort: high
  bilateral: true
  movement_patterns:
  - vertical_pull
  requires: []
  unlocks: []
  contraindicated_with:
  - shoulder_impingement
  - elbow_tendinopathy
  progressions:
    volume: add_reps_per_set
    load: add_weight_when_reps_exceed_8
  scaling_down:
  - bjj_inverted_row
  typical_volume:
    sets: 5
    reps: 5
  sources:
  - BJJ
  - Gym Jones
  notes: 'Full dead hang at the bottom, chin clearly over the bar. Pulling
    strength carries over to grappling more directly than any press does — every
    guard retention and every sweep starts with a pull.'

- id: bjj_inverted_row
  name: Inverted Row
  category: bodyweight
  modality:
  - relative_strength
  - strength_endurance
  # A low bar, rings or the edge of a sturdy table: the substitute the
  # grappling S&C session names for an athlete without a pull-up bar.
  equipment: []
  effort: medium
  bilateral: true
  movement_patterns:
  - horizontal_pull
  requires: []
  unlocks:
  - pull_up
  contraindicated_with: []
  progressions:
    volume: add_reps_per_set
  scaling_down: []
  typical_volume:
    sets: 4
    reps: 10
  sources:
  - BJJ
  notes: 'Body straight, bar (or table edge) to sternum. The horizontal pull that
    balances the heavy vertical pulling volume grappling already supplies, and the
    pull for an athlete without a pull-up bar.'

- id: dead_hang
  name: Dead Hang
  category: bodyweight
  modality:
  - strength_endurance
  equipment:
  - pull_up_bar
  effort: medium
  bilateral: true
  movement_patterns:
  - isometric
  - vertical_pull
  requires: []
  unlocks: []
  contraindicated_with:
  - shoulder_instability
  progressions:
    volume: increase_duration
  scaling_down: []
  typical_volume:
    sets: 4
    duration_sec: 45
  sources:
  - BJJ
  - Gym Jones
  notes: 'Grip endurance, measured honestly. 45 seconds is a reasonable
    intermediate standard; a six-minute round asks for grip long after that.
    Shoulders active, not hanging passively off the joint.'

# ── Isometric and anti-rotation ──────────────────────────────────────────────
- id: bjj_plank_hold
  name: Plank Hold
  category: bodyweight
  modality:
  - strength_endurance
  equipment: []
  effort: medium
  bilateral: true
  movement_patterns:
  - isometric
  requires: []
  unlocks: []
  contraindicated_with: []
  progressions:
    volume: increase_duration
  scaling_down: []
  typical_volume:
    sets: 3
    duration_sec: 60
  sources:
  - BJJ
  notes: 'Anti-extension under sustained load. The frame held off a heavier
    opponent is this, with an unhelpful partner on top of it.'

- id: bjj_hollow_hold
  name: Hollow Body Hold
  category: bodyweight
  modality:
  - strength_endurance
  equipment: []
  effort: medium
  bilateral: true
  movement_patterns:
  - isometric
  - hip_flexion
  requires: []
  unlocks: []
  contraindicated_with: []
  progressions:
    volume: increase_duration
  scaling_down:
  - bjj_plank_hold
  typical_volume:
    sets: 3
    duration_sec: 30
  sources:
  - BJJ
  notes: 'Closed guard is a sustained hollow position. Trains the same thing with
    nobody trying to open it.'

# ── StrengthLog's lifts ──────────────────────────────────────────────────────
# Strength Training for BJJ (StrengthLog): Workout 1 and Workout 2 of the
# strength block, the deload week and the power block.
- id: trap_bar_deadlift
  name: Trap Bar Deadlift
  category: barbell
  modality:
  - max_strength
  - power
  # A trap (hex) bar and plates; the equipment list has no trap bar of its own.
  equipment:
  - barbell
  - plates
  effort: high
  bilateral: true
  movement_patterns:
  - hip_hinge
  - squat
  requires: []
  unlocks: []
  contraindicated_with:
  - lumbar_disc
  progressions:
    load: add_weight_when_every_set_makes_its_reps
  scaling_down: []
  typical_volume:
    sets: 4
    reps: 5
  sources:
  - StrengthLog
  notes: 'Stand inside the bar, grip the handles, push the floor away. The hinge that
    finishes a takedown and lifts a partner, with less load on the lower back than a
    straight bar.'

- id: bulgarian_split_squat
