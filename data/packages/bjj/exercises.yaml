  typical_volume:
    sets: 3
    reps: 8
  sources:
  - StrengthLog
  notes: 'Rear foot on a bench, front foot well forward; each leg does the reps. Hold
    dumbbells once your bodyweight is easy.'

- id: barbell_row
  name: Barbell Row
  category: barbell
  modality:
  - max_strength
  - strength_endurance
  equipment:
  - barbell
  - plates
