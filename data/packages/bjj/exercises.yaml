    duration_sec: 90
  sources:
  - BJJ
  - Kelly Starrett
  notes: 'Hip flexor length for full extension when bridging and finishing
    takedowns. Squeeze the glute of the trailing leg rather than sinking.'

- id: bjj_thoracic_extension
