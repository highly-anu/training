# ── Joint maintenance ────────────────────────────────────────────────────────
- id: bjj_neck_isometric
  name: Neck Isometric
  category: mobility
  modality:
  - mobility
  - durability
  equipment: []
  effort: low
  bilateral: false
  movement_patterns:
  - isometric
  requires: []
  unlocks: []
  contraindicated_with:
  - cervical_radiculopathy
  progressions:
    volume: increase_duration
  scaling_down: []
  typical_volume:
    sets: 4
    duration_sec: 20
  sources:
  - BJJ
  notes: 'Gentle self-resisted holds in four directions. The neck takes load from
    guillotines, stack passes and simple mat posture, and it is the joint most
    often neglected until it complains.'

- id: bjj_shoulder_dislocate
  name: Shoulder Dislocate (Band or Stick)
  category: mobility
  modality:
  - mobility
  equipment:
  - resistance_band
  effort: low
  bilateral: true
  movement_patterns:
  - vertical_pull
  - rotation
  requires: []
  unlocks: []
  contraindicated_with:
  - shoulder_instability
  progressions:
    volume: add_reps_per_set
  scaling_down: []
  typical_volume:
    sets: 2
    reps: 12
  sources:
  - BJJ
  - Kelly Starrett
  notes: 'Wide grip, slow arc overhead and behind. Maintains the external
    rotation that armbars and kimuras repeatedly test.'

- id: bjj_hip_90_90
  name: 90/90 Hip Rotation
  category: mobility
  modality:
  - mobility
  equipment: []
  effort: low
  bilateral: true
  movement_patterns:
