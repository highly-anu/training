  - rotation
  requires: []
  unlocks: []
  contraindicated_with:
  - hip_impingement
  progressions:
    volume: add_reps_per_set
  scaling_down: []
  typical_volume:
    sets: 3
    reps: 8
  sources:
  - BJJ
  notes: 'Active internal and external hip rotation. Guard work lives in these
    ranges, and hips that cannot get there under their own power get there anyway
    when someone else supplies the force.'

- id: bjj_couch_stretch
  name: Couch Stretch
  category: mobility
  modality:
  - mobility
  equipment: []
  effort: low
  bilateral: false
  movement_patterns:
  - hip_flexion
  requires: []
  unlocks: []
  contraindicated_with:
