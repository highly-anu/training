- id: bjj_wrist_prep
  name: Wrist Prep
  category: mobility
  modality:
  - mobility
  - durability
  equipment: []
  effort: low
  bilateral: true
  movement_patterns:
  - isometric
  requires: []
  unlocks: []
  contraindicated_with: []
  progressions:
