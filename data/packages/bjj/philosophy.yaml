id: bjj
name: "BJJ / Brazilian Jiu-Jitsu (Combat Sport Modality)"
core_principles:
  - mat_time_is_non_transferable_sparring_has_no_substitute
  - rolling_is_both_training_stimulus_and_test
  - conditioning_targets_isometric_endurance_hip_explosiveness_grip_endurance
  - positional_drilling_before_live_sparring
  - strength_and_power_in_two_full_body_sessions_beside_the_mat
  - tap_early_protect_joints_for_long_term_training
scope:
  - combat_sport
  - max_strength
  - anaerobic_intervals
bias:
  - combat_sport
  - max_strength
avoid_with: []
required_equipment: []
intensity_model: hard_easy_alternation
progression_philosophy: time_based
sources:
  - "plan.md section 1 (BJJ)"
  - "StrengthLog, Strength Training for BJJ (two full-body workouts; strength, deload, power)"
  - "BJJEE, finding your BJJ / strength and conditioning ratio"
notes: >
  BJJ as a philosophy entry governs how the system allocates and protects mat time.
  Required equipment is empty — the sport itself requires only a mat and partner;
  S&C support work varies. Conditioning priorities derived from sport demands:
  isometric endurance (maintaining frames and grips under sustained pressure),
  hip explosiveness (guard sweeps, takedowns, hip escapes), grip endurance (6-min
  rounds of sustained pulling). Vulnerable joints: shoulders (from armbars,
  kimuras), knees (leg locks, guard passing), and neck (from guillotines, mat
  posture). Intensity model is hard_easy_alternation because hard rolling days must
  be followed by drilling or technique days to manage cumulative joint stress.
  Progression is time_based: mat hours and drilling volume are the primary
  advancement mechanism, not load or complexity increments.

# Every modality this philosophy's frameworks prescribe has an archetype in
# this package; generation never needs to reach into another philosophy.
self_contained: true

# One repeating phase: S&C that supports mat time. The package describes no
# block sequence. Phase text is drafted from this package's own notes and
# framework notes — review before relying on it.
primary_track_id: mat_support
tracks:
  - id: mat_support
    name: "BJJ Performance"
    description: >
      Strength and conditioning around the mat: class is the anchor, and
      everything else supports it without competing for recovery. Classes
      take most of the week — two at three training days, three at four or
      five, four at six, five at seven — and StrengthLog's strength program
      beside them: one of its two workouts a week up to four days, both from
      five, never more than the mat (training_contract.yaml).
    phases:
      - id: mat_support
        name: "Mat-Time Support"
        kind: base
        weeks: 12
        repeatable: true
        framework_id: bjj_performance
        focus: "Support the mat without stealing recovery"
        description: >
          Mat time is non-negotiable; strength fits around it, on the days
          between classes where the week allows. StrengthLog's program runs in
          twelve-week cycles: six weeks of strength and hypertrophy (trap bar
          deadlifts, split squats, rows, presses, pull-ups, carries and grip
          work at three or four sets of five to eight), a deload week of two
          easy sets of about ten, and five weeks of power — up to 75 % of a
          one-rep max, every rep as fast as it can go. The weights are the
          athlete's own: add weight once every set makes its reps. The classes
          never deload on a schedule; an athlete who is overreached deloads
          everything, and the class drops live rolling and keeps the drilling.
        adaptations:
          - "Strength and hypertrophy"
          - "Power and explosive strength"
          - "Grip strength"
        intensity: "Hard/easy alternation; strength by reps made, power by speed"
        # Mat time first: classes outnumber the strength work and the
        # competitor's conditioning every week (docs/package-fidelity/bjj.md).
        checks:
          modality_outnumbers:
            - [combat_sport, max_strength]
            - [combat_sport, anaerobic_intervals]
