box_jump:
  animation:
    external_id: Front_Box_Jump
    gif_alt: Box Jump
    gif_source: free_exercise_db
    gif_url: https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Front_Box_Jump/0.jpg
    type: gif
  coaching_focus: Step down, do not jump down -- under fatigue, athletes jump down from the
    box repeatedly, which accumulates Achilles tendon stress far beyond what the workout itself
    intends.
  common_errors:
  - 'Jumping down from the box repeatedly: under fatigue this accumulates landing impact load
    on the Achilles and patella that the workout design did not account for'
  - 'Landing with locked knees on the box: the entire lower extremity absorbs the load when
    the knees are bent; locked-knee landing concentrates it at the joint'
  - 'Scraping the shins on the box: the jump height is insufficient for the box height; reduce
    box height or improve power'
  cue_points:
  - Approach the box at a comfortable distance; use a brief dip (arm swing optional) to load
    the legs
  - 'Explode through the entire foot: heels through to the balls of the feet as the jump progresses'
  - Land in a partial squat on top of the box with soft knees -- the landing should be quiet
  - Stand to full extension on top of the box before stepping or jumping off
  - Step off the box -- one foot at a time; do not jump off under fatigue
  description: The box jump is a standard plyometric -- an explosive two-leg jump from the floor
    onto a box (24 inches for men, 20 for women in CrossFit standards). Gym Jones programs it
    in conditioning circuits at 20-24 inch heights. It develops lower-body explosive power and
    the reactive strength required for athletic movements. The landing mechanics and the step-down
    are as important as the jump height for long-term Achilles and patellar tendon health.
  muscle_diagram:
    highlight_primary:
    - quadriceps
    - glutes
    - calves
    highlight_secondary:
    - hamstrings
    - core
  muscles_primary:
  - quadriceps
  - glutes
  - calves
  muscles_secondary:
  - hamstrings
  - core
