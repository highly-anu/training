bench_press:
  animation:
    external_id: Bench_Press_-_Powerlifting
    gif_alt: Bench Press
    gif_source: free_exercise_db
    gif_url: https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Bench_Press_-_Powerlifting/0.jpg
    type: gif
  coaching_focus: Bench pressing is a full-body movement — leg drive and upper-back tightness
    are not optional if you want to press heavy.
  common_errors:
  - Flared elbows at 90 degrees — places the shoulder in an impingement-prone position
  - Butt rising off the bench — usually means the load exceeds current strength
  - Losing upper-back tightness and letting shoulder blades wing under load
  - Bouncing the bar off the chest — catching a bounce trains the wrong quality
  cue_points:
  - 'Grip: roughly 1 finger outside shoulder width; forearms vertical when bar touches chest'
  - Retract and depress the shoulder blades before unracking — hold this through every rep
  - Arch your upper back and keep glutes on the bench; feet drive actively into the floor
  - 'Bar path: slight diagonal from lower chest at the bottom to over the upper chest at the
    top'
  - Touch lower chest or upper sternum — not the clavicle and not the belly
  - Elbows at 45–75 degrees to the torso — straight out stresses the shoulder
  description: The bench press is the foundational horizontal pushing movement — a bilateral
    press where the bar descends to the lower chest and is driven to lockout while the feet
    drive into the floor and the upper back remains tight. The Horsemen goal is 1.5x bodyweight;
    Starting Strength builds from 3x5 linear progression.
  muscle_diagram:
    highlight_primary:
    - pec
    - deltoids
    - triceps
    highlight_secondary:
    - core
    - forearms
  muscles_primary:
  - pec
  - deltoids
  - triceps
  muscles_secondary:
  - core
  - forearms
bjj_bear_crawl:
  animation:
    external_id: Bear_Crawl_Sled_Drags
    gif_alt: Bear Crawl
    gif_source: free_exercise_db
    gif_url: https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Bear_Crawl_Sled_Drags/0.jpg
    type: gif
  coaching_focus: Hips stay low and level -- if the hips are swaying side to side or rising
    high with each step, the crawl has degenerated into a four-point trot; slow down and keep
    the hips level.
  common_errors:
  - 'Hips rising too high: the crawl becomes a downward-dog walk; keep the knees close to the
    floor'
  - 'Ipsilateral movement (same-side hand and foot together): this is the common untrained pattern
    and removes the contralateral coordination demand'
  - 'Head dropping: the head should be neutral, not hanging down; maintain full-body awareness
    throughout'
  cue_points:
  - Start on hands and knees (tabletop position) with knees hovering 1-2 inches off the floor
  - Move the right hand and left foot simultaneously, then the left hand and right foot -- opposite
    limbs move together
  - 'Hips stay level: neither rising nor swaying side-to-side during each step'
  - 'Head neutral: looking slightly forward, neck an extension of the spine'
  - 'Slow is more challenging than fast: a slow, controlled bear crawl with level hips is harder
    than a fast, sloppy one'
  description: The bear crawl is a quadruped locomotion pattern with the hips kept low and opposite
    limbs moving simultaneously -- right hand with left foot, left hand with right foot. Gym
    Jones programs it in GPP circuits for shoulder stability, hip flexor endurance, and total-body
    coordination. It develops the contralateral coordination pattern foundational to efficient
    running and directly challenges the scapular stabilizers under dynamic loading.
  muscle_diagram:
    highlight_primary:
    - deltoids
    - core
    - quadriceps
    highlight_secondary:
    - upper_back
    - hip_flexors
    - serratus
  muscles_primary:
  - deltoids
  - core
  - quadriceps
  muscles_secondary:
  - upper_back
  - hip_flexors
  - serratus
