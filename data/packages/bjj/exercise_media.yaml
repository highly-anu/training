pull_up:
  animation:
    type: none
  coaching_focus: Dead hang fully at the bottom -- if you do not reach full elbow extension,
    you are doing a partial ROM exercise, not a pull-up.
  common_errors:
  - 'Half reps: not reaching full extension at the bottom caps strength development and creates
    poor movement habits'
  - 'Kipping under a strict prescription: kipping is a separate skill; mixing them unknowingly
    trains neither'
  - 'Chin in front of, not over, the bar: the standard is chin over -- partial top-range reps
    do not count'
  cue_points:
  - 'Start from a dead hang: shoulders fully elevated (passive) or actively depressed before
    initiating'
  - Drive the elbows down and back -- think of pulling the bar to the sternum, not the hands
    up
  - Chin clears the bar at the top; do not tuck the chin or crane the neck forward
  - Return to full dead hang at the bottom -- partial descents reduce the strength stimulus
    and build a false ceiling
  - Squeeze glutes and brace the core throughout -- no swinging or kipping in the strict variant
  description: The strict pull-up is the foundational upper-body vertical pulling test -- a
    dead-hang start with full elbow extension at the bottom, chin clearing the bar at the top.
    Marcus Filly treats it as the primary pulling strength metric; Gym Jones programs it at
    high volume in Murph-style sessions. Relative strength in this movement reliably predicts
    overall athletic capacity.
  muscle_diagram:
    highlight_primary:
    - upper_back
    - lats
    - biceps
    highlight_secondary:
    - core
    - forearms
    - deltoids
  muscles_primary:
  - upper_back
  - lats
  - biceps
  muscles_secondary:
  - core
  - forearms
  - deltoids
