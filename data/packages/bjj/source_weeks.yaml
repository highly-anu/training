# BJJ — the sources' own weeks (docs/schemas/source_weeks.schema.json).
# The one week a source writes out day by day, re-read 2026-10-21.
- id: bjjee_training_mix
  rule: R1
  track: mat_support
  note: >
    Huni (BJJEE, 2017), the mix that "works the best for me": BJJ Monday and
    Tuesday, a hard S&C session Wednesday, BJJ Thursday to Saturday, a medium
    S&C session Saturday afternoon or evening, Sunday rest — five classes and
    two S&C sessions on six days. The package keeps the two S&C sessions; its
    four classes, each on a day of its own, are I7 (the owner's decision), so
    the class count is not compared. The weekdays are the author's.
  profile: {days_per_week: 6, session_time_minutes: 90, training_level: intermediate, equipment: all}
  weeks:
    - modalities: {strength_endurance: 2}
- id: strengthlog_deload
  rule: R4
  track: mat_support
  note: >
    StrengthLog's deload: a week between the two six-week halves of the
    strength block, "about 50–60% of the weight", about ten reps, two sets.
    At four training days the strength session is weekly, so the seventh is
    the deload; the weight is the athlete's (I2), said in the note.
  profile: {days_per_week: 4, session_time_minutes: 60, training_level: intermediate, equipment: all}
  num_weeks: 8
  series:
    - {exercise: pull_up, field: sets, values: [5, 5, 5, 5, 5, 5, 2, 5]}
    - {exercise: pull_up, field: reps, values: [5, 5, 5, 5, 5, 5, 10, 5]}
