# What progress means for BJJ mat support. Time-based: the mat is the sport,
# so the first number is time on it; around it, the loads of StrengthLog's
# lifts and how long the grip and trunk hold.
id: bjj

# The elite grappler's strength marks: the bench press to bodyweight, estimated
# from the program's own bench, and max pull-ups, its "max reps" sets, at their
# ladders' elite rung (I10; docs/logic/levels.md).
elite_standards: [bench_press_bw_ratio, pull_up_reps]

progress:
  - id: mat_time
    label: Mat time
    primitive: duration
    headline: true
    scope: {archetypes: [bjj_class]}
    expected: {load_field: duration_minutes}

  - id: grip_holds
    label: Grip and trunk holds
    primitive: hold_seconds
    scope: {archetypes: [grappling_sc], slot_types: [static_hold]}
    expected: {load_field: hold_seconds}

  - id: lift_loads
    label: Strength
    primitive: set_load
    scope:
      archetypes: [grappling_sc]
      slot_types: [sets_reps]
    expected: prescribed
