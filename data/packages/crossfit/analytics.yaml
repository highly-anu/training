# What progress means for CrossFit: the benchmark workouts, repeated at
# irregular intervals so progress can be measured (Benchmark Workouts, 2003),
# and the rounds of the twenty-minute triplets.
id: crossfit

progress:
  - id: benchmark_wods
    label: Benchmark workouts
    primitive: benchmark_level
    headline: true
    benchmarks: [wod_fran_minutes, wod_helen_minutes, wod_cindy_rounds, wod_diane_minutes,
                 wod_elizabeth_minutes, wod_annie_minutes, wod_murph_minutes]
    target_level: intermediate

  - id: triplet_rounds
    label: Rounds in twenty minutes
    primitive: rounds
    scope: {slot_types: [amrap]}

benchmarks: [wod_fran_minutes, wod_helen_minutes, wod_cindy_rounds, wod_diane_minutes,
             wod_elizabeth_minutes, wod_annie_minutes, wod_murph_minutes]
