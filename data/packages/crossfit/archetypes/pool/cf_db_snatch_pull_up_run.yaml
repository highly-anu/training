id: cf_db_snatch_pull_up_run
name: "Dumbbell Snatch / Pull-Ups / Run x 3"
modality: mixed_modal_conditioning
category: conditioning
training_levels: [intermediate, advanced, elite]
duration_estimate_minutes: 25
pool_only: true

slots:
  - role: triplet
    slot_type: for_time
    rounds: 3
    exercise_filter:
      exercise_ids: [db_snatch]
      ordered: true
    load: "55 lb (25 kg), alternating arms"
    notes: "3 rounds for time. Post time."

  - role: triplet_2
    slot_type: amrap_movement
    parent_slot_role: triplet
    reps_per_round: 20
    exercise_filter:
      exercise_ids: [pull_up]
      ordered: true

  - role: triplet_3
    slot_type: amrap_movement
    parent_slot_role: triplet
    distance_m: 400
    exercise_filter:
      exercise_ids: [run_interval]
      ordered: true

required_equipment:
- dumbbell
- pull_up_bar
- open_space
sources:
- "crossfit.com Workout of the Day, 2005 (2005-09-11)"
notes: >
  3 rounds for time: 20 alternating dumbbell (or kettlebell) snatches at 55 lb, 20 pull-ups, run 400 m.
