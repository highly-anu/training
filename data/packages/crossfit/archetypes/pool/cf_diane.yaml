id: cf_diane
name: "Diane"
modality: mixed_modal_conditioning
category: conditioning
training_levels: [novice, intermediate, advanced, elite]
# Written as Rx (the track's authored level); the levels below do it scaled.
scaling_eligible: true
duration_estimate_minutes: 15
pool_only: true
# A benchmark: its logged result suggests a standard result.
test: {selectable: true}

slots:
  - role: diane
    slot_type: for_time
    rep_scheme: [21, 15, 9]
    rounds: 3
    exercise_filter:
      exercise_ids: [deadlift]
      ordered: true
    load: "225 lb (102 kg); women 155 lb (70 kg)"
    load_kg: {male: 102, female: 70}
    standard: wod_diane_minutes
    notes: "21-15-9 reps of each, for time. Post time."

  - role: diane_2
    slot_type: amrap_movement
    parent_slot_role: diane
    rep_scheme: [21, 15, 9]
    exercise_filter:
      exercise_ids: [handstand_push_up]
      ordered: true

required_equipment:
- barbell
- plates
sources:
- "CrossFit, Benchmark Workouts (2003) / The New Girls (2004) / crossfit.com/benchmark"
notes: >
  21-15-9 reps, for time, of deadlifts at 225/155 lb and handstand push-ups.
