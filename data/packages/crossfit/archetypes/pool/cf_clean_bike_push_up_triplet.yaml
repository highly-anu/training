id: cf_clean_bike_push_up_triplet
name: "Clean / Bike / Push-Ups, 20 min"
modality: mixed_modal_conditioning
category: conditioning
training_levels: [intermediate, advanced, elite]
duration_estimate_minutes: 20
pool_only: true

slots:
  - role: triplet
    slot_type: amrap
    reps_per_round: 20
    duration_sec: 1200
    exercise_filter:
      exercise_ids: [clean]
      ordered: true
    load: "50 % of bodyweight"
    notes: "20 minutes for rotations."

  - role: triplet_2
    slot_type: amrap_movement
    parent_slot_role: triplet
    distance_m: 1609
    exercise_filter:
      exercise_ids: [bike_interval]
      ordered: true

  - role: triplet_3
    slot_type: amrap_movement
    parent_slot_role: triplet
    reps_per_round: 15
    exercise_filter:
      exercise_ids: [push_up]
      ordered: true

required_equipment:
- barbell
- plates
- bike
sources:
- "Glassman, A Theoretical Template for CrossFit's Programming (2003), Table 4"
notes: >
  As many rounds as possible in 20 minutes: 20 cleans at 50 % of bodyweight, bike 1 mile, 15 push-ups.
