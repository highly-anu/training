id: cf_lynne
name: "Lynne"
modality: mixed_modal_conditioning
category: conditioning
training_levels: [intermediate, advanced, elite]
duration_estimate_minutes: 30
pool_only: true

slots:
  - role: bench
    slot_type: sets_reps
    sets: 5
    reps: max
    exercise_filter:
      exercise_ids: [bench_press]
      ordered: true
    load: "Bodyweight"

  - role: pull_ups
    slot_type: sets_reps
    sets: 5
    reps: max
    exercise_filter:
      exercise_ids: [pull_up]
      ordered: true
    notes: "Alternate with the bench; post reps for both in all rounds."

required_equipment:
- barbell
- rack
- plates
- pull_up_bar
sources:
- "CrossFit, Benchmark Workouts (2003) / The New Girls (2004) / crossfit.com/benchmark"
notes: >
  5 rounds for max reps of bodyweight bench press and pull-ups.
