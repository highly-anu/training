id: cf_chelsea
name: "Chelsea"
modality: mixed_modal_conditioning
category: conditioning
training_levels: [intermediate, advanced, elite]
duration_estimate_minutes: 30
pool_only: true

slots:
  - role: chelsea
    slot_type: emom
    duration_sec: 1800
    exercise_filter:
      exercise_ids: [pull_up]
      ordered: true
    notes: "Every minute for 30 minutes. Post rounds completed."

  - role: chelsea_2
    slot_type: amrap_movement
    parent_slot_role: chelsea
    reps_per_round: 10
    exercise_filter:
      exercise_ids: [push_up]
      ordered: true

  - role: chelsea_3
    slot_type: amrap_movement
    parent_slot_role: chelsea
    reps_per_round: 15
    exercise_filter:
      exercise_ids: [squat_air]
      ordered: true

required_equipment:
- pull_up_bar
sources:
- "CrossFit, Benchmark Workouts (2003) / The New Girls (2004) / crossfit.com/benchmark"
notes: >
  Every minute on the minute for 30 minutes: 5 pull-ups, 10 push-ups, 15 squats.
