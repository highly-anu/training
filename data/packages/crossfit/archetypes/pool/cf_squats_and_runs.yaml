id: cf_squats_and_runs
name: "Back, Front and Overhead Squats with Runs"
modality: mixed_modal_conditioning
category: conditioning
training_levels: [intermediate, advanced, elite]
duration_estimate_minutes: 30
pool_only: true

slots:
  - role: chipper
    slot_type: for_time
    reps_per_round: 21
    rounds: 1
    exercise_filter:
      exercise_ids: [back_squat]
      ordered: true
    load: "bodyweight"
    notes: "For time, in order. Post time."

  - role: chipper_2
    slot_type: amrap_movement
    parent_slot_role: chipper
    distance_m: 200
    exercise_filter:
      exercise_ids: [run_interval]
      ordered: true

  - role: chipper_3
    slot_type: amrap_movement
    parent_slot_role: chipper
    reps_per_round: 21
    exercise_filter:
      exercise_ids: [front_squat]
      ordered: true
    load: "2/3 of bodyweight"

  - role: chipper_4
    slot_type: amrap_movement
    parent_slot_role: chipper
    distance_m: 400
    exercise_filter:
      exercise_ids: [run_interval]
      ordered: true

  - role: chipper_5
    slot_type: amrap_movement
    parent_slot_role: chipper
    reps_per_round: 21
    exercise_filter:
      exercise_ids: [overhead_squat]
      ordered: true
    load: "1/2 of bodyweight"

  - role: chipper_6
    slot_type: amrap_movement
    parent_slot_role: chipper
    distance_m: 800
    exercise_filter:
      exercise_ids: [run_interval]
      ordered: true

required_equipment:
- open_space
- barbell
- rack
- plates
sources:
- "crossfit.com Workout of the Day, 2005 (2005-09-09)"
notes: >
  For time: 21 back squats at bodyweight, run 200 m, 21 front squats at 2/3 bodyweight, run 400 m, 21 overhead squats at 1/2 bodyweight, run 800 m.
