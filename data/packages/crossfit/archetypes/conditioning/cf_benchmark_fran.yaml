id: cf_benchmark_fran
name: "Fran — Benchmark"
modality: mixed_modal_conditioning
category: conditioning
training_levels:
  - intermediate
  - advanced
  - elite
duration_estimate_minutes: 35
test: {}

slots:
  - role: warm_up
    slot_type: time_domain
    duration_sec: 900
    intensity: zone2
    exercise_filter:
      exercise_ids: [row_easy, run_easy, jump_rope_single_under]
    notes: "15 min: easy cardio, then build to the Fran weight with a few thrusters and pull-ups."

  - role: fran
    slot_type: for_time
    time_cap_sec: 720
    intensity: max_effort
    exercise_filter:
      exercise_ids: [thruster]
    standard: wod_fran_minutes
    notes: "21-15-9 thrusters (43/30 kg) and pull-ups, for time. 12-minute cap. Log the time."

  - role: fran_pull_ups
    slot_type: amrap_movement
    parent_slot_role: fran
    reps_per_round: 15
    exercise_filter:
      exercise_ids: [pull_up]
    notes: "21, 15 and 9 pull-ups after each thruster set."

required_equipment:
  - barbell
  - plates
  - pull_up_bar
sources:
  - CrossFit
notes: >
  Fran: 21-15-9 thrusters and pull-ups for time — the benchmark of benchmarks,
  a measure of how hard you can go for three to ten minutes.
