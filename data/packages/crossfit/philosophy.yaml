id: crossfit
name: "CrossFit / CrossFit Endurance (Glassman)"
core_principles:
  - intensity_over_volume
  - broad_gpp_is_protective_and_transferable
  - mixed_modal_conditioning_reveals_weaknesses
  - constant_variation_prevents_accommodation
  - functional_movement_over_machine_based_isolation
  - form_mastery_before_load_or_speed
  - benchmark_testing_tracks_adaptation
  - cfe_applies_cf_principles_to_monostructural_domains
scope:
  - strength_endurance
  - anaerobic_intervals
  - mixed_modal_conditioning
bias:
  - mixed_modal_conditioning
  - anaerobic_intervals
  - strength_endurance
avoid_with:
  - max_strength
  - aerobic_base
required_equipment:
  - barbell
  - rack
  - plates
  - pull_up_bar
  - jump_rope
  - box
intensity_model: constant_variation
progression_philosophy: density_based
sources:
  - "CrossFit Journal 2002–2012 (Glassman, Rippetoe, Starr, Dougherty, Takano, Vaughn)"
  - "data/crossfit/crossfit journal/"
notes: >
  CrossFit's progression mechanism is primarily density-based: same benchmark WOD
  completed faster or with more rounds. Load-based progression exists for barbell
  work (linear on beginner program) but is secondary to time/rounds as the primary
  metric. Constant variation is intentional — the anti-periodization stance.
  CFE (CrossFit Endurance) applies the same high-intensity, low-volume philosophy
  to running, rowing, and cycling; it explicitly rejects high-mileage base building.
  Rhabdo risk on first exposure requires mandatory scaling.

# Every modality this philosophy's frameworks prescribe has an archetype in
# this package; generation never needs to reach into another philosophy.
self_contained: true

# One repeating phase: CrossFit's anti-periodization stance means constant
# variation, not a block sequence. Phase text is drafted from this package's
# own notes and framework notes — review before relying on it.
primary_track_id: constantly_varied
tracks:
  - id: constantly_varied
    name: "Constantly Varied Conditioning"
    description: >
      Constantly varied, high-intensity functional movement, measured by doing
      the same work faster or with more rounds.
    phases:
      - id: constantly_varied
        name: "Constantly Varied"
        kind: base
        weeks: 12
        repeatable: true
        framework_id: emom_amrap
        focus: "Density — more work in the same time"
        description: >
          Variation is deliberate: no blocks, no peaking. EMOM and AMRAP
          formats are the vehicle, and progress is density — a benchmark
          completed faster, or more rounds in the same time domain. Barbell
          work progresses by load as a secondary measure. Scale first
          exposures.
        adaptations:
          - "Mixed-modal work capacity"
          - "Output across time domains"
        intensity: "High intensity, low volume"
        # Variation is the method: the main lift changes from session to session.
        rotate_main_lifts: true
        # Benchmark testing is how CrossFit tracks adaptation: a benchmark girl
        # every fourth week, in turn, in place of a conditioning day.
        tests:
          - archetypes: [cf_benchmark_cindy, cf_benchmark_fran, cf_benchmark_helen]
            every: 4
            in_place_of: mixed_modal_conditioning
        checks:
          modalities_required: [mixed_modal_conditioning]
