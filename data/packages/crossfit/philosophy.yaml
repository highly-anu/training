id: crossfit
name: "CrossFit (Glassman)"
core_principles:
  - constantly_varied_functional_movement_at_high_intensity
  - three_days_on_one_day_off
  - one_two_and_three_element_days
  - benchmark_workouts_repeated_to_measure_progress
  - mechanics_then_consistency_then_intensity
  - scale_load_and_intensity_never_the_program
scope:
  - mixed_modal_conditioning
  - max_strength
  - aerobic_base
  - movement_skill
bias:
  - mixed_modal_conditioning
avoid_with: []
required_equipment:
  - barbell
  - rack
  - plates
  - pull_up_bar
  - rings
  - jump_rope
  - box
  - kettlebell
  - medicine_ball
  - rower
  - open_space
intensity_model: constant_variation
progression_philosophy: density_based
sources:
  - "Greg Glassman, A Theoretical Template for CrossFit's Programming (2003); What Is Fitness? (2002); Foundations (2002); Benchmark Workouts (2003)"
  - "The New Girls (CrossFit Journal, 2004); CrossFit Level 1 Training Guide; crossfit.com benchmarks and the 2005 Workouts of the Day"
notes: >
  Constantly varied, high-intensity functional movement. Glassman's template
  cycles three kinds of day — one element (a long slow distance, a single
  skill, a single heavy lift), two elements for time, three elements for twenty
  minutes — three days on and one off. The Girls recur irregularly, so progress
  can be measured. Loads, reps and rounds are scaled to the athlete; the
  program is not changed.

# Every exercise of its workouts is the package's own.
self_contained: true

primary_track_id: constantly_varied
tracks:
  - id: constantly_varied
    name: "Three On, One Off"
    description: >
      Glassman's template as crossfit.com ran it: three days of training, one
      of rest, the days cycling through one, two and three elements.
    phases:
      - id: constantly_varied
        name: "Constantly Varied"
        kind: base
        weeks: 12
        repeatable: true
        framework_id: crossfit_template
        focus: "Work capacity across broad time and modal domains"
        description: >
          Twelve weeks hold the twelve-day cycle seven times: a long slow distance,
          a skill or a heavy lift; a couplet for time; a triplet for twenty minutes;
          rest. Each day takes the next workout of its kind, the Girls among them.
        adaptations:
          - "Work capacity across time and modal domains"
          - "Strength, skill and endurance"
        intensity: "High, relative to the athlete"
        week_templates:
          - [m, gw, triplet, rest, g, wm, triplet]
          - [rest, w, mg, triplet, rest, m, gw]
          - [triplet, rest, g, wm, triplet, rest, w]
          - [mg, triplet, rest, m, gw, triplet, rest]
          - [g, wm, triplet, rest, w, mg, triplet]
          - [rest, m, gw, triplet, rest, g, wm]
          - [triplet, rest, w, mg, triplet, rest, m]
          - [gw, triplet, rest, g, wm, triplet, rest]
          - [w, mg, triplet, rest, m, gw, triplet]
          - [rest, g, wm, triplet, rest, w, mg]
          - [triplet, rest, m, gw, triplet, rest, g]
          - [wm, triplet, rest, w, mg, triplet, rest]
        drop_order: [g, m, w, mg, wm, gw, triplet]
  - id: five_on_two_off
    name: "Five On, Two Off"
    description: >
      The template's five-days-on, two-days-off regimen, for fixed weekdays.
    phases:
      - id: five_on_two_off
        name: "Constantly Varied (5/2)"
        kind: base
        weeks: 12
        repeatable: true
        framework_id: crossfit_template
        focus: "Work capacity across broad time and modal domains"
        description: >
          The five-on, two-off pattern's three weeks, repeating: one, two and three element
          days through the week, the weekend off.
        adaptations:
          - "Work capacity across time and modal domains"
        intensity: "High, relative to the athlete"
        week_templates:
          - [m, gw, triplet, mg, w, rest, rest]
          - [g, wm, triplet, gw, m, rest, rest]
          - [w, mg, triplet, wm, g, rest, rest]
        drop_order: [g, m, w, mg, wm, gw, triplet]
