deadlift:
  animation:
    external_id: Axle_Deadlift
    gif_alt: Deadlift
    gif_source: free_exercise_db
    gif_url: https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Axle_Deadlift/0.jpg
    type: gif
  coaching_focus: 'Set the back before you pull: establish your lumbar arch and brace, then leg-press
    the floor away — the back does not initiate the pull.'
  common_errors:
  - 'Hips shooting up first: back rounds as hips rise faster than the bar — corrected by pause deadlifts
    at submaximal load'
  - Bar drifting forward away from the legs — increases moment arm dramatically; keep it dragging up the
    shins
  - Jerking the bar off the floor — causes spinal flexion under rapid load; take slack out first
  - Hyperextending at lockout — squeeze glutes and stand tall, do not lever the lower back
  cue_points:
  - Bar over mid-foot at setup — roughly 1 inch from shins, directly below the scapulae
  - 'Hip hinge to the bar: push the floor away with the legs to find the pull, do not bend and grip'
  - 'Establish the arch before pulling: chest up, shoulders slightly in front of the bar, hips above knees'
  - 'Take the slack out before pulling: tension the bar against the floor — no jerking'
  - Bar stays in contact with the legs on the way up — a bar path away from the body is a mechanical disadvantage
  - Lock out by squeezing glutes and pushing hips forward, not by hyperextending the lower back
  description: The deadlift is the master posterior-chain loading movement and the king of absolute strength
    — the bar is lifted from the floor to hip extension using the legs, hips, and back working in concert.
    Horsemen benchmark is 2.5x bodyweight; Starting Strength programs 1x5 as the novice primary; Gym Jones
    builds all Olympic lifting percentages from the tested deadlift 1RM.
  muscle_diagram:
    highlight_primary:
    - erector_spinae
    - glutes
    - hamstrings
    highlight_secondary:
    - quadriceps
    - adductors
    - core
    - forearms
  muscles_primary:
  - erector_spinae
  - glutes
  - hamstrings
  muscles_secondary:
  - quadriceps
  - adductors
  - core
  - forearms
dip_ring:
  animation:
    type: none
  coaching_focus: Turn the rings out at the top -- the rings-turned-out (RTO) position is the expression
    of full shoulder engagement and is the goal of every rep.
  common_errors:
  - Rings flaring wide on the descent -- actively squeeze the rings inward throughout the range
  - No RTO at lockout -- the rings must turn out; no partial RTO qualifies as a completed ring dip
  - Short depth -- the upper arm must clear below the ring level on every rep; partial range does not
    train the chest through full length
  cue_points:
  - Mount the rings in a support hold (RTO) and establish a locked, stable position before beginning
  - Lower with full control -- rings tend to drift apart as the elbows bend; actively keep them tight
  - Descend until the upper arms are below the rings (full depth, shoulder below elbow)
  - Press back to lockout and rotate the rings outward actively as the arms straighten
  - Maintain core tension throughout -- do not arch the lower back to compensate for weak pressing
  description: The ring dip is a vertical push on gymnastic rings with significantly greater pectoralis
    minor, serratus anterior, and rotator cuff demand than the bar dip -- the free rotation of the rings
    requires active shoulder stabilization throughout the full range. Turning the rings out at lockout
    (RTO) is mandatory for the complete movement. CrossFit benchmark Elizabeth programs ring dips as a
    primary movement.
  muscle_diagram:
    highlight_primary:
    - chest
    - triceps
    - shoulders
    highlight_secondary:
    - serratus_anterior
    - core
  muscles_primary:
  - chest
  - triceps
  - shoulders
  muscles_secondary:
  - serratus_anterior
  - pec_minor
  - core
front_squat:
  animation:
    external_id: Front_Barbell_Squat
    gif_alt: Front Squat
    gif_source: free_exercise_db
    gif_url: https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Front_Barbell_Squat/0.jpg
    type: gif
  coaching_focus: Elbows up — if they drop, the bar rolls and the lift is over; everything else flows
    from keeping them high.
  common_errors:
  - Elbows dropping during descent — this tips the bar forward and dumps the lift; wrist and lat stretch
    are usually the root cause
  - 'Good morning out of the hole: hips rise faster than the bar — means the load exceeds current front-rack
    strength'
  - Bar sits on hands rather than shoulders — causes wrist strain and an unstable rack
  cue_points:
  - 'Clean grip or crossed-arm: fingertips only on the bar, no wrapping — elbows must travel high and
    forward'
  - Keep elbows parallel to the floor throughout; they should point forward, not toward the floor
  - Torso stays upright — a vertical shin is less important here than a vertical torso
  - Push knees out just as in the back squat; the front rack does not change that demand
  - Stand tall on the way up — do not dump the elbows as fatigue sets in
  description: The front squat holds the barbell in a front-rack position across the anterior deltoids,
    forcing a more upright torso than the back squat and placing greater demand on the quadriceps and
    thoracic spine. Gym Jones programs it as a primary strength movement (10x2 at 1-min rest); Horsemen
    benchmark is 1.5x bodyweight.
  muscle_diagram:
    highlight_primary:
    - quadriceps
    - core
    - erector_spinae
    highlight_secondary:
    - glutes
    - adductors
    - deltoids
  muscles_primary:
  - quadriceps
  - core
  - erector_spinae
  muscles_secondary:
  - glutes
  - adductors
  - deltoids
handstand_hold:
  animation:
    type: none
  coaching_focus: Push the floor away actively -- if you are just resting on your arms, the shoulders
    are passive and this is a balance exercise, not a strength one.
  common_errors:
  - 'Banana shape: the lower back hyperextends because the glutes are not engaged -- squeeze them throughout'
  - 'Head looking forward: the head should be neutral, not craning forward to look at the room'
  - 'Not pushing the floor: passive arms make this a balance drill; the push develops the overhead strength
    needed for HSPU'
  cue_points:
  - Kick up to the wall carefully; establish the position before beginning the timed hold
  - 'Push the floor away: active shoulder depression and protraction -- hands push down, shoulders push
    up'
  - 'Body should be as straight as possible: engage the glutes and core to prevent the arch that naturally
    appears in the chest-to-wall position'
  - Eyes look at the floor between the hands -- not at the wall
  - Breathe normally; a held breath will end the set prematurely and elevates blood pressure unnecessarily
  description: 'The handstand hold against the wall builds inverted shoulder stability and overhead compression
    tolerance. Chest-to-wall and back-to-wall variants train different alignment patterns: chest-to-wall
    creates a slight arch that must be actively corrected; back-to-wall enforces a straighter body line.
    Ido Portal treats daily inversion practice as a fundamental movement habit. CrossFit programs it as
    the base position before HSPU.'
  muscle_diagram:
    highlight_primary:
    - deltoids
    - triceps
    highlight_secondary:
    - core
    - serratus
    - upper_back
  muscles_primary:
  - deltoids
  - triceps
  muscles_secondary:
  - core
  - serratus
  - upper_back
handstand_push_up:
  animation:
    type: none
  coaching_focus: Head touches the floor, not the wall -- if the head drifts to the wall, the press has
    become horizontal; the path must be vertical with the head going straight down between the hands.
  common_errors:
  - 'Head drifting toward the wall: turns a vertical press into a pike push-up -- the head must go between
    the hands, not toward the wall'
  - 'Elbows flaring excessively: some flare is normal in HSPU; extreme flare shifts load to the anterior
    shoulder capsule'
  - 'Partial ROM: head hovering an inch above the floor; the floor contact is the standard and there are
    no partial HSPU in competition'
  cue_points:
  - Kick up to chest-to-wall, hands shoulder-width, fingers spread for stability
  - 'Lower with control: the head descends straight down between the hands, not forward toward the wall'
  - Touch the floor (or parallettes) -- any contact point short of this is a partial rep
  - Press in a straight line back to lockout; the path should be identical on the way up
  - 'At lockout: push the floor, protract the scapulae, body in a tight line against the wall'
  description: The wall handstand push-up (HSPU) lowers the head to the floor from a handstand position
    against the wall and presses back to lockout -- the maximal vertical pressing movement available with
    only bodyweight. CrossFit and Gym Jones program it as the primary overhead pressing bodyweight standard.
    The deficit variant (hands on parallettes) increases range of motion and difficulty. Strict HSPU is
    the strength standard; kipping HSPU is a separate met-con skill.
  muscle_diagram:
    highlight_primary:
    - deltoids
    - triceps
    highlight_secondary:
    - core
    - upper_back
    - serratus
  muscles_primary:
  - deltoids
  - triceps
  muscles_secondary:
  - core
  - upper_back
  - serratus
hang_squat_clean:
  animation:
    external_id: Hang_Clean
    gif_alt: Hang Squat Clean
    gif_source: free_exercise_db
    gif_url: https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Hang_Clean/0.jpg
    type: gif
  coaching_focus: The pull is short so the drop must be faster — think of punching your elbows through
    rather than catching.
  common_errors:
  - 'Not achieving full squat depth: receiving high and then squatting down rather than under'
  - 'Elbows dropping at the bottom of the squat: front rack collapses under fatigue'
  - 'Losing the hip hinge in the hang position under fatigue: knees push forward and the power source
    is gone'
  cue_points:
  - 'Same hang setup as the hang power clean: hips loaded, bar above the knee'
  - Hip snap drives the bar up; immediately rotate the elbows around and under
  - Drop into the full squat simultaneously with the elbow turnover — no waiting
  - Receive with elbows parallel to the floor in a full-depth front squat
  - Drive out of the bottom immediately in conditioning contexts — do not rest in the hole
  description: The hang squat clean combines the shortened range of the hang position with the full-depth
    front squat catch, making it highly metabolic and frequently used in conditioning complexes. Horsemen
    feature it in the Purple Church EMOM triplet. The limited pull range forces faster elbow turnover
    and a more aggressive drop under the bar.
  muscle_diagram:
    highlight_primary:
    - glutes
    - hamstrings
    - quadriceps
    highlight_secondary:
    - core
    - deltoids
  muscles_primary:
  - glutes
  - hamstrings
  - quadriceps
  muscles_secondary:
  - core
  - deltoids
jump_rope_double_under:
  animation:
    type: none
  coaching_focus: Jump higher and flick the wrists faster -- the double under is a jump with the same
    footwork as a single under but with two wrist rotations during the airborne phase.
  common_errors:
  - Piking the hips (butt kick) -- the double under requires a straight body in the air, not a pike; hip
    flexion slows the jump and creates timing errors
  - Arms swinging forward -- the rope spins from the wrists with arms beside the body; forward arm swing
    changes the rope arc and causes misses
  - Rushing from single to double without wrist speed -- practice the wrist acceleration in the air before
    attempting full doubles
  cue_points:
  - Jump height increases to 3-4 inches off the ground -- enough air time for two rope passes
  - Wrist rotation accelerates -- the rope must pass twice while airborne; practice wrist speed before
    adding the jump
  - Single-under cadence first, then convert to doubles -- the footwork pattern is identical
  - 'Rope length: the handles should reach the armpits when the rope is under the feet; too long a rope
    slows it'
  - Relax the shoulders -- tension in the upper body breaks wrist mechanics and disrupts the timing
  description: Double unders require the rope to pass twice under the feet per jump -- demanding a higher
    jump, faster wrist rotation, and precise timing. They are a CrossFit benchmark skill appearing in
    Annie (50-40-30-20-10 double unders and sit-ups) and many other workouts. Rope length and wrist mechanics
    are the primary limiting factors for beginners. The cardiovascular demand is significantly higher
    than single unders.
  muscle_diagram:
    highlight_primary:
    - calves
    highlight_secondary:
    - core
    - wrist_extensors
  muscles_primary:
  - calves
  - wrist_extensors
  muscles_secondary:
  - core
  - shoulders
  - tibialis_anterior
kb_swing_two_hand:
  animation:
    type: none
  coaching_focus: The arms are ropes attached to the bell — they do not lift it; the hips snap and the
    bell floats.
  common_errors:
  - 'Squatting the swing: hips drop and the torso stays upright — the bell lifts rather than floats; this
    is a quad exercise, not a ballistic'
  - 'Arms lifting the bell: early shoulder elevation kills the hip drive connection'
  - 'Lower back rounding on the backswing: the hinge must be maintained through the entire downswing'
  - 'Soft glutes at the top: the lockout should be aggressive — squeezed glutes are the braking force'
  cue_points:
  - 'Hike the bell back aggressively between the legs: the hinge happens first, not a squat'
  - Snap the hips forward explosively — glutes fire hard at the top, not the lower back
  - 'At the top the body is a rigid plank: glutes, abs, and quads all contracted simultaneously'
  - Let the bell float to shoulder height; do not muscle it up with the arms
  - 'On the backswing: hinge back and let the bell pull you into the next rep — catch the load with the
    hamstrings'
  - 'Breath: exhale sharply at the top of the swing with a hiss — the exhale protects the spine'
  description: The two-hand kettlebell swing is the foundational ballistic — a hip-hinge-driven movement
    where the bell is projected to shoulder height by explosive hip extension, not a squat-and-lift. It
    simultaneously develops posterior-chain power, aerobic capacity, and trunk stiffness under load. Horsemen
    include it in every warm-up; Gym Jones programs the breathing ladder format with 24 kg.
  muscle_diagram:
    highlight_primary:
    - glutes
    - hamstrings
    - erector_spinae
    highlight_secondary:
    - core
    - quadriceps
    - deltoids
  muscles_primary:
  - glutes
  - hamstrings
  - erector_spinae
  muscles_secondary:
  - core
  - quadriceps
  - deltoids
l_pull_up:
  animation:
    type: none
  coaching_focus: Hold the L the whole rep.
  common_errors:
  - Dropping the legs
  cue_points:
  - Legs straight out at hip height
  - Pull the chin over the bar
  - Lower under control
  description: A strict pull-up with the legs held straight out in an L.
  muscle_diagram:
    highlight_primary:
    - lats
    - core
    highlight_secondary:
    - biceps
    - hip_flexors
  muscles_primary:
  - lats
  - core
  muscles_secondary:
  - biceps
  - hip_flexors
lunge:
  animation:
    external_id: Barbell_Walking_Lunge
    gif_alt: Walking Lunge
    gif_source: free_exercise_db
    gif_url: https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Barbell_Walking_Lunge/0.jpg
    type: gif
  coaching_focus: The front shin stays near-vertical at the bottom -- if the knee shoots forward past
    the toes, the quad is overloading and the hip is not working.
  common_errors:
  - 'Knee-forward position: the front knee tracking over or past the toes means the stride was too short
    and the front heel is lifting'
  - 'Torso pitching forward: either a balance issue or a hip flexor tightness issue on the trailing side
    -- address both'
  - 'Back knee slamming the floor: the eccentric descent of the back knee should be controlled throughout'
  cue_points:
  - Step forward with enough stride length that the front shin can stay vertical at the bottom
  - Back knee descends toward but does not slam the floor -- controlled descent, soft tap if any contact
  - 'Torso upright throughout: no forward lean; the chest stays tall'
  - Drive through the front heel to stand and step through into the next lunge
  - Arms can swing naturally for balance or be held at sides; add load by holding dumbbells at the sides
  description: The walking lunge is an alternating-leg unilateral lower-body movement stepping forward
    into a lunge position with the back knee approaching the floor. Gym Jones programs 2x20m walking lunges
    as single-leg accessory work. It develops unilateral hip extension strength, single-leg stability,
    and the hip flexor length required for efficient bipedal locomotion. It transfers directly to trail
    running, step-ups, and split jerks.
  muscle_diagram:
    highlight_primary:
    - quadriceps
    - glutes
    highlight_secondary:
    - hamstrings
    - adductors
    - core
  muscles_primary:
  - quadriceps
  - glutes
  muscles_secondary:
  - hamstrings
  - adductors
  - core
lunge_overhead:
  animation:
    type: none
  coaching_focus: The overhead position enforces good lunge mechanics -- if the torso pitches forward,
    the load falls forward; use the overhead constraint to find the correct lunge posture.
  common_errors:
  - 'Elbows bending under fatigue: the overhead lockout must be maintained; a bent-elbow overhead lunge
    loads the shoulder in an unstable position'
  - 'Leaning forward: the overhead load should make forward lean impossible -- if it is happening, reduce
    the load'
  - 'Short stride length: the overhead constraint should not reduce stride length; take a full step'
  cue_points:
  - Press or clean the load overhead before stepping -- establish the overhead position with full lockout
    before the first step
  - 'Arms locked overhead throughout: any elbow bend under fatigue must be addressed before continuing'
  - The overhead load forces the torso upright; lean into this constraint rather than fighting it
  - 'Stride length: the overhead load makes it tempting to shorten the stride -- maintain full lunge depth'
  - 'Look forward, not up: the eyes stay level; looking up at the bar destabilizes the cervical spine'
  description: The overhead lunge adds an overhead load (barbell, plate, or simply arms extended) to the
    walking lunge movement, dramatically increasing the core and shoulder stability demand. Gym Jones
    programs a 45 lb barbell overhead lunge across 400 meters as a signature power-endurance challenge.
    The overhead position forces a more vertical torso, making overhead lunges technically more demanding
    than front-loaded variants.
  muscle_diagram:
    highlight_primary:
    - quadriceps
    - glutes
    - deltoids
    highlight_secondary:
    - hamstrings
    - core
    - triceps
  muscles_primary:
  - quadriceps
  - glutes
  - deltoids
  muscles_secondary:
  - hamstrings
  - core
  - triceps
muscle_up_ring:
  animation:
    external_id: Muscle_Up
    gif_alt: Muscle-Up (Rings)
    gif_source: free_exercise_db
    gif_url: https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Muscle_Up/0.jpg
    type: gif
  coaching_focus: The false grip is the foundation of the ring muscle-up -- without it, the wrist transition
    above the rings requires brute force that makes the movement near-impossible; establish the false
    grip before the first attempt.
  common_errors:
  - No false grip -- attempting a ring muscle-up without false grip is an exercise in futility; the wrist
    must be over the ring
  - Losing the false grip at the pull peak -- the grip must be maintained; strengthening the wrist flexors
    addresses this
  - Missing the RTO lockout -- the movement is incomplete without full shoulder engagement at the top
  cue_points:
  - 'False grip: wrap the wrist over the ring so the ring sits in the crease of the wrist -- not in the
    palm'
  - Maintain the false grip throughout the entire movement -- releasing it means the transition cannot
    happen
  - Pull explosively -- the hips rise, the elbows flare out, and the body transitions above the rings
  - At the transition, lean forward and press to lockout -- the rings-turned-out (RTO) position is the
    finish
  - Lower under complete control with the false grip maintained to return to the starting position
  description: The ring muscle-up transitions from below the rings to a support position above them in
    a single pull-press movement. The false grip on the rings is the critical setup skill -- it positions
    the wrists above the rings for a smooth pull-to-press transition. The free rotation of the rings adds
    significant shoulder stability demand compared to the bar variant. CrossFit benchmark movement.
  muscle_diagram:
    highlight_primary:
    - lats
    - biceps
    - triceps
    highlight_secondary:
    - shoulders
    - serratus_anterior
  muscles_primary:
  - lats
  - biceps
  - triceps
  - shoulders
  muscles_secondary:
  - core
  - serratus_anterior
  - pec_minor
overhead_squat:
  animation:
    external_id: Overhead_Squat
    gif_alt: Overhead Squat
    gif_source: free_exercise_db
    gif_url: https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Overhead_Squat/0.jpg
    type: gif
  coaching_focus: The bar must stay over the midfoot — if it drifts forward or backward, the movement
    is not yet available to you.
  common_errors:
  - Bar drifting forward — usually shoulder mobility or thoracic extension restriction
  - Forward lean of torso — ankle dorsiflexion is the most common root cause
  - Arms bending during the squat — scapular instability or insufficient shoulder external rotation
  - Knees caving — the bar overhead amplifies every lower-body alignment fault
  cue_points:
  - Wide snatch grip — narrower grips require extraordinary shoulder mobility and will fail first
  - 'External rotation: bend the bar into a horseshoe, elbows pointing out and slightly back'
  - 'Active shoulders: push the bar up into the ceiling continuously — do not just hold it'
  - Torso as upright as possible; weight on heels, not mid-foot
  - Initiate with a hip hinge back before sitting into depth
  - If depth cannot be achieved with bar overhead, ankle, hip, or thoracic mobility is the limiter
  description: The overhead squat holds the barbell at lockout above the head while squatting to depth
    — the most demanding test of total-body mobility, stability, and positional strength in the barbell
    system. Gym Jones programs it as a primary strength movement and tests 1RM. It exposes every restriction
    in the kinetic chain simultaneously.
  muscle_diagram:
    highlight_primary:
    - quadriceps
    - core
    - deltoids
    highlight_secondary:
    - glutes
    - erector_spinae
    - adductors
  muscles_primary:
  - quadriceps
  - core
  - deltoids
  muscles_secondary:
  - glutes
  - erector_spinae
  - adductors
pistol_squat:
  animation:
    type: none
  coaching_focus: The non-working leg drives forward as a counterbalance -- if it drops or bends, the
    athlete is losing control of the descent; the leg position is part of the standard.
  common_errors:
  - 'Non-working leg dropping to the floor at depth: losing the leg position removes the balance demand
    and is a technique failure'
  - 'Working heel rising: the single most common limiter -- ankle dorsiflexion is the gating factor for
    most athletes'
  - 'Excessive forward lean of the torso: usually combined with heel rise; improving ankle dorsiflexion
    typically resolves both'
  cue_points:
  - Start standing on one leg; extend the other leg forward at hip height or higher
  - Begin the descent by sitting the hips back and down while the non-working leg stays extended forward
  - 'Reach full depth: hip crease well below parallel, non-working heel close to but not touching the
    floor'
  - The extended leg stays horizontal or above throughout -- it counterbalances the hips moving rearward
  - Stand back up by driving through the working heel -- do not pull up with the hip flexors of the non-working
    leg
  description: The pistol squat is the free single-leg squat to full depth with the non-working leg extended
    forward -- it requires simultaneous hip, ankle, and thoracic mobility, single-leg strength, and balance.
    Marcus Filly uses it as a milestone movement (5 clean reps per side as a functional strength standard).
    CrossFit programs it in gymnastics skills workouts. Ido Portal treats it as a fundamental unilateral
    movement pattern.
  muscle_diagram:
    highlight_primary:
    - quadriceps
    - glutes
    highlight_secondary:
    - hamstrings
    - core
    - adductors
  muscles_primary:
  - quadriceps
  - glutes
  muscles_secondary:
  - hamstrings
  - core
  - adductors
pull_up:
  animation:
    type: none
  coaching_focus: Dead hang fully at the bottom -- if you do not reach full elbow extension, you are doing
    a partial ROM exercise, not a pull-up.
  common_errors:
  - 'Half reps: not reaching full extension at the bottom caps strength development and creates poor movement
    habits'
  - 'Kipping under a strict prescription: kipping is a separate skill; mixing them unknowingly trains
    neither'
  - 'Chin in front of, not over, the bar: the standard is chin over -- partial top-range reps do not count'
  cue_points:
  - 'Start from a dead hang: shoulders fully elevated (passive) or actively depressed before initiating'
  - Drive the elbows down and back -- think of pulling the bar to the sternum, not the hands up
  - Chin clears the bar at the top; do not tuck the chin or crane the neck forward
  - Return to full dead hang at the bottom -- partial descents reduce the strength stimulus and build
    a false ceiling
  - Squeeze glutes and brace the core throughout -- no swinging or kipping in the strict variant
  description: The strict pull-up is the foundational upper-body vertical pulling test -- a dead-hang
    start with full elbow extension at the bottom, chin clearing the bar at the top. Marcus Filly treats
    it as the primary pulling strength metric; Gym Jones programs it at high volume in Murph-style sessions.
    Relative strength in this movement reliably predicts overall athletic capacity.
  muscle_diagram:
    highlight_primary:
    - upper_back
    - lats
    - biceps
    highlight_secondary:
    - core
    - forearms
    - deltoids
  muscles_primary:
  - upper_back
  - lats
  - biceps
  muscles_secondary:
  - core
  - forearms
  - deltoids
push_press:
  animation:
    external_id: Push_Press
    gif_alt: Push Press
    gif_source: free_exercise_db
    gif_url: https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Push_Press/0.jpg
    type: gif
  coaching_focus: The dip must be vertical — any forward lean during the dip makes the bar drift forward
    and the press fails.
  common_errors:
  - 'Dipping forward: torso tilts during the dip, sending the bar path forward — drill vertical dip'
  - 'Soft dip with no explosion: using the legs only minimally, leaving the press mostly to the arms'
  - 'Arms pressing before legs are fully extended: legs first, then arms'
  cue_points:
  - 'Dip: short, quick — torso stays vertical, knees push out, 4–6 inch range'
  - Drive explosively through the heels immediately after the dip — no pause at the bottom
  - The leg drive ends the moment the hips are fully extended; the arms take over from there
  - 'Lock out overhead with the same position as the strict press: bar over midfoot, arms straight'
  - The bar should feel light in the hands at the catch — if you are pressing hard through the whole range,
    leg drive was insufficient
  description: The push press uses a sharp hip-and-knee dip followed by explosive leg drive to generate
    momentum that the arms carry to lockout overhead. It allows significantly more load overhead than
    the strict press and develops power transfer from the lower to upper body. Gym Jones features it in
    the Six-Way Barbell Complex; Horsemen use it in power-endurance formats.
  muscle_diagram:
    highlight_primary:
    - deltoids
    - triceps
    - quadriceps
    highlight_secondary:
    - glutes
    - core
    - pec
  muscles_primary:
  - deltoids
  - triceps
  - quadriceps
  muscles_secondary:
  - glutes
  - core
  - pec
push_up:
  animation:
    type: none
  coaching_focus: The push-up is a moving plank -- if the hips sag or pike at any point in the set, the
    rep does not count and the set is over.
  common_errors:
  - 'Hip sag: the most common fault; the core gives out before the chest does -- when hips drop, the set
    ends'
  - 'Elbow flare: elbows at 90 degrees loads the anterior shoulder capsule in a stressful position --
    keep them at 45 degrees'
  - 'Partial ROM at the bottom: hovering above the floor eliminates the pec stretch and reduces the training
    stimulus significantly'
  cue_points:
  - Hands slightly wider than shoulder-width; elbows track at 45 degrees from the torso -- not 90 degrees
    out
  - Body forms a rigid plank from heel to crown; squeeze glutes and brace the core before the first rep
  - Chest touches the floor at the bottom -- no hovering an inch above; this is a full ROM exercise
  - Full lockout at the top; the arms extend completely and the scapulae protract at lockout
  - 'Breathe: inhale on the way down, exhale at the top -- do not hold the breath across reps'
  description: The push-up is the foundational horizontal pressing movement -- a full plank position pressing
    from chest-to-floor to full lockout. Gym Jones programs 200+ reps in Murph-style sessions; CrossFit
    uses it as a primary conditioning tool. It simultaneously trains the horizontal press, scapular stability,
    and anti-extension core. The push-up is the most scalable pressing exercise and the foundation for
    all ring and parallette progressions.
  muscle_diagram:
    highlight_primary:
    - pec
    - triceps
    - deltoids
    highlight_secondary:
    - core
    - serratus
  muscles_primary:
  - pec
  - triceps
  - deltoids
  muscles_secondary:
  - core
  - serratus
rope_climb:
  animation:
    external_id: Rope_Climb
    gif_alt: Rope Climb
    gif_source: free_exercise_db
    gif_url: https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Rope_Climb/0.jpg
    type: gif
  coaching_focus: Lock the rope with the feet to rest between pulls -- the foot lock is a skill, and athletes
    who cannot rest on the rope will fail due to grip before upper body.
  common_errors:
  - 'No foot lock: athletes without a reliable foot lock will fail every time due to grip fatigue long
    before upper body'
  - 'Too much space between pulls: every inch the rope is away from the body adds exponential difficulty
    -- keep it close'
  - 'Not descending under control: uncontrolled descents damage the hands and will prevent training the
    following day'
  cue_points:
  - 'Foot lock technique: wrap the rope around one foot and step on it with the other foot to create a
    secure hold'
  - 'Pull in a smooth S-curve: pull to chin, then lock the feet, then stand in the foot lock to rest the
    grip'
  - Keep the rope close to the body throughout -- a rope that hangs away from the body creates a long
    moment arm
  - 'Legless variant: drive the hips up with each pull using hip flexion; the legs counterbalance but
    do not assist the pull'
  - Descend under control using the foot lock -- sliding down burns the hands and is a safety risk
  description: The rope climb pulls the athlete to the top of a 15-foot rope using upper-body strength
    and a leg assist. The legless variant removes the lower-body contribution entirely, making it one
    of the most demanding upper-body pulling exercises available -- comparable in lat and bicep activation
    to a weighted pull-up at significant load. CrossFit programs it regularly; Gym Jones uses the legless
    variant as a benchmark.
  muscle_diagram:
    highlight_primary:
    - upper_back
    - lats
    - biceps
    highlight_secondary:
    - core
    - forearms
  muscles_primary:
  - upper_back
  - lats
  - biceps
  muscles_secondary:
  - core
  - forearms
  - grip
row_easy:
  animation:
    type: none
  coaching_focus: Ratio over rate -- a slow, powerful stroke at 18-20 SPM with a long drive is more efficient
    and aerobically beneficial than a high-rate choppy stroke.
  common_errors:
  - Too high a damper setting -- a damper above 7 increases strain without proportional aerobic benefit;
    use 4-6 for most work
  - Arm pull at the start of the drive -- arms must remain straight until legs are nearly extended; early
    arm pull breaks the power chain
  - Short slides -- not reaching full compression (shin vertical) at the catch wastes power per stroke
  cue_points:
  - Set damper to 4-6 for recovery rowing -- higher damper settings do not increase benefit and increase
    fatigue
  - Maintain 18-22 strokes per minute -- lower rate forces more power per stroke and better technique
  - 'Drive sequence: legs first, then lean back, then arms -- not all at once'
  - 'Recovery sequence: arms first, then forward lean, then knees bend -- exact reverse of the drive'
  - Keep heart rate at or below AeT -- if HR climbs, reduce stroke rate, not just power
  description: Easy rowing at Zone 1-2 is a Gym Jones recovery day standard -- 60-120 minutes at conversational
    pace on the Concept II rower. The Concept II is rated the highest metabolic conditioning tool by CrossFit
    Journal for its full-body demand and zero-impact nature. Damper setting 4-6 suits most athletes at
    recovery pace; stroke rate is 18-22 SPM.
  muscle_diagram:
    highlight_primary:
    - hamstrings
    - glutes
    - lats
    highlight_secondary:
    - erector_spinae
    - core
  muscles_primary:
  - hamstrings
  - glutes
  - erector_spinae
  - lats
  muscles_secondary:
  - quadriceps
  - core
  - biceps
  - upper_trapezius
row_threshold:
  animation:
    type: none
  coaching_focus: Split consistency is the quality metric -- every piece should be within 2 seconds of
    the same 500m split; a fading split means the threshold was started too fast.
  common_errors:
  - Starting the first piece too fast -- target split should feel controlled at rep 1; fading pieces mean
    the start was too fast
  - Increasing rate instead of power when the split slips -- cue a more powerful drive, not a higher stroke
    rate
  - Rest (not active recovery) between pieces -- easy rowing maintains blood flow and clears lactate;
    standing rest does not
  cue_points:
  - 'Target split: 15-20 sec per 500m slower than your personal record 500m pace'
  - Stroke rate increases to 24-28 SPM at threshold -- the drive remains powerful, not rushed
  - 'Active recovery between pieces: row easy (not rest) at 18-20 SPM'
  - Maintain drive sequence even at elevated rate -- legs-back-arms; do not let the rate break the technique
  - Monitor split consistently throughout each piece -- adjust rate before the split drifts
  description: Threshold rowing at Zone 3-4 develops aerobic capacity at the lactate threshold -- the
    intensity sustained in competition or maximal aerobic efforts. Gym Jones programs 6 x 500m at approximately
    15 seconds per 500m slower than PR pace with 3-minute active rest between pieces. CrossFit Endurance
    mirrors the run threshold protocol. Stroke rate increases to 24-28 SPM at threshold.
  muscle_diagram:
    highlight_primary:
    - hamstrings
    - glutes
    - lats
    highlight_secondary:
    - erector_spinae
    - core
  muscles_primary:
  - hamstrings
  - glutes
  - erector_spinae
  - lats
  muscles_secondary:
  - quadriceps
  - core
  - biceps
run_easy:
  animation:
    type: none
  coaching_focus: Slower than you think -- the majority of runners run their easy days too fast; the correct
    pace is embarrassingly slow until aerobic capacity catches up to ego.
  common_errors:
  - Running too fast -- cardiac drift will push HR above Z2; slow the pace 30-60 seconds per mile from
    what feels comfortable
  - Skipping the HR monitor -- perceived effort does not accurately reflect metabolic zone; use objective
    data
  - Turning easy runs into moderate runs -- the base-building benefit comes from zone compliance, not
    perceived effort
  cue_points:
  - Nasal breathing throughout -- if you must open your mouth, slow down
  - 'Conversational pace: you can speak in complete sentences, not just short phrases'
  - Heart rate at or below AeT -- typically 125-135 bpm; use HR monitor, not perceived effort
  - Walk uphills if necessary to keep HR in zone -- pace is secondary to metabolic zone
  - 'Maffetone formula: 180 - age = max HR for easy runs (adjust for fitness level)'
  description: The easy run is the primary aerobic base building stimulus -- a conversational pace at
    or below aerobic threshold (AeT), typically below 135 bpm or Maffetone pace (180 minus age). Uphill
    Athlete programming places 80% of all aerobic volume at this intensity. Nasal breathing serves as
    an effective intensity governor. Gym Jones uses 60-120 minute easy runs on recovery days.
  muscle_diagram:
    highlight_primary:
    - calves
    - quadriceps
    highlight_secondary:
    - glutes
    - hamstrings
  muscles_primary:
  - calves
  - quadriceps
  - hamstrings
  muscles_secondary:
  - glutes
  - hip_flexors
  - core
run_interval:
  animation:
    type: none
  coaching_focus: Each rep must be run at the same pace as the first -- if later reps slow by more than
    5%, either reduce the number of reps or increase the rest period.
  common_errors:
  - Sprinting rep 1 and surviving the rest -- the goal is consistent pace across all reps, not a fast
    first rep
  - Shortening the rest -- the rest period is part of the workout; cutting it turns intervals into a tempo
    run
  - Skipping the warm-up and cool-down -- intervals without warm-up significantly increase injury risk
    and reduce performance
  cue_points:
  - Warm up with at least 10-15 minutes of easy running before the first interval
  - Begin each rep at the prescribed pace -- do not go out faster on rep 1
  - Active recovery (easy jogging or walking) between reps -- do not stand still
  - 'Use the final rep as a quality check: if you ran it the same as rep 1, pacing was correct'
  - Cool down with 10+ minutes of easy running after the last rep
  description: Run intervals are Zone 4-5 efforts of 400m to 1 mile with structured rest periods. Gym
    Jones uses 5 x 1-minute all-out with 4-minute active recovery, or 4 x 800 yards at 10% faster than
    2-mile PR pace. CrossFit Endurance uses pyramid intervals (1-2-3-4-3-2-1 minutes at Zone 3-4). The
    work-to-rest ratio of 1:2 to 1:4 allows high-quality efforts to be repeated across the full session.
  muscle_diagram:
    highlight_primary:
    - calves
    - quadriceps
    highlight_secondary:
    - glutes
    - hamstrings
  muscles_primary:
  - calves
  - quadriceps
  - hamstrings
  muscles_secondary:
  - glutes
  - hip_flexors
  - core
sit_up:
  animation:
    external_id: Sit-Up
    gif_alt: Sit-Up (Abmat)
    gif_source: free_exercise_db
    gif_url: https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Sit-Up/0.jpg
    type: gif
  coaching_focus: Touch the floor behind the head at the bottom -- the abmat allows the lower back to
    extend fully; this is the range of motion that makes the abmat sit-up different from a crunch.
  common_errors:
  - 'Not touching the floor at the bottom: using a partial range of motion turns sit-ups into crunches
    -- the abmat is specifically to enable the full bottom position'
  - 'Jerking through the motion: explosive, bouncy sit-ups generate momentum that replaces core contraction;
    control the movement'
  - 'Neck strain at the top: reaching the head forward rather than the chest up; the chest should lead
    the rise, not the head'
  cue_points:
  - Place the abmat under the lower back for lumbar support at the bottom -- this allows the chest to
    reach the floor
  - Feet can be anchored (increases hip flexor demand) or unanchored (more abdominal demand)
  - Descend until the back of the hands touch the floor overhead
  - Rise by contracting the core and reaching the arms forward; touch the feet or floor in front at the
    top
  - 'Breathe: exhale as you rise, inhale as you lower'
  description: The abmat sit-up is the CrossFit standard core movement used in benchmark workouts -- full
    range of motion from a lying position to upright with an abmat under the lower back to allow lumbar
    extension at the bottom. CrossFit benchmark Annie (50-40-30-20-10 sit-ups with double-unders) is the
    signature test. Gym Jones programs high-rep sit-ups as core accumulation work. Anchored feet increase
    hip flexor contribution.
  muscle_diagram:
    highlight_primary:
    - core
    - hip_flexors
    highlight_secondary:
    - quadriceps
  muscles_primary:
  - core
  - hip_flexors
  muscles_secondary:
  - quadriceps
snatch:
  animation:
    external_id: Snatch
    gif_alt: Snatch
    gif_source: free_exercise_db
    gif_url: https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Snatch/0.jpg
    type: gif
  coaching_focus: Speed through the middle is everything — slow down at the hip and the bar can only go
    so high; the snatch lives and dies at the second pull.
  common_errors:
  - 'Early arm pull: bending elbows before full hip extension — the single most common snatch error at
    every level'
  - 'Bar drifting from the body: reduces mechanical advantage dramatically; drag the bar up the thighs'
  - 'Missing the overhead squat: receiving above parallel means load is too heavy or drop speed too slow'
  - 'Forward lean in the overhead squat catch: shoulder mobility and thoracic extension restriction'
  cue_points:
  - 'Setup: wider grip, lower hip than the clean — a nearly horizontal back angle allows a longer pulling
    range'
  - 'First pull: maintain the back angle — hips and shoulders rise together until the bar passes the knee'
  - 'Transition (scoop): hips come through under the bar as the knee rebends — the most technically demanding
    moment'
  - 'Second pull: violent hip extension and shrug, elbows immediately high and wide'
  - Drop under aggressively into an overhead squat to receive the bar
  - Stand with bar locked overhead to complete the lift
  description: The full Olympic snatch takes the bar from the floor to overhead lockout in one movement,
    receiving it in a full overhead squat — the most demanding single athletic movement in the barbell
    canon. It is an integrated test of hip power, mobility, coordination, and overhead stability. Horsemen
    program at 80–90% in wave patterns and test 1RM.
  muscle_diagram:
    highlight_primary:
    - glutes
    - hamstrings
    - erector_spinae
    - deltoids
    highlight_secondary:
    - quadriceps
    - core
    - calves
  muscles_primary:
  - glutes
  - hamstrings
  - erector_spinae
  - deltoids
  muscles_secondary:
  - quadriceps
  - core
  - calves
squat_air:
  animation:
    type: none
  coaching_focus: Below parallel is the standard -- the hip crease must drop below the top of the knee;
    if this is not happening, the air squat is not yet proficient regardless of how easy it feels.
  common_errors:
  - 'Stopping above parallel: the most common error; the air squat is not a squat unless the hip crease
    passes the knee'
  - 'Heels rising: ankle mobility limitation -- fix the mobility, do not accommodate the fault by allowing
    toes-only squatting'
  - 'Chest falling forward at depth: usually a combination of hip tightness and weak anterior core; use
    goblet squat as a teaching tool'
  cue_points:
  - Stance shoulder-width or slightly wider; toes turned out 30-45 degrees
  - Brace the core and begin by sending the hips back and down simultaneously -- not just sitting the
    hips down
  - Knees track over the toes throughout -- push them out; do not let them cave inward
  - Hip crease descends below the top of the knee -- this is below parallel and non-negotiable
  - Heels flat throughout; if heels rise, ankle dorsiflexion is the limiter -- elevate temporarily and
    work on ankle mobility
  description: The air squat is the CrossFit foundational movement -- bodyweight squat to below parallel
    with a neutral spine and heels flat. Gym Jones warms up with 2x5 wall squats followed by 2x10 air
    squats before all strength sessions. The air squat establishes the squatting motor pattern used in
    every loaded squat variant and in all conditioning movements that include a squat component.
  muscle_diagram:
    highlight_primary:
    - quadriceps
    - glutes
    highlight_secondary:
    - hamstrings
    - adductors
    - core
  muscles_primary:
  - quadriceps
  - glutes
  muscles_secondary:
  - hamstrings
  - adductors
  - core
thruster:
  animation:
    type: none
  coaching_focus: The squat drives the press — if you hit the front squat and then press as a separate
    movement, you are doing two movements, not one.
  common_errors:
  - 'Two-movement thruster: stopping at the top of the squat before pressing — the hip drive is lost'
  - 'Elbows dropping in the front rack during the squat: bar rolls off the shoulders'
  - 'Receiving the bar back from overhead with soft elbows: bar crashes into the front rack and breaks
    the rhythm'
  - 'Leaning forward under fatigue: the front rack collapses and the bar path worsens with every rep'
  cue_points:
  - 'Front rack identical to the front squat: elbows high and forward throughout the descent'
  - 'Drive out of the squat with aggression: the upward momentum carries through the torso into the press'
  - 'No pause between the squat and press: the hips extend and the press begins before you are standing'
  - Lock out overhead with straight arms and stand tall — do not lean forward at the top
  - On the way down, absorb the bar back into the front rack and descend immediately — efficient cycling
    requires no pause at the top
  description: The thruster is a front squat driven continuously into a push press — the bar leaves the
    shoulders as the hips extend and is pressed to lockout in one unbroken movement. It is one of the
    most metabolically demanding barbell movements, combining lower-body power with overhead pressing
    in a cyclical pattern. Featured in CrossFit benchmark Fran (21-15-9) and Horsemen breathing ladder
    formats.
  muscle_diagram:
    highlight_primary:
    - quadriceps
    - glutes
    - deltoids
    - triceps
    highlight_secondary:
    - core
    - hamstrings
  muscles_primary:
  - quadriceps
  - glutes
  - deltoids
  - triceps
  muscles_secondary:
  - core
  - hamstrings
wall_ball:
  animation:
    type: none
  coaching_focus: Squat and throw in one movement.
  common_errors:
  - Throwing with the arms only
  cue_points:
  - Full squat with the ball at the chest
  - Drive up and throw to the target
  - Catch into the next squat
  description: A squat with a medicine ball, then a throw to a 10 ft target.
  muscle_diagram:
    highlight_primary:
    - quadriceps
    - glutes
    - shoulders
    highlight_secondary:
    - core
    - triceps
  muscles_primary:
  - quadriceps
  - glutes
  - shoulders
  muscles_secondary:
  - core
  - triceps
