back_extension:
  animation:
    type: none
  coaching_focus: Hinge down, then extend to a straight line.
  common_errors:
  - Hyperextending at the top
  cue_points:
  - Hips on the pad
  - Lower under control
  - Extend to straight, not past
  description: A hip extension on a GHD or back-extension bench.
  muscle_diagram:
    highlight_primary:
    - erector_spinae
    - glutes
    highlight_secondary:
    - hamstrings
  muscles_primary:
  - erector_spinae
  - glutes
  muscles_secondary:
  - hamstrings
back_squat:
  animation:
    type: none
  coaching_focus: Think hip hinge loaded onto your back, not a knee bend — sit back and down, not just
    down.
  common_errors:
  - 'Morning star: hips shoot up and chest drops forward — fix with box squat and intentional hip-drive
    cuing'
  - Knees caving medially — cue external rotation, use band above knees as feedback
  - Excessive forward lean — usually ankle dorsiflexion restriction or bar position too high
  - 'Half reps: hip crease above parallel — use a box or depth marker until the habit is built'
  cue_points:
  - 'Brace hard before unracking: 360-degree air pressure through your belt, not just your belly'
  - Break at the hips and knees simultaneously — do not initiate with the knees
  - Push knees out in the direction of your toes throughout the descent
  - Hip crease must pass below the top of the patella at depth
  - Drive the floor away on the ascent — spread the floor, not raise the bar
  - Keep the bar over mid-foot; weight shifts forward or heels rise when this fails
  description: The back squat is the foundational bilateral lower-body strength movement — a loaded hip
    hinge and knee flexion pattern that demands coordinated engagement of the entire posterior chain and
    trunk. Horsemen set the benchmark at 2x bodyweight; Starting Strength builds to this from a 3x5 novice
    progression.
  muscle_diagram:
    highlight_primary:
    - quadriceps
    - glutes
    - erector_spinae
    highlight_secondary:
    - hamstrings
    - adductors
    - core
  muscles_primary:
  - quadriceps
  - glutes
  - erector_spinae
  muscles_secondary:
  - hamstrings
  - adductors
  - core
bench_press:
  animation:
    external_id: Bench_Press_-_Powerlifting
    gif_alt: Bench Press
    gif_source: free_exercise_db
    gif_url: https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Bench_Press_-_Powerlifting/0.jpg
    type: gif
  coaching_focus: Bench pressing is a full-body movement — leg drive and upper-back tightness are not
    optional if you want to press heavy.
  common_errors:
  - Flared elbows at 90 degrees — places the shoulder in an impingement-prone position
  - Butt rising off the bench — usually means the load exceeds current strength
  - Losing upper-back tightness and letting shoulder blades wing under load
  - Bouncing the bar off the chest — catching a bounce trains the wrong quality
  cue_points:
  - 'Grip: roughly 1 finger outside shoulder width; forearms vertical when bar touches chest'
  - Retract and depress the shoulder blades before unracking — hold this through every rep
  - Arch your upper back and keep glutes on the bench; feet drive actively into the floor
  - 'Bar path: slight diagonal from lower chest at the bottom to over the upper chest at the top'
  - Touch lower chest or upper sternum — not the clavicle and not the belly
  - Elbows at 45–75 degrees to the torso — straight out stresses the shoulder
  description: The bench press is the foundational horizontal pushing movement — a bilateral press where
    the bar descends to the lower chest and is driven to lockout while the feet drive into the floor and
    the upper back remains tight. The Horsemen goal is 1.5x bodyweight; Starting Strength builds from
    3x5 linear progression.
  muscle_diagram:
    highlight_primary:
    - pec
    - deltoids
    - triceps
    highlight_secondary:
    - core
    - forearms
  muscles_primary:
  - pec
  - deltoids
  - triceps
  muscles_secondary:
  - core
  - forearms
bike_easy:
  animation:
    type: none
  coaching_focus: Cadence over resistance -- maintain 85-100 RPM at low resistance rather than grinding
    at 60 RPM in a high gear; higher cadence trains the cardiovascular system more than the legs.
  common_errors:
  - Too much resistance -- grinding a heavy gear elevates HR above Z2 and shifts the demand from aerobic
    to muscular
  - Low cadence -- pedaling at 60 RPM is inefficient for aerobic training; aim for 85-100 RPM
  - Using cycling as training rather than recovery -- Z2 bike should feel easy; if it feels like work,
    reduce the intensity
  cue_points:
  - Maintain 85-100 RPM cadence -- use a cadence sensor or count strokes for 15 seconds and multiply by
    4
  - Resistance should allow easy conversation throughout -- Zone 1-2 intensity only
  - Heart rate should remain at or below AeT -- if HR climbs despite low resistance, reduce cadence
  - 'Seat height: hip fully extended at the bottom of the pedal stroke with a slight knee bend -- not
    fully locked'
  - 'In rehabilitation context: start with 10-15 minutes and build to 45-60 minutes as tolerance increases'
  description: Easy cycling at Zone 1-2 is the preferred aerobic rehabilitation modality when running
    is contraindicated -- it provides aerobic stimulus with minimal joint impact, making it the standard
    for post-surgical aerobic maintenance. Uphill Athlete uses it for aerobic base building when impact
    is unavailable. Stationary or outdoor formats are equivalent for metabolic adaptation.
  muscle_diagram:
    highlight_primary:
    - quadriceps
    - hamstrings
    highlight_secondary:
    - calves
    - glutes
  muscles_primary:
  - quadriceps
  - hamstrings
  - calves
  muscles_secondary:
  - glutes
  - hip_flexors
  - core
bike_interval:
  animation:
    type: none
  coaching_focus: Upper and lower body together -- the Assault bike demands arm drive equal to leg drive;
    the mistake is to leg-press and ignore the arms, which loses 30-40% of the power output.
  common_errors:
  - Only using legs on the Assault bike -- the handles are powered by arm push-pull; ignoring them wastes
    available output
  - Pacing the Tabata working interval -- 20 seconds is short enough to go all out; pacing means the correct
    intensity was not reached
  - Seat height too low -- a low seat forces deep knee flexion and reduces power; seat should allow near-full
    leg extension at the bottom
  cue_points:
  - 'On Assault/Echo bike: drive arms and legs simultaneously -- push arms down as legs push forward'
  - 'For Tabata format: max effort for 20 seconds, minimal movement for 10 seconds, repeat 8 rounds'
  - 'Cadence targets: push for maximum RPM on the working interval without sacrificing smooth mechanics'
  - 'For threshold intervals (5-8 min): find a sustained hard effort you can maintain for the duration'
  - 'Resistance on stationary bikes: set high enough that the legs have to push, not spin freely'
  description: High-intensity bike intervals at Zone 4-5 use Tabata protocol (20 seconds on / 10 seconds
    off) or longer threshold efforts. The Assault bike (Echo bike) is commonly used in mixed-modal conditioning
    for calorie or time targets. Cycling intervals have lower injury risk than running intervals, making
    them useful when running is contraindicated while maintaining anaerobic capacity.
  muscle_diagram:
    highlight_primary:
    - quadriceps
    - calves
    highlight_secondary:
    - glutes
    - hamstrings
  muscles_primary:
  - quadriceps
  - calves
  - glutes
  muscles_secondary:
  - hamstrings
  - shoulders
  - core
box_jump:
  animation:
    external_id: Front_Box_Jump
    gif_alt: Box Jump
    gif_source: free_exercise_db
    gif_url: https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Front_Box_Jump/0.jpg
    type: gif
  coaching_focus: Step down, do not jump down -- under fatigue, athletes jump down from the box repeatedly,
    which accumulates Achilles tendon stress far beyond what the workout itself intends.
  common_errors:
  - 'Jumping down from the box repeatedly: under fatigue this accumulates landing impact load on the Achilles
    and patella that the workout design did not account for'
  - 'Landing with locked knees on the box: the entire lower extremity absorbs the load when the knees
    are bent; locked-knee landing concentrates it at the joint'
  - 'Scraping the shins on the box: the jump height is insufficient for the box height; reduce box height
    or improve power'
  cue_points:
  - Approach the box at a comfortable distance; use a brief dip (arm swing optional) to load the legs
  - 'Explode through the entire foot: heels through to the balls of the feet as the jump progresses'
  - Land in a partial squat on top of the box with soft knees -- the landing should be quiet
  - Stand to full extension on top of the box before stepping or jumping off
  - Step off the box -- one foot at a time; do not jump off under fatigue
  description: The box jump is a standard plyometric -- an explosive two-leg jump from the floor onto
    a box (24 inches for men, 20 for women in CrossFit standards). Gym Jones programs it in conditioning
    circuits at 20-24 inch heights. It develops lower-body explosive power and the reactive strength required
    for athletic movements. The landing mechanics and the step-down are as important as the jump height
    for long-term Achilles and patellar tendon health.
  muscle_diagram:
    highlight_primary:
    - quadriceps
    - glutes
    - calves
    highlight_secondary:
    - hamstrings
    - core
  muscles_primary:
  - quadriceps
  - glutes
  - calves
  muscles_secondary:
  - hamstrings
  - core
burpee:
  animation:
    type: none
  coaching_focus: The quality of each component does not degrade because the exercise is hard -- the push-up
    at the bottom must have chest contact and full lockout at the top, regardless of pace.
  common_errors:
  - 'Omitting the push-up chest contact: the chest-to-floor push-up is half the exercise; hovering an
    inch above and calling it a push-up is not a burpee'
  - 'Worm-style from plank (snaking up): the feet should jump back under the hips in one movement, not
    worming through the hips'
  - 'No full extension at the jump: the jump must reach full hip and knee extension; a half-jump does
    not complete the movement'
  cue_points:
  - Start standing; descend to a squat and place the hands on the floor
  - Jump or step the feet back to a plank position; do not collapse into the plank
  - 'Perform a push-up: chest to floor, full lockout -- this is a standard push-up embedded in a burpee'
  - Jump or step the feet back to squat position
  - Jump vertically with arms overhead -- full extension at the top; clap overhead as the standard
  description: The burpee is a compound movement combining a squat thrust, push-up, and vertical jump
    -- demanding coordinated transition through four distinct positions in each rep. Marcus Filly programs
    controlled-pace burpees as an aerobic capacity builder; Gym Jones uses them as the final punishing
    element in circuits. The burpee simultaneously taxes the upper and lower body and cardiovascular system,
    making it one of the most metabolically demanding bodyweight exercises.
  muscle_diagram:
    highlight_primary:
    - quadriceps
    - glutes
    - pec
    highlight_secondary:
    - core
    - deltoids
    - triceps
  muscles_primary:
  - quadriceps
  - glutes
  - pec
  muscles_secondary:
  - core
  - deltoids
  - triceps
clean:
  animation:
    type: none
  coaching_focus: Pull from the floor with a flat back, then jump and pull under the bar.
  common_errors:
  - Pulling with bent arms early
  cue_points:
  - Bar over the mid-foot, back flat
  - Extend the hips hard, shrug
  - Pull under and catch in the front squat
  description: From the floor to the front rack, received in a squat.
  muscle_diagram:
    highlight_primary:
    - glutes
    - hamstrings
    - quadriceps
    highlight_secondary:
    - upper_back
    - erector_spinae
  muscles_primary:
  - glutes
  - hamstrings
  - quadriceps
  muscles_secondary:
  - upper_back
  - erector_spinae
clean_and_jerk:
  animation:
    type: none
  coaching_focus: Clean, stand, then dip and drive the bar overhead.
  common_errors:
  - Pressing out the jerk
  cue_points:
  - Clean to the front rack
  - Dip straight down, drive
  - Lock out overhead
  description: A clean to the shoulders, then a jerk overhead.
  muscle_diagram:
    highlight_primary:
    - glutes
    - quadriceps
    - shoulders
    highlight_secondary:
    - triceps
    - upper_back
  muscles_primary:
  - glutes
  - quadriceps
  - shoulders
  muscles_secondary:
  - triceps
  - upper_back
db_snatch:
  animation:
    type: none
  coaching_focus: From the floor to overhead in one pull.
  common_errors:
  - Pressing the last part
  cue_points:
  - Hinge, dumbbell between the feet
  - Drive the hips and pull high
  - Punch to lockout overhead
  description: A one-arm dumbbell (or kettlebell) snatch.
  muscle_diagram:
    highlight_primary:
    - glutes
    - hamstrings
    - shoulders
    highlight_secondary:
    - upper_back
    - core
  muscles_primary:
  - glutes
  - hamstrings
  - shoulders
  muscles_secondary:
