# CrossFit — the machine half of docs/package-fidelity/crossfit.md
# (docs/schemas/fidelity.schema.json; docs/package-fidelity/README.md).
# Read 2026-10-21: Glassman's CrossFit Journal articles, the Level 1 guide,
# the benchmark pages and the crossfit.com workouts of July-December 2005.
shape: templates

sources:
  - id: tmpl03
    kind: primary
    author: Greg Glassman
    title: A Theoretical Template for CrossFit's Programming (CrossFit Journal 6)
    where: https://library.crossfit.com/free/pdf/06_03_CF_Template.pdf
    published: '2003-02'
    read: full
    accessed: '2026-10-21'
  - id: wif02
    kind: primary
    author: Greg Glassman
    title: What Is Fitness?
    where: https://library.crossfit.com/free/pdf/CFJ-trial.pdf
    published: '2002-10'
    read: full
    accessed: '2026-10-21'
  - id: found02
    kind: primary
    author: Greg Glassman
    title: Foundations
    where: https://library.crossfit.com/free/pdf/Foundations.pdf
    published: '2002'
    read: full
    accessed: '2026-10-21'
  - id: bench03
    kind: primary
    author: Greg Glassman
    title: Benchmark Workouts (CrossFit Journal 13)
    where: https://library.crossfit.com/free/pdf/13_03_Benchmark_Workouts.pdf
    published: '2003-09'
    read: full
    accessed: '2026-10-21'
  - id: newgirls04
    kind: primary
    author: CrossFit Journal
    title: The New Girls (CrossFit Journal 27)
    where: https://library.crossfit.com/free/pdf/27_04_new_girls.pdf
    published: '2004-11'
    read: full
    accessed: '2026-10-21'
  - id: bm
    kind: primary
    author: CrossFit
    title: The benchmark workouts (crossfit.com/benchmark)
    where: https://www.crossfit.com/benchmark/fran
    read: full
    accessed: '2026-10-21'
