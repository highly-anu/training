    volume: increase_reps_per_set
  scaling_down: []
  typical_volume:
    sets: 4
    reps: 10
  sources:
  - CrossFit
  - Gym Jones
  notes: 'Standard CrossFit box: 24" male, 20" female. Gym Jones uses 20–24" boxes
    in circuits (e.g., 30 box jumps in "Those Burpees Suck"). Land softly in partial
    squat; step down (do not jump down) to protect Achilles under fatigue. Jump-and-land
    variant vs. rebound variant — program intentionally.

    '
