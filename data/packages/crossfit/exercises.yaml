    complexity: squat_jump
  scaling_down: []
  typical_volume:
    sets: 3
    reps: 20
  sources:
  - CrossFit
  - Gym Jones
  notes: 'CrossFit fundamental movement. Rippetoe squatting standards apply: below
    parallel, neutral spine, heels flat. Gym Jones warm-up protocol: 2×5 wall squats
    then 2×10 air squats before loading. Chelsea benchmark: 15 squats per minute
    EMOM 30 min.

    '
