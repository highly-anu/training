    complexity: l_sit
  scaling_down: []
  typical_volume:
    sets: 3
    reps: 20
  sources:
  - CrossFit
  - Gym Jones
  notes: 'CrossFit benchmark Annie: 50-40-30-20-10 sit-ups. Gym Jones uses in accumulation
    days as high-rep core work. Anchored foot variant increases hip flexor contribution;
    abmat allows full lumbar extension at bottom.

    '
