  - Gym Jones
  notes: 'Alternating legs, stepping forward. Knee tracks over foot, front shin near-vertical.
    Gym Jones programs 2×20m walking lunges in single-leg accessory work. Bodyweight
    version is the baseline; progress to overhead or weighted variants.

    '
