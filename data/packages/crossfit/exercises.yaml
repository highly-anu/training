  - Gym Jones
  notes: 'Arms locked overhead with weight or simply arms raised. Gymn Jones programs
    45lb bar overhead during 400m lunge walks as a power-endurance challenge. Without
    load this is a mobility and stability developer.

    '
- id: burpee
  name: Burpee
  category: bodyweight
