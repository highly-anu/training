  typical_volume:
    sets: 5
    reps: 1
  sources:
  - CrossFit
  notes: '15-foot standard height (CrossFit). Legless variant eliminates lower-body
    assistance and dramatically increases upper-body demand. Rope climb scores high
    on lat/biceps activation and grip endurance. Foot-assisted technique for conditioning;
    legless for strength.

    '
- id: box_jump
  name: Box Jump
  category: bodyweight
  modality:
  - power
  - anaerobic_intervals
  equipment:
  - box
  effort: high
  bilateral: true
  movement_patterns:
  - squat
  - ballistic
  requires: []
  unlocks: []
  contraindicated_with:
