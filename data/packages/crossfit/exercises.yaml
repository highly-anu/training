exercises:
- id: run_easy
  name: Easy Run (Zone 1–2)
  category: aerobic
  modality:
  - aerobic_base
  equipment:
  - open_space
  effort: low
  bilateral: true
  movement_patterns:
  - aerobic_monostructural
  - locomotion
  requires: []
  unlocks: []
  contraindicated_with:
  - ankle_sprain
  - achilles_tendinopathy
  - patellar_tendinopathy
  - knee_meniscus_post_op
  progressions:
    volume: increase_distance
  scaling_down: []
  typical_volume:
    duration_sec: 4500
  sources:
  - Uphill Athlete
  - CrossFit Endurance
  notes: 'Conversational pace; heart rate at or below aerobic threshold (AeT), typically
    <135 bpm or Maffetone (180 − age). Uphill Athlete: 80% of all aerobic volume
    at this intensity. Gym Jones recovery days: 60–120 min at conversational pace.
    Primary aerobic base builder. Nasal breathing is a useful intensity governor.

    '
- id: run_interval
  name: Interval Run (Zone 4–5)
  category: aerobic
  modality:
  - anaerobic_intervals
  equipment:
  - open_space
  effort: high
  bilateral: true
  movement_patterns:
  - aerobic_monostructural
  - locomotion
  requires:
  - run_easy
  unlocks: []
  contraindicated_with:
  - ankle_sprain
  - achilles_tendinopathy
  - patellar_tendinopathy
  - knee_meniscus_post_op
  progressions:
    volume: add_sets
  scaling_down: []
  typical_volume:
    sets: 6
    distance_m: 400
  sources:
  - CrossFit Endurance
  - Gym Jones
  notes: 'Gym Jones: 5× 1-min all-out, 4-min active recovery; or 4× 800 yards at
    10% faster than 2-mile PR pace. CrossFit Endurance pyramid intervals: 1-2-3-4-3-2-1
    min at Zone 3–4. Work:rest ratio typically 1:2 to 1:4.

    '
- id: row_threshold
  name: Threshold Row (Zone 3–4)
  category: aerobic
  modality:
  - aerobic_base
  - anaerobic_intervals
  equipment:
  - rower
  effort: medium
  bilateral: true
  movement_patterns:
  - aerobic_monostructural
  requires:
  - row_easy
  unlocks: []
  contraindicated_with:
  - lumbar_disc_pathology
  progressions:
    volume: increase_duration
  scaling_down:
  - row_easy
  typical_volume:
    sets: 4
    duration_sec: 480
  sources:
  - Gym Jones
  - CrossFit Endurance
  notes: 'Gym Jones: 6× 500m at ~15 sec per 500m slower than PR pace, 3-min active
    rest between pieces (1:2 work:rest). CrossFit Endurance threshold row format mirrors
    run threshold protocol. Stroke rate 24–28 SPM.

    '
- id: bike_interval
  name: Interval Bike (Zone 4–5)
  category: aerobic
  modality:
  - anaerobic_intervals
  equipment:
  - bike
  effort: high
  bilateral: true
  movement_patterns:
  - aerobic_monostructural
  requires:
  - bike_easy
  unlocks: []
  contraindicated_with: []
  progressions:
    volume: add_sets
  scaling_down:
  - bike_easy
  typical_volume:
    sets: 8
    duration_sec: 20
  sources:
  - CrossFit Endurance
  notes: 'Tabata-protocol intervals or longer threshold intervals on bike. Assault
    bike commonly used for mixed-modal conditioning (e.g., Echo bike calories). Low
    injury risk relative to running intervals; useful when running is contraindicated.

    '
- id: jump_rope_double_under
  name: Jump Rope (Double Under)
  category: aerobic
  modality:
  - anaerobic_intervals
  - movement_skill
  equipment:
  - jump_rope
  effort: medium
  bilateral: true
  movement_patterns:
  - aerobic_monostructural
  - locomotion
  - ballistic
  requires: []
  unlocks: []
  contraindicated_with:
  - ankle_sprain
  - achilles_tendinopathy
  - knee_meniscus_post_op
  progressions:
    volume: increase_reps_per_set
  scaling_down: []
  typical_volume:
    sets: 5
    reps: 50
  sources:
  - CrossFit
  notes: 'Rope passes twice per jump. CrossFit benchmark Annie: 50-40-30-20-10 double
    unders alternated with sit-ups. Requires rope speed, timing, and consistent jump
    height. Higher cardiovascular demand than single unders. Wrist mechanics and rope
    length are the primary limiting factors for beginners.

    '
- id: push_up
  name: Push-Up
  category: bodyweight
  modality:
  - relative_strength
  - strength_endurance
  equipment:
  - none
  effort: medium
  bilateral: true
  movement_patterns:
  - horizontal_push
  requires: []
  unlocks: []
  contraindicated_with:
  - wrist_injury
  - shoulder_impingement
  progressions:
    volume: increase_reps_per_set
    complexity: push_up_ring
  scaling_down: []
  typical_volume:
    sets: 4
    reps: 15
  sources:
  - CrossFit
  - Gym Jones
  notes: 'Foundation horizontal push. Cue: full lockout at top, chest to floor at
    bottom, elbows at 45 degrees. Scale up via ring, archer, or clapping variants.
    Gym Jones programs 200+ reps in Murph-style sessions.

    '
- id: pull_up
  name: Pull-Up (Overhand)
  category: bodyweight
  modality:
  - relative_strength
  - strength_endurance
  equipment:
  - pull_up_bar
  effort: medium
  bilateral: true
  movement_patterns:
  - vertical_pull
  requires:
  - scapular_control
  unlocks: []
  contraindicated_with:
  - shoulder_instability
  - shoulder_impingement
  progressions:
    volume: increase_reps_per_set
    load: add_weight_vest
    complexity: pull_up_weighted
  scaling_down: []
  typical_volume:
    sets: 5
    reps: 5
  sources:
  - CrossFit
  - Gym Jones
  notes: 'Pronated grip, full hang to chin over bar. Gym Jones programs pull-up ladders
    (1-2-3-4-5-6 per set) accumulating 50+ reps. CrossFit benchmark Murph: 100 reps.
    Prerequisite dead_hang ensures shoulder stability under passive load before active
    pulling.

    '
- id: dip_ring
  name: Dip (Rings)
  category: bodyweight
  modality:
  - relative_strength
  - movement_skill
  equipment:
  - rings
  effort: high
  bilateral: true
  movement_patterns:
  - vertical_push
  requires:
  - push_pattern
  - shoulder_stability
  unlocks:
  - muscle_up_ring
  contraindicated_with:
  - shoulder_impingement
  - shoulder_instability
  - wrist_injury
  progressions:
    volume: increase_reps_per_set
    complexity: muscle_up_ring
  scaling_down:
  - dip
  typical_volume:
    sets: 3
    reps: 8
  sources:
  - CrossFit
  notes: 'Turn rings out (RTO) at lockout. Greater pectoralis minor and serratus demand
    than bar dip. CrossFit benchmark Elizabeth programs ring dips as a primary movement.

    '
- id: handstand_hold
  name: Handstand Hold (Wall)
  category: bodyweight
  modality:
  - relative_strength
  - movement_skill
  equipment:
  - none
  effort: medium
  bilateral: true
  movement_patterns:
  - vertical_push
  - isometric
  requires:
  - shoulder_stability
  unlocks:
  - handstand_push_up
  contraindicated_with:
  - wrist_injury
  - shoulder_impingement
  progressions:
    volume: increase_duration
    complexity: handstand_push_up
  scaling_down: []
  typical_volume:
    sets: 3
    duration_sec: 30
  sources:
  - CrossFit
  - Ido Portal
  notes: 'Chest-to-wall or back-to-wall hold. Active shoulders — push floor away,
    protract scapulae. Foundation for HSPU. Ido Portal treats inversion practice as
    a daily movement habit.

    '
- id: handstand_push_up
  name: Handstand Push-Up (Wall)
  category: bodyweight
  modality:
  - relative_strength
  - max_strength
  equipment:
  - none
  effort: high
  bilateral: true
  movement_patterns:
  - vertical_push
  requires:
  - handstand_hold
  unlocks: []
  contraindicated_with:
  - wrist_injury
  - shoulder_impingement
  - shoulder_instability
  progressions:
    volume: increase_reps_per_set
    complexity: handstand_push_up_ring
  scaling_down:
  - handstand_hold
  typical_volume:
    sets: 4
    reps: 5
  sources:
  - CrossFit
  - Gym Jones
  notes: 'Chest-to-wall kick-up. Head to floor at bottom; full lockout at top. Deficit
    HSPU (hands on parallettes) increases range of motion and difficulty. Kipping
    variant increases volume capacity for metabolic conditioning; strict variant is
    primary strength developer.

    '
- id: muscle_up_ring
  name: Muscle-Up (Rings)
  category: bodyweight
  modality:
  - relative_strength
  - power
  - movement_skill
  equipment:
  - rings
  effort: max
  bilateral: true
  movement_patterns:
  - vertical_pull
  - vertical_push
  requires:
  - pull_up
  - dip_ring
  unlocks: []
  contraindicated_with:
  - shoulder_instability
  - shoulder_impingement
  progressions:
    volume: increase_reps_per_set
  scaling_down:
  - dip_ring
  typical_volume:
    sets: 3
    reps: 3
  sources:
  - CrossFit
  notes: 'Transition from below rings to support position in a single movement. The
    false grip enables a smooth pull-to-press transition. CrossFit benchmark movement.
    Higher shoulder demand than bar variant due to free rotation.

    '
- id: sit_up
  name: Sit-Up (Abmat)
