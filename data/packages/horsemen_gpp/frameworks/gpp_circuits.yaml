id: gpp_circuits
name: GPP Circuits (Horsemen / SOF-style)
source_philosophy: horsemen_gpp

goals_served:
  - durability
  - strength_endurance
  - mixed_modal_conditioning
  - max_strength

sessions_per_week:
  durability: 2
  mixed_modal_conditioning: 1
  max_strength: 1
modality_priority:
  committed: [durability]
  core: [mixed_modal_conditioning, max_strength]
  supplementary: []

intensity_distribution:
  zone1_2_pct: 0.10
  zone3_pct: 0.35
  zone4_5_pct: 0.35
  max_effort_pct: 0.20

progression_model: time_to_task

applicable_when:
  training_level:
    - novice
    - intermediate
    - advanced
    - elite
  days_per_week_min: 3   # must match expectations.min_days_per_week below
  days_per_week_max: 5
  goal_priority_min:
    durability: 0.2

incompatible_with:
  - framework_id: linear_progression
    reason: >
      GPP circuit volume and mixed-modal fatigue accumulation interferes with the
      full systemic recovery required by linear progression. High-rep, multi-modal
      circuit work elevates cortisol and delays muscle protein synthesis on barbell
      training days.
    interference_level: manageable
    mitigation: >
      Reduce circuit frequency to 1 session/week during active linear progression.
      Schedule circuit day as far as possible from heavy barbell sessions (e.g.
      Saturday if strength days are Mon/Wed/Fri). Keep circuit intensity moderate.
  - framework_id: polarized_80_20
    reason: >
      GPP circuits operate predominantly in Zone 3-4, accumulating the type of
      moderate-high intensity fatigue that polarized theory explicitly avoids to
      protect aerobic base development quality.
    interference_level: manageable
    mitigation: >
      If aerobic base is the primary goal, replace circuit sessions with Zone 1-2
      aerobic work and limit GPP circuits to 1 session/week as a supplementary
      work capacity stimulus. Do not count circuit sessions as aerobic base volume.

# Circuit-friendly: moderate spacing allows back-to-back circuit days
cadence_options:
  3: [[1, 3, 5], [2, 4, 6], [1, 4, 6]]
  4: [[1, 2, 4, 6], [1, 3, 5, 6], [2, 3, 5, 7]]
  5: [[1, 2, 3, 5, 7], [1, 2, 4, 5, 7], [1, 3, 4, 6, 7]]

sources:
  - "App adaptation; not in the Horsemen Training Program"

notes: >
  An app adaptation, not in the Horsemen source, which has no circuits-only
  block. GPP (General Physical Preparedness) circuits for broad work
  capacity, durability and repeatable output under fatigue: sandbag
  complexes, loaded-carry circuits and bodyweight circuits. Progression is by
  time-to-task: the same circuit completed faster, with more load, or with
  less rest. The source's own circuits (short, complementary and focus) and
  its SMMF efforts are named workouts inside the four-month macro, not this
  block. Equipment-minimal: a sandbag, a barbell, bodyweight and a ruck cover
  it.

# An app choice, like the rest of this framework: the Horsemen source has no
# deload week.
deload_protocol:
  frequency_weeks: 4
  volume_reduction_pct: 0.6   # share of volume kept
  intensity_change: reduce_slightly

expectations:
  min_weeks: 8
  ideal_weeks: 12
  min_days_per_week: 3
  ideal_days_per_week: 4
  min_session_minutes: 45
  ideal_session_minutes: 60
  supports_split_days: false
