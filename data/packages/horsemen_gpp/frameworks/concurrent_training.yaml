id: concurrent_training
name: Concurrent Training (GPP / Balanced Fitness)
source_philosophy: horsemen_gpp

goals_served:
  - max_strength
  - aerobic_base
  - mixed_modal_conditioning
  - durability
  - strength_endurance

sessions_per_week:
  max_strength: 2
  aerobic_base: 2
  mixed_modal_conditioning: 1
  durability: 1
  strength_endurance: 1
modality_priority:
  committed: [max_strength, aerobic_base]
  core: [mixed_modal_conditioning, durability]
  supplementary: [strength_endurance]

# The source gives no intensity distribution and no RPE, so none is declared.
# Its loads are a 1RM worked up to on the day and percentages of it, fixed
# weights and multiples of bodyweight, none of which the app can compute or
# ramp: every slot is prescribed as written (progression.as_written), its
# `load` text saying what to lift.
prescription_policy: framework
progression_model: as_written

applicable_when:
  training_level:
    - intermediate
    - advanced
    - elite
  days_per_week_min: 4
  days_per_week_max: 6
  goal_priority_min:
    aerobic_base: 0.15

incompatible_with:
  - framework_id: linear_progression
    reason: >
      Concurrent training's conditioning volume and fatigue accumulation prevents
      the session-to-session recovery that linear progression requires. The
      interference effect is well-documented: endurance work blunts strength
      adaptation when both are pursued at full volume.
    interference_level: high
    mitigation: >
      If a novice needs both, run a minimal linear progression (3×/week barbell)
      and strictly cap conditioning at 2 low-intensity sessions/week. Accept slower
      strength gains. Transition to true concurrent programming once linear progress
      stalls.
  - framework_id: high_frequency_skill
    reason: >
      Adding daily skill sessions on top of a full concurrent training week creates
      excessive total training volume and degrades movement quality — the opposite
      of what high-frequency skill work is designed to achieve.
    interference_level: manageable
    mitigation: >
      Replace one conditioning session with a skill session, or limit skill practice
      to 10-15 min movement prep before existing sessions rather than standalone
      daily sessions.

# No deload_protocol: the source has no deload week. Every week carries a
# recovery day (≤65% max HR) and a rest day instead.

# Index 0 = most spread-out (used for taper/deload); others are 2-on-1-off variants
cadence_options:
  3: [[1, 4, 7], [1, 3, 6], [2, 4, 7]]
  4: [[1, 3, 5, 7], [1, 2, 4, 6], [2, 3, 5, 7]]
  5: [[1, 2, 4, 6, 7], [1, 2, 4, 5, 7], [1, 3, 4, 6, 7]]
  6: [[1, 2, 3, 5, 6, 7], [1, 2, 4, 5, 6, 7]]

sources:
  - "data/horsemen/horsemen.pdf (Horsemen Training Program 2008)"

notes: >
  The weekly build of the Horsemen four-month macro. In the source every week
  is six training days and a rest day: each day is a category — strength,
  power endurance, job specific, SMMF, progression, circuits, density,
  accumulation, endurance, recovery — opened by a warm-up from its list, and
  the workout is picked from that category's list of named workouts. Each
  phase writes its month's weeks day by day (philosophy.yaml week_templates);
  the categories below are those lists, taken in rotation. Strength days work
  up to a 1RM in the day's lift, then work at percentages of it; other loads
  are fixed or multiples of bodyweight. There is no RPE and no deload week; a
  recovery day (30-60 minutes at 65% of max heart rate or less) and a rest day
  sit in every week. sessions_per_week and cadence_options describe the same
  month for readers that need a modality mix; the templates decide the days.

expectations:
  min_weeks: 12
  ideal_weeks: 16
  min_days_per_week: 4
  ideal_days_per_week: 6
  min_session_minutes: 60
  ideal_session_minutes: 90
  ideal_long_session_minutes: 120
  supports_split_days: true

# The source's day categories (src/week_template.py): each day of a phase's
# week_templates draws the next workout of its category the athlete can do as
# written; a category none fits falls back in the order given, and the week
# says so. Pools are in the source's order; every workout is pool_only.
warm_up_category: warm_up
