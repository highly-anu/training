- id: ruck
  name: Ruck (Loaded Walk / Run)
  category: aerobic
  modality:
  - aerobic_base
  - durability
  equipment:
  - ruck_pack
  - open_space
  effort: medium
  bilateral: true
  movement_patterns:
  - aerobic_monostructural
  - locomotion
  - loaded_carry
  requires: []
  unlocks: []
  contraindicated_with:
  - ankle_sprain
  - achilles_tendinopathy
  - lumbar_disc_pathology
  progressions:
    load: increase_pack_weight
    volume: increase_distance
  scaling_down:
  - run_easy
  typical_volume:
    duration_sec: 5400
    distance_m: 10000
  sources:
  - Horsemen
  - Uphill Athlete
  - Gym Jones
  notes: >
    The Horsemen source's only ruck is a 3-mile ruck run with at least 45 lb,
    followed by lunges, dips and pull-ups in the ruck and a 1-mile run without it;
    it also uses a rucksack as step-up load. Longer loaded walks are an app
    adaptation. Uphill Athlete aerobic ruck with 10–20% bodyweight. Gym Jones
    recovery endurance hike: 90–120 min with 20–30# pack. Progressions: distance
    first, then load, then speed. Simple, durable training modality requiring
    minimal equipment.
