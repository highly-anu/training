id: horsemen_gpp
name: "Horsemen GPP / SOF-Style Training"
core_principles:
  - durability_over_peak_performance
  - elite_fitness_across_broad_base_no_single_domain_specialization
  - repeatable_output_under_fatigue
  - simple_equipment_sandbag_barbell_kb_bodyweight_rower
  - function_under_extreme_environment_and_operational_load
  - strength_and_conditioning_goals_reached_within_four_months
  - job_specific_conditioning_drives_programming_in_later_phases
  - block_structure_shifts_from_strength_to_power_endurance_to_job_specific
scope:
  - max_strength
  - power
  - strength_endurance
  - aerobic_base
  - mixed_modal_conditioning
  - durability
bias:
  - durability
  - strength_endurance
  - mixed_modal_conditioning
avoid_with: []
required_equipment:
  - barbell
  - plates
  - kettlebell
  - dumbbell
  - sandbag
  - pull_up_bar
  - rings
  - ghd
  - rower
  - box
  - medicine_ball
  - sled
  - tire
  - rope
intensity_model: block_periodization
# The source loads from a 1RM worked up to on the day, then percentages of
# it, fixed loads or multiples of bodyweight — load is its currency.
progression_philosophy: load_based
sources:
  - "data/horsemen/horsemen.pdf (Horsemen Training Program 2008)"
notes: >
  Written by "the Horsemen" for special-operations operators ("Team guys") to
  build a broad operator base of fitness. It states no prerequisites and has
  no novice path; daily 1RM work, Olympic lifts at 80-100% and gymnastics such
  as handstand push-ups and rope climbs assume an experienced athlete. Its
  numbers are goals to reach within four months, not entry standards:
  deadlift 2.5x, front squat 1.5x, bench press 1.5x and military press 1.0x
  bodyweight, 3 miles in under 20:00, and at least 200 on the Secret Service
  Snatch Test (SSST). The PT test is a separate list: max pull-ups (minimum
  15), sit-ups in 3 minutes (90), push-ups in 3 minutes (80), a 3-mile run
  (22:30) and an 800 m swim (14:30). The program is four 28-day months —
  strength, power endurance, job specific, maintenance — run two or three
  times. Every week is six sessions and a rest day, with recovery days (30-60
  minutes at 65% of max heart rate or less) built in. Each day is a category —
  strength, power endurance, job specific, SMMF, progression, circuits,
  density, accumulation, endurance or recovery — and the workout is picked
  from that category's list of named workouts. Loads come from a 1RM worked up
  to on the day, then percentages of it, fixed loads or multiples of
  bodyweight; there is no RPE and no deload week. The 4-Month Macro track runs
  the source as written: each month's week templates day by day, every named
  workout as an archetype in its category's pool, taken in rotation, and
  prescribed exactly as the source writes it (src/week_template.py). A workout
  whose equipment the athlete lacks is passed over for the next one; names
  carrying profanity or a slur are cleaned.

# Every modality concurrent_training and gpp_circuits prescribe now has an
# archetype in this package. Borrowing, where it happens, is declared below.
self_contained: true

# Two tracks: the source's four-month macro, and GPP circuits — an app
# adaptation with no counterpart in the source — as a repeating block. Phase
# text follows the source's month templates (Training Program pp.3-6).
primary_track_id: four_month_macro
tracks:
  - id: four_month_macro
    name: "4-Month Macro"
    description: >
      The source's four months — strength, power endurance, job specific,
      maintenance — each a 28-day template started on the 1st of the month,
      with the days left over free, and the whole run two or three times.
      Every week is six training days and a rest day. The strength and
      conditioning numbers the source names are what it aims to reach in
      four months.
    phases:
      - id: strength
        name: "Strength"
        kind: base
        weeks: 4
        framework_id: concurrent_training
        focus: "Strength-dominant month"
        description: >
          Month one: strength twice a week, on days 1 and 5; a job-specific
          day, a power-endurance day and one rotating day (SMMF, power, a
          progression workout or a circuit) between them; recovery on day 6
          and rest on day 7. Strength days work up to a 1RM in the day's lift,
          then percentages of it, then accessory rounds; there is no RPE.
          The source lists the PT test among its hard job-specific options
          and never schedules it; here it takes the month's first hard
          job-specific day (week 2) as a baseline for the four-month goals.
        adaptations:
          - "Maximal strength toward the bodyweight goals"
          - "Power endurance and job-specific capacity kept alongside it"
        intensity: "Heavy: a 1RM worked up to on the day, then percentages of it"
        # The source's example weeks (Training Program pp.3-4), day by day.
        week_templates:
          - [strength, job_specific_long, power_endurance, smmf, strength, recovery, rest]
          - [strength, power_explosive, job_specific_hard, power_endurance, strength, recovery, rest]
          - [strength, power_cardio, job_specific_short, [progression, breathing_ladder], strength, recovery, rest]
          - [strength, power_endurance, job_specific_long, circuit_complementary, strength, recovery, rest]
        # Fewer than six days: recovery, then the rotating day, go first;
        # the two strength days stay.
        drop_order: [recovery, smmf, power_explosive, power_cardio, progression, circuit_complementary,
                     power_endurance, job_specific_short, job_specific_long, job_specific_hard]
        # The PT test is one of the source's hard job-specific options. As a
        # baseline it takes the month's first hard job-specific day (week 2).
        tests:
          - archetype: horsemen_pt_test
            week: 2
            in_place_of: [job_specific_hard, job_specific_long, job_specific_short]
      - id: power_endurance
        name: "Power Endurance"
        kind: build
        weeks: 4
        framework_id: concurrent_training
        focus: "Power-endurance month"
        description: >
          Month two puts power endurance first — about four sessions every two
          weeks: runs with get-ups, the Secret Service Snatch Test, Tabata, a
          5K row, EMOMs. Strength drops to maintenance, about twice in two
          weeks, beside job-specific days, an endurance session of 60 minutes
          or more, recovery and a rest day each week.
        adaptations:
          - "Repeatable power under fatigue"
          - "Work capacity"
        intensity: "High, in repeated efforts"
        week_templates:
          - [power_endurance, job_specific_short, strength_maintenance, power_endurance, endurance_long, recovery, rest]
          - [power_endurance, circuit_focus, job_specific_long, power_endurance,
             [strength_maintenance, job_specific_short], {categories: [olympic], light: true}, rest]
          - [power_endurance, strength_maintenance, job_specific_hard, endurance_long,
             [power_endurance, circuit_short], recovery, rest]
          - [power_endurance, job_specific_long, [strength_maintenance, run], progression, power_endurance,
             {categories: [smmf], light: true}, rest]
        drop_order: [recovery, smmf, olympic, circuit_focus, progression, endurance_long, circuit_short,
                     job_specific_short, job_specific_long, strength_maintenance, job_specific_hard,
                     power_endurance]
      - id: job_specific
        name: "Job Specific"
        kind: specific
        weeks: 4
        framework_id: concurrent_training
        focus: "Job-specific month"
        description: >
          Month three makes job-specific days most of the week: climbing and
          grip work, leg blasters, a ruck run, the PT tests, tire and sled
          work. Strength and power endurance alternate around them, with
          recovery on day 6 and rest on day 7.
        adaptations:
          - "Task-specific conditioning"
          - "Grip, climbing and load-carriage capacity"
        intensity: "Hard, job-paced"
        week_templates:
          - [job_specific_long, strength, job_specific_short, power_endurance, job_specific_long, recovery, rest]
          - [job_specific_hard, circuit_short, job_specific_long, job_specific_short, density, recovery, rest]
          - [job_specific_long, power_endurance, job_specific_short,
             {categories: [smmf, progression], light: true}, job_specific_long, recovery, rest]
          - [job_specific_hard, endurance, job_specific_short, strength, job_specific_long, recovery, rest]
        drop_order: [recovery, smmf, density, circuit_short, endurance, power_endurance, strength,
                     job_specific_short, job_specific_long, job_specific_hard]
      - id: maintenance
        name: "Maintenance"
        kind: maintenance
        weeks: 4
        framework_id: concurrent_training
        focus: "Maintenance month"
        description: >
          Month four holds what the macro built: recovery twice a week at 65%
          of max heart rate or less, circuits, strength, and a hard
          job-specific day, with rest on day 7. The PT test, one of the
          source's hard job-specific options, takes the macro's last hard
          job-specific day: the most rested point of the four months, and the
          check against their goals.
        adaptations:
          - "Retained strength and conditioning"
          - "Recovery"
        intensity: "Hard days between recovery at ≤65% max HR"
        week_templates:
          - [circuit_short, strength, {categories: [recovery], warm_up: true}, job_specific_hard,
             progression, recovery, rest]
          - [circuit_complementary, strength, {categories: [recovery], warm_up: true}, job_specific_hard,
             {categories: [smmf], light: true}, recovery, rest]
          - [circuit_focus, job_specific_hard, {categories: [recovery], warm_up: true}, strength,
             accumulation, {categories: [recovery], warm_up: true}, rest]
          - [endurance_long, job_specific_hard, {categories: [recovery], warm_up: true}, strength,
             circuit_short, recovery, rest]
        drop_order: [recovery, accumulation, smmf, progression, endurance_long, circuit_complementary,
                     circuit_focus, circuit_short, job_specific_hard, strength]
        # And at the end of the macro, on its last hard job-specific day, the
        # most rested day of the four months: the check against its goals.
        tests:
          - archetype: horsemen_pt_test
            week: last
            in_place_of: [job_specific_hard, job_specific_long, job_specific_short]
  - id: gpp_circuits
    name: "GPP Circuits"
    description: >
      An app adaptation, not in the Horsemen source: broad work capacity and
      durability through circuits, carries and fixed tasks, repeated as a
      block.
    phases:
      - id: gpp_block
        name: "GPP Block"
        kind: build
        weeks: 8
        repeatable: true
        framework_id: gpp_circuits
        focus: "Work capacity and durability"
        description: >
          An app adaptation, not in the Horsemen source. Sandbag, loaded-carry
          and bodyweight circuits progressed by time-to-task: the same circuit
          faster, heavier or with less rest.
        adaptations:
          - "General work capacity"
          - "Durability under load"
        intensity: "Time-to-task"
