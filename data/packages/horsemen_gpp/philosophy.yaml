id: horsemen_gpp
name: "Horsemen GPP / SOF-Style Training"
core_principles:
  - durability_over_peak_performance
  - elite_fitness_across_broad_base_no_single_domain_specialization
  - repeatable_output_under_fatigue
  - simple_equipment_sandbag_barbell_kb_bodyweight_rower
  - function_under_extreme_environment_and_operational_load
  - strength_standards_are_prerequisites_not_goals
  - job_specific_conditioning_drives_programming_in_later_phases
  - block_structure_shifts_from_strength_to_power_endurance_to_job_specific
scope:
  - max_strength
  - strength_endurance
  - aerobic_base
  - mixed_modal_conditioning
  - durability
bias:
  - durability
  - strength_endurance
  - mixed_modal_conditioning
avoid_with:
  - max_strength
  - aerobic_base
required_equipment:
  - barbell
  - plates
  - kettlebell
  - sandbag
  - pull_up_bar
  - rower
  - box
  - medicine_ball
  - sled
  - tire
  - rope
intensity_model: block_periodization
progression_philosophy: volume_based
sources:
  - "data/horsemen/horsemen.pdf (Horsemen Training Program 2008)"
notes: >
  4-month macro: Month 1 strength-dominant (4×strength/14 days), Month 2
  power-endurance dominant, Month 3 job-specific dominant, Month 4 maintenance.
  Draws explicitly from Gym Jones (Twight), Mountain Athlete (Shaul), CrossFit
  (Glassman), and Dan John. Strength standards are prerequisites for the program,
  not training goals: deadlift 2.5× BW, front squat 1.5× BW, bench 1.5× BW,
  military press 1× BW. PT test standards: 15+ pull-ups, 200+ SSST reps (KB snatch
  10min @ 53#), 3-mile run under 20:00. Sandbag get-ups, barbell complexes, and
  SMMF (Slow Massive Movement) challenges are signature formats. Recovery sessions
  are low-HR active recovery (≤65% MHR). Named workouts (Curtis P, Riley Black,
  Russian Aggression, SMMF) are distinct from generic archetypes.

# Every modality concurrent_training and gpp_circuits prescribe now has an
# archetype in this package. Borrowing, where it happens, is declared below.
self_contained: true

# Two tracks: the 4-month macro on concurrent training, and GPP circuits as a
# repeating block. Phase text is drafted from this package's own notes and
# framework notes — review before relying on it.
primary_track_id: four_month_macro
tracks:
  - id: four_month_macro
    name: "4-Month Macro"
    description: >
      Month by month from strength to the job: strength-dominant, then
      power-endurance, then job-specific, then maintenance. The strength
      standards are prerequisites for entering it, not its goals.
    phases:
      - id: strength
        name: "Strength"
        kind: base
        weeks: 4
        framework_id: concurrent_training
        focus: "Strength-dominant month"
        description: >
          Month one leans on strength — four strength exposures every two
          weeks — with conditioning held at a level that does not interfere.
          RPE autoregulation sets the day's load against accumulated fatigue.
        adaptations:
          - "Maximal and relative strength"
          - "Fatigue management across modalities"
        intensity: "Heavy strength; conditioning held back"
      - id: power_endurance
        name: "Power Endurance"
        kind: build
        weeks: 4
        framework_id: concurrent_training
        focus: "Power-endurance month"
        description: >
          Month two turns strength into repeatable output: barbell complexes,
          sandbag work and conditioning that asks for power again and again
          under fatigue.
        adaptations:
          - "Repeatable power under fatigue"
          - "Work capacity"
        intensity: "High, in repeated efforts"
      - id: job_specific
        name: "Job Specific"
        kind: specific
        weeks: 4
        framework_id: concurrent_training
        focus: "Job-specific month"
        description: >
          Month three shapes the work to the job: rucks, loaded carries, named
          workouts and the PT-test events, so fitness is expressed in the forms
          it will be needed.
        adaptations:
          - "Task-specific conditioning"
          - "Load-carriage durability"
        intensity: "Task-paced"
      - id: maintenance
        name: "Maintenance"
        kind: maintenance
        weeks: 4
        framework_id: concurrent_training
        focus: "Maintenance month"
        description: >
          Month four holds what the macro built at a sustainable dose, with
          low-heart-rate recovery sessions (65% of max or less) between the
          hard days.
        adaptations:
          - "Retained strength and conditioning"
          - "Recovery"
        intensity: "Sustainable; recovery at ≤65% max HR"
  - id: gpp_circuits
    name: "GPP Circuits"
    description: >
      Broad work capacity and durability through circuits, carries and
      fixed-task benchmarks, repeated as a block.
    phases:
      - id: gpp_block
        name: "GPP Block"
        kind: build
        weeks: 8
        repeatable: true
        framework_id: gpp_circuits
        focus: "Work capacity and durability"
        description: >
          Sandbag complexes, loaded-carry circuits and bodyweight circuits,
          progressed by time-to-task: the same circuit faster, heavier or with
          less rest. Named benchmarks and SMMF efforts test work capacity and
          mental durability at once.
        adaptations:
          - "General work capacity"
          - "Durability under load"
          - "Mental durability"
        intensity: "Time-to-task"
