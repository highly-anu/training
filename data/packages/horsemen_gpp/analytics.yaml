# What progress means for Horsemen GPP. The source's currency is load — a
# 1RM worked up to on the day, then percentages of it — and its goals for four
# months are bodyweight multiples (deadlift 2.5, front squat 1.5, bench 1.5,
# military press 1.0), 3 miles under 20:00 and 200 on the Secret Service
# Snatch Test; its PT tests are job-specific options. So strength leads.
# Aerobic volume reads the endurance and recovery days.
id: horsemen_gpp

progress:
  - id: strength
    label: Strength
    primitive: set_load
    headline: true
    # The 4-Month Macro's strength days work up to a 1RM before anything else
    # (`work_up_1rm*`, prescribed as written): that max is the measure.
    scope:
      modalities: [max_strength]
      slot_roles: [main_lift, secondary_compound, "work_up_1rm*"]
    expected: prescribed

  - id: aerobic_volume
    label: Aerobic volume
    primitive: duration
    scope: {modalities: [aerobic_base]}
    expected: {load_field: duration_minutes}

# The source's goals, then PT test I and PT test II. There is no commons
# front-squat ratio standard yet. The macro's PT test measures the pull-ups,
# sit-ups, push-ups and 3-mile run, and the day's worked-up maxes estimate the
# ratios; the rest are tests the athlete runs on their own and enters by hand.
benchmarks:
  - deadlift_bw_ratio
  - bench_press_bw_ratio
  - strict_press_bw_ratio
  - run_3mile_minutes
  - {id: ssst_reps, manual: true}
  - pull_up_reps
  - pt_sit_ups_3min_reps
  - pt_push_ups_3min_reps
  - {id: swim_800m_minutes, manual: true}
  - {id: run_5mile_minutes, manual: true}
  - {id: bench_press_bodyweight_reps, manual: true}
  - {id: pull_ups_weighted_25lb_reps, manual: true}
