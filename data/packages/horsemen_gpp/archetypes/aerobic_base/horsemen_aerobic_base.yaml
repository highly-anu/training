id: horsemen_aerobic_base
name: Horsemen Aerobic Base (Run / Row / Ruck)
modality: aerobic_base
category: conditioning
duration_estimate_minutes: 50
required_equipment:
- open_space
applicable_phases:
- base
- build
- peak
- taper
- deload
- maintenance
- specific
training_levels:
- novice
- intermediate
- advanced
- elite
sources:
- Horsemen
notes: >
  One archetype for two of the source's day categories. Endurance is any
  cardio for 30-90 minutes — climb, cycle, hike, paddle, run, row, swim, ski
  ("+60 min" in months 2 and 4, "+30" in month 3). Recovery is easy,
  low-impact work for 30-60 minutes at 65% of max heart rate or less, to
  move blood and flush by-products, or a light rowing and bodyweight
  recovery workout. The 45-minute zone-2 default below is the app's, not the
  source's; modality is interchangeable.
slots:
- role: aerobic_main
  slot_type: time_domain
  duration_sec: 2700
  intensity: zone2
  exercise_filter:
    category: aerobic
  notes: >
    45 min continuous at an easy pace (the app's default). The source's
    endurance days run 30-90 min; its recovery days 30-60 min at 65% of max
    heart rate or less.
- role: cool_down
  slot_type: time_domain
  duration_sec: 300
  intensity: zone1
  exercise_filter:
    category: mobility
  notes: 5 min easy walk plus hip flexor and calf work.
scaling:
  deload:
    volume_multiplier: 0.6
    notes: >
      App scaling; the source has no deload week (its recovery days are their
      own category). Cap heart rate at 65% MHR, 25-30 min, bike or row.
  time_limited:
    drop_slots:
    - cool_down
    notes: >
      Keep the main effort and cut the cool-down.
  equipment_limited:
    substitutions:
    - missing_equipment: open_space
      substitute_approach: Row or bike at the same duration and heart rate.
    - missing_equipment: rower
      substitute_approach: Run, or ruck at 20-25 kg for the same duration.
