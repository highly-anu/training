id: ruck_session
name: Ruck Session (Distance × Load)
modality: durability
category: gpp_durability
duration_estimate_minutes: 90
required_equipment:
- ruck_pack
- open_space
applicable_phases:
- base
- build
- peak
- maintenance
- specific
sources:
- Horsemen
- Uphill Athlete
notes: >
  An app adaptation. The source's only ruck is a job-specific workout: a
  3-mile ruck run with at least 45 lb, then 3 rounds of 50 lunges, 50 dips
  and 10 pull-ups still wearing the ruck, then a 1-mile run without it. It
  also uses a rucksack as step-up load in a warm-up. This archetype is
  instead a steady loaded walk progressed by distance, then load, then
  speed; its distance and pack weight are the app's, and it carries no
  benchmark from the source.
slots:
- role: ruck_main
  slot_type: distance
  distance_m: 12000
  intensity: zone2
  pack_load_kg: 20
  exercise_filter:
    movement_pattern: ruck
    category: aerobic
  notes: >
    12 km at 20 kg is the app's default, not the source's. Adjust distance
    and load to the athlete: start lighter and add load only once the
    distance is comfortable. Conversational pace on the flat; push on hills.
scaling:
  deload:
    volume_multiplier: 0.6
    intensity_pct: 0.9
    notes: App scaling; the source has no deload week. Reduce distance by 40% and
      drop pack weight 5 kg.
  time_limited:
    drop_slots: []
    notes: 'Ruck is a single-slot session. Shorten by reducing distance. Minimum useful
      ruck is ~30 min (~4–5 km) to get cardiovascular and tissue loading benefit.
      Below 30 min, switch to a different archetype.

      '
  equipment_limited:
    substitutions:
    - missing_equipment: ruck_pack
      substitute_approach: Use a backpack loaded with books, water bottles, or sandbag
        filler. Purpose-built ruck packs are preferred for weight distribution but
        any sturdy pack works.
