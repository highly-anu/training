id: horsemen_power_endurance
name: Horsemen Power Endurance (Run + TGU + Loaded Movement)
modality: strength_endurance
category: gpp_durability
duration_estimate_minutes: 55
required_equipment:
- kettlebell
- open_space
applicable_phases:
- build
- peak
- maintenance
- specific
sources:
- Horsemen
notes: >
  Models part 1 of the source's power-endurance workout "Palin in 2012!":
  four descending rounds for time, each a 400 m run, then Turkish get-ups
  each hand at 35 lb (16 kg), then jumping lunges —
    round 1: run 400 m, 10 get-ups each hand, 40 jumping lunges (20 each leg)
    round 2: run 400 m, 7 get-ups each hand, 30 jumping lunges
    round 3: run 400 m, 5 get-ups each hand, 20 jumping lunges
    round 4: run 400 m, 3 get-ups each hand, 10 jumping lunges
  Part 2 — 10 rounds of 5 pull-ups, 10 dips and 15 push-ups, a grind not for
  time — is not encoded yet. The warm-up run and the cool-down are the app's.
  The source's power-endurance list also includes the Secret Service Snatch
  Test, an all-out 3-mile run, a 5K row, Tabata and EMOM workouts, and
  "Counting Dead Bodies" (5 lunges + 5 push presses holding a 45 lb bar or
  two 25 lb dumbbells, repeated for 400 m, 20-30 min); this archetype runs
  only the get-up and run ladder.
slots:
- role: warm_up_run
  slot_type: time_domain
  duration_sec: 600
  intensity: zone2
  exercise_filter:
    category: aerobic
  notes: 10-min easy run to warm up, with leg swings and shoulder rolls. The app's
    warm-up; the source opens training days with one from its warm-up list.
- role: run_interval
  slot_type: distance
  distance_m: 400
  intensity: max_effort
  exercise_filter:
    category: aerobic
  notes: 'Each round starts with a 400 m run (4 in all). The whole workout is for
    time, so run hard and go straight into the get-ups.

    '
- role: tgu_block
  slot_type: sets_reps
  sets: 4
  reps: 3-10
  intensity: moderate
  intensity_pct_1rm: 0.6
  rest_sec: 0
  exercise_filter:
    movement_pattern: tgu
    category: kettlebell
  notes: 'Turkish get-ups each hand, descending 10 / 7 / 5 / 3 across the four rounds,
    at 35 lb (16 kg) in the source. Straight from the get-ups into the jumping lunges.

    '
- role: lunge_block
  slot_type: sets_reps
  sets: 4
  reps: 10-40
  intensity: bodyweight
  rest_sec: 0
  notes: 'Jumping lunges, descending 40 / 30 / 20 / 10 (half each leg) to match the
    get-up rounds, bodyweight. Then the next round''s run.

    '
- role: cool_down
  slot_type: time_domain
  duration_sec: 300
  intensity: zone1
  notes: 5-min easy walk or jog and light stretching (the app's).
scaling:
  deload:
    volume_multiplier: 0.6
    intensity_pct: 0.9
    notes: App scaling; the source has no deload week. Run two rounds (10 and 7 get-ups
      each hand) and shorten the runs to 200 m.
  time_limited:
    drop_slots:
    - cool_down
    notes: App scaling. Drop the cool-down and run the first two rounds only.
  equipment_limited:
    substitutions:
    - missing_equipment: kettlebell
      substitute_approach: Dumbbell get-ups at a similar or slightly lighter weight
        (a dumbbell is harder to balance).
    - missing_equipment: open_space
      substitute_approach: Replace each 400 m run with a 500 m row or 2 min hard on
        a bike.
