id: horsemen_strength_block
name: Horsemen Strength Block (Month 1 Barbell)
modality: max_strength
category: strength
duration_estimate_minutes: 70
required_equipment:
- barbell
- plates
- rack
applicable_phases:
- base
- build
- specific
- maintenance
training_levels:
- intermediate
- advanced
- elite
sources:
- Horsemen
- Gym Jones
- Dan John
notes: >
  The source's strength days start by working up to a 1RM in the day's lift
  — front squat, deadlift, standing press, push press, squat clean and
  others — then work at percentages of it (for example 10 x 3 at 75% every
  40 seconds, or 5 x 3 at 85%), then two or three rounds of accessory work.
  Month 1 runs strength twice a week. This block's slots simplify that: a
  squat main lift at a fixed percentage, a press, a hinge accessory and a
  carry, with no daily 1RM slot yet, and the main lift is always a squat
  where the source's varies by workout. The bodyweight numbers the source
  names (deadlift 2.5x, front squat 1.5x, bench 1.5x, military press 1x) are
  the program's goals within four months.
slots:
- role: warm_up
  slot_type: time_domain
  duration_sec: 600
  intensity: light
  exercise_filter:
    category: mobility
  notes: >
    Mobility, then empty-bar and ramping warm-up sets of the main lift. The
    app's warm-up; the source opens training days with a loaded warm-up from
    its list.
- role: main_lift
  slot_type: sets_reps
  sets: 5
  reps: 3-5
  intensity: heavy
  intensity_pct_1rm: 0.85
  rest_sec: 180
  exercise_filter:
    movement_pattern: squat
    category: barbell
  notes: >
    Squat variant, 5 x 3-5 at about 85% of 1RM — the app's simplification. In
    the source the day's lift is worked up to a 1RM first, and the
    percentage work is read from that day's max.
- role: secondary_compound
  slot_type: sets_reps
  sets: 3
  reps: 5
  intensity: moderate
  intensity_pct_1rm: 0.75
  rest_sec: 150
  exercise_filter:
    movement_pattern: press
    category: barbell
  notes: >
    Press or bench, 3x5 at 70-78% (the app's). Alternate strict press and
    bench across the block; both carry a bodyweight goal in the source.
- role: posterior_accessory
  slot_type: sets_reps
  sets: 3
  reps: 8
  intensity: moderate
  rest_sec: 90
  exercise_filter:
    movement_pattern: hinge
    category: barbell
  notes: Barbell row or a lighter hinge variant. Controlled, no body english.
- role: loaded_carry_finisher
  slot_type: distance
  distance_m: 40
  sets: 4
  intensity: heavy
  rest_sec: 90
  exercise_filter:
    movement_pattern: carry
  notes: >
    4 x 40 m heavy carry (the app's). Source strength days end with
    accessory rounds that often include a carry, crawl, sled or tire drag.
scaling:
  deload:
    volume_multiplier: 0.6
    intensity_pct: 0.85
    notes: >
      App scaling; the source has no deload week. Drop to 3 working sets on
      the main lift at 70-75%, keep the secondary compound at 2 sets, cut the
      carry finisher.
  time_limited:
    drop_slots:
    - posterior_accessory
    - loaded_carry_finisher
    notes: >
      Main lift and secondary compound are the session. Everything after them is
      accessory and comes off first.
  equipment_limited:
    substitutions:
    - missing_equipment: rack
      substitute_approach: >
        Deadlift and floor press instead of squat and bench — both start from the
        floor and need no rack.
    - missing_equipment: barbell
      substitute_approach: >
        Double-kettlebell front squat and press, or sandbag clean and press. Load
        is lower, so add a set and treat it as strength endurance rather than max
        strength for that week.
