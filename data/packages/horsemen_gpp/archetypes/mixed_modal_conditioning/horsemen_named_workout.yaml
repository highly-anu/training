id: horsemen_named_workout
name: Horsemen Named Workout (simplified)
modality: mixed_modal_conditioning
category: conditioning
duration_estimate_minutes: 45
required_equipment:
- barbell
- plates
- open_space
applicable_phases:
- build
- peak
- specific
- maintenance
- base
training_levels:
- intermediate
- advanced
- elite
sources:
- Horsemen
- Gym Jones
- CrossFit
notes: >
  A simplification: one for-time barbell piece stands in for the source's
  named workouts until they are encoded. The source lists about 120 named
  workouts, each a multi-part protocol, under its day categories. The three
  this archetype was once named after are not what it runs:
    - Curtis P is a complex, not a workout: hang squat clean -> forward lunge
      right -> forward lunge left -> push press, one rep, at a prescribed
      weight. The source uses it in several workouts at different doses
      (5 rounds of 5, 15-10-5 at 95 lb, 100 reps, 1-minute intervals at
      55 lb); it has no "50 reps for time" benchmark.
    - Riley Black is a max-strength loading method: 1-2-3 rep ladders on
      three bars at 95, 90 and 85% of 1RM, no rest inside a ladder, at least
      3 minutes between ladders, 18-30 reps in all.
    - Russian Aggression is a five-part strength workout: work up to a 1RM
      front squat; 10 rounds of 3 front squats at 75% every 40 seconds;
      5 rounds of deadlifts, a sled push and one-arm weighted sit-ups;
      3 rounds of elevated push-ups, a rope climb (or 10 pull-ups) and
      standing dumbbell presses; 3 rounds of 1-minute kettlebell swings.
  Riley Black and Russian Aggression sit in the source's strength section,
  not its conditioning.
slots:
- role: warm_up
  slot_type: time_domain
  duration_sec: 600
  intensity: light
  exercise_filter:
    category: mobility
  notes: >
    Thoracic and hip mobility, then two or three rounds of the workout's own
    movements at a light load. The source opens training days with a loaded
    warm-up from its list; this one is the app's.
- role: named_workout
  slot_type: for_time
  time_cap_sec: 1500
  intensity: max_effort
  exercise_filter:
    movement_pattern: olympic_lift
    category: barbell
  notes: >
    The scored piece, an app simplification of the source's named workouts:
    one Olympic barbell lift for time, picked by the selector. The rep
    target, load and 25-minute cap are the app's, not any named workout's.
    Record the time.
- role: cool_down
  slot_type: time_domain
  duration_sec: 420
  intensity: zone1
  exercise_filter:
    category: mobility
  notes: >
    7 min. Walk until breathing is back to normal before stretching. Front rack and
    hip flexor work — the lunge volume loads both hard.
scaling:
  deload:
    volume_multiplier: 0.5
    intensity_pct: 0.8
    notes: >
      App scaling; the source has no deload week. Halve the rep target and
      drop the load one step.
  time_limited:
    drop_slots:
    - cool_down
    notes: >
      Keep the warm-up and cut the rep target to fit the remaining budget.
      Note the reduced target alongside the time.
  equipment_limited:
    substitutions:
    - missing_equipment: barbell
      substitute_approach: >
        Sandbag or double-kettlebell version: clean -> lunge -> press for the same
        rep target. The time does not compare with the barbell version.
    - missing_equipment: open_space
      substitute_approach: >
        Replace walking lunges with reverse lunges in place. Same reps, no travel.
