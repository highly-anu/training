id: hm_tens
name: Tens
modality: mixed_modal_conditioning
category: conditioning
training_levels:
- intermediate
- advanced
- elite
pool_only: true
duration_estimate_minutes: 60
slots:
- role: hang_cleans
  slot_type: sets_reps
  sets: 10
  reps: 10
  exercise_filter:
    exercise_ids:
    - hang_power_clean
    ordered: true
  load: 61 kg (135 lb)
  notes: >-
    Accumulating: exercise 1 and 1 sprint, then exercises 1-2 and 2 sprints, then 1-3 and 3 sprints, and
    so on to all ten and 10 sprints — so hang cleans come 10 times and back extensions once. 10 reps of
    each exercise every time.
- role: squats
  slot_type: sets_reps
  sets: 9
  reps: 10
  exercise_filter:
    exercise_ids:
    - back_squat
    ordered: true
  load: 61 kg (135 lb)
- role: plyo_jump_repeats
  slot_type: sets_reps
  sets: 8
  reps: 10
  exercise_filter:
    exercise_ids:
    - plyo_jump_repeat
    ordered: true
  notes: Onto a 30 in (76 cm) box.
- role: plyo_push_ups
  slot_type: sets_reps
  sets: 7
  reps: 10
  exercise_filter:
    exercise_ids:
    - plyo_push_up_box
    ordered: true
  notes: Off a 12 in (30 cm) box.
- role: one_arm_rows
  slot_type: sets_reps
  sets: 6
  reps: 10
  exercise_filter:
    exercise_ids:
    - db_row_single_arm
    ordered: true
  load: 23 kg (50 lb)
- role: bent_over_lateral_raises
  slot_type: sets_reps
  sets: 5
  reps: 10
  exercise_filter:
    exercise_ids:
    - db_bent_over_lateral_raise
    ordered: true
  load: 11 kg (25 lb)
- role: dips
  slot_type: sets_reps
  sets: 4
  reps: 10
  exercise_filter:
    exercise_ids:
    - dip
    ordered: true
  load: bodyweight
- role: med_ball_throws
  slot_type: sets_reps
  sets: 3
  reps: 10
  exercise_filter:
    exercise_ids:
    - med_ball_underhand_throw
    ordered: true
  load: 14 kg (30 lb)
  notes: Underhand throws.
- role: ab_wheel
  slot_type: sets_reps
  sets: 2
  reps: 10
  exercise_filter:
    exercise_ids:
    - ab_wheel
    ordered: true
- role: back_extensions
  slot_type: sets_reps
  sets: 1
  reps: 10
  exercise_filter:
    exercise_ids:
    - back_extension
    ordered: true
- role: sprints
  slot_type: sets_reps
  sets: 55
  reps: 1
  intensity: max_effort
  exercise_filter:
    exercise_ids:
    - run_sprint
    ordered: true
  notes: >-
    Sprints: 1, then 2, ... then 10 after each pass (55 in all). The source gives no sprint distance.
required_equipment:
- barbell
- rack
- plates
- dumbbell
- parallettes
- medicine_ball
- box
- ghd
- open_space
sources:
- Horsemen
- API (Athletic Performance Inc)
notes: >-
  An API workout tagged MS in the source: ten exercises of 10 reps, accumulating one exercise and one
  more sprint each pass, 55 sprints in all. The source does not say for time or give the sprint distance.
  Where the source gives no load the weight is the athlete's call, by its weight-loading rule.
