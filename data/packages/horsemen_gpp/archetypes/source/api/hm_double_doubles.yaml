required_equipment:
- kettlebell
- tire
- rope
- box
- jump_rope
- open_space
- cable_machine
sources:
- Horsemen
- API (Athletic Performance Inc)
notes: >-
  An API station workout tagged ME/CE in the source, "done for time @ 2 min per station": ten stations
  of double-unders with nine others between them. Without a rope to climb, 10 pull-ups stand in for the
  climb (the source's substitute); the rope pull-ups still need a rope. Where the source gives no load
  the weight is the athlete's call, by its weight-loading rule.
