id: hm_bannister
name: Bannister
modality: mixed_modal_conditioning
category: conditioning
training_levels:
- intermediate
- advanced
- elite
pool_only: true
duration_estimate_minutes: 45
slots:
- role: one_arm_deadlifts
  slot_type: sets_reps
  sets: 1
  reps: 100
  exercise_filter:
    exercise_ids:
    - single_arm_deadlift
    ordered: true
  load: 61 kg (135 lb)
  notes: >-
    50 each arm. In order, each set followed by a 270-yard run: 100 one-arm deadlifts, 50 close-grip bench,
    20 tire flips, 40 push presses, 25 hurdle over/unders, 50 bent-over rows, 2 lengths of cable crawl.
