pool_only: true
duration_estimate_minutes: 60
slots:
- role: chest_press
  slot_type: sets_reps
  sets: 2
  reps: 50
  exercise_filter:
    exercise_ids:
    - bench_press
    ordered: true
  load: 20 kg (45 lb) bar
  notes: >-
    2 rounds, in order: 50 chest press, 50 bent-over rows, run 0.2 mi, 50 overhead squats, 50 shoulder
    press, run, 50 front squats, 50 RDLs, run, 50 standing twists, 50 good mornings, run, 50 snatches,
    50 back squats, run — 1,000 reps with the empty bar. Not for time.
