sources:
- Horsemen
- API (Athletic Performance Inc)
notes: >-
  An API station workout tagged ME/CE in the source: ten stations of two minutes, jump rope between every
  one, then gorilla drills. The source gives the station length only in its name and gives no loads except
  the get-up's 35 lb. Where the source gives no load the weight is the athlete's call, by its weight-loading
  rule.
