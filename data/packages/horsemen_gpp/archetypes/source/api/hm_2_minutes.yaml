id: hm_2_minutes
name: 2 Minutes
modality: mixed_modal_conditioning
category: conditioning
training_levels:
- intermediate
- advanced
- elite
pool_only: true
duration_estimate_minutes: 45
slots:
- role: jump_rope_1
  slot_type: time_domain
  duration_sec: 120
  exercise_filter:
    exercise_ids:
    - jump_rope_single_under
    ordered: true
  notes: >-
    Two minutes per station, in order, jump rope between every station: rope, cable crawl, rope, chop
    station, rope, punches, rope, tire flips, rope, med ball throw, rope, over/unders, rope, squat jumps,
    rope, get-ups, rope, plyo push-ups, rope, lateral hops, then gorilla drills. The source gives the
    two minutes only in the name.
- role: cable_crawl
  slot_type: time_domain
  duration_sec: 120
  exercise_filter:
    exercise_ids:
    - horizontal_cable_crawl
    ordered: true
  notes: Horizontal cable crawl.
