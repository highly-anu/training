id: hm_horses_tail
name: "Horse's Tail"
modality: mixed_modal_conditioning
category: conditioning
training_levels: [intermediate, advanced, elite]
duration_estimate_minutes: 15
pool_only: true

slots:
  - role: deadlifts
    slot_type: rounds_for_time
    reps_per_round: 30
    rounds: 3
    duration_sec: 720
    intensity: max_effort
    load: "1.25x bodyweight"
    exercise_filter:
      exercise_ids: [deadlift]
      ordered: true
    notes: >
      30-20-10 reps of each: deadlifts at 125% of bodyweight, then handstand push-ups.

  - role: hspu
    slot_type: amrap_movement
    reps_per_round: 30
    parent_slot_role: deadlifts
    exercise_filter:
      exercise_ids: [handstand_push_up]
      ordered: true
    notes: >
      30, 20 and 10 handstand push-ups after each set of deadlifts.

required_equipment:
  - barbell
  - plates
sources:
  - Horsemen
notes: >
  30-20-10 deadlifts at 125% of bodyweight and handstand push-ups. The source writes only the
  rep scheme, no clock. Source name cleaned of profanity.
