id: hm_annie
name: "Annie"
modality: mixed_modal_conditioning
category: conditioning
training_levels: [intermediate, advanced, elite]
duration_estimate_minutes: 12
pool_only: true

slots:
  - role: double_unders
    slot_type: rounds_for_time
    reps_per_round: 50
    rounds: 5
    duration_sec: 600
    intensity: max_effort
    exercise_filter:
      exercise_ids: [jump_rope_double_under]
      ordered: true
    notes: >
      50-40-30-20-10 reps of each: double-unders, then sit-ups.

  - role: sit_ups
    slot_type: amrap_movement
    reps_per_round: 50
    parent_slot_role: double_unders
    exercise_filter:
      exercise_ids: [sit_up]
      ordered: true
    notes: >
      50, 40, 30, 20 and 10 sit-ups after each set of double-unders.

required_equipment:
  - jump_rope
sources:
  - Horsemen
  - CrossFit
notes: >
  CrossFit's Annie as the source writes it: 50-40-30-20-10 double-unders and sit-ups. The source
  writes only the rep scheme; it is run for time, as CrossFit runs it.
