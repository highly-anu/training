id: hm_elizabeth
name: "Elizabeth"
modality: mixed_modal_conditioning
category: conditioning
training_levels: [intermediate, advanced, elite]
duration_estimate_minutes: 12
pool_only: true

slots:
  - role: cleans
    slot_type: rounds_for_time
    rep_scheme: [21, 15, 9]
    rounds: 3
    duration_sec: 720
    intensity: max_effort
    load: "61 kg (135 lb)"
    exercise_filter:
      exercise_ids: [squat_clean]
      ordered: true
    notes: >
      21-15-9 reps of each, for time: 21 cleans, 21 ring dips, 15 and 15, 9 and 9. The source
      writes "Clean".

  - role: ring_dips
    slot_type: amrap_movement
    rep_scheme: [21, 15, 9]
    parent_slot_role: cleans
    exercise_filter:
      exercise_ids: [ring_dip]
      ordered: true
    notes: >
      21, 15 and 9 ring dips after each set of cleans.

required_equipment:
  - barbell
  - plates
  - rings
sources:
  - Horsemen
  - CrossFit
notes: >
  CrossFit's Elizabeth as the source writes it: 21-15-9 cleans at 135 lb and ring dips. The
  source writes only the rep scheme; it is run for time, as CrossFit runs it.
