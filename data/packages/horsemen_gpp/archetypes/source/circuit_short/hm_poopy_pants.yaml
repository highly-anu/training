id: hm_poopy_pants
name: "Poopy Pants"
modality: mixed_modal_conditioning
category: conditioning
training_levels: [intermediate, advanced, elite]
duration_estimate_minutes: 32
pool_only: true

slots:
  - role: thrusters
    slot_type: rounds_for_time
    rounds: 3
    duration_sec: 480
    intensity: max_effort
    exercise_filter:
      exercise_ids: [thruster]
      ordered: true
    notes: >
      Part 1: 21-15-9 reps of each, thrusters then kipping pull-ups. Then 5 min rest.

  - role: kipping_pull_ups
    slot_type: amrap_movement
    reps_per_round: 21
    parent_slot_role: thrusters
    exercise_filter:
      exercise_ids: [kipping_pull_up]
      ordered: true
    notes: >
      21, 15 and 9 kipping pull-ups after each set of thrusters.

  - role: deadlifts
    slot_type: rounds_for_time
    rounds: 3
    duration_sec: 600
    intensity: max_effort
    exercise_filter:
      exercise_ids: [deadlift]
      ordered: true
    notes: >
      Part 2, after the 5 min rest: 30-20-10 reps of each, deadlifts then push presses. Then 5
      min rest.

  - role: push_presses
    slot_type: amrap_movement
    reps_per_round: 30
    parent_slot_role: deadlifts
    exercise_filter:
      exercise_ids: [push_press]
      ordered: true
    notes: >
      30, 20 and 10 push presses after each set of deadlifts.

  - role: jingle_jangles
    slot_type: emom
    sets: 5
    work_sec: 30
    rest_sec: 30
    exercise_filter:
      exercise_ids: [jingle_jangles]
      ordered: true
    notes: >
      Part 3, after the second 5 min rest: 5 rounds of 30 s jingle jangles (5-yard sprint back
      and forth between two cones, touching the ground at each), 30 s rest.

required_equipment:
  - barbell
  - open_space
  - plates
  - pull_up_bar
  - rack
sources:
  - Horsemen
notes: >
  Three parts with 5 minutes' rest between them: 21-15-9 thrusters and kipping pull-ups,
  30-20-10 deadlifts and push presses, then 5 rounds of 30 s jingle jangles and 30 s rest. The
  source writes only the rep schemes, no clock. Where the source gives no load it is the
  athlete's choice (its Weight Loading rule).
