id: hm_secret_service_snatch_test
name: Secret Service Snatch Test
modality: mixed_modal_conditioning
category: conditioning
training_levels:
- intermediate
- advanced
- elite
pool_only: true
duration_estimate_minutes: 10
slots:
- role: snatches_10_min
  slot_type: time_domain
  duration_sec: 600
  intensity: max_effort
  exercise_filter:
    exercise_ids:
    - kb_snatch
    - db_snatch
    ordered: true
  load: 24 kg (53 lb)
  notes: >-
    As many snatches as possible in 10 min, switching hands as you like. "Official" (Gentlemen's) rules:
    the bell may be set down to rest. "Tier One" rules: it may not be set down, one transfer swing to
    change hands, and any rest is taken with the bell locked out overhead. Score: 100 lethargic, 150 good
    (Team Guy standard), 200 really good, 250 ridiculous, 275 record.
required_equipment: []
sources:
- Horsemen
notes: >-
  The SSST: as many kettlebell snatches as possible in 10 minutes, men with the 53 lb bell, scored by
  total reps under Official or Tier One rules (100 lethargic to 275 record). The source's program goal
  is a score of at least 200. By the source's rule a dumbbell may stand in for the kettlebell.
