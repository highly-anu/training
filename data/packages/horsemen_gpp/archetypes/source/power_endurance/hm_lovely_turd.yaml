id: hm_lovely_turd
name: Lovely Turd
modality: mixed_modal_conditioning
category: conditioning
training_levels:
- intermediate
- advanced
- elite
pool_only: true
duration_estimate_minutes: 50
slots:
- role: hang_squat_cleans
  slot_type: sets_reps
  sets: 5
  reps: 5
  rest_sec: 60
  exercise_filter:
    exercise_ids:
    - hang_squat_clean
    ordered: true
  notes: 'Block 1, 5 rounds: 5 hang squat cleans, 5 push presses, 5 box jumps, 1 min rest.'
- role: push_presses
  slot_type: sets_reps
  sets: 5
  reps: 5
  exercise_filter:
    exercise_ids:
    - push_press
    ordered: true
- role: box_jumps
  slot_type: sets_reps
  sets: 5
  reps: 5
  exercise_filter:
    exercise_ids:
    - box_jump
    ordered: true
- role: bench_presses
  slot_type: sets_reps
  sets: 5
  reps: 5
  rest_sec: 60
  exercise_filter:
    exercise_ids:
    - bench_press
    ordered: true
  notes: 'Block 2, 5 rounds: 5 bench presses, 5 dips, 5 plyo push-ups, 1 min rest.'
- role: dips
  slot_type: sets_reps
  sets: 5
  reps: 5
  exercise_filter:
    exercise_ids:
    - dip
    ordered: true
  load: bodyweight
- role: plyo_push_ups
  slot_type: sets_reps
  sets: 5
  reps: 5
  exercise_filter:
    exercise_ids:
    - push_up_clapping
    ordered: true
  load: bodyweight
- role: sandbag_squat_jumps
  slot_type: sets_reps
  sets: 5
  reps: 5
  rest_sec: 60
  exercise_filter:
    exercise_ids:
    - sb_squat_jump
    ordered: true
  notes: 'Block 3, 5 rounds: 5 sandbag squat jumps, 5 heavy swings, 1 sled push, 1 min rest.'
- role: heavy_swings
  slot_type: sets_reps
  sets: 5
  reps: 5
  exercise_filter:
    exercise_ids:
    - kb_swing_two_hand
    ordered: true
  load: heavy
- role: sled_push
  slot_type: sets_reps
  sets: 5
  reps: 1
  exercise_filter:
    exercise_ids:
    - sled_push
    - jingle_jangles
    ordered: true
  notes: >-
    1 sled push a round; the source gives no distance. Without a sled, 40 s of jingle jangles instead.
- role: sprints
  slot_type: sets_reps
  sets: 5
  reps: 5
  exercise_filter:
    exercise_ids:
    - run_sprint
    ordered: true
  notes: >-
    Block 4, 5 rounds: 5 sprints, 5 heavy goblet squats, 10 jumping lunges. The source gives no sprint
    distance and no rest line for this block.
- role: goblet_squats
  slot_type: sets_reps
  sets: 5
  reps: 5
  exercise_filter:
    exercise_ids:
    - kb_squat_goblet
    ordered: true
  load: heavy
- role: jumping_lunges
  slot_type: sets_reps
  sets: 5
  reps: 10
  exercise_filter:
    exercise_ids:
    - lunge_jumping
    ordered: true
  load: bodyweight
  notes: 5 each leg.
required_equipment:
- barbell
- rack
- plates
- box
- parallettes
- sandbag
- kettlebell
- open_space
sources:
- Horsemen
notes: >-
  Four blocks of 5 rounds with a minute between rounds: hang squat clean, push press and box jump; bench,
  dips and plyo push-ups; sandbag squat jumps, heavy swings and a sled push (40 s of jingle jangles without
  a sled); sprints, heavy goblet squats and jumping lunges. Where no load is written it is the athlete's
  call, by the source's weight-loading rule.
