notes: >-
  One of the source's hard job-specific workouts: eight bodyweight sets descending 50-40-30-20, each followed
  by a 250 m row under 50 to 60 seconds, then four pairs of bodyweight movements. The rows carry the source's
  time targets; the source does not say the whole is for time or give rests.
