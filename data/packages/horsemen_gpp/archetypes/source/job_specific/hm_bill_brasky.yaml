    ordered: true
  notes: >-
    In order, each set followed by a 250 m row under the time given: 50 pull-ups, 40 knees to elbows,
    30 windshield wipers, 20 ankles to bar, 50 air squats, 40 jumping lunges, 30 frog hops, 20 jumping
    squats; then four pairs without rows.
