sources:
- Horsemen
notes: >-
  One of the source's hard job-specific workouts: a long chipper of nineteen movements climbing from 10
  to 100 reps and back to 10, with a 500 m row under 1:55 at either end of the middle. The sledgehammer
  strikes may be mountain climbers instead (the source's "pick one"). The source does not say for time.
  Where the source gives no load the weight is the athlete's call, by its weight-loading rule.
