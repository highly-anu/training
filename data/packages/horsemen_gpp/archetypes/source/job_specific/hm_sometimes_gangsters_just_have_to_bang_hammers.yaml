  slot_type: sets_reps
  sets: 1
  reps: 10
  exercise_filter:
    exercise_ids:
    - pull_up
    ordered: true
  notes: >-
    A chipper, in order, each movement finished before the next: 10 up to 100 and back down to 10. The
    source does not say for time.
