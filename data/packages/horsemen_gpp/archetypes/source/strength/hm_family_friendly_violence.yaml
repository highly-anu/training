id: hm_family_friendly_violence
name: Family Friendly Violence
modality: max_strength
category: strength
training_levels: [intermediate, advanced, elite]
pool_only: true
duration_estimate_minutes: 55
slots:
- role: deadlift
  slot_type: sets_reps
  sets: 7
  reps: 5
  exercise_filter:
    exercise_ids: [deadlift]
    ordered: true
  notes: '7 rounds, alternating: 5 deadlifts (increase the weight each round), 3 Turkish get-ups, 5 ankles to bar
    — not for time.'
- role: turkish_get_up
  slot_type: sets_reps
  sets: 7
  reps: 3
  exercise_filter:
    exercise_ids: [kb_tgu]
    ordered: true
  load: 16 kg (35 lb)
- role: ankles_to_bar
  slot_type: sets_reps
  sets: 7
  reps: 5
  exercise_filter:
    exercise_ids: [ankles_to_bar]
    ordered: true
- role: hang_squat_clean
  slot_type: sets_reps
  sets: 5
  reps: 8
  exercise_filter:
    exercise_ids: [hang_squat_clean]
    ordered: true
  load: 75 kg (165 lb)
  notes: '5 rounds, alternating: 8 hang squat cleans, 30 m tire drag, 10 m dumbbell crawl — not for time.'
- role: tire_drag
  slot_type: distance
  distance_m: 30
  sets: 5
  exercise_filter:
    exercise_ids: [tire_drag_forward]
    ordered: true
- role: db_crawl
  slot_type: distance
  distance_m: 10
  sets: 5
  exercise_filter:
    exercise_ids: [db_crawl]
    ordered: true
  load: 2 x 25 kg (2 x 55 lb)
- role: pull_up
  slot_type: sets_reps
  sets: 10
  reps: 5
  exercise_filter:
    exercise_ids: [pull_up]
    ordered: true
  notes: '10 rounds, alternating: 5 pull-ups, 10 dips, 15 push-ups — not for time.'
- role: dip
  slot_type: sets_reps
  sets: 10
  reps: 10
  exercise_filter:
    exercise_ids: [dip]
    ordered: true
- role: push_up
  slot_type: sets_reps
  sets: 10
  reps: 15
  exercise_filter:
    exercise_ids: [push_up]
    ordered: true
required_equipment: [barbell, plates, kettlebell, pull_up_bar, tire, open_space, dumbbell, parallettes]
sources: [Horsemen]
notes: Seven rounds of deadlifts (heavier each round), Turkish get-ups and ankles to bar, 5 rounds of hang squat
  cleans at 75 kg (165 lb), tire drags and dumbbell crawls, and 10 rounds of pull-ups, dips and push-ups. The source
  does not time it. Where no load is given, the source leaves it to the athlete (its Weight Loading rule).
