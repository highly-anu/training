id: hm_the_cog
name: "The Cog"
modality: mixed_modal_conditioning
category: conditioning
training_levels: [novice, intermediate, advanced, elite]
# Written for the operator (the track's authored level); the levels below do it scaled.
scaling_eligible: true
duration_estimate_minutes: 12
pool_only: true

slots:
  - role: row
    slot_type: distance
    sets: 3
    distance_m: 250
    exercise_filter:
      exercise_ids: [row_erg]
      ordered: true
    notes: >
      3 rounds, alternating: row 250 m, 10 deadlifts, 12 dumbbell thrusters — the source gives
      no clock.

  - role: deadlifts
    slot_type: sets_reps
    sets: 3
    reps: 10
    load: "1.25x bodyweight"
    exercise_filter:
      exercise_ids: [deadlift]
      ordered: true

  - role: db_thrusters
    slot_type: sets_reps
    sets: 3
    reps: 12
    load: "2 x 11 kg (2 x 25 lb)"
    load_kg: 11
    exercise_filter:
      exercise_ids: [db_thruster]
      ordered: true

required_equipment:
  - barbell
  - dumbbell
  - plates
  - rower
sources:
  - Horsemen
notes: >
  Three rounds of a 250 m row, 10 deadlifts at 125% of bodyweight and 12 thrusters with two 25
  lb dumbbells; the source says neither for time nor how to rest.
