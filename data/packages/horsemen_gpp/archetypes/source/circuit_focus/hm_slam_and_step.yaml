id: hm_slam_and_step
name: "Slam and Step"
modality: mixed_modal_conditioning
category: conditioning
training_levels: [novice, intermediate, advanced, elite]
# Written for the operator (the track's authored level); the levels below do it scaled.
scaling_eligible: true
duration_estimate_minutes: 12
pool_only: true

slots:
  - role: ball_slams
    slot_type: rounds_for_time
    rep_scheme: [30, 20, 10]
    rounds: 3
    duration_sec: 600
    intensity: max_effort
    load: "11 kg (25 lb)"
    load_kg: 11
    exercise_filter:
      exercise_ids: [ball_slam]
      ordered: true
    notes: >
      30-20-10 reps of each: ball slams, then kettlebell step-ups.

  - role: kb_step_ups
    slot_type: amrap_movement
    rep_scheme: [30, 20, 10]
    parent_slot_role: ball_slams
    load: "2 x 16 kg (2 x 35 lb)"
    load_kg: 16
    exercise_filter:
      exercise_ids: [kb_step_up_double]
      ordered: true
    notes: >
      30, 20 and 10 step-ups onto a 20 in (51 cm) box holding two kettlebells.

required_equipment:
  - box
  - kettlebell
  - medicine_ball
sources:
  - Horsemen
notes: >
  30-20-10 ball slams at 25 lb and step-ups onto a 20 in box with two 35 lb kettlebells. The
  source writes only the rep scheme, no clock. Source name cleaned of profanity.
