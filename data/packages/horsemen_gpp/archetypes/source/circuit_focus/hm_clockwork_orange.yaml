id: hm_clockwork_orange
name: "Clockwork Orange"
modality: mixed_modal_conditioning
category: conditioning
training_levels: [intermediate, advanced, elite]
duration_estimate_minutes: 12
pool_only: true

slots:
  - role: overhead_squats
    slot_type: rounds_for_time
    reps_per_round: 30
    rounds: 3
    duration_sec: 720
    intensity: max_effort
    load: "35% of bodyweight"
    exercise_filter:
      exercise_ids: [overhead_squat]
      ordered: true
    notes: >
      30-20-10 reps of each: overhead squats, then ring push-ups.

  - role: ring_push_ups
    slot_type: amrap_movement
    reps_per_round: 30
    parent_slot_role: overhead_squats
    exercise_filter:
      exercise_ids: [push_up_ring]
      ordered: true
    notes: >
      30, 20 and 10 ring push-ups with the feet higher than the hands.

required_equipment:
  - barbell
  - plates
  - rings
sources:
  - Horsemen
notes: >
  30-20-10 overhead squats at 35% of bodyweight and feet-up ring push-ups. The source writes
  only the rep scheme, no clock.
