  slot_type: amrap_movement
  parent_slot_role: till_u_collapse
  reps_per_round: 25
  exercise_filter:
    exercise_ids: [ghd_sit_up]
    ordered: true
- role: row_250m
  slot_type: amrap_movement
  parent_slot_role: till_u_collapse
  distance_m: 250
  exercise_filter:
    exercise_ids: [row_erg]
    ordered: true
  notes: Row 250 m to finish (metres, not reps).
required_equipment: [barbell, rack, plates, pull_up_bar, kettlebell, medicine_ball, rower, tire, ghd]
sources: [Horsemen]
notes: A long chipper of thirteen movements, from 50 power cleans at 43 kg (95 lb) to a 250 m row, each finished
  before the next. The 25 calories may be rowed or ridden on an air bike. Where no load is given, the source leaves
  it to the athlete (its Weight Loading rule).
