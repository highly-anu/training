id: kb_antiglycolic_session
name: KB Anti-Glycolytic Practice (StrongFirst)
modality: aerobic_base
category: kettlebell
training_levels:
- novice
- intermediate
- advanced
- elite
duration_estimate_minutes: 40
applicable_phases:
- base
- maintenance
- transition
- build
- peak
slots:
# Short sets, each rest ending once the heart rate is back under ~130 bpm (68 %
# of a 190 max; the server sends the athlete's own number), capped at 90 s:
# at most 35 minutes, as the notes have it.
- role: main
  slot_type: emom
  sets: 20
  work_sec: 15
  rest_sec: 90
  rest_until_hr_pct: 68
  intensity: zone2
  exercise_filter:
    category: kettlebell
    movement_pattern: ballistic
required_equipment:
- kettlebell
sources:
- Pavel (StrongFirst)
notes: 'Anti-glycolytic KB session popularised by Pavel (StrongFirst); no Wildman program
  prescribes it, and Pentathlon Prep does not schedule it (kettlebell sport needs its glycolytic
  capacity — Girevoy Sport Science). Short
  timed sets (10–20 sec) of swings or snatches alternate with full rest until HR returns
  below ~130 bpm. Total session volume accumulates over 30–40 min; the glycolytic
  system is never taxed. Builds aerobic base and repeatable work capacity without
  accumulated fatigue or soreness. Breathing must remain nasal throughout — if mouth-breathing
  is required, the set was too long or the bell too heavy. This is not cardio: it
  is high-quality ballistic repetitions performed aerobically.

  '
