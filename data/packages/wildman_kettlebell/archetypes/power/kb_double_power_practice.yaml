id: kb_double_power_practice
name: Double-Bell Jerk Technique
modality: power
category: kettlebell
training_levels:
- intermediate
- advanced
- elite
duration_estimate_minutes: 45
applicable_phases:
- base
- build
- maintenance
slots:
- role: prep
  slot_type: skill_practice
  duration_minutes: 3
  intensity: moderate
  exercise_filter:
    exercise_ids:
    - kb_deadlift
  notes: ''
- role: jerk
  slot_type: skill_practice
  duration_minutes: 6
  intensity: moderate
  exercise_filter:
    exercise_ids:
    - kb_jerk_double
  notes: 'App adaptation: brief sets of already-proficient double jerks, resting fully between sets. This
    six-minute window is not a continuous jerk set and is not an IKMF pentathlon event.'
required_equipment:
- kettlebell
sources:
- Wildman
notes: 'App adaptation of Wildman movement families and nonconsecutive Tetris scheduling; not a reproduction
  of a purchased Wildman program. Repeat these fixed modules twice weekly. Calendar time never grants
  proficiency or a heavier bell. Requires two matching controllable bells and proficiency in every double-bell
  lift. Selected weight is per bell. The jerk technique module is an app-authored extension, not an official
  Wildman cycle. '
