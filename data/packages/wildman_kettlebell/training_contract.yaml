version: 1
sources:
- https://www.wildmanathletica.com/programming
- https://s3.amazonaws.com/kajabi-storefronts-production/sites/2147529643/themes/2148964886/downloads/wm1OoAfESN6SsE7bdmR9_NerdMath_SwingProgram_211011_r1.4.pdf
- https://programs.wildmanathletica.com/kettlebell-programs
- https://programs.wildmanathletica.com/snatch
- https://programs.wildmanathletica.com/tgu
- https://programs.wildmanathletica.com/blog/the-benefits-of-double-kettlebell-training
- https://www.youtube.com/watch?v=LpFZMjh80nM
- https://ikmf-world.com/disciplines/ikmf-pentathlon
- https://www.razebells.com/post/valery-fedorenko-gave-us-gold
- https://kettlebellnation.com/the-kettlebell-pentathalon/
- http://www.giryagarage.com/powerbyparker/2022/8/10/kettlebell-sport-training-styles
- https://breakingmuscle.com/a-12-week-gpp-programme-for-kettlebell-sport-athletes/
- https://www.gsscience.com.au/anti-glycolytic-musings-part-1/
tracks:
  general_practice:
    training_levels:
    - novice
    - intermediate
    - advanced
    - elite
    level_seeds:
      intermediate:
      - wk_kb_clean_single
      - wk_kb_press_single
      advanced:
      - wk_kb_clean_single
      - wk_kb_press_single
      elite:
      - wk_kb_clean_single
      - wk_kb_press_single
    notes: 'Repeated single-bell practice in independently progressing modules. Complete the repetitions
      at the start of each minute and rest for the remainder. Advance only after clean completion at RPE
      7 or below. Future exposures are conditional forecasts, not earned progress. Keep the chosen bell
      throughout the cycle; choosing a heavier bell starts a new cycle explicitly. No snatch, jerk or
      double-bell progression is inferred from the calendar. 

      '
    modules:
    - id: swing
      name: Nerd Math Two-Hand Swing
      archetype_id: kb_ballistic_session
      modality: power
      training_levels:
      - novice
      - intermediate
      - advanced
      - elite
      exposures_per_week: 2
      min_spacing_days: 2
      max_rpe: 7
      deload_keep: 0.5
      # Nerd Math PDF, "Tracking your progress": repeat workouts after more than
      # a week away. Recommended, not enforced (owner, 2026-10-21): the athlete
      # decides and takes responsibility; the cursor never reads the calendar.
      advice: Away more than a week? Wildman repeats the last workouts before moving on — repeat them if you need to; the program carries on either way.
      # The Nerd Math swing program's four approaches, in its order: 6 to 20
      # swings a minute (two more each session) over a 10-minute EMOM, then a
      # 20-minute one, then start/stop swings in ten and twenty 90-second
      # rounds. Sixteen weeks at two sessions a week, then a heavier bell.
      progression:
        model: density_cycle
        reps_start: 6
        reps_step: 2
        reps_max: 20
        rounds:
        - 10
        - 20
        - 10
        - 20
        interval_sec:
        - 60
        - 60
        - 90
        - 90
        cues:
        - null
        - null
        - 'Start/stop: park the bell on the floor between every rep.'
        - 'Start/stop: park the bell on the floor between every rep.'
      blocks:
      - role: prep
        exercise_id: kb_deadlift
        slot_type: skill_practice
        duration_sec: 180
        notes: Rehearse the hinge with a controllable bell; this is preparation, not a load test.
      - role: main
        exercise_id: wk_kb_swing_two_hand
        slot_type: emom
        loaded: true
        notes: Swings at the top of each minute (or round); rest for its remainder. Wildman's most
          common option alternates minutes of two-hand and hand-to-hand swings once both are clean.
          Stop if technique or breathing deteriorates.
      - role: recovery
        exercise_id: wk_kb_halo
        slot_type: skill_practice
        duration_sec: 120
        notes: Gentle unloaded or very light shoulder circles; omit external load if fatigued.
    - id: technique
      name: Hinge and Get-Up Technique
      archetype_id: kb_movement_skill_session
      modality: movement_skill
      training_levels:
      - novice
      exposures_per_week: 2
      min_spacing_days: 2
      max_rpe: 7
      deload_keep: 0.5
      progression:
        model: skill_hold
      blocks:
      - role: prep
        exercise_id: wk_kb_halo
        slot_type: skill_practice
        duration_sec: 180
      - role: hinge
        exercise_id: kb_deadlift
        slot_type: skill_practice
        duration_sec: 300
        notes: Low-fatigue hinge practice. No automatic weight increases.
      - role: getup
        exercise_id: wk_kb_tgu
        slot_type: skill_practice
        duration_sec: 360
        notes: Unloaded get-up positions, one side at a time. Use a shoe or no load until positions are
          controlled; calendar time never authorizes adding a bell.
    - id: clean_press
      name: Single-Bell Clean and Press Practice
      archetype_id: kb_clean_press_practice
      modality: movement_skill
      training_levels:
      - intermediate
      - advanced
      - elite
      exposures_per_week: 2
      min_spacing_days: 2
      max_rpe: 7
      requires_mastery:
      - wk_kb_clean_single
      - wk_kb_press_single
      deload_keep: 0.5
      progression:
        model: density_cycle
        reps_start: 1
        reps_step: 1
        reps_max: 5
        rounds:
        - 5
        - 10
      blocks:
      - role: prep
        exercise_id: wk_kb_halo
        slot_type: skill_practice
        duration_sec: 180
      - role: clean
        exercise_id: wk_kb_clean_single
        slot_type: emom
        loaded: true
        notes: 'Alternate hands each minute; perform clean repetitions, then rest for
          the remainder. Intermediate entry assumes a proficient single-bell clean.'
      - role: press
        exercise_id: wk_kb_press_single
        slot_type: emom
        loaded: true
        notes: 'Alternate hands each minute; strict presses, no push press or jerk. Repeat
          the same bell and movement throughout the cycle.'
    # Wildman's other Phase II programs, stacked into the week as the time
    # allows (Tetris of Training): each twice a week on nonconsecutive days,
    # beside the swing and clean-and-press days when the minutes fit.
    - id: getup
      name: Turkish Get-Up Practice
      archetype_id: kb_getup_mobility_practice
      modality: movement_skill
      training_levels:
      - intermediate
      - advanced
      - elite
      exposures_per_week: 2
      min_spacing_days: 2
      max_rpe: 7
      optional: true
      may_share_day: true
      deload_keep: 0.5
      progression:
        model: density_cycle
        reps_start: 1
        reps_step: 1
        reps_max: 1
        rounds:
        - 6
        - 8
        - 10
      blocks:
      - role: getup
        exercise_id: wk_kb_tgu
        slot_type: emom
        loaded: true
        notes: One get-up at the top of each minute, alternating sides, at a bell you control through
          every position.
    - id: deck_squat
      name: Deck Squat Practice
      archetype_id: kb_squat_practice
      modality: movement_skill
      training_levels:
      - novice
      - intermediate
      - advanced
      - elite
      exposures_per_week: 2
      min_spacing_days: 2
      max_rpe: 7
      optional: true
      may_share_day: true
      deload_keep: 0.5
      progression:
        model: density_cycle
        reps_start: 2
        reps_step: 1
        reps_max: 6
        rounds:
        - 10
        - 20
      blocks:
      - role: squat
        exercise_id: wk_deck_squat
        slot_type: emom
        progresses: true
        alternatives:
        - wk_kb_squat_goblet
        notes: 'Deck squats at the top of each minute: squat, roll back with the head off the floor,
          roll forward and stand. Bodyweight until a cycle is clean, then a light bell at the chest.'
    - id: snatch
      name: Nerd Math Snatch
      archetype_id: kb_snatch_practice
      modality: power
      training_levels:
      - intermediate
      - advanced
      - elite
      exposures_per_week: 2
      min_spacing_days: 2
      max_rpe: 7
      optional: true
      may_share_day: true
      when_mastered: true
      requires_mastery:
      - wk_kb_clean_single
      - wk_kb_press_single
      - wk_kb_snatch
      deload_keep: 0.5
      progression:
        model: density_cycle
        reps_start: 6
        reps_step: 2
        reps_max: 20
        rounds:
        - 10
        - 20
      blocks:
      - role: snatch
        exercise_id: wk_kb_snatch
        slot_type: emom
        loaded: true
        alternatives:
        - wk_kb_swing_single_arm
        notes: Alternate hands each minute. Wildman's snatch goal is 200 snatches in 10 minutes —
          the 10 x 20 that ends the first stage; then the same over 20 minutes. A heavier bell starts
          a new cycle. Joins after Clean and Press, as he advises.
  pentathlon:
    deload_phases:
    - competition
    training_levels:
    - intermediate
    - advanced
    - elite
    test_module: pentathlon_events
    notes: 'For the IKMF pentathlon (Fedorenko''s five events, six minutes each with
      five minutes between), built from kettlebell-sport practice; Wildman publishes no pentathlon
      program. Three event sessions a week: volume through all five events, building to the four-minute
      sets of a mini pentathlon at competition rest; repeats of three-minute sets slightly faster than
      planned competition pace; and minute intervals on the four fast events. A full practice pentathlon
      closes Timed Sets and the test closes Competition. Easy runs on free days are optional general
      preparation and never take a lifting day. Confirm mastery of the events first. Timed sets advance
      only after clean completion; RPM is a scoring ceiling, not an instruction to chase it.

      '
    modules:
    - id: pentathlon_events
      name: Pentathlon Event Volume
      archetype_id: kb_pentathlon_training
      modality: strength_endurance
      training_levels:
      - intermediate
      - advanced
      - elite
      exposures_per_week: 1
      min_spacing_days: 2
      max_rpe: 7
      requires_mastery:
      - wk_kb_clean_single
      - wk_kb_long_cycle_press
      - kb_jerk_single
      - wk_kb_half_snatch
      - wk_kb_push_press_single
      deload_keep: 0.6
      # Volume toward the full event, capped at the mini pentathlon's four
      # minutes (Kettlebell Nation: a predictor that can be tried more often);
      # six-minute sets are kept for the practice pentathlon and the test.
      progression:
        model: timed_cycle
        duration_start_sec: 180
        duration_step_sec: 60
        duration_max_sec: 240
      blocks:
      - role: prep
        exercise_id: kb_deadlift
        slot_type: skill_practice
        duration_sec: 300
      - role: clean
        exercise_id: wk_kb_clean_single
        slot_type: time_domain
        duration_sec: 180
        rest_after_sec: 300
        target_rpm: 20
        loaded: true
        notes: At the pace you plan to compete at; hand changes rehearsed, the bell never set down.
      - role: long_cycle_press
        exercise_id: wk_kb_long_cycle_press
        slot_type: time_domain
        duration_sec: 180
        rest_after_sec: 300
        target_rpm: 10
        loaded: true
      - role: jerk
        exercise_id: kb_jerk_single
        slot_type: time_domain
        duration_sec: 180
        rest_after_sec: 300
        target_rpm: 20
        loaded: true
      - role: half_snatch
        exercise_id: wk_kb_half_snatch
        slot_type: time_domain
        duration_sec: 180
        rest_after_sec: 300
        target_rpm: 18
        loaded: true
      - role: push_press
        exercise_id: wk_kb_push_press_single
        slot_type: time_domain
        duration_sec: 180
        target_rpm: 20
        loaded: true
      - role: recovery
        exercise_id: wk_kb_halo
        slot_type: skill_practice
        duration_sec: 300
    - id: pentathlon_repeats
      name: Pentathlon Event Repeats
      archetype_id: kb_pentathlon_repeats
      modality: strength_endurance
      training_levels:
      - intermediate
      - advanced
      - elite
      exposures_per_week: 1
      min_spacing_days: 2
      max_rpe: 8
      requires_mastery:
      - wk_kb_clean_single
      - wk_kb_long_cycle_press
      - kb_jerk_single
      - wk_kb_half_snatch
      - wk_kb_push_press_single
      deload_keep: 0.6
      # Kettlebell-sport repeats (Girya Garage): three-to-five-minute sets a
      # little faster than competition pace, resting the set plus one to two
      # minutes; five sets of three minutes, four minutes between.
      progression:
        model: timed_cycle
        duration_start_sec: 180
        duration_step_sec: 60
        duration_max_sec: 180
      blocks:
      - role: prep
        exercise_id: kb_deadlift
        slot_type: skill_practice
        duration_sec: 300
      - role: clean
        exercise_id: wk_kb_clean_single
        slot_type: time_domain
        duration_sec: 180
        rest_after_sec: 240
        target_rpm: 20
        loaded: true
        notes: A little faster than your planned competition pace, never above the scoring cap.
      - role: long_cycle_press
        exercise_id: wk_kb_long_cycle_press
        slot_type: time_domain
        duration_sec: 180
        rest_after_sec: 240
        target_rpm: 10
        loaded: true
      - role: jerk
        exercise_id: kb_jerk_single
        slot_type: time_domain
        duration_sec: 180
        rest_after_sec: 240
        target_rpm: 20
        loaded: true
      - role: half_snatch
        exercise_id: wk_kb_half_snatch
        slot_type: time_domain
        duration_sec: 180
        rest_after_sec: 240
        target_rpm: 18
        loaded: true
      - role: push_press
        exercise_id: wk_kb_push_press_single
        slot_type: time_domain
        duration_sec: 180
        target_rpm: 20
        loaded: true
      - role: recovery
        exercise_id: wk_kb_halo
        slot_type: skill_practice
        duration_sec: 180
    - id: pentathlon_intervals
      name: Pentathlon Minute Intervals
      archetype_id: kb_pentathlon_intervals
      modality: strength_endurance
      training_levels:
      - intermediate
      - advanced
      - elite
      exposures_per_week: 1
      min_spacing_days: 2
      max_rpe: 8
      requires_mastery:
      - wk_kb_clean_single
      - kb_jerk_single
      - wk_kb_half_snatch
      - wk_kb_push_press_single
      deload_keep: 0.5
      # Kettlebell-sport intervals (Girya Garage): short sets faster than
      # competition pace at about 1:1. Each minute: the reps at a quick pace
      # (about half the minute), then rest. The long cycle press, capped at 10
      # RPM, is trained by the volume and repeats sessions instead.
      progression:
        model: density_cycle
        reps_start: 6
        reps_step: 2
        reps_max: 10
        rounds:
        - 4
        - 6
      blocks:
      - role: prep
        exercise_id: kb_deadlift
        slot_type: skill_practice
        duration_sec: 300
      - role: clean
        exercise_id: wk_kb_clean_single
        slot_type: emom
        loaded: true
        notes: At the top of each minute, the reps faster than competition pace; rest for the remainder.
          Switch hands each minute.
      - role: jerk
        exercise_id: kb_jerk_single
        slot_type: emom
        loaded: true
      - role: half_snatch
        exercise_id: wk_kb_half_snatch
        slot_type: emom
        loaded: true
      - role: push_press
        exercise_id: wk_kb_push_press_single
        slot_type: emom
        loaded: true
      - role: recovery
        exercise_id: wk_kb_halo
        slot_type: skill_practice
        duration_sec: 180
    - id: easy_aerobic
      name: Easy Aerobic Run
      archetype_id: kb_pentathlon_aerobic
      modality: aerobic_base
      optional: true
      training_levels:
      - intermediate
      - advanced
      - elite
      exposures_per_week: 2
      min_spacing_days: 2
      max_rpe: 4
      deload_keep: 0.6
      # General preparation for kettlebell sport (Breaking Muscle, Clemente):
      # two easy steady runs a week on days without lifting, skippable when
      # time or energy is short; the sport lifts get the lion's share.
      progression:
        model: timed_cycle
        duration_start_sec: 1200
        duration_step_sec: 300
        duration_max_sec: 2400
      blocks:
      - role: run
        exercise_id: run_zone2
        slot_type: time_domain
        duration_sec: 1200
        progresses: true
        intensity: zone2
        notes: Easy and steady, able to talk throughout. Skip it before you skip an event session.
  squat_practice:
    training_levels: &id001
    - novice
    - intermediate
    - advanced
    - elite
    notes: 'Wildman movement families on nonconsecutive Tetris scheduling. Repeat these fixed modules twice weekly. Calendar time never grants
      proficiency or a heavier bell. '
    modules:
    - id: squat
      name: Deck Squat Practice
      archetype_id: kb_squat_practice
      modality: movement_skill
      training_levels: *id001
      exposures_per_week: 2
      min_spacing_days: 2
      max_rpe: 7
      deload_keep: 0.5
      requires_mastery: []
      progression:
        model: density_cycle
        reps_start: 2
        reps_step: 1
        reps_max: 6
        rounds:
        - 10
        - 20
      blocks:
      - role: squat
        exercise_id: wk_deck_squat
        slot_type: emom
        progresses: true
        alternatives:
        - wk_kb_squat_goblet
        notes: 'Deck squats at the top of each minute: squat, roll back with the head off the floor,
          roll forward and stand. Bodyweight until a cycle is clean, then a light bell at the chest.'
      - role: recovery
        exercise_id: wk_kb_halo
        slot_type: skill_practice
        duration_sec: 120
  snatch_practice:
    training_levels: &id002
    - intermediate
    - advanced
    - elite
    notes: 'Wildman movement families on nonconsecutive Tetris scheduling. Repeat these fixed modules twice weekly. Calendar time never grants
      proficiency or a heavier bell. '
    modules:
    - id: snatch
      name: Nerd Math Snatch
      archetype_id: kb_snatch_practice
      modality: power
      training_levels: *id002
      exposures_per_week: 2
      min_spacing_days: 2
      max_rpe: 7
      deload_keep: 0.5
      requires_mastery:
      - wk_kb_swing_single_arm
      - wk_kb_clean_single
      - wk_kb_snatch
      progression:
        model: density_cycle
        reps_start: 6
        reps_step: 2
        reps_max: 20
        rounds:
        - 10
        - 20
      blocks:
      - role: prep
        exercise_id: kb_deadlift
        slot_type: skill_practice
        duration_sec: 180
      - role: snatch
        exercise_id: wk_kb_snatch
        slot_type: emom
        loaded: true
        alternatives:
        - wk_kb_swing_single_arm
        notes: Alternate hands each minute. Wildman's snatch goal is 200 snatches in 10 minutes —
          the 10 x 20 that ends the first stage; then the same over 20 minutes. A heavier bell starts
          a new cycle.
      - role: recovery
        exercise_id: wk_kb_halo
        slot_type: skill_practice
        duration_sec: 120
  getup_mobility:
    training_levels: *id002
    notes: 'Wildman movement families on nonconsecutive Tetris scheduling. Repeat these fixed modules twice weekly. Calendar time never grants
      proficiency or a heavier bell. Practice-window durations include rests; they never mean continuous
      overhead holds. Use one light bell appropriate for the most demanding movement, or omit this track
      if that cannot be controlled. '
    modules:
    - id: getup_mobility
      name: Get-Up and Loaded Mobility Practice
      archetype_id: kb_getup_mobility_practice
      modality: movement_skill
      training_levels: *id002
      exposures_per_week: 2
      min_spacing_days: 2
      max_rpe: 7
      deload_keep: 0.5
      requires_mastery:
      - wk_kb_tgu
      - kb_windmill
      - wk_kb_rack_carry
      - wk_kb_overhead_carry
      progression:
        model: skill_hold
      blocks:
      - role: prep
        exercise_id: wk_kb_halo
        slot_type: skill_practice
        duration_sec: 180
      - role: getup
        exercise_id: wk_kb_tgu
        slot_type: skill_practice
        duration_sec: 360
        loaded: true
        notes: Practice singles on alternating sides with rest between repetitions; this is a six-minute
          practice window, not a continuous hold.
      - role: windmill
        exercise_id: kb_windmill
        slot_type: skill_practice
        duration_sec: 240
        loaded: true
        notes: Alternate sides in small controlled sets with rest; do not chase range or fatigue.
      - role: rack_carry
        exercise_id: wk_kb_rack_carry
        slot_type: skill_practice
        duration_sec: 240
        loaded: true
        notes: Short walks on alternating sides, resting between efforts. Four minutes is the whole practice
          window, not one uninterrupted carry.
      - role: overhead_carry
        exercise_id: wk_kb_overhead_carry
        slot_type: skill_practice
        duration_sec: 240
        loaded: true
        notes: Short walks on alternating sides with rest. Stop if overhead position deteriorates. Do
          not carry continuously for the entire practice window.
  double_bell_practice:
    training_levels: *id002
    notes: 'Wildman movement families on nonconsecutive Tetris scheduling. Repeat these fixed modules twice weekly. Calendar time never grants
      proficiency or a heavier bell. Requires two matching controllable bells and proficiency in every
      double-bell lift. Selected weight is per bell. The jerk technique module is an app-authored extension,
      not an official Wildman cycle. '
    modules:
    - id: double_strength
      name: Double-Bell Strength Practice
      archetype_id: kb_double_strength_practice
      modality: max_strength
      training_levels: *id002
      exposures_per_week: 2
      min_spacing_days: 2
      max_rpe: 7
      deload_keep: 0.5
      requires_mastery:
      - kb_clean_double
      - kb_press_double
      - kb_squat_double
      progression:
        model: density_cycle
        reps_start: 1
        reps_step: 1
        reps_max: 5
        rounds:
        - 5
        - 10
      blocks:
      - role: prep
        exercise_id: wk_kb_halo
        slot_type: skill_practice
        duration_sec: 180
      - role: clean
        exercise_id: kb_clean_double
        slot_type: emom
        loaded: true
      - role: press
        exercise_id: kb_press_double
        slot_type: emom
        loaded: true
      - role: squat
        exercise_id: kb_squat_double
        slot_type: emom
        loaded: true
    - id: double_power
      name: Double-Bell Jerk Technique
      archetype_id: kb_double_power_practice
      modality: power
      training_levels: *id002
      exposures_per_week: 2
      min_spacing_days: 2
      max_rpe: 7
      deload_keep: 0.5
      requires_mastery:
      - kb_clean_double
      - kb_jerk_single
      - kb_jerk_double
      progression:
        model: skill_hold
      blocks:
      - role: prep
        exercise_id: kb_deadlift
        slot_type: skill_practice
        duration_sec: 180
      - role: jerk
        exercise_id: kb_jerk_double
        slot_type: skill_practice
        duration_sec: 360
        loaded: true
        notes: 'Brief sets of already-proficient double jerks, resting fully between sets.
          This six-minute window is not a continuous jerk set and is not an IKMF pentathlon event.'
    requires_kettlebell_pair: true
