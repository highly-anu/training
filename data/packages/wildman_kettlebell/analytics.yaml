# Actual practice currencies; confirmed module advancement is reported by the progression review.
# Every practice track but the get-up's runs its programs as density cycles —
# so many reps a minute, for so many minutes, then more — so the currency is
# the intervals completed (Nerd Math: the swing program's EMOMs, its start/stop
# rounds). Pentathlon Prep falls through to cadence, Get-Up and Loaded
# Mobility to technique minutes (src/analytics/document._lead_entry).
id: wildman_kettlebell
progress:
- id: interval_rounds
  label: Completed intervals
  primitive: rounds
  headline: true
  scope:
    frameworks:
    - kb_general_practice
    - kb_squat_practice
    - kb_snatch_practice
    - kb_double_bell_practice
    slot_types:
    - emom
  expected: prescribed
- id: practice_sessions
  label: Practice consistency
  primitive: session_completion
  scope:
    frameworks:
    - kb_general_practice
    - kb_squat_practice
    - kb_snatch_practice
    - kb_getup_mobility
    - kb_double_bell_practice
- id: swing_intervals
  label: Completed swing intervals
  primitive: rounds
  scope:
    frameworks:
    - kb_general_practice
    slot_types:
    - emom
    exercises:
    - wk_kb_swing_two_hand
  expected: prescribed
- id: technique_time
  label: Technique practice
  primitive: duration
  scope:
    frameworks:
    - kb_general_practice
    - kb_getup_mobility
    slot_types:
    - skill_practice
  expected: prescribed
- id: jerk_rpm
  label: Jerk cadence
  primitive: rate
  scope:
    frameworks:
    - kb_pentathlon
    archetypes:
    - kb_pentathlon_training
    exercises:
    - kb_jerk_single
  rpm_target: 20
- id: half_snatch_rpm
  label: Half snatch cadence
  primitive: rate
  scope:
    frameworks:
    - kb_pentathlon
    archetypes:
    - kb_pentathlon_training
    exercises:
    - wk_kb_half_snatch
  rpm_target: 18
- id: event_minutes
  label: Event set duration
  primitive: duration
  scope:
    frameworks:
    - kb_pentathlon
    slot_types:
    - time_domain
    exercises:
    - wk_kb_clean_single
    - wk_kb_long_cycle_press
    - kb_jerk_single
    - wk_kb_half_snatch
    - wk_kb_push_press_single
  expected: prescribed
# Pentathlon Prep's optional general preparation: easy runs on free days.
- id: easy_run_minutes
  label: Easy running
  primitive: duration
  scope:
    frameworks:
    - kb_pentathlon
    exercises:
    - run_zone2
  expected: prescribed
benchmarks:
# The snatch program's goal, 200 snatches in ten minutes (/snatch), is the SSST
# count; the SSST fixes a 24 kg bell where Wildman lets the athlete choose, so a
# result is entered by hand. The get-up's ratio likewise.
- id: ssst_reps
  frameworks:
  - kb_general_practice
  - kb_snatch_practice
  manual: true
- id: turkish_get_up_bw_ratio
  frameworks:
  - kb_general_practice
  - kb_getup_mobility
  manual: true
- id: kb_pentathlon_clean_reps
  frameworks:
  - kb_pentathlon
- id: kb_pentathlon_long_cycle_press_reps
  frameworks:
  - kb_pentathlon
- id: kb_pentathlon_jerk_reps
  frameworks:
  - kb_pentathlon
- id: kb_pentathlon_half_snatch_reps
  frameworks:
  - kb_pentathlon
- id: kb_pentathlon_push_press_reps
  frameworks:
  - kb_pentathlon
