# What progress means for Wildman kettlebell work. RPM-based when training for
# the pentathlon; complexity-based in general practice, where a new movement
# earned is the unit of progress.
id: wildman_kettlebell

progress:
  # Targets are the IKMF pentathlon caps per minute (120 jerks and 108 half
  # snatches in 6 min score at most; ikmf-world.com/disciplines/ikmf-pentathlon),
  # the ceiling the paced sets are measured against.
  - id: jerk_rpm
    label: Jerk cadence
    primitive: rate
    scope:
      frameworks: [kb_pentathlon]
      archetypes: [kb_pentathlon_training]
      exercises: [kb_jerk_single]
    rpm_target: 20          # IKMF cap: 120 in 6 min

  - id: half_snatch_rpm
    label: Half snatch cadence
    primitive: rate
    scope:
      frameworks: [kb_pentathlon]
      archetypes: [kb_pentathlon_training]
      exercises: [wk_kb_half_snatch]
    rpm_target: 18          # IKMF cap: 108 in 6 min

  - id: ballistic_load
    label: Ballistic load
    primitive: set_load
    scope:
      modalities: [power]
      slot_types: [sets_reps]
      exclude_slot_roles: ["*warm*", "*cool*"]
    expected: prescribed

  - id: skills
    label: Movements earned
    primitive: unlocks
    scope: {modalities: [movement_skill, power, strength_endurance]}
    min_sessions: 2

benchmarks: [ssst_reps]
