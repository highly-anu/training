# What progress means for Wildman kettlebell work. RPM-based when training for
# the pentathlon; complexity-based in general practice, where a new movement
# earned is the unit of progress. No entry is marked headline: the engine leads
# with the entry matching the running framework's progression_model among
# those that apply (cadence in Pentathlon Prep, movements earned in General
# Practice — src/analytics/document._lead_entry).
id: wildman_kettlebell

progress:
  # Targets are the IKMF pentathlon caps per minute (120 jerks and 108 half
  # snatches in 6 min score at most; ikmf-world.com/disciplines/ikmf-pentathlon),
  # the ceiling the paced sets are measured against.
  - id: jerk_rpm
    label: Jerk cadence
    primitive: rate
    scope:
      frameworks: [kb_pentathlon]
      archetypes: [kb_pentathlon_training]
      exercises: [kb_jerk_single]
    rpm_target: 20          # IKMF cap: 120 in 6 min

  - id: half_snatch_rpm
    label: Half snatch cadence
    primitive: rate
    scope:
      frameworks: [kb_pentathlon]
      archetypes: [kb_pentathlon_training]
      exercises: [wk_kb_half_snatch]
    rpm_target: 18          # IKMF cap: 108 in 6 min

  # The ballistic session progresses by "timed-set duration or RPM, not load"
  # (kb_ballistic_session's own notes): its main block is a time_domain slot,
  # so the measure is the minutes logged on it. It used to be set_load on
  # sets_reps slots, which no Wildman power session has — it measured nothing.
  - id: ballistic_time
    label: Ballistic timed sets
    primitive: duration
    scope:
      modalities: [power]
      slot_types: [time_domain]
      exclude_slot_roles: ["*warm*", "*cool*"]
    expected: prescribed

  # Bell weight on the double-bell presses and squats and the get-up's
  # hinge — raised "only when all reps are clean" (kb_double_strength), so the
  # expectation is the prescription, never last achieved + an increment.
  - id: bell_weight
    label: Bell weight
    primitive: set_load
    scope:
      modalities: [max_strength, relative_strength]
      slot_types: [sets_reps]
      exclude_slot_roles: ["*warm*", "*cool*"]
    expected: prescribed

  - id: skills
    label: Movements earned
    primitive: unlocks
    scope: {modalities: [movement_skill, power, strength_endurance]}
    min_sessions: 2

benchmarks: [ssst_reps, turkish_get_up_bw_ratio]
