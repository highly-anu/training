id: wildman_kettlebell
name: Mark Wildman Kettlebell
core_principles:
- skill_before_load
- repeat_fundamentals
- independent_module_progression
- density_before_load
- nonconsecutive_module_exposures
scope:
- power
- strength_endurance
- aerobic_base
- relative_strength
- movement_skill
bias:
- power
- strength_endurance
- movement_skill
avoid_with:
- mixed_modal_conditioning
required_equipment:
- kettlebell
intensity_model: operator_readiness
progression_philosophy: volume_based
sources:
- https://www.wildmanathletica.com/programming
- training_contract.yaml sources (public swing-program FAQ)
notes: Executable rules live in training_contract.yaml. General Practice repeats stable single-bell modules;
  density and volume advance after clean successful exposures. The calendar never earns a harder movement.
  Forecasts are conditional. Complementary technique and clean/press cycles are app adaptations of public
  principles, not a purchased Wildman plan. Pentathlon is a separate sport-specific track requiring demonstrated
  event proficiency.
self_contained: true
primary_track_id: general_practice
tracks:
- id: general_practice
  name: General Practice
  description: Stable swing and complementary practice modules, twice weekly each on nonconsecutive days.
    Progression is per successful module exposure, independent of phase names.
  phases:
  - id: foundations
    name: Foundations
    kind: base
    weeks: 6
    framework_id: kb_general_practice
    focus: Learn and repeat the fundamentals
    description: Practice the same movements at a controllable bell. Novices use unloaded get-up positions.
      Do not progress through movements merely because weeks have elapsed.
    adaptations:
    - Repeated skill practice
    - Capacity at a stable bell
    - Density and volume progression
    intensity: Clean mechanics, RPE 7 or below; rest within every minute
    exclude_exercises:
    - wk_kb_snatch
    - wk_kb_half_snatch
    - kb_jerk_single
    - kb_jerk_double
    - wk_kb_long_cycle_press
    checks:
      archetypes_forbidden:
      - kb_pentathlon_training
      - kb_double_strength
      - kb_pentathlon_test
  - id: ladder
    name: Density and Volume
    kind: build
    weeks: 6
    framework_id: kb_general_practice
    focus: Advance repetitions, then volume
    description: Continue each module cycle without resetting it. Forecasts assume clean completion; recorded
      outcomes decide the next earned prescription. A higher density or volume does not authorize a heavier
      bell.
    adaptations:
    - Repeated skill practice
    - Capacity at a stable bell
    - Density and volume progression
    intensity: Clean mechanics, RPE 7 or below; rest within every minute
    checks:
      archetypes_forbidden:
      - kb_pentathlon_training
      - kb_double_strength
      - kb_pentathlon_test
  - id: practice
    name: Repeatable Practice
    kind: maintenance
    weeks: 4
    repeatable: true
    framework_id: kb_general_practice
    focus: Repeat or explicitly choose the next cycle
    description: Retain movement identity. Repeat at the same bell or explicitly start a new cycle after
      confirming technique and available equipment. Snatches and jerks require a separate proficiency
      decision.
    adaptations:
    - Repeated skill practice
    - Capacity at a stable bell
    - Density and volume progression
    intensity: Clean mechanics, RPE 7 or below; rest within every minute
    checks:
      archetypes_forbidden:
      - kb_pentathlon_training
      - kb_double_strength
      - kb_pentathlon_test
- id: pentathlon
  name: Pentathlon Prep
  description: "Sport preparation for the IKMF kettlebell pentathlon: clean, long cycle press, jerk, half\
    \ snatch and strict push press, six minutes each. An app adaptation from kettlebell-sport practice,\
    \ not a Wildman program. Not for novices \u2014 every one of the five lifts must already be proficient.\n"
  phases:
  - id: event_technique
    name: Event Technique
    kind: base
    weeks: 4
    framework_id: kb_pentathlon
    focus: All five events, below scoring pace
    description: 'Three event sessions a week: the five events back to back at the pace you plan to compete
      at, repeats a little faster, and minute intervals on the four fast events, with hand changes and
      racking positions rehearsed until they cost nothing. Easy runs on free days build the aerobic base
      underneath; they are optional and never take a lifting day.

      '
    adaptations:
    - Efficiency in all five lifts
    - Hand-change and rack-position economy
    intensity: Below scoring pace
  - id: timed_sets
    name: Timed Sets
    kind: build
    weeks: 6
    framework_id: kb_pentathlon
    focus: Mini-pentathlon sets, then a full practice pentathlon
    description: 'Event sets reach the mini pentathlon''s four minutes at the five-minute competition
      rest, paced against each event''s scoring cap (20, 10, 20, 18 and 20 RPM) without chasing it. The
      phase ends with one full practice pentathlon, six minutes per event, as the rehearsal coaches ask
      for at least once a cycle.

      '
    adaptations:
    - Six-minute strength endurance per event
    - Pacing against the RPM cap
    intensity: Event pace, rising toward the cap
    tests:
    - archetype: kb_pentathlon_test
      week: last
    checks:
      archetypes_required:
      - kb_pentathlon_training
  - id: competition
    name: Competition
    kind: peak
    weeks: 2
    framework_id: kb_pentathlon
    focus: Full pentathlon at target pace
    description: 'Volume comes down so the event is met fresh: shorter event sessions at target pace,
      then the full pentathlon as the test.

      '
    adaptations:
    - Five events back to back
    - Arriving fresh for the test
    intensity: Target pace; reduced volume
    tests:
    - archetype: kb_pentathlon_test
      week: last
    checks:
      archetypes_required:
      - kb_pentathlon_training
      volume_vs_previous_phase:
      - -0.6
      - -0.1
