id: wildman_kettlebell
name: Mark Wildman Kettlebell
core_principles:
- skill_before_load
- repeat_fundamentals
- independent_module_progression
- density_before_load
- nonconsecutive_module_exposures
scope:
- power
- strength_endurance
- aerobic_base
- relative_strength
- movement_skill
bias:
- power
- strength_endurance
- movement_skill
avoid_with:
- mixed_modal_conditioning
required_equipment:
- kettlebell
intensity_model: operator_readiness
progression_philosophy: volume_based
sources:
- https://www.wildmanathletica.com/programming
- training_contract.yaml sources (public swing-program FAQ)
notes: Executable rules live in training_contract.yaml. General Practice repeats stable single-bell modules;
  density and volume advance after clean successful exposures. The calendar never earns a harder movement.
  Forecasts are conditional. Pentathlon is a separate sport-specific track requiring demonstrated
  event proficiency.
self_contained: true
primary_track_id: general_practice
tracks:
- id: general_practice
  name: General Practice
  description: Wildman's Phase II programs on the Tetris of Training — swing, clean and press, Turkish
    get-up, deck squat and, once confirmed, snatch — each twice a week on nonconsecutive days, as many
    as the week's time holds. Each runs its Nerd Math cycle at one bell and starts again with a heavier
    one; progress is per clean session, never by the calendar.
  phases:
  - id: build
    name: Build
    kind: build
    weeks: 16
    repeatable: true
    # Foundations, Density and Volume and Repeatable Practice were the same
    # modules under three names; Wildman's structure is the cycle inside each
    # program, not phases of the calendar.
    former_ids:
    - foundations
    - ladder
    - practice
    framework_id: kb_general_practice
    focus: Repeat the fundamentals; cycle each program, then a heavier bell
    description: 'The swing runs the Nerd Math program''s four approaches: 6 to 20 swings a minute over
      10 minutes, then over 20, then start/stop swings in ten and twenty 90-second rounds — sixteen
      weeks at two sessions a week. Clean and press, get-up and deck squat run their own cycles beside
      it, as the session time allows; the snatch joins after clean and press once it is confirmed. A
      cycle finished cleanly is repeated with a heavier bell. Wildman calls Phase II the one you are
      never done with.'
    adaptations:
    - Posterior-chain strength and work capacity
    - Repeated skill practice at a stable bell
    - Density, then volume, then a heavier bell
    intensity: Clean mechanics, RPE 7 or below; rest within every minute
    exclude_exercises:
    - wk_kb_half_snatch
    - kb_jerk_single
    - kb_jerk_double
    - wk_kb_long_cycle_press
    checks:
      archetypes_forbidden:
      - kb_pentathlon_training
      - kb_double_strength
      - kb_pentathlon_test
- id: pentathlon
  name: Pentathlon Prep
  description: "Sport preparation for the IKMF kettlebell pentathlon: clean, long cycle press, jerk, half\
    \ snatch and strict push press, six minutes each. Built from kettlebell-sport practice. Not for novices \u2014 every one of the five lifts must already be proficient.\n"
  phases:
  - id: event_technique
    name: Event Technique
    kind: base
    weeks: 4
    framework_id: kb_pentathlon
    focus: All five events, below scoring pace
    description: 'Three event sessions a week: the five events back to back at the pace you plan to compete
      at, repeats a little faster, and minute intervals on the four fast events, with hand changes and
      racking positions rehearsed until they cost nothing. Easy runs on free days build the aerobic base
      underneath; they are optional and never take a lifting day.

      '
    adaptations:
    - Efficiency in all five lifts
    - Hand-change and rack-position economy
    intensity: Below scoring pace
  - id: timed_sets
    name: Timed Sets
    kind: build
    weeks: 6
    framework_id: kb_pentathlon
    focus: Mini-pentathlon sets, then a full practice pentathlon
    description: 'Event sets reach the mini pentathlon''s four minutes at the five-minute competition
      rest, paced against each event''s scoring cap (20, 10, 20, 18 and 20 RPM) without chasing it. The
      phase ends with one full practice pentathlon, six minutes per event, as the rehearsal coaches ask
      for at least once a cycle.

      '
    adaptations:
    - Six-minute strength endurance per event
    - Pacing against the RPM cap
    intensity: Event pace, rising toward the cap
    tests:
    - archetype: kb_pentathlon_test
      week: last
    checks:
      archetypes_required:
      - kb_pentathlon_training
  - id: competition
    name: Competition
    kind: peak
    weeks: 2
    framework_id: kb_pentathlon
    focus: Full pentathlon at target pace
    description: 'Volume comes down so the event is met fresh: shorter event sessions at target pace,
      then the full pentathlon as the test.

      '
    adaptations:
    - Five events back to back
    - Arriving fresh for the test
    intensity: Target pace; reduced volume
    tests:
    - archetype: kb_pentathlon_test
      week: last
    checks:
      archetypes_required:
      - kb_pentathlon_training
      volume_vs_previous_phase:
      - -0.6
      - -0.1
