- id: getup_mobility
  name: Get-Up and Loaded Mobility
  description: 'Wildman movement families on nonconsecutive Tetris scheduling. Repeat these fixed modules twice weekly. Calendar time
    never grants proficiency or a heavier bell. Practice-window durations include rests; they never mean
    continuous overhead holds. Use one light bell appropriate for the most demanding movement, or omit
    this track if that cannot be controlled. '
