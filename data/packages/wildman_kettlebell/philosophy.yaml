  name: Squat Practice
  description: 'App adaptation of Wildman movement families and nonconsecutive Tetris scheduling; not
    a reproduction of a purchased Wildman program. Repeat these fixed modules twice weekly. Calendar time
    never grants proficiency or a heavier bell. '
  phases:
