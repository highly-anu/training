- id: double_bell_practice
  name: Double-Bell Practice
  description: 'Wildman movement families on nonconsecutive Tetris scheduling. Repeat these fixed modules twice weekly. Calendar time
    never grants proficiency or a heavier bell. Requires two matching controllable bells and proficiency
    in every double-bell lift. Selected weight is per bell. The jerk technique module is an app-authored
    extension, not an official Wildman cycle. '
  phases:
