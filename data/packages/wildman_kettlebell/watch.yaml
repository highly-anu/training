# How Wildman Kettlebell sessions look on the watch (docs/schemas/watch.schema.json).
id: wildman_kettlebell
spec_version: 1
archetypes:
  tgu_practice:
    slots:
      # The get-up practice block: the six positions under the rule, and when
      # it is counted in sets, one side at a time.
      main:
        lines: phases
        phases: [roll, post, bridge, sweep, lunge, stand]
        behaviours: { side_tracked: true }
      accessory:
        behaviours: { side_tracked: true }
  kb_pentathlon_training:
    slots:
      # Timed sets paced to a target: the RPM is the session. An interval set
      # shows the pace in its own field; a timed block puts it beside the clock.
      main:
        behaviours: { metronome_rpm: 12 }
        slot_types:
          time_domain: { b: rpm }
