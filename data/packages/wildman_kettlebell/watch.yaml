# How Wildman Kettlebell sessions look on the watch (docs/schemas/watch.schema.json).
id: wildman_kettlebell
spec_version: 1
archetypes:
  tgu_practice:
    slots:
      # The get-up practice block: a timed block worked one side at a time,
      # LAP switching sides, with the six positions under the rule.
      main:
        title: [name, side, load]
        lap: next_side
        lines: phases
        phases: [roll, post, bridge, sweep, lunge, stand]
        behaviours: { side_tracked: true }
      accessory:
        behaviours: { side_tracked: true }
  kb_pentathlon_training:
    slots:
      # Timed sets paced to a target: the RPM is the session. The pace is the
      # exercise's IKMF cap per minute, sent as targetRpm (there is no package
      # default: one number cannot fit five events). A timed block puts it
      # beside the clock.
      main:
        slot_types:
          time_domain: { b: rpm }
