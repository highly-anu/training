id: kb_general_practice
name: Kettlebell General Practice (Wildman)
source_philosophy: wildman_kettlebell
goals_served:
- power
- movement_skill
- strength_endurance
- relative_strength
sessions_per_week:
  power: 2
  movement_skill: 2
modality_priority:
  committed:
  - power
  - movement_skill
  core: []
  supplementary: []
intensity_distribution:
  zone1_2_pct: 0.6
  zone3_pct: 0.3
  zone4_5_pct: 0.1
  max_effort_pct: 0.0
progression_model: complexity
applicable_when:
  training_level:
  - novice
  - intermediate
  - advanced
  days_per_week_min: 3
  days_per_week_max: 4
# No deload_protocol: Wildman's Nerd Math programs run their sixteen weeks
# without a deload week; the lighter stretch is the next cycle, restarted at a
# heavier bell from its first, easiest session. An overreached athlete still
# deloads (fatigue_state).
# Wildman's programming page: "Never repeat the same workout on back-to-back
# training days — always allow a rest day between sessions of the same type",
# and "Example: Kettlebell Swings on Monday & Thursday, Clean & Press on
# Wednesday & Saturday". Four days take his example's days; the contract
# alternates the two programs on them (training_contract._spacing).
cadence_options:
  4: [[1, 3, 4, 6]]
sources:
- Wildman
notes: The executable module contract owns frequency, density cycles, movement continuity,
  mastery and elapsed time. General Practice never borrows the pentathlon or double-bell
  templates. The shared modality load model does not prescribe this track.
expectations:
  min_weeks: 8
  ideal_weeks: 16
  min_days_per_week: 3
  ideal_days_per_week: 4
  min_session_minutes: 25
  ideal_session_minutes: 30
  supports_split_days: true
