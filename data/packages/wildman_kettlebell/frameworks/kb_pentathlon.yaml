id: kb_pentathlon
name: Kettlebell Pentathlon Training (IKMF)
source_philosophy: wildman_kettlebell
goals_served:
- strength_endurance
- power
- aerobic_base
sessions_per_week:
  strength_endurance: 2
modality_priority:
  committed:
  - strength_endurance
  core: []
  supplementary: []
intensity_distribution:
  zone1_2_pct: 0.5
  zone3_pct: 0.3
  zone4_5_pct: 0.2
  max_effort_pct: 0.0
progression_model: pentathlon_rpm
applicable_when:
  training_level:
  - intermediate
  - advanced
  - elite
  days_per_week_min: 2
  days_per_week_max: 5
deload_protocol:
  frequency_weeks: 4
  volume_reduction_pct: 0.6
  intensity_change: reduce_slightly
sources:
- IKMF
- Wildman
- Pavel
notes: Two nonconsecutive event-practice modules per week, implemented by training_contract.yaml.
  All five events retain their identity, duration ceiling and rests. Entry requires
  confirmed event proficiency. Progress is conditional on clean successful exposures;
  competition practice tapers while the scored test remains exact. This event-preparation
  track is an app adaptation, separate from General Practice.
expectations:
  min_weeks: 10
  ideal_weeks: 14
  min_days_per_week: 2
  ideal_days_per_week: 2
  min_session_minutes: 60
  ideal_session_minutes: 60
  supports_split_days: false
