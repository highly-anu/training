    load: hold_dumbbells
  scaling_down: []
  typical_volume:
    sets: 3
    reps: 10
  sources: ["Ben Patrick, ATG Zero; ATG Program #1 & 2; Knee Ability Series 3 of 10"]
  notes: >
    Front knee travels past the toes, hamstring to calf at the bottom, back
    knee straight. Scales from assisted to unassisted to loaded, and from a
    higher front foot (a stair or chair) to a lower one; leverage makes it
    harder the deeper you go.

