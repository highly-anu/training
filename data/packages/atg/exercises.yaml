# ATG (Ben Patrick) — the movements his published workouts name
# (docs/package-fidelity/atg.md). Every one "scales to remarkably gentle
# levels" (Patrick): the notes give the ladder he writes, easiest first, and
# the athlete works at the level that is pain-free. Nothing is locked behind
# another exercise — which step of a ladder the athlete is on is theirs (the
# record's open item on assessment gating).
exercises:

# ── Backward and forward ─────────────────────────────────────────────────────
- id: sled_forward_backward
  name: Forward & Backward Sled
  category: loaded_carry
  modality: [durability]
  equipment: [sled, open_space]
  effort: medium
  bilateral: true
  movement_patterns: [locomotion, loaded_carry, knee_extension]
  requires: []
  unlocks: []
  contraindicated_with: []
  progressions:
    load: add_weight_to_the_sled
    volume: increase_distance
  scaling_down: [backward_walk]
  typical_volume:
    sets: 2
    distance_m: 46
  sources: ["Ben Patrick, ATG Program #1 & 2; Knee Ability Series 3 of 10"]
  notes: >
    Drag the sled walking backward, then push or drag it forward. Backward is
    "the first knee-over-toes exercise I teach": it loads the knee with no
    eccentric strain and gets circulation into it. A resisted treadmill
    ("hill from home") or plain backward walking replaces it — "You don't have
    to sled!"

- id: backward_walk
  name: Backward Walk
  category: aerobic
  modality: [durability]
  equipment: []
  effort: low
  bilateral: true
  movement_patterns: [locomotion, knee_extension]
  requires: []
  unlocks: []
  contraindicated_with: []
  progressions:
    volume: increase_duration
    load: drag_a_sled
  scaling_down: []
  typical_volume:
    duration_sec: 300
  sources: ["Ben Patrick, ATG Zero (ATG newsletter, 2023-08-06)"]
  notes: >
    Walk backward: outdoors, on a treadmill that is switched off (push the
    belt), or dragging a sled. Balances "a lifetime of forward-focused
    movement"; the first step of ATG Zero.

# ── Lower legs ───────────────────────────────────────────────────────────────
