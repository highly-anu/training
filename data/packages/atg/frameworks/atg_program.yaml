id: atg_program
name: "ATG Program #2 (Ben Patrick)"
source_philosophy: atg

goals_served:
  - durability
  - mobility

sessions_per_week:
  durability: 2
modality_priority:
  committed: [durability]
  core: []
  supplementary: []

prescription_policy: framework
progression_model: as_written

applicable_when:
  training_level:
    - novice
    - intermediate
    - advanced
    - elite
  days_per_week_min: 2
  days_per_week_max: 7

# No deload_protocol (see atg_zero.yaml).

categories:
  workout_1:
    name: "Workout 1"
    modality: durability
    # Recommended, not enforced (owner, 2026-10-22; I8).
    advice: "Each progression is a ladder: work at the step you own without pain, and take the next one when you are ready. Patrick writes no pass mark, so the call is yours; the program does not track your step."
    archetypes:
      - atg_p2_w1
  workout_2:
    name: "Workout 2"
    modality: durability
    # Recommended, not enforced (owner, 2026-10-22; I8).
    advice: "Each progression is a ladder: work at the step you own without pain, and take the next one when you are ready. Patrick writes no pass mark, so the call is yours; the program does not track your step."
    archetypes:
      - atg_p2_w2

sources:
  - "Ben Patrick, ATG Program #1 & 2 (ATG Online articles)"

notes: >
  The second program Patrick teaches: two workouts, each once a week —
  "3 days of sport and 2 days of ATG, not 5 days of sport."

expectations:
  min_weeks: 4
  ideal_weeks: 12
  min_days_per_week: 2
  ideal_days_per_week: 2
  min_session_minutes: 60
  ideal_session_minutes: 60
  supports_split_days: false
