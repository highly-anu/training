# What progress means for ATG (Ben Patrick): the workouts done as written, two
# or three days a week, every movement at its pain-free level. Which level of
# each ladder the athlete has reached is not tracked yet (assessment gating,
# docs/package-fidelity/atg.md).
id: atg

# Patrick writes no pass marks (I8): each program's level is the source's own
# (Zero, Program #2, Knee Ability Pro).
no_elite_standard: "Ben Patrick writes no test or numeric standard; the athlete works at the step of each ladder owned without pain (I8)."

progress:
  - id: plan_completion
    label: Workouts done as written
    primitive: session_completion
    headline: true

  - id: holds
    label: Split squat, couch stretch and L-sit holds
    primitive: hold_seconds
    scope: {slot_types: [static_hold]}
    expected: {load_field: hold_seconds}

  - id: sled
    label: Sled
    primitive: distance
    scope: {slot_types: [distance]}
