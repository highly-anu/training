push_up:
  animation:
    type: none
  coaching_focus: The push-up is a moving plank -- if the hips sag or pike at any point in the
    set, the rep does not count and the set is over.
  common_errors:
  - 'Hip sag: the most common fault; the core gives out before the chest does -- when hips drop,
    the set ends'
  - 'Elbow flare: elbows at 90 degrees loads the anterior shoulder capsule in a stressful position
    -- keep them at 45 degrees'
  - 'Partial ROM at the bottom: hovering above the floor eliminates the pec stretch and reduces
    the training stimulus significantly'
  cue_points:
  - Hands slightly wider than shoulder-width; elbows track at 45 degrees from the torso -- not
    90 degrees out
  - Body forms a rigid plank from heel to crown; squeeze glutes and brace the core before the
    first rep
  - Chest touches the floor at the bottom -- no hovering an inch above; this is a full ROM exercise
  - Full lockout at the top; the arms extend completely and the scapulae protract at lockout
  - 'Breathe: inhale on the way down, exhale at the top -- do not hold the breath across reps'
  description: The push-up is the foundational horizontal pressing movement -- a full plank
    position pressing from chest-to-floor to full lockout. Gym Jones programs 200+ reps in Murph-style
    sessions; CrossFit uses it as a primary conditioning tool. It simultaneously trains the
    horizontal press, scapular stability, and anti-extension core. The push-up is the most scalable
    pressing exercise and the foundation for all ring and parallette progressions.
  muscle_diagram:
    highlight_primary:
    - pec
    - triceps
    - deltoids
    highlight_secondary:
    - core
    - serratus
  muscles_primary:
  - pec
  - triceps
  - deltoids
  muscles_secondary:
  - core
  - serratus
