face_pull:
  animation:
    type: none
  coaching_focus: Elbows high and finishing behind the plane of the ears -- if the elbows stay
    low, the pull becomes a row and the external rotation demand disappears.
  common_errors:
  - 'Elbows staying low during the pull: this turns the face pull into a cable row and eliminates
    the external rotation component'
  - 'Pulling to the chin rather than the face: insufficient elbow elevation -- pull to the nose
    or eyes with elbows high'
  - 'Too much weight: heavy cable reduces the range of motion achievable with the correct elbow
    pattern'
  cue_points:
  - Band or cable at face height; use a rope attachment or two-handed band grip with thumbs
    up
  - Pull toward the face with the elbows traveling high and wide -- ending with hands at temples
    and elbows behind the plane of the ears
  - 'Full external rotation at end range: thumbs point behind you'
  - Hold 1 second at end range; return under control
  - 15-25 reps per set; 2-3 sets daily or several times per week
  description: The face pull (Horsemen) pulls a band or cable toward the face with a thumbs-up
    grip and elbows high and flared, reaching full external rotation at end range. It targets
    the rotator cuff posterior fibers, posterior deltoid, and lower and mid trapezius. High-frequency
    programming is appropriate -- face pulls can be performed daily without meaningful recovery
    cost and accumulate significant prehabilitative stimulus over time.
  muscle_diagram:
    highlight_primary: []
    highlight_secondary: []
  muscles_primary: []
  muscles_secondary: []
