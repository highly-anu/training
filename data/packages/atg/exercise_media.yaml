band_pull_apart:
  animation:
    external_id: Band_Pull_Apart
    gif_alt: Band Pull-Apart
    gif_source: free_exercise_db
    gif_url: https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Band_Pull_Apart/0.jpg
    type: gif
  coaching_focus: Pull apart, not just back -- the motion is horizontal and backward simultaneously,
    separating the hands while drawing the shoulder blades together and down.
  common_errors:
  - 'Band touching only the sternum without scapular retraction: the hands are moving apart
    but the shoulder blades are not following'
  - 'Insufficient band tension: a band that offers no resistance trains the motion without the
    strengthening stimulus'
  - 'Treating it as a throwaway warm-up: program sets and reps; the pull-apart is a prehab exercise
    with real strength value'
  cue_points:
  - Band at chest height or overhead; hands shoulder-width or wider
  - Pull apart until the band touches the chest (or the overhead equivalent)
  - Shoulder blades retract and depress at end range
  - 15-25 reps per set; high frequency -- can be done every session
  - Overhead pull-apart variant develops scapular upward rotation simultaneously
  description: The band pull-apart (Ido Portal and Horsemen variant) pulls a horizontal resistance
    band apart at chest height or overhead to activate the posterior deltoid, infraspinatus,
    and lower trapezius. Portal and Horsemen both program it as a daily prehab staple for any
    pressing-heavy program -- the posterior shoulder structures are chronically undertrained
    and the pull-apart is the most accessible corrective. No recovery cost at moderate volumes.
  muscle_diagram:
    highlight_primary: []
    highlight_secondary: []
  muscles_primary: []
  muscles_secondary: []
