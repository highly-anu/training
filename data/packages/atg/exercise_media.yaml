couch_stretch:
  animation:
    type: none
  coaching_focus: The wall is the tool -- the rear shin must be vertical against the wall, not
    just resting near it; the wall provides the traction that makes this more effective than
    a standard kneeling hip flexor stretch.
  common_errors:
  - 'Foot sliding down from the wall: the foot must press against the wall to maintain the knee
    flexion that creates the rectus femoris stretch'
  - 'Anterior tilt of the pelvis: kills the stretch on the iliopsoas and turns this into a lumbar
    extension exercise'
  - 'Front foot too close to the wall: the torso tips forward and the hip cannot drive toward
    the wall'
  cue_points:
  - Rear shin vertical against the wall; foot pressed against the wall, not resting passively
  - Front foot far enough forward to allow an upright torso
  - Posterior pelvic tilt before driving the hip toward the wall
  - Breathe slowly; the hip flexors often protect with increased tone -- exhale to release
  - 60-90 seconds each side; perform daily if hip flexion is a known restriction
  description: The couch stretch (Ido Portal and Horsemen variant) targets the rectus femoris
    and hip flexor complex with the rear foot elevated against a wall and the knee on the floor.
    One of the most effective hip extension mobility drills available. Portal and Horsemen both
    program it as a daily essential for athletes with any sitting-intensive lifestyle. Contraindicated
    with acute knee conditions due to end-range knee flexion load.
  muscle_diagram:
    highlight_primary: []
    highlight_secondary: []
  muscles_primary: []
  muscles_secondary: []
