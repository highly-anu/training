id: atg
name: "ATG / Knees Over Toes Guy (Ben Patrick)"
core_principles:
  - train_from_the_ground_up
  - backward_before_forward
  - every_exercise_scales_to_a_pain_free_level
  - never_work_through_a_level_or_range_that_does_not_feel_good
  - knee_over_toes_progressively
  - range_first_then_load
  - the_bottom_of_the_squat_is_trained_low_and_slow
  - balanced_ability
scope:
  - durability
  - mobility
bias:
  - durability
  - mobility
avoid_with: []
required_equipment: []
intensity_model: autoregulation_rpe
progression_philosophy: range_based
sources:
  - "Ben Patrick, ATG Zero (ATG newsletter, 2023-08-06)"
  - "Ben Patrick, ATG Program #1 & 2; Minimalistic Full-Body Program; The ATG Longevity System (ATG Online articles)"
  - "Ben Patrick, ATG: Knee Ability Series 1-4 (2025)"
notes: >
  Ben Patrick's "pain-free ability": a fixed workout trained from the ground up
  — backward and forward on the sled, the tibialis and calves, the knee over
  the toes (step-ups, ATG split squats, the bottom of the squat), the
  hamstrings and hips, then the core, and the upper body last ("All this
  'earns' the right to train the upper body!"). Two or three days a week, the
  days between for other exercise or sport. Every exercise scales to
  remarkably gentle levels — by assistance, height, slope, range — and the
  athlete works at the level that is pain-free: "Never work through a level or
  range that doesn't feel good for you." No phases, no deloads, no tests: the
  same workouts, each movement progressed as ability grows.

# Every modality this philosophy's frameworks prescribe has an archetype in
# this package; generation never needs to reach into another philosophy.
self_contained: true

# Three of Patrick's published programs, each a week the source writes day by
# day (docs/package-fidelity/atg.md). With no track named, the level picks one
# (I1): Zero is where he starts everyone.
primary_track_id: zero
track_for_level:
  novice: zero
  intermediate: program
  advanced: knee_ability_pro
  elite: knee_ability_pro
tracks:
  - id: zero
    name: "ATG Zero"
    description: >
      Ten movements, no equipment, three days a week: backward walking,
      tibialis and calf raises, the ATG split squat, the seated good morning,
      hip and hamstring work, the couch stretch and two for the shoulders.
    phases:
      - id: zero
        name: "Zero"
        kind: base
        weeks: 4
        repeatable: true
        framework_id: atg_zero
        focus: "Pain-free ability from zero"
        description: >
          The same ten movements three days a week, each at the level that
          feels good, with other exercise or sport on the days between.
        adaptations:
          - "Knee, ankle and hip ability"
          - "Lower-leg strength"
        intensity: "At your pain-free level"
        week_templates:
          - [zero, rest, zero, rest, zero, rest, rest]
  - id: program
    name: "ATG Program #2"
    description: >
      Two full-body workouts, each once a week: the sled, the lower legs, the
      knee and hamstrings, the hips, the L-sit and the upper body.
    phases:
      - id: program
        name: "Program #2"
        kind: base
        weeks: 4
        repeatable: true
        framework_id: atg_program
        focus: "Two days of ATG beside your sport"
        description: >
          Workout 1 and Workout 2 once each a week — "3 days of sport and 2
          days of ATG" — every movement at its pain-free level.
        adaptations:
          - "Knee and lower-leg ability"
          - "Flexibility through full range"
          - "Upper-body balance"
        intensity: "At your pain-free level"
        week_templates:
          - [workout_1, rest, rest, workout_2, rest, rest, rest]
  - id: knee_ability_pro
    name: "Knee Ability Pro"
    description: >
      Patrick's four-day week for jumping higher while making the knees more
      injury-resistant: heavy sled and the bottom of the squat twice, then
      flexibility and the upper body twice.
    phases:
      - id: knee_ability_pro
        name: "Knee Ability Pro"
        kind: base
        weeks: 4
        repeatable: true
        framework_id: knee_ability_pro
        focus: "Maximum intent at the bottom"
        description: >
          Monday and Thursday the heavy sled, the lower legs and the last
          quarter of the squat; Tuesday and Friday flexibility pulses and the
          upper body.
        adaptations:
          - "Strength at the bottom of the squat"
          - "Knee resilience"
        intensity: "Heavy sled; low and slow"
        week_templates:
          - [pro_monday, pro_tuesday, rest, pro_thursday, pro_friday, rest, rest]
