id: atg
name: "ATG / Knees Over Toes Guy (Ben Patrick)"
core_principles:
  - posterior_chain_health_is_foundation_of_durability
  - reverse_movements_accelerate_recovery_and_joint_health
  - progressive_range_of_motion_is_as_important_as_progressive_load
  - full_range_terminal_extension_work_is_key_to_knee_health
  - knee_health_is_achievable_through_targeted_progressive_loading
  - pain_free_range_before_loaded_range
  - tibialis_and_soleus_strength_underpin_lower_body_durability
scope:
  - durability
  - mobility
  - rehab
bias:
  - rehab
  - durability
  - mobility
avoid_with: []
required_equipment:
  - sled
  - resistance_band
intensity_model: autoregulation_rpe
progression_philosophy: range_based
sources:
  - "ATG (Athletic Truth Group) — Ben Patrick published methodology and programs"
notes: >
  Core movement vehicles: backward sled drag (reverse sled), Nordic curl, reverse
  tib raises, tibialis raises, calf raises (full ROM), split squats progressing
  to ATG split squat, and step-ups. Reverse sled is considered the foundational
  entry movement — zero eccentric load, builds knee tolerance from scratch. Range
  of motion progression precedes load progression: athlete must demonstrate pain-free
  full ROM before adding resistance. Progressive range is the primary adaptation
  target, not 1RM. Sled (for reverse dragging) and resistance bands (tibialis work)
  are the minimum viable equipment. The system is compatible with concurrent
  strength training but mandates its own lower-body prep work regardless of other
  modalities in the program.

# Every modality this philosophy's frameworks prescribe has an archetype in
# this package; generation never needs to reach into another philosophy.
self_contained: true

# One track: range before load, then maintenance. Phase text is drafted from
# this package's own notes and framework notes — review before relying on it.
primary_track_id: joint_health
tracks:
  - id: joint_health
    name: "ATG Joint Health"
    description: >
      Ben Patrick's progression: earn pain-free full range first, then load
      it, then keep it.
    phases:
      - id: range
        name: "Range"
        kind: base
        weeks: 8
        framework_id: atg_joint_health
        focus: "Pain-free full range"
        description: >
          Start from zero eccentric load: the reverse sled, tibialis raises
          and full-range calf work rebuild knee tolerance. Split squats and
          step-ups progress toward the ATG split squat only as range comes
          back pain-free — range is the target, not load.
        adaptations:
          - "Knee tolerance"
          - "Pain-free range of motion"
        intensity: "Unloaded to light"
      - id: load
        name: "Load"
        kind: build
        weeks: 8
        framework_id: atg_joint_health
        focus: "Resistance through the earned range"
        description: >
          Once full range is pain-free, resistance is added through it:
          loaded ATG split squats, Nordic curls and step-ups, with the sled and
          tibialis work kept as the entry to every session.
        adaptations:
          - "Strength at end range"
          - "Posterior-chain resilience"
        intensity: "Moderate, range first"
      - id: maintain
        name: "Maintain"
        kind: maintenance
        weeks: 4
        repeatable: true
        framework_id: atg_joint_health
        focus: "Keep the lower-body prep"
        description: >
          The lower-body prep stays in place alongside any other training,
          keeping the range and the joint tolerance that were built.
        adaptations:
          - "Retained range and tolerance"
        intensity: "Low"
