id: gj_of_d12
name: "Operator Fitness — Day 12: Strength"
modality: max_strength
category: conditioning
training_levels: [intermediate, advanced, elite]
duration_estimate_minutes: 75
pool_only: true

slots:
  - role: wall_squat
    slot_type: sets_reps
    sets: 2
    reps: 5
    exercise_filter:
      exercise_ids: [wall_squat]
      ordered: true

  - role: air_squat
    slot_type: sets_reps
    sets: 2
    reps: 10
    exercise_filter:
      exercise_ids: [squat_air]
      ordered: true

  - role: goblet_squat
    slot_type: sets_reps
    sets: 2
    reps: 5
    exercise_filter:
      exercise_ids: [kb_squat_goblet]
      ordered: true
    load: "25 lb (11 kg)"

  - role: sl_squat
    slot_type: sets_reps
    sets: 5
    reps: 5
    exercise_filter:
      exercise_ids: [single_leg_squat_box]
      ordered: true
    notes: "Single-leg squat to a 20 in (51 cm) box."

  - role: step_up
    slot_type: sets_reps
    sets: 5
    reps: '2/side'
    exercise_filter:
      exercise_ids: [weighted_step_up]
      ordered: true
    load: "95-135 lb (43-61 kg), after working up to it"
    notes: "No help from the trailing leg; 60 s rest."

  - role: get_ups
    slot_type: sets_reps
    sets: 5
    reps: 6
    exercise_filter:
      exercise_ids: [kb_tgu]
      ordered: true
    load: "25 lb (11 kg) dumbbell"
    notes: "Each round, 6 get-ups then 60 s in the front leaning rest."

  - role: flr
    slot_type: static_hold
    sets: 5
    hold_seconds: 60
    exercise_filter:
      exercise_ids: [plank_hold]
      ordered: true

required_equipment:
- barbell
- box
- dumbbell
- kettlebell
- medicine_ball
- open_space
- plates
- pull_up_bar
- rack
- rower
sources:
- "Gym Jones, Operator Fitness (Rob MacDonald)"
notes: >
  Squat warm-up, weighted step-ups 5x2 a side, then five rounds of 6 get-ups and 60 s in the front leaning rest.
