id: gj_sos_d22
name: "Soldier of Steel — Day 22: Workout"
modality: mixed_modal_conditioning
category: conditioning
training_levels: [novice, intermediate]
duration_estimate_minutes: 60
pool_only: true

slots:
  - role: warm_up
    slot_type: time_domain
    duration_minutes: 10
    exercise_filter:
      exercise_ids: [run_easy]
      ordered: true
    notes: "Run 10 minutes at an easy pace."

  - role: man_maker_ladder
    slot_type: sets_reps
    sets: 5
    reps: '12-10-8-6-4'
    exercise_filter:
      exercise_ids: [man_maker]
      ordered: true
    load: "none, then 2 x 15, 20, 25, 30 lb (7-14 kg)"
    notes: "12 without weight, 10 with 2 x 15 lb, 8 with 2 x 20, 6 with 2 x 25, 4 with 2 x 30; rest 2-3 minutes between sets."

  - role: heavy_man_makers
    slot_type: sets_reps
    sets: 8
    reps: 2
    exercise_filter:
      exercise_ids: [man_maker]
      ordered: true
    load: "40-60 lb (18-27 kg) dumbbells"
    notes: "Rest 30 s between sets."

  - role: box
    slot_type: time_domain
    duration_minutes: 12
    exercise_filter:
      exercise_ids: [box_jump]
      ordered: true
    notes: "Five to seven rounds on an 18-20 in box: 30 s box jumps, 60 s step-ups, 30 s rest."

required_equipment:
- box
- dumbbell
- open_space
sources:
- "Gym Jones, Soldier of Steel (Army National Guard, 2013)"
notes: >
  The man-maker ladder, 8x2 heavy man-makers, then five to seven rounds of box jumps and step-ups.
