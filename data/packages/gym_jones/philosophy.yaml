id: gym_jones
name: "Gym Jones / Mark Twight"
core_principles:
  - mind_is_primary_limiter
  - work_tolerance_is_most_trainable_characteristic
  - horsepower_over_appearance
  - fit_for_whatever_comes_next_not_peaked_in_one_domain
  - maintain_60_to_70_pct_across_all_fitness_domains
  - hard_day_followed_by_recovery_day
  - general_fitness_before_sport_specific
  - no_shortcuts
  - power_endurance_and_strength_endurance_over_max_strength
  - progress_by_less_rest_or_more_weight_form_range_and_speed
scope:
  - max_strength
  - strength_endurance
  - aerobic_base
  - anaerobic_intervals
  - mixed_modal_conditioning
  - power
  - durability
bias:
  - strength_endurance
  - mixed_modal_conditioning
  - durability
avoid_with: []

primary_track_id: operator_fitness
# Novices take Soldier of Steel, the plan Gym Jones wrote for the newly
# training; everyone else Operator Fitness.
track_for_level:
  novice: soldier_of_steel
  intermediate: operator_fitness
  advanced: operator_fitness
  elite: operator_fitness
tracks:
  - id: operator_fitness
    name: "Operator Fitness"
    # The three-block periodization track, dropped on 2026-10-21: a stored
    # program that names it regenerates as Operator Fitness.
    former_ids: [block_periodization]
    description: >
      Gym Jones' one-month Foundation plan, day by day, six days a week:
      strength, circuits and accumulation, recovery days and a long hike with
      a pack. Done once, or repeated a few times in a row.
    phases:
      - id: foundation
        name: "Foundation"
        kind: base
        weeks: 4
        repeatable: true
        former_ids: [accumulation, transmutation, realization]
        framework_id: operator_fitness
        focus: "Fit for whatever comes next"
        description: >
          Twenty-eight days as written: strength, progression, circuit,
          accumulation, power endurance and interval days, each followed by a
          recovery day, a 90-120 minute hike with a light pack, a rest day.
        adaptations:
          - "Strength, power endurance and endurance, evenly"
          - "Single-leg and core strength"
        intensity: "Hard days and recovery days"
        week_templates:
          - [strength, recovery, progression, recovery, circuit, endurance, rest]
          - [power_endurance, recovery, interval, recovery, strength, endurance, rest]
          - [strength, recovery, breathing_ladder, recovery, accumulation, endurance, rest]
          - [progression, recovery, circuit, recovery, strength, endurance, rest]
  - id: soldier_of_steel
    name: "Soldier of Steel"
    description: >
      Gym Jones' month for the newly training, day by day: a workout, a
      recovery day, a workout, a recovery day, a workout, a recovery day, rest.
      Repeat it, or make it harder by less rest or more weight.
    phases:
      - id: soldier_of_steel
        name: "Soldier of Steel"
        kind: base
        weeks: 4
        repeatable: true
        framework_id: soldier_of_steel
        focus: "Fundamental movements and the habit of daily exercise"
        description: >
          Twenty-eight days as written, most needing only open space; the
          beginner versions printed on the days.
        adaptations:
          - "Work tolerance"
          - "Power endurance and strength endurance"
          - "General endurance"
        intensity: "Hard days and recovery days"
        week_templates:
          - [sos_workout, sos_recovery, sos_workout, sos_recovery, sos_workout, sos_recovery, rest]
          - [sos_workout, sos_recovery, sos_workout, sos_recovery, sos_workout, sos_recovery, rest]
          - [sos_workout, sos_recovery, sos_workout, sos_recovery, sos_workout, sos_recovery, rest]
          - [sos_workout, sos_recovery, sos_workout, sos_recovery, sos_workout, sos_recovery, rest]
