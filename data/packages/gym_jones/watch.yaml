# How Gym Jones sessions look on the watch (docs/schemas/watch.schema.json).
# Field, title, line and action ids are the vocabulary in
# data/commons/watch_vocabulary.json; anything not named here is the
# vocabulary's default for the slot type.
id: gym_jones
spec_version: 1
archetypes:
  # Operator Fitness' recovery days 4, 16 and 25: "100 get-ups", not one set
  # of 100 — the number the athlete tracks is the running total, per side.
  gj_of_d04:
    slots:
      get_ups: &get_ups
        a: cumulative
        lines: phases
        phases: [roll, post, bridge, sweep, lunge, stand]
        behaviours: { side_tracked: true, cumulative_target: 100 }
  gj_of_d16:
    slots:
      get_ups: *get_ups
  gj_of_d25:
    slots:
      get_ups: *get_ups
  gj_of_d17:
    slots:
      # About 400 swings climbing 1..20 and back; a flat clock says nothing,
      # so LAP logs each rung against the clock. The practice swings before
      # it stay plain sets.
      ladder:
        template: for_time
        a: rung
        lines: ladder_total
        behaviours: { ladder: { peak: 20 } }
