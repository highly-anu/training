# How Gym Jones sessions look on the watch (docs/schemas/watch.schema.json).
# Field, title, line and action ids are the vocabulary in
# data/commons/watch_vocabulary.json; anything not named here is the
# vocabulary's default for the slot type.
id: gym_jones
spec_version: 1
archetypes:
  gym_jones_tgu_recovery:
    slots:
      # "100 get-ups", not "10 sets of 5": the number the athlete tracks is the
      # running total, per side.
      tgu_volume:
        a: cumulative
        lines: phases
        phases: [roll, post, bridge, sweep, lunge, stand]
        behaviours: { side_tracked: true, cumulative_target: 100 }
  gym_jones_breathing_ladder:
    slots:
      # About 400 swings climbing 1..20 and back; a flat round counter says
      # nothing. The warm-up swings stay plain sets.
      breathing_ladder:
        a: rung
        lines: ladder_total
        behaviours: { ladder: { peak: 20 } }
  emom_strength:
    slots:
      # Where in the wave this minute's load sits, rather than recalled from notes.
      primary_emom_lift:
        behaviours: { load_wave: [85, 87, 90, 92, 95, 92, 90, 90, 87, 85] }
