# What progress means for Gym Jones: the plan's days done as written (work
# tolerance), and the times its rows and runs record.
id: gym_jones

# The operator's mark: the 2000 m row Operator Fitness rows on day 15, at
# its ladder's elite rung (docs/logic/levels.md).
elite_standards: [row_2km_minutes]

progress:
  - id: plan_completion
    label: Days done as written
    primitive: session_completion
    headline: true

  - id: row_times
    label: Rows for time
    primitive: duration
    scope: {slot_types: [for_time]}
