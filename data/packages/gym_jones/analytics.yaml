# What progress means for Gym Jones: the plan's days done as written (work
# tolerance), and the times its rows and runs record.
id: gym_jones

progress:
  - id: plan_completion
    label: Days done as written
    primitive: session_completion
    headline: true

  - id: row_times
    label: Rows for time
    primitive: duration
    scope: {slot_types: [for_time]}
