front_squat:
  animation:
    external_id: Front_Barbell_Squat
    gif_alt: Front Squat
    gif_source: free_exercise_db
    gif_url: https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Front_Barbell_Squat/0.jpg
    type: gif
  coaching_focus: Elbows up — if they drop, the bar rolls and the lift is over; everything else flows
    from keeping them high.
  common_errors:
  - Elbows dropping during descent — this tips the bar forward and dumps the lift; wrist and lat stretch
    are usually the root cause
  - 'Good morning out of the hole: hips rise faster than the bar — means the load exceeds current front-rack
    strength'
  - Bar sits on hands rather than shoulders — causes wrist strain and an unstable rack
  cue_points:
  - 'Clean grip or crossed-arm: fingertips only on the bar, no wrapping — elbows must travel high and
    forward'
  - Keep elbows parallel to the floor throughout; they should point forward, not toward the floor
  - Torso stays upright — a vertical shin is less important here than a vertical torso
  - Push knees out just as in the back squat; the front rack does not change that demand
  - Stand tall on the way up — do not dump the elbows as fatigue sets in
  description: The front squat holds the barbell in a front-rack position across the anterior deltoids,
    forcing a more upright torso than the back squat and placing greater demand on the quadriceps and
    thoracic spine. Gym Jones programs it as a primary strength movement (10x2 at 1-min rest); Horsemen
    benchmark is 1.5x bodyweight.
  muscle_diagram:
    highlight_primary:
    - quadriceps
    - core
    - erector_spinae
    highlight_secondary:
    - glutes
    - adductors
    - deltoids
  muscles_primary:
  - quadriceps
  - core
  - erector_spinae
  muscles_secondary:
  - glutes
  - adductors
  - deltoids
