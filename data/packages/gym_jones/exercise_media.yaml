  animation:
    type: none
  coaching_focus: Smooth transitions; the bell never rests.
  common_errors:
  - A bell too heavy for the weakest lift
  cue_points:
  - Plan the order before you start
  - Grip lightly between lifts
  - Hinge, do not squat, the swings
  description: 'A kettlebell complex: several lifts in a row without putting the bell down.'
  muscle_diagram:
    highlight_primary:
    - glutes
    - shoulders
    highlight_secondary:
    - hamstrings
    - core
  muscles_primary:
  - glutes
  - shoulders
  muscles_secondary:
  - hamstrings
  - core
kb_squat_goblet:
  animation:
    external_id: Goblet_Squat
    gif_alt: Kettlebell Goblet Squat
    gif_source: free_exercise_db
    gif_url: https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Goblet_Squat/0.jpg
    type: gif
  coaching_focus: Use the bell as a counterbalance — allow the torso to stay upright by letting the weight
    in front pull you into depth, not fight you out of it.
  common_errors:
  - 'Forward lean of the torso: usually holding the bell away from the body rather than tight to the chest'
  - 'Heels rising: ankle dorsiflexion limitation — elevate the heels temporarily while working ankle mobility'
  - 'Knee cave: the elbows-to-knees cue helps; add a band above the knees as tactile feedback'
  cue_points:
  - Hold the bell by the horns at chest height; elbows point down and are tucked inside the knees at depth
  - Feet shoulder-width or slightly wider; toes turned out 30–45 degrees
  - Sink into depth — elbows track inside the knees and push them outward as a coaching cue
  - Upright torso throughout; the counterbalance should make this easier than a bodyweight squat
  - 'At the bottom: pause, reach the elbows into the knees, and feel the hip stretch before standing'
  description: The goblet squat holds the kettlebell at chest height by the horns and squats to full depth
    — the anterior load counterbalances the hips and teaches an upright torso, making it one of the most
    effective squat teaching tools available. Gym Jones uses it (25 lb) in the warm-up 2×5 before strength
    sessions. It is the appropriate first squat loaded with an implement.
  muscle_diagram:
    highlight_primary:
    - quadriceps
    - glutes
    highlight_secondary:
    - adductors
    - core
    - erector_spinae
  muscles_primary:
  - quadriceps
  - glutes
  muscles_secondary:
  - adductors
  - core
  - erector_spinae
kb_step_up:
  animation:
    type: none
  coaching_focus: The trailing leg does nothing — if it pushes, you are using it; test yourself by holding
    the trailing foot an inch off the ground.
  common_errors:
  - 'Trailing foot push-off: the most common fault; hold the foot slightly elevated to enforce the single-leg
    demand'
  - 'Toes-only placement on the box: reduces stability and shifts load to the ankle rather than the hip
    and knee'
  - 'Forward lean: the torso should be vertical; any lean forward means the hip is not extending through
    the top'
  cue_points:
  - Place the entire foot on the box — heel and ball of the foot, not just the toes
  - Drive through the heel of the working leg; the trailing knee can swing through but the foot must not
    push
  - Torso stays upright — the bell can be held in rack position or at the side
  - 'Descend with control on the working leg: the eccentric is as valuable as the concentric'
  - Complete all reps on one side before switching
  description: The kettlebell step-up is a single-leg strength movement where the athlete steps up to
    a box holding one kettlebell, driving through the heel of the working leg with no assistance from
    the trailing leg. It approximates the Gym Jones loaded step-up protocol when a barbell is not available
    and builds the unilateral leg strength essential for field work.
  muscle_diagram:
    highlight_primary:
    - quadriceps
    - glutes
    highlight_secondary:
    - hamstrings
    - adductors
    - core
  muscles_primary:
  - quadriceps
  - glutes
  muscles_secondary:
  - hamstrings
  - adductors
  - core
kb_swing_breathing_ladder:
  animation:
    type: none
  coaching_focus: The breath count is the rest — do not rush the breathing, do not skip breaths; if the
    breathing is not complete, neither is the recovery.
  common_errors:
  - 'Rushing the breathing rest: the ladder becomes a straight continuous set and the self-regulatory
    benefit disappears'
  - 'Technique degrading in the large middle sets: quality must be maintained regardless of rep count
    — these are the sets that build or break the pattern'
  - 'Wrong weight: too heavy and the ladder fails at the top; too light and there is no adaptation stimulus
    — 24 kg is the established standard for trained athletes'
  cue_points:
  - 'Every rep of every set must be perfect: the ladder is designed to be performed at full quality, not
    race pace'
  - Count breaths deliberately and out loud if necessary — rushing shortchanges the rest and compounds
    fatigue early
  - The peak (set of 20) is the most demanding; identify your limiting factor before the ladder — grip,
    hip, or breath
  - 'At high rep sets, break large sets into smaller clusters if needed: 10+10 counts as 20 if both are
    perfect'
  - The descent is psychologically easier; maintain pace and do not rush the breaths just because it is
    going down
  description: 'The Gym Jones breathing ladder assigns rest by breath count — swing once, breathe once;
    swing twice, breathe twice — climbing from 1 to 20 and descending back to 1 for approximately 400
    total swings. The breathing is the rest period: the count enforces complete oxygen recovery between
    sets and makes the workout self-regulating. Mark Twight programmed it at 53 lb (24 kg).'
  muscle_diagram:
    highlight_primary:
    - glutes
    - hamstrings
    - erector_spinae
    highlight_secondary:
    - core
    - deltoids
    - forearms
  muscles_primary:
  - glutes
  - hamstrings
  - erector_spinae
  muscles_secondary:
  - core
  - deltoids
  - forearms
kb_swing_two_hand:
  animation:
    type: none
  coaching_focus: The arms are ropes attached to the bell — they do not lift it; the hips snap and the
    bell floats.
  common_errors:
  - 'Squatting the swing: hips drop and the torso stays upright — the bell lifts rather than floats; this
    is a quad exercise, not a ballistic'
  - 'Arms lifting the bell: early shoulder elevation kills the hip drive connection'
  - 'Lower back rounding on the backswing: the hinge must be maintained through the entire downswing'
  - 'Soft glutes at the top: the lockout should be aggressive — squeezed glutes are the braking force'
  cue_points:
  - 'Hike the bell back aggressively between the legs: the hinge happens first, not a squat'
  - Snap the hips forward explosively — glutes fire hard at the top, not the lower back
  - 'At the top the body is a rigid plank: glutes, abs, and quads all contracted simultaneously'
  - Let the bell float to shoulder height; do not muscle it up with the arms
  - 'On the backswing: hinge back and let the bell pull you into the next rep — catch the load with the
    hamstrings'
  - 'Breath: exhale sharply at the top of the swing with a hiss — the exhale protects the spine'
  description: The two-hand kettlebell swing is the foundational ballistic — a hip-hinge-driven movement
    where the bell is projected to shoulder height by explosive hip extension, not a squat-and-lift. It
    simultaneously develops posterior-chain power, aerobic capacity, and trunk stiffness under load. Horsemen
    include it in every warm-up; Gym Jones programs the breathing ladder format with 24 kg.
  muscle_diagram:
    highlight_primary:
    - glutes
    - hamstrings
    - erector_spinae
    highlight_secondary:
    - core
    - quadriceps
    - deltoids
  muscles_primary:
  - glutes
  - hamstrings
  - erector_spinae
  muscles_secondary:
  - core
  - quadriceps
  - deltoids
kb_tgu:
  animation:
    external_id: Kettlebell_Turkish_Get-Up_Lunge_style
    gif_alt: Kettlebell Turkish Get-Up
    gif_source: free_exercise_db
    gif_url: https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Kettlebell_Turkish_Get-Up_Lunge_style/0.jpg
    type: gif
  coaching_focus: The bell does not move — your body moves underneath it; every fault in position is revealed
    by the bell shifting.
  common_errors:
  - 'Losing the overhead lockout: the shoulder dips or the elbow bends at any transition — stop and rebuild
    from that position'
  - 'Eyes leaving the bell: looking away correlates with losing the overhead position'
  - 'Rushing the transitions: each position must be stable before moving to the next — the TGU rewards
    patience'
  - 'Hip not fully bridged before the leg sweep: the lunge is impossible to achieve cleanly without full
    hip extension first'
  cue_points:
  - Lie on your back, bell in the right hand, right elbow bent — roll to load the wrist before pressing
  - Press to full lockout; eyes stay on the bell for the entire get-up
  - Roll to the left elbow, then to the left hand — the right shoulder stays packed throughout
  - 'High bridge: drive the right hip up while supporting on the left hand and right heel'
  - Sweep the left leg under to the lunge position; stand up maintaining the overhead lockout
  - Reverse every step identically — the descent is as demanding as the ascent; rush it and you will catch
    the floor
  description: The Turkish get-up takes an athlete from lying on the floor to standing and back with a
    kettlebell locked overhead throughout — a sequence of seven positions each requiring shoulder stability,
    hip mobility, and integrated trunk control. Gym Jones programs 100 TGUs at 15 lb as a recovery modality;
    Horsemen use it as a benchmark (100 reps at 35 lb). It is foundational to all overhead carry work.
  muscle_diagram:
    highlight_primary:
    - deltoids
    - core
    - glutes
    highlight_secondary:
    - quadriceps
    - hamstrings
    - adductors
    - erector_spinae
  muscles_primary:
  - deltoids
  - core
  - glutes
  muscles_secondary:
  - quadriceps
  - hamstrings
  - adductors
  - erector_spinae
lunge:
  animation:
    external_id: Barbell_Walking_Lunge
    gif_alt: Walking Lunge
    gif_source: free_exercise_db
    gif_url: https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Barbell_Walking_Lunge/0.jpg
    type: gif
  coaching_focus: The front shin stays near-vertical at the bottom -- if the knee shoots forward past
    the toes, the quad is overloading and the hip is not working.
  common_errors:
  - 'Knee-forward position: the front knee tracking over or past the toes means the stride was too short
    and the front heel is lifting'
  - 'Torso pitching forward: either a balance issue or a hip flexor tightness issue on the trailing side
    -- address both'
  - 'Back knee slamming the floor: the eccentric descent of the back knee should be controlled throughout'
  cue_points:
  - Step forward with enough stride length that the front shin can stay vertical at the bottom
  - Back knee descends toward but does not slam the floor -- controlled descent, soft tap if any contact
  - 'Torso upright throughout: no forward lean; the chest stays tall'
  - Drive through the front heel to stand and step through into the next lunge
  - Arms can swing naturally for balance or be held at sides; add load by holding dumbbells at the sides
  description: The walking lunge is an alternating-leg unilateral lower-body movement stepping forward
    into a lunge position with the back knee approaching the floor. Gym Jones programs 2x20m walking lunges
    as single-leg accessory work. It develops unilateral hip extension strength, single-leg stability,
    and the hip flexor length required for efficient bipedal locomotion. It transfers directly to trail
    running, step-ups, and split jerks.
  muscle_diagram:
    highlight_primary:
    - quadriceps
    - glutes
    highlight_secondary:
    - hamstrings
    - adductors
    - core
  muscles_primary:
  - quadriceps
  - glutes
  muscles_secondary:
  - hamstrings
  - adductors
  - core
lunge_jumping:
  animation:
    external_id: Split_Jump
    gif_alt: Split Jump Lunge
    gif_source: free_exercise_db
    gif_url: https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Split_Jump/0.jpg
    type: gif
  coaching_focus: Land in a full lunge position -- if you are landing with feet close together or on stiff
    legs, the power output was too high for the current landing skill; reduce height and land with control.
  common_errors:
  - 'Landing with feet together: the split should be maintained in the air and re-established cleanly
    on landing'
  - 'Short split at landing: the landing lunge position is too shallow -- same depth standard as the walking
    lunge'
  - 'Torso crumbling forward on landing: the trunk must stay upright; forward collapse is a hip stability
    issue'
  cue_points:
  - Start in a full lunge split stance with the back knee close to the floor
  - Drive off both legs simultaneously -- the back foot pushes off the toe, the front foot pushes through
    the heel
  - 'Switch legs during flight: the back leg swings forward, the front leg swings back'
  - Land in a full lunge on the opposite side with the same descent control as the walking lunge
  - Maintain a tall torso throughout -- hunching forward on the landing means the hips are absorbing less
  description: The split jump lunge (plyometric lunge) starts in a split stance, jumps vertically, switches
    legs mid-air, and lands in the opposite split stance. It is a high-power, high-impact lower-body plyometric.
    Gym Jones programs it as a power-endurance tool in circuits. The demand on the hip flexors, glutes,
    and quad of each leg alternates rapidly, creating a significant metabolic and neuromuscular stimulus.
  muscle_diagram:
    highlight_primary:
    - quadriceps
    - glutes
    - calves
    highlight_secondary:
    - hamstrings
    - core
  muscles_primary:
  - quadriceps
  - glutes
  - calves
  muscles_secondary:
  - hamstrings
  - core
