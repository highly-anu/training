romanian_deadlift:
  animation:
    external_id: Romanian_Deadlift
    gif_alt: Romanian Deadlift
    gif_source: free_exercise_db
    gif_url: https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Romanian_Deadlift/0.jpg
    type: gif
  coaching_focus: The bar should graze your legs all the way down — if it swings away from you, you have
    lost the hip hinge.
  common_errors:
  - Rounding the lower back on descent — almost always a hamstring flexibility limitation; limit range
    until mobility improves
  - Bar swinging away from the legs — losing the hip hinge; bar should stay within 2 inches of your legs
  - Bending the knees too much — turns it into a conventional deadlift with a short range; keep the knee
    angle constant once set
  cue_points:
  - Start from standing with a proud chest and packed shoulders
  - Initiate by pushing your hips back — not by bending the knees or rounding forward
  - Soft bend in the knees throughout, but they do not drive the movement
  - Descend until you feel a strong hamstring stretch — typically just below the knee
  - Bar tracks close to the legs; think of shaving your shins on the way down
  - Return by driving hips forward to standing, not by lifting the chest
  description: The Romanian deadlift initiates from standing and descends with a soft-knee hip hinge until
    the hamstrings reach end-range, then returns to full hip extension — the bar never touches the floor.
    It builds hamstring length under load and posterior-chain resilience. Gym Jones programs 3x10 as an
    accumulation staple.
  muscle_diagram:
    highlight_primary:
    - hamstrings
    - glutes
    - erector_spinae
    highlight_secondary:
    - adductors
    - core
    - forearms
  muscles_primary:
  - hamstrings
  - glutes
  - erector_spinae
  muscles_secondary:
  - adductors
  - core
  - forearms
