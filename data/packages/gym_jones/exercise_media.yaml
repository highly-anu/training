wall_squat:
  animation:
    type: none
  coaching_focus: Touch the wall with the toes at all times -- if the toes have to move away from the
    wall to reach depth, the ankle and hip mobility that are limiting the squat have been found.
  common_errors:
  - 'Moving the toes away from the wall to achieve depth: this accommodates the restriction rather than
    revealing it'
  - 'Using the hands on the wall to pull into depth: the drill is self-assessed; using the wall as an
    assist changes the test'
  - 'Feet too wide: a very wide stance bypasses the ankle dorsiflexion requirement and allows depth without
    addressing the restriction'
  cue_points:
  - Stand with toes touching the wall, feet hip-width, toes angled out slightly
  - Squat to full depth with the knees tracking over the toes and touching the wall
  - Hands on the wall for balance as needed
  - The torso must stay relatively upright -- the wall prevents the forward lean that compensates for
    mobility deficits
  - 5 reps; use the feedback to direct the mobility work for that session
  description: 'The wall squat (Gym Jones) is a squat mobility drill with the toes touching a wall --
    the wall enforces a vertical shin position and upright torso, simultaneously testing ankle dorsiflexion,
    hip flexor mobility, and thoracic extension. Gym Jones programs 2-3 sets of 5 before every lower-body
    strength or circuit session. The wall is the diagnostic: touching the wall with the toes while achieving
    full depth reveals the actual mobility requirement, not the athlete compensating with a forward lean.'
  muscle_diagram:
    highlight_primary: []
    highlight_secondary: []
  muscles_primary: []
  muscles_secondary: []
weighted_step_up:
  animation:
    type: none
  coaching_focus: The trailing leg is dead weight — if it contributes at all, you are doing an assisted
    step-up, not a weighted step-up.
  common_errors:
  - 'Pushing off the trailing foot: the most common cheat; trailing leg touches only as a balance point'
  - 'Foot not fully on the box: stepping with the ball of the foot reduces stability'
  - 'Forward lean: loses the upright torso and reduces the quad demand'
  cue_points:
  - Place the entire foot on the box before beginning the drive — not just the toes
  - Drive through the heel of the working leg; the trailing knee brushes past the box without pushing
    off
  - Torso stays upright — do not lean forward to use momentum
  - 'Work each side independently: complete all reps on one leg then the other'
  - 'The step-down is also unilateral: lower with control on the working leg'
  description: The weighted step-up places the barbell on the back and has the athlete step up to a 20-inch
    box relying exclusively on the leading leg — no push from the trailing leg. Gym Jones programs it
    as a heavy single-leg strength movement with 5x2 each side at near-maximal load, building the unilateral
    deployment strength critical for field performance.
  muscle_diagram:
    highlight_primary:
    - quadriceps
    - glutes
    highlight_secondary:
    - hamstrings
    - adductors
    - core
  muscles_primary:
  - quadriceps
  - glutes
  muscles_secondary:
  - hamstrings
  - adductors
  - core
