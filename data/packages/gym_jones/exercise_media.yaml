power_clean:
  animation:
    external_id: Power_Clean
    gif_alt: Power Clean
    gif_source: free_exercise_db
    gif_url: https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Power_Clean/0.jpg
    type: gif
  coaching_focus: The hips extend violently at the hip crease and the bar is pulled in close — any early
    arm bend kills the pull.
  common_errors:
  - 'Early arm bend: bending the elbows before full hip extension — disconnects hip power from the bar'
  - 'Bar swinging away from the body on the first pull: creates a longer lever arm; drag it up the thighs'
  - 'Not completing the hip extension: cutting the second pull short means less power transferred to the
    bar'
  - 'Soft elbows in the catch: the front rack must be locked in place before receiving the bar'
  cue_points:
  - 'First pull: identical to deadlift setup — bar over mid-foot, back arched, chest up'
  - The bar must pass the knee before the second pull begins — patience on the first pull
  - At hip contact, extend the hips and shrug explosively; elbows drive high and outside
  - Pull yourself under the bar immediately — do not wait at the top
  - 'Receive in a partial squat: front rack with elbows high, hips above parallel'
  - Stand to full extension before lowering the bar
  description: The power clean pulls the bar from the floor to the front rack in one explosive hip-extension-driven
    movement, receiving it in a partial squat above parallel. It is the primary power development movement
    in the barbell system and a direct training stimulus for athletic explosiveness. Starting Strength
    programs 1x5; Horsemen Olympic Day uses wave loading at 80–90%.
  muscle_diagram:
    highlight_primary:
    - glutes
    - hamstrings
    - erector_spinae
    highlight_secondary:
    - quadriceps
    - deltoids
    - core
    - calves
  muscles_primary:
  - glutes
  - hamstrings
  - erector_spinae
  muscles_secondary:
  - quadriceps
  - deltoids
  - core
  - calves
pull_up:
  animation:
    type: none
  coaching_focus: Dead hang fully at the bottom -- if you do not reach full elbow extension, you are doing
    a partial ROM exercise, not a pull-up.
  common_errors:
  - 'Half reps: not reaching full extension at the bottom caps strength development and creates poor movement
    habits'
  - 'Kipping under a strict prescription: kipping is a separate skill; mixing them unknowingly trains
    neither'
  - 'Chin in front of, not over, the bar: the standard is chin over -- partial top-range reps do not count'
  cue_points:
  - 'Start from a dead hang: shoulders fully elevated (passive) or actively depressed before initiating'
  - Drive the elbows down and back -- think of pulling the bar to the sternum, not the hands up
  - Chin clears the bar at the top; do not tuck the chin or crane the neck forward
  - Return to full dead hang at the bottom -- partial descents reduce the strength stimulus and build
    a false ceiling
  - Squeeze glutes and brace the core throughout -- no swinging or kipping in the strict variant
  description: The strict pull-up is the foundational upper-body vertical pulling test -- a dead-hang
    start with full elbow extension at the bottom, chin clearing the bar at the top. Marcus Filly treats
    it as the primary pulling strength metric; Gym Jones programs it at high volume in Murph-style sessions.
    Relative strength in this movement reliably predicts overall athletic capacity.
  muscle_diagram:
    highlight_primary:
    - upper_back
    - lats
    - biceps
    highlight_secondary:
    - core
    - forearms
    - deltoids
  muscles_primary:
  - upper_back
  - lats
  - biceps
  muscles_secondary:
  - core
  - forearms
  - deltoids
push_up:
  animation:
    type: none
  coaching_focus: The push-up is a moving plank -- if the hips sag or pike at any point in the set, the
    rep does not count and the set is over.
  common_errors:
  - 'Hip sag: the most common fault; the core gives out before the chest does -- when hips drop, the set
    ends'
  - 'Elbow flare: elbows at 90 degrees loads the anterior shoulder capsule in a stressful position --
    keep them at 45 degrees'
  - 'Partial ROM at the bottom: hovering above the floor eliminates the pec stretch and reduces the training
    stimulus significantly'
  cue_points:
  - Hands slightly wider than shoulder-width; elbows track at 45 degrees from the torso -- not 90 degrees
    out
  - Body forms a rigid plank from heel to crown; squeeze glutes and brace the core before the first rep
  - Chest touches the floor at the bottom -- no hovering an inch above; this is a full ROM exercise
  - Full lockout at the top; the arms extend completely and the scapulae protract at lockout
  - 'Breathe: inhale on the way down, exhale at the top -- do not hold the breath across reps'
  description: The push-up is the foundational horizontal pressing movement -- a full plank position pressing
    from chest-to-floor to full lockout. Gym Jones programs 200+ reps in Murph-style sessions; CrossFit
    uses it as a primary conditioning tool. It simultaneously trains the horizontal press, scapular stability,
    and anti-extension core. The push-up is the most scalable pressing exercise and the foundation for
    all ring and parallette progressions.
  muscle_diagram:
    highlight_primary:
    - pec
    - triceps
    - deltoids
    highlight_secondary:
    - core
    - serratus
  muscles_primary:
  - pec
  - triceps
  - deltoids
  muscles_secondary:
  - core
  - serratus
