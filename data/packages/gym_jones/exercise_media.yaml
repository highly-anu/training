ball_slam:
  animation:
    type: none
  coaching_focus: Slam with the whole body, not the arms.
  common_errors:
  - Rounding to pick the ball up
  cue_points:
  - Reach tall overhead
  - Pull down through the abs and hips
  - Squat to pick the ball up
  description: A medicine ball lifted overhead and thrown into the floor.
  muscle_diagram:
    highlight_primary:
    - lats
    - core
    highlight_secondary:
    - shoulders
    - glutes
  muscles_primary:
  - lats
  - core
  muscles_secondary:
  - shoulders
  - glutes
barbell_complex:
  animation:
    type: none
  coaching_focus: Every rep of every movement counts — the complex fails the moment one movement is performed
    poorly, even if you do not drop the bar.
  common_errors:
  - 'Loading too heavy: the complex exposes the weakest link — start lighter than feels right'
  - 'Dropping the bar between movements: this ends the complex; if you must put it down, the load is too
    heavy'
  - 'Rushing movements under fatigue: the complex should be performed with controlled aggression'
  cue_points:
  - 'Load conservatively: the complex is finished when the weakest movement fails, usually the push press'
  - 'Movement order is non-negotiable for flow: the clean leads naturally into the front squat and then
    push press'
  - 'Between movements: reset your breath and brace briefly — do not rush the transitions'
  - The bar never leaves your hands and never touches the floor between the row and the clean
  - 'The back squat comes last: upper body is pre-fatigued, so the load feels heavier than it is'
  - Use 1–2 minutes rest between sets; this is conditioning, not a max-strength test
  description: The Six-Way Barbell Complex strings together six movements without rest or touching the
    bar to the floor — deadlift, bent row, hang clean, front squat, push press, back squat — for six reps
    each. Used by both Gym Jones and Horsemen as a loaded warm-up and conditioning stimulus, performed
    for 3–4 sets with progressively increasing loads (75–105 lb).
  muscle_diagram:
    highlight_primary:
    - glutes
    - hamstrings
    - quadriceps
    - erector_spinae
    highlight_secondary:
    - deltoids
    - triceps
    - core
    - upper_back
  muscles_primary:
  - glutes
  - hamstrings
  - quadriceps
  - erector_spinae
  muscles_secondary:
  - deltoids
  - triceps
  - core
  - upper_back
bear_crawl:
  animation:
    external_id: Bear_Crawl_Sled_Drags
    gif_alt: Bear Crawl
    gif_source: free_exercise_db
    gif_url: https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Bear_Crawl_Sled_Drags/0.jpg
    type: gif
  coaching_focus: Hips stay low and level -- if the hips are swaying side to side or rising high with
    each step, the crawl has degenerated into a four-point trot; slow down and keep the hips level.
  common_errors:
  - 'Hips rising too high: the crawl becomes a downward-dog walk; keep the knees close to the floor'
  - 'Ipsilateral movement (same-side hand and foot together): this is the common untrained pattern and
    removes the contralateral coordination demand'
  - 'Head dropping: the head should be neutral, not hanging down; maintain full-body awareness throughout'
  cue_points:
  - Start on hands and knees (tabletop position) with knees hovering 1-2 inches off the floor
  - Move the right hand and left foot simultaneously, then the left hand and right foot -- opposite limbs
    move together
  - 'Hips stay level: neither rising nor swaying side-to-side during each step'
  - 'Head neutral: looking slightly forward, neck an extension of the spine'
  - 'Slow is more challenging than fast: a slow, controlled bear crawl with level hips is harder than
    a fast, sloppy one'
  description: The bear crawl is a quadruped locomotion pattern with the hips kept low and opposite limbs
    moving simultaneously -- right hand with left foot, left hand with right foot. Gym Jones programs
    it in GPP circuits for shoulder stability, hip flexor endurance, and total-body coordination. It develops
    the contralateral coordination pattern foundational to efficient running and directly challenges the
    scapular stabilizers under dynamic loading.
  muscle_diagram:
    highlight_primary:
    - deltoids
    - core
    - quadriceps
    highlight_secondary:
    - upper_back
    - hip_flexors
    - serratus
  muscles_primary:
  - deltoids
  - core
  - quadriceps
  muscles_secondary:
  - upper_back
  - hip_flexors
  - serratus
box_jump:
  animation:
    external_id: Front_Box_Jump
    gif_alt: Box Jump
    gif_source: free_exercise_db
    gif_url: https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Front_Box_Jump/0.jpg
    type: gif
  coaching_focus: Step down, do not jump down -- under fatigue, athletes jump down from the box repeatedly,
    which accumulates Achilles tendon stress far beyond what the workout itself intends.
  common_errors:
  - 'Jumping down from the box repeatedly: under fatigue this accumulates landing impact load on the Achilles
    and patella that the workout design did not account for'
  - 'Landing with locked knees on the box: the entire lower extremity absorbs the load when the knees
    are bent; locked-knee landing concentrates it at the joint'
  - 'Scraping the shins on the box: the jump height is insufficient for the box height; reduce box height
    or improve power'
  cue_points:
  - Approach the box at a comfortable distance; use a brief dip (arm swing optional) to load the legs
  - 'Explode through the entire foot: heels through to the balls of the feet as the jump progresses'
  - Land in a partial squat on top of the box with soft knees -- the landing should be quiet
  - Stand to full extension on top of the box before stepping or jumping off
  - Step off the box -- one foot at a time; do not jump off under fatigue
  description: The box jump is a standard plyometric -- an explosive two-leg jump from the floor onto
    a box (24 inches for men, 20 for women in CrossFit standards). Gym Jones programs it in conditioning
    circuits at 20-24 inch heights. It develops lower-body explosive power and the reactive strength required
    for athletic movements. The landing mechanics and the step-down are as important as the jump height
    for long-term Achilles and patellar tendon health.
  muscle_diagram:
    highlight_primary:
    - quadriceps
    - glutes
    - calves
    highlight_secondary:
    - hamstrings
    - core
  muscles_primary:
  - quadriceps
  - glutes
  - calves
  muscles_secondary:
  - hamstrings
  - core
burpee:
  animation:
    type: none
  coaching_focus: The quality of each component does not degrade because the exercise is hard -- the push-up
    at the bottom must have chest contact and full lockout at the top, regardless of pace.
  common_errors:
  - 'Omitting the push-up chest contact: the chest-to-floor push-up is half the exercise; hovering an
    inch above and calling it a push-up is not a burpee'
  - 'Worm-style from plank (snaking up): the feet should jump back under the hips in one movement, not
    worming through the hips'
  - 'No full extension at the jump: the jump must reach full hip and knee extension; a half-jump does
    not complete the movement'
  cue_points:
  - Start standing; descend to a squat and place the hands on the floor
  - Jump or step the feet back to a plank position; do not collapse into the plank
  - 'Perform a push-up: chest to floor, full lockout -- this is a standard push-up embedded in a burpee'
  - Jump or step the feet back to squat position
  - Jump vertically with arms overhead -- full extension at the top; clap overhead as the standard
  description: The burpee is a compound movement combining a squat thrust, push-up, and vertical jump
    -- demanding coordinated transition through four distinct positions in each rep. Marcus Filly programs
    controlled-pace burpees as an aerobic capacity builder; Gym Jones uses them as the final punishing
    element in circuits. The burpee simultaneously taxes the upper and lower body and cardiovascular system,
    making it one of the most metabolically demanding bodyweight exercises.
  muscle_diagram:
    highlight_primary:
    - quadriceps
    - glutes
    - pec
    highlight_secondary:
    - core
    - deltoids
    - triceps
  muscles_primary:
  - quadriceps
  - glutes
  - pec
  muscles_secondary:
  - core
  - deltoids
  - triceps
