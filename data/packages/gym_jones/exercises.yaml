  notes: 'Standing on a 18–20 inch box, lower on one leg until the non-working heel
    touches the ground, then stand. Uses the box to limit depth and provide a proprioceptive
    endpoint — more accessible than a full pistol squat. Gym Jones Operator Fitness
    I and II primary single-leg strength exercise, performed 5×5. Eliminates assistance
    from the trailing leg. Builds posterior chain, quad, and hip stability for unilateral
    movement demands. Progress by lowering the box height toward full pistol range.

    '
