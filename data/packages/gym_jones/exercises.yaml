  notes: 'Gym Jones warm-up staple used in virtually every strength and circuit session.
    Stand with toes touching a wall, feet wide. Drop into a squat with knees tracking
    toes; contact the wall with knees to enforce vertical shin position and upright
    torso. Hands brace against wall as needed. Builds ankle mobility, hip flexor opening,
    and thoracic extension. Not a strength exercise — a diagnostic and mobility
    drill. 2–3 sets of 5 before any lower body session.

    '
