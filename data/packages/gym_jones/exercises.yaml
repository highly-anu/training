  notes: 'With DBs: plank on DBs → push-up → renegade row (each arm) → stand
    up into squat → press. Each rep is a compound sequence. Gym Jones programs DB
    complexes incorporating this movement pattern. Scale load by reducing DB weight;
    bodyweight version removes push-up row but retains squat + press.

