id: ido_portal
name: "Ido Portal / Movement Culture"
core_principles:
  - movement_quality_precedes_loading_and_complexity
  - joint_preparation_is_non_negotiable_before_loading
  - skill_acquisition_isolation_to_integration_to_spontaneous_expression
  - daily_practice_habits_matter_more_than_session_intensity
  - complexity_and_novelty_are_forms_of_progression
  - prerequisite_hierarchy_must_be_respected
  - time_based_practice_over_rep_based_intensity
  - improvisation_is_the_highest_expression_of_skill
scope:
  - mobility
  - movement_skill
bias:
  - movement_skill
  - mobility
avoid_with:
  - max_strength
  - mixed_modal_conditioning
required_equipment:
  - open_space
  - jump_rope
intensity_model: skill_based
progression_philosophy: complexity_based
sources:
  - "data/portal/Ido Portal Floreio Routines.pdf"
  - "plan.md section 1 (Ido Portal)"
notes: >
  Prerequisite hierarchy is strictly enforced: low bridge before high bridge,
  basic handstand before handstand walk, simple movement before sequences,
  sequences before improvisation (role work). Warm-up protocol is standardized
  across all sessions: 5-min jump rope, wrists routine, squat clinic, shoulder
  ROM and stabilization, 5-min joint mobility, scapula mobilization cool-down.
  Rep schemes: light 6–10, standard 10–14, high-volume 14–30; time holds 10–30s;
  continuous movement (role work) 2–5 min. Three locomotion levels (beginner /
  intermediate / advanced) define session difficulty. Floreio and locomotion
  patterns form the core archetypes. No barbell or heavy loading is prescribed —
  open space and bodyweight are the primary tools.

# Every modality this philosophy's frameworks prescribe has an archetype in
# this package; generation never needs to reach into another philosophy.
self_contained: true

# One track in Ido's three stages of skill. Phase text is drafted from this
# package's own notes and framework notes — review before relying on it.
primary_track_id: movement_practice
tracks:
  - id: movement_practice
    name: "Movement Practice Program"
    description: >
      High-frequency skill practice through Ido Portal's three stages:
      isolation, integration and spontaneous expression.
    phases:
      - id: isolation
        name: "Isolation"
        kind: base
        weeks: 12
        framework_id: high_frequency_skill
        focus: "Single patterns in a controlled setting"
        description: >
          One pattern at a time, in a controlled environment, practiced often
          and briefly — frequency beats duration. Joint preparation comes
          before any loading; it is a prerequisite, not a warm-up. A variant is
          advanced only when the current one is owned.
        adaptations:
          - "Neural learning of base patterns"
          - "Joint preparation and range"
        intensity: "Short, frequent exposures"
      - id: integration
        name: "Integration"
        kind: build
        weeks: 8
        framework_id: high_frequency_skill
        focus: "Combining patterns; adding load and complexity"
        description: >
          Patterns are combined, and load or complexity is added: simple
          movements become sequences, and harder variants open as the easier
          ones become fluent under fatigue and in varied settings.
        adaptations:
          - "Sequencing and transitions"
          - "Strength through harder variants"
        intensity: "Rising complexity"
      - id: expression
        name: "Spontaneous Expression"
        kind: peak
        weeks: 4
        framework_id: high_frequency_skill
        focus: "Reactive, improvised movement"
        description: >
          Movement becomes reactive and improvised — role work and
          environment-driven practice, where the skill is expressed rather
          than rehearsed.
        adaptations:
          - "Improvisation"
          - "Adaptability across environments"
        intensity: "Continuous movement, 2–5 minutes"
