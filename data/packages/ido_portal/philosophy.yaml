id: ido_portal
name: "Ido Portal / Movement Culture"
core_principles:
  - prepare_the_joints_before_the_floor_work
  - polish_single_movements_then_sequence_them_then_improvise
  - every_routine_written_for_beginner_intermediate_and_advanced
  - choose_the_variation_you_are_capable_of
  - breathe_fluid_movement
  - prehab_closes_the_session
scope:
  - movement_skill
  - mobility
bias:
  - movement_skill
  - mobility
avoid_with: []
required_equipment: []
intensity_model: skill_based
progression_philosophy: complexity_based
sources:
  - "Ido Portal, Floreio Routines (data/portal/Ido Portal Floreio Routines.pdf)"
notes: >
  Ido Portal's Floreio routines: every session opens with the preparation —
  jump rope or joint mobility, the wrists routine, his squat clinic, the
  shoulder ROM and stabilization routine — and closes with prehab for the
  shoulders, scapulae or wrists. Between them, the floor work of capoeira's
  floreio: bridges and rotations into them, QDR, au cortado, rolê, gatherings,
  corta capim; handstand work ("Equilibre"); locomotion patterns; and
  bodyweight conditioning. Single movements are polished, then sequenced, then
  improvised in role work. Every routine is written three times — for
  beginners, intermediates and the advanced — with "the variation you are
  capable of".

# Every modality this philosophy's frameworks prescribe has an archetype in
# this package; generation never needs to reach into another philosophy.
self_contained: true

# One track: the routines as written, the athlete's level choosing each one's
# version (docs/package-fidelity/ido_portal.md).
primary_track_id: floreio
tracks:
  - id: floreio
    name: "Floreio Routines"
    description: >
      Ido Portal's routines in turn, each at the athlete's level: Floreio
      basics and sequences, handstand work, locomotion, bridges, the static
      QDR, explosive legs, air baby and pulling.
    phases:
      - id: floreio
        name: "Floreio"
        kind: base
        weeks: 4
        repeatable: true
        former_ids: [isolation, integration, expression]
        framework_id: floreio_routines
        focus: "Polish, sequence, improvise"
        description: >
          One routine a training day, the next written for your level each
          time: preparation, single-movement polish or sequences, role work,
          handstands, locomotion or conditioning, and the prehab cool-down.
        adaptations:
          - "Floor-movement skill: bridges, QDR, au cortado, rolê"
          - "Hand balancing and locomotion"
          - "Joint preparation"
        intensity: "Breathe, fluid movement"
        week_templates:
          - [floreio, floreio, floreio, floreio, floreio, floreio, rest]
