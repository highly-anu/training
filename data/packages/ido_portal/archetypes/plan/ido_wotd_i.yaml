id: ido_wotd_i
name: Floreio Workout of the Day — Intermediate
modality: movement_skill
category: movement_skill
training_levels:
- intermediate
duration_estimate_minutes: 50
pool_only: true
slots:
- role: joint_mobility
  slot_type: time_domain
  duration_minutes: 5
  exercise_filter:
    exercise_ids:
    - joint_mobility
    ordered: true
  notes: 5 min of total body joint mobility.
- role: wrists
  slot_type: skill_practice
  sets: 1
  duration_minutes: 3
  exercise_filter:
    exercise_ids:
    - wrists_routine
    ordered: true
  notes: Wrists Routine X 1 set.
- role: horse_walk
  slot_type: distance
  sets: 1
  distance_m: 20
  exercise_filter:
    exercise_ids:
    - horse_walk
    ordered: true
  notes: Horse Walk from the Locomotion Conditioning Routine X 20 meters.
- role: duck_walk
  slot_type: distance
  sets: 1
  distance_m: 20
  exercise_filter:
    exercise_ids:
    - duck_walk
    ordered: true
  notes: Duck Walk X 20 meters.
- role: ostrich_walk
  slot_type: distance
  sets: 1
  distance_m: 20
  exercise_filter:
    exercise_ids:
    - ostrich_walk
    ordered: true
  notes: Ostrich Walk X 20 meters.
- role: scapula
  slot_type: skill_practice
  sets: 1
  duration_minutes: 3
  exercise_filter:
    exercise_ids:
    - scapula_mobilization
    ordered: true
  notes: Scapula Mobilization Routine X 1 set.
- role: handstand
  slot_type: static_hold
  sets: 3
  hold_seconds: 25
  rest_sec: 50
  exercise_filter:
    exercise_ids:
    - handstand_wall_drill
    ordered: true
  notes: Handstand Body Line Wall Drill X 20-30 sec X 3 sets / 45-60 sec rest. Rest 90 sec.
- role: sequence
  slot_type: sets_reps
  sets: 3
  reps: 10/8/8
  rest_sec: 60
  exercise_filter:
    exercise_ids:
    - au_cortado_low_bridge
    ordered: true
  notes: 'Au Cortado And Rotation Into Low Bridge: 3 sets of 10, 8, 8 reps / 60 sec rest.'
- role: role_into_qdr
  slot_type: sets_reps
  sets: 3
  reps: 10/8/8
  rest_sec: 60
  exercise_filter:
    exercise_ids:
    - role_into_qdr
    ordered: true
  notes: 'Role Into QDR sequence: 3 sets of 10, 8, 8 reps / 60 sec rest. Rest 90 sec.'
- role: high_bridge
  slot_type: sets_reps
  sets: 3
  reps: 12/10/8
  rest_sec: 45
  exercise_filter:
    exercise_ids:
    - rotations_into_high_bridge
    ordered: true
  notes: E1. Rotations into High Bridge X 12, 10, 8 reps; 45 sec between E1 and E2.
- role: gatherings
  slot_type: sets_reps
  sets: 3
  reps: 12/10/8
  rest_sec: 45
  exercise_filter:
    exercise_ids:
    - gatherings_intermediate
    ordered: true
  notes: E2. Gatherings Intermediate Variations X 12, 10, 8 reps.
- role: prehab_shoulder
  slot_type: skill_practice
  sets: 2
  duration_minutes: 4
  exercise_filter:
    exercise_ids:
    - shoulder_rom_stabilization
    ordered: true
  notes: Shoulder ROM and Stabilization routine X 2 subsequent sets, no rest.
required_equipment: []
sources:
- Ido Portal, Floreio Routines (data/portal/Ido Portal Floreio Routines.pdf), p. 10
notes: Handstand wall drill, au cortado into low bridge, role into QDR, a high bridge and gatherings finisher.
