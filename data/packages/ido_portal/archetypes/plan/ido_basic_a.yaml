id: ido_basic_a
name: Floreio Basic Workout — Advanced
modality: movement_skill
category: movement_skill
training_levels:
- advanced
- elite
duration_estimate_minutes: 60
pool_only: true
slots:
- role: jump_rope
  slot_type: time_domain
  duration_minutes: 5
  exercise_filter:
    exercise_ids:
    - jump_rope
    ordered: true
  notes: 5 min jump rope.
- role: wrists
  slot_type: skill_practice
  sets: 1
  duration_minutes: 3
  exercise_filter:
    exercise_ids:
    - wrists_routine
    ordered: true
  notes: Wrists Routine X 1 set.
- role: squat_clinic
  slot_type: skill_practice
  sets: 1
  duration_minutes: 3
  exercise_filter:
    exercise_ids:
    - squat_clinic
    ordered: true
  notes: Ido's Squat Clinic Routine X 1 set.
- role: shoulder_rom
  slot_type: skill_practice
  sets: 1
  duration_minutes: 3
  exercise_filter:
    exercise_ids:
    - shoulder_rom_stabilization
    ordered: true
  notes: Shoulder ROM and Stabilization routine X 1 set.
- role: low_bridge
  slot_type: sets_reps
  sets: 1
  reps: 10
  exercise_filter:
    exercise_ids:
    - rotations_into_low_bridge
    ordered: true
  notes: Rotations Into Low Bridge X 10 reps.
- role: qdr_push_up
  slot_type: sets_reps
  sets: 3
  reps: 14
  rest_sec: 60
  exercise_filter:
    exercise_ids:
    - qdr_push_up_advanced
    ordered: true
  notes: QDR Rotational Push Ups — advanced variation X 14 reps / 3 sets / 60 sec rest.
- role: high_bridge
  slot_type: sets_reps
  sets: 3
  reps: 14
  rest_sec: 60
  exercise_filter:
    exercise_ids:
    - rotations_into_high_bridge_advanced
    ordered: true
  notes: Rotations Into High Bridge Advanced X 14 reps / 3 sets / 60 sec rest.
- role: au_cortado
  slot_type: sets_reps
  sets: 3
  reps: 10
  rest_sec: 60
  exercise_filter:
    exercise_ids:
    - au_cortado_press
    ordered: true
  notes: Au Cortado Presses X 10 reps / 3 sets / 60 sec rest.
- role: role
  slot_type: time_domain
  duration_minutes: 2
  sets: 3
  rest_sec: 30
  exercise_filter:
    exercise_ids:
    - role_basic
    ordered: true
  notes: Role work, in random, as little rest as you can for 2 minutes straight / 3 sets / rest 30 sec.
- role: cool_down_shoulder
  slot_type: skill_practice
  sets: 3
  duration_minutes: 6
  exercise_filter:
    exercise_ids:
    - shoulder_rom_stabilization
    ordered: true
  notes: 'F1-F3 X 3 times, resting 60 seconds after F3 only: Shoulder ROM and Stabilization routine.'
- role: cool_down_squat
  slot_type: skill_practice
  sets: 3
  duration_minutes: 6
  exercise_filter:
    exercise_ids:
    - squat_clinic
    ordered: true
  notes: Ido's Squat Clinic Routine (F1-F3 X 3).
- role: cool_down_scapula
  slot_type: skill_practice
  sets: 3
  duration_minutes: 6
  exercise_filter:
    exercise_ids:
    - scapula_mobilization
    ordered: true
  notes: Scapula Mobilization Routine (F1-F3 X 3).
required_equipment: []
sources:
- Ido Portal, Floreio Routines (data/portal/Ido Portal Floreio Routines.pdf), p. 2
notes: Warm-up, singular movement polish at the advanced variations, au cortado presses, role work, an
  extra mobility cool-down.
