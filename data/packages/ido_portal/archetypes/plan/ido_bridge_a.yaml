id: ido_bridge_a
name: Bridge Workout — Advanced
modality: movement_skill
category: movement_skill
training_levels:
- advanced
- elite
duration_estimate_minutes: 60
pool_only: true
slots:
- role: joint_mobility
  slot_type: time_domain
  duration_minutes: 5
  exercise_filter:
    exercise_ids:
    - joint_mobility
    ordered: true
  notes: 5 min of total body joint mobility.
- role: wrists
  slot_type: skill_practice
  sets: 1
  duration_minutes: 3
  exercise_filter:
    exercise_ids:
    - wrists_routine
    ordered: true
  notes: Wrists Routine X 1 set.
- role: shoulder_rom
  slot_type: skill_practice
  sets: 1
  duration_minutes: 3
  exercise_filter:
    exercise_ids:
    - shoulder_rom_stabilization
    ordered: true
  notes: Shoulder ROM and Stabilization routine X 1 set.
- role: squat_clinic
  slot_type: skill_practice
  sets: 1
  duration_minutes: 3
  exercise_filter:
    exercise_ids:
    - squat_clinic
    ordered: true
  notes: Ido's Squat Clinic Routine X 1 set.
- role: scapula
  slot_type: skill_practice
  sets: 1
  duration_minutes: 3
  exercise_filter:
    exercise_ids:
    - scapula_mobilization
    ordered: true
  notes: Scapula Mobilization Routine X 1 set.
- role: static_qdr
  slot_type: static_hold
  sets: 3
  hold_seconds: 30
  rest_sec: 45
  exercise_filter:
    exercise_ids:
    - static_qdr
    ordered: true
  notes: Static QDR 30 sec per side / 3 sets / 45 sec rest.
- role: high_bridge
  slot_type: sets_reps
  sets: 3
  reps: 10
  rest_sec: 60
  exercise_filter:
    exercise_ids:
    - rotation_high_bridge_qdr_exit
    ordered: true
  notes: Rotation Into High Bridge to QDR Exit X 10 reps / 3 sets / 60 sec.
- role: corta_capim
  slot_type: static_hold
  sets: 3
  hold_seconds: 45
  rest_sec: 60
  exercise_filter:
    exercise_ids:
    - corta_capim_rotations
    ordered: true
  notes: Corta Capim Rotations X 45 sec of work per side / 3 sets / 60 sec.
- role: shrimp
  slot_type: sets_reps
  sets: 5
  reps: 10/8/6/4/2
  exercise_filter:
    exercise_ids:
    - shrimp_advanced
    ordered: true
  notes: E1. The Shrimp in a quad stretch position, or with the knee only touching behind you. 10 (5-5
    per leg), 8, 6, 4, 2 reps of E1-E3.
- role: leg_raise
  slot_type: sets_reps
  sets: 5
  reps: 10/8/6/4/2
  exercise_filter:
    exercise_ids:
    - hanging_leg_raise_0_90
    - one_arm_hanging_leg_raise
    ordered: true
  notes: E2. 0-90 Hanging Leg Raises or One Arm Hanging Leg Raises (change arms every rep).
- role: bridge_push_up
  slot_type: sets_reps
  sets: 5
  reps: 10/8/6/4/2
  exercise_filter:
    exercise_ids:
    - one_arm_bridge_push_up
    ordered: true
  notes: E3. One Arm Bridge Push Ups (change arms every rep).
- role: rehab_wrists
  slot_type: skill_practice
  sets: 2
  duration_minutes: 4
  exercise_filter:
    exercise_ids:
    - wrists_routine
    ordered: true
  notes: Wrists Routine X 2 subsequent sets / 60 sec rest.
required_equipment: []
sources:
- Ido Portal, Floreio Routines (data/portal/Ido Portal Floreio Routines.pdf), p. 12
notes: Static QDR, high bridge to QDR exit, corta capim rotations for time, a 10-8-6-4-2 one-arm conditioning
  tri-set.
