id: ido_loco_a
name: Locomotion Workout — Advanced
modality: movement_skill
category: movement_skill
training_levels:
- advanced
- elite
duration_estimate_minutes: 50
pool_only: true
slots:
- role: joint_mobility
  slot_type: time_domain
  duration_minutes: 5
  exercise_filter:
    exercise_ids:
    - joint_mobility
    ordered: true
  notes: 5 min of total body joint mobility.
- role: wrists
  slot_type: skill_practice
  sets: 1
  duration_minutes: 3
  exercise_filter:
    exercise_ids:
    - wrists_routine
    ordered: true
  notes: Wrists Routine X 1 set.
- role: squat_clinic
  slot_type: skill_practice
  sets: 1
  duration_minutes: 3
  exercise_filter:
    exercise_ids:
    - squat_clinic
    ordered: true
  notes: Ido's Squat Clinic Routine X 1 set.
- role: shoulder_rom
  slot_type: skill_practice
  sets: 1
  duration_minutes: 3
  exercise_filter:
    exercise_ids:
    - shoulder_rom_stabilization
    ordered: true
  notes: Shoulder ROM and Stabilization routine X 1 set.
- role: handstand
  slot_type: distance
  sets: 4
  distance_m: 15
  exercise_filter:
    exercise_ids:
    - handstand_walk_elbow_to_knee
    ordered: true
  notes: B1. 15 m. Rest 75 seconds after B6 and repeat 3-5 total circuits.
- role: duck_walk
  slot_type: distance
  sets: 4
  distance_m: 30
  exercise_filter:
    exercise_ids:
    - duck_walk
    ordered: true
  notes: B2. Duck Walk 30 m.
- role: bridge
  slot_type: distance
  sets: 4
  distance_m: 15
  exercise_filter:
    exercise_ids:
    - back_bridge_walk
    ordered: true
  notes: B3. 15 m.
- role: horse_walk
  slot_type: distance
  sets: 4
  distance_m: 30
  exercise_filter:
    exercise_ids:
    - horse_walk
    ordered: true
  notes: B4. Horse Walk 30 m.
- role: lizard_walk
  slot_type: distance
  sets: 4
  distance_m: 15
  exercise_filter:
    exercise_ids:
    - lizard_walk
    ordered: true
  notes: B5. Lizard Walk 15 m.
- role: ostrich_walk
  slot_type: distance
  sets: 4
  distance_m: 30
  exercise_filter:
    exercise_ids:
    - ostrich_walk
    ordered: true
  notes: B6. Ostrich Walk 30 m. Rest 75 seconds after B6 and repeat 3-5 total circuits.
required_equipment: []
sources:
- Ido Portal, Floreio Routines (data/portal/Ido Portal Floreio Routines.pdf), p. 8
notes: Six locomotion patterns as a circuit, 3-5 circuits, 75 seconds after each.
