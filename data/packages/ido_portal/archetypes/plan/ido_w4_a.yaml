id: ido_w4_a
name: Floreio Workout Number 4 — Advanced
modality: movement_skill
category: movement_skill
training_levels:
- advanced
- elite
duration_estimate_minutes: 60
pool_only: true
slots:
- role: joint_mobility
  slot_type: time_domain
  duration_minutes: 5
  exercise_filter:
    exercise_ids:
    - joint_mobility
    ordered: true
  notes: 5 min of total body joint mobility.
- role: wrists
  slot_type: skill_practice
  sets: 1
  duration_minutes: 3
  exercise_filter:
    exercise_ids:
    - wrists_routine
    ordered: true
  notes: Wrists Routine X 1 set.
- role: squat_clinic
  slot_type: skill_practice
  sets: 1
  duration_minutes: 3
  exercise_filter:
    exercise_ids:
    - squat_clinic
    ordered: true
  notes: Ido's Squat Clinic Routine X 1 set.
- role: shoulder_rom
  slot_type: skill_practice
  sets: 1
  duration_minutes: 3
  exercise_filter:
    exercise_ids:
    - shoulder_rom_stabilization
    ordered: true
  notes: Shoulder ROM and Stabilization routine X 1 set.
- role: shoulder_stretch
  slot_type: skill_practice
  sets: 1
  duration_minutes: 3
  exercise_filter:
    exercise_ids:
    - shoulder_rom_stabilization
    ordered: true
  notes: A5. The assisted stretching part of the Shoulder ROM and Stabilization routine only, 1 more set.
    Rest 2 min.
- role: handstand
  slot_type: static_hold
  sets: 3
  hold_seconds: 30
  rest_sec: 45
  exercise_filter:
    exercise_ids:
    - handstand_wall_drill
    ordered: true
  notes: Handstand Body Line Wall Drill X 30 sec X 3 sets / 45 sec rest. Rest 2 min.
- role: straighten
  slot_type: static_hold
  sets: 3
  hold_seconds: 45
  rest_sec: 90
  exercise_filter:
    exercise_ids:
    - handstand_straighten_into_line
    ordered: true
  notes: Handstand Straighten Into Line X 45 sec of total work X 3 sets / 90 sec. Rest 3 min.
- role: gatherings
  slot_type: sets_reps
  sets: 5
  reps: 10
  exercise_filter:
    exercise_ids:
    - gatherings_advanced
    ordered: true
  notes: C1. Gatherings Advanced.
- role: low_bridge
  slot_type: sets_reps
  sets: 5
  reps: 10
  exercise_filter:
    exercise_ids:
    - rotations_into_low_bridge_advanced
    ordered: true
  notes: C2. Rotations Into Low Bridge Advanced.
- role: qdr_push_up
  slot_type: sets_reps
  sets: 5
  reps: 10
  rest_sec: 68
  exercise_filter:
    exercise_ids:
    - qdr_push_up_advanced
    ordered: true
  notes: C3. QDR Rotational Push Ups Advanced. 5 sets of 10 reps per exercise, resting after C3 for 45-90
    sec.
- role: role
  slot_type: time_domain
  duration_minutes: 1
  sets: 3
  rest_sec: 60
  exercise_filter:
    exercise_ids:
    - role_basic
    ordered: true
  notes: Role work + other Floreio movements you have down for 1 minute straight. Flow around the floor.
    Improvisation. Rest 1 min, 3 total sets.
required_equipment: []
sources:
- Ido Portal, Floreio Routines (data/portal/Ido Portal Floreio Routines.pdf), p. 5
notes: Handstand wall drill and straighten into line, five sets of ten of the advanced tri-set, improvised
  role work.
