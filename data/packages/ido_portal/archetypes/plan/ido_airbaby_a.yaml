id: ido_airbaby_a
name: Air Baby and Pulling Workout — Advanced
modality: movement_skill
category: movement_skill
training_levels:
- advanced
- elite
duration_estimate_minutes: 55
pool_only: true
slots:
- role: joint_mobility
  slot_type: time_domain
  duration_minutes: 5
  exercise_filter:
    exercise_ids:
    - joint_mobility
    ordered: true
  notes: 5 min of total body joint mobility.
- role: wrists
  slot_type: skill_practice
  sets: 1
  duration_minutes: 3
  exercise_filter:
    exercise_ids:
    - wrists_routine
    ordered: true
  notes: Wrists Routine X 1 set.
- role: shoulder_rom
  slot_type: skill_practice
  sets: 1
  duration_minutes: 3
  exercise_filter:
    exercise_ids:
    - shoulder_rom_stabilization
    ordered: true
  notes: Shoulder ROM and Stabilization routine X 1 set.
- role: squat_clinic
  slot_type: skill_practice
  sets: 1
  duration_minutes: 3
  exercise_filter:
    exercise_ids:
    - squat_clinic
    ordered: true
  notes: Ido's Squat Clinic Routine X 1 set.
- role: scapula
  slot_type: skill_practice
  sets: 1
  duration_minutes: 3
  exercise_filter:
    exercise_ids:
    - scapula_mobilization
    ordered: true
  notes: Scapula Mobilization Routine X 1 set.
- role: equilibre
  slot_type: static_hold
  sets: 4
  hold_seconds: 12
  rest_sec: 60
  exercise_filter:
    exercise_ids:
    - static_air_baby
    ordered: true
  notes: Static Air Baby 10-15 sec per side X 3-5 sets / 60 sec rest.
- role: qdr_circles
  slot_type: sets_reps
  sets: 3
  reps: 10
  rest_sec: 60
  exercise_filter:
    exercise_ids:
    - qdr_circles
    ordered: true
  notes: QDR Circles X 10 reps per side / 3 sets / 60 sec rest.
- role: high_bridge
  slot_type: sets_reps
  sets: 3
  reps: 10
  rest_sec: 60
  exercise_filter:
    exercise_ids:
    - rotation_high_bridge_qdr_exit
    ordered: true
  notes: Rotation Into High Bridge to QDR Exit X 10 reps / 3 sets / 60 sec.
- role: corta_capim
  slot_type: sets_reps
  sets: 3
  reps: 25
  rest_sec: 60
  exercise_filter:
    exercise_ids:
    - corta_capim_rotations
    ordered: true
  notes: Corta Capim Rotations X 25 reps per side / 3 sets / 60 sec.
- role: pull
  slot_type: static_hold
  sets: 5
  hold_seconds: 10
  rest_sec: 75
  exercise_filter:
    exercise_ids:
    - one_arm_iso_chin_hang_90_90
    ordered: true
  notes: 90-90 One Arm Iso Chin Up Hang 5-15 sec per side, 10 sec between sides / 5 sets / 60-90 sec rest.
- role: prehab_wrists
  slot_type: skill_practice
  sets: 3
  duration_minutes: 6
  exercise_filter:
    exercise_ids:
    - wrists_routine
    ordered: true
  notes: Wrists Routine X 3 subsequent sets.
required_equipment: []
sources:
- Ido Portal, Floreio Routines (data/portal/Ido Portal Floreio Routines.pdf), p. 16
notes: Static air baby, QDR circles, high bridge to QDR exit, corta capim rotations, one-arm 90-90 iso
  chin hangs.
