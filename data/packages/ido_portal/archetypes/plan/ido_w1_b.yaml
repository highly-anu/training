id: ido_w1_b
name: Floreio Workout Number 1 — Beginner
modality: movement_skill
category: movement_skill
training_levels:
- novice
duration_estimate_minutes: 25
pool_only: true
slots:
- role: jump_rope
  slot_type: time_domain
  duration_minutes: 5
  exercise_filter:
    exercise_ids:
    - jump_rope
    ordered: true
  notes: 5 min jump rope.
- role: shoulder_rom
  slot_type: skill_practice
  sets: 1
  duration_minutes: 3
  exercise_filter:
    exercise_ids:
    - shoulder_rom_stabilization
    ordered: true
  notes: Shoulder ROM and Stabilization routine X 1 set.
- role: squat_clinic
  slot_type: skill_practice
  sets: 1
  duration_minutes: 3
  exercise_filter:
    exercise_ids:
    - squat_clinic
    ordered: true
  notes: Ido's Squat Clinic Routine X 1 set.
- role: low_bridge
  slot_type: static_hold
  sets: 3
  hold_seconds: 25
  exercise_filter:
    exercise_ids:
    - slide_into_low_bridge
    ordered: true
  notes: D1. Slide Into Low Bridge X 5 reps of 5-second holds; D1-D3 for 3 total sets.
- role: arch
  slot_type: sets_reps
  sets: 3
  reps: 10
  exercise_filter:
    exercise_ids:
    - rotations_into_arch_wall
    ordered: true
  notes: D2. Rotations Into Arch Using The Wall X 10 reps.
- role: qdr_push_up
  slot_type: sets_reps
  sets: 3
  reps: 10
  exercise_filter:
    exercise_ids:
    - qdr_push_up
    ordered: true
  notes: D3. QDR Rotational Push Ups — beginner variation, 10 reps.
required_equipment: []
sources:
- Ido Portal, Floreio Routines (data/portal/Ido Portal Floreio Routines.pdf), p. 2
notes: Slide into low bridge, rotations into arch and QDR push-ups, three sets.
