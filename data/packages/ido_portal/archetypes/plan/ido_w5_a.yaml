id: ido_w5_a
name: Floreio Workout Number 5 — Advanced
modality: movement_skill
category: movement_skill
training_levels:
- advanced
- elite
duration_estimate_minutes: 45
pool_only: true
slots:
- role: jump_rope
  slot_type: time_domain
  duration_minutes: 5
  exercise_filter:
    exercise_ids:
    - jump_rope
    ordered: true
  notes: 5 min jump rope.
- role: wrists
  slot_type: skill_practice
  sets: 1
  duration_minutes: 3
  exercise_filter:
    exercise_ids:
    - wrists_routine
    ordered: true
  notes: Wrists Routine X 1 set.
- role: squat_clinic
  slot_type: skill_practice
  sets: 1
  duration_minutes: 3
  exercise_filter:
    exercise_ids:
    - squat_clinic
    ordered: true
  notes: Ido's Squat Clinic Routine X 1 set.
- role: shoulder_rom
  slot_type: skill_practice
  sets: 1
  duration_minutes: 3
  exercise_filter:
    exercise_ids:
    - shoulder_rom_stabilization
    ordered: true
  notes: Shoulder ROM and Stabilization routine X 1 set.
- role: bridge
  slot_type: sets_reps
  sets: 3
  reps: 10
  rest_sec: 45
  exercise_filter:
    exercise_ids:
    - rotations_into_high_bridge_advanced
    ordered: true
  notes: B1. Rotations Into High Bridge Advanced X 10 reps; 3 sets of B1-B2, 45 sec between exercises.
- role: gatherings
  slot_type: sets_reps
  sets: 3
  reps: 6
  rest_sec: 45
  exercise_filter:
    exercise_ids:
    - gatherings_advanced
    ordered: true
  notes: B2. Gatherings Advanced X 6 reps. Rest 1 min.
- role: au_cortado
  slot_type: sets_reps
  sets: 3
  reps: 6
  exercise_filter:
    exercise_ids:
    - au_cortado_press
    ordered: true
  notes: C1. Au Cortado Presses X 6 reps, as slow as possible.
- role: role_into_qdr
  slot_type: sets_reps
  sets: 3
  reps: 10
  rest_sec: 90
  exercise_filter:
    exercise_ids:
    - role_into_qdr_push_up
    ordered: true
  notes: C2. Role Into QDR Rotational Push Ups X 10 reps; 3 sets, 90 sec only after C2. Rest 2 min.
- role: nda
  slot_type: sets_reps
  sets: 5
  reps: 10/8/6/4/2
  rest_sec: 38
  exercise_filter:
    exercise_ids:
    - nda_lateral_one_arm_push_up
    ordered: true
  notes: D1. NDA Lateral One Arm Push Ups side to side X 10/8/6/4/2 reps, resting 60/45/30/15 sec between
    sets.
required_equipment: []
sources:
- Ido Portal, Floreio Routines (data/portal/Ido Portal Floreio Routines.pdf), p. 7
notes: Advanced high bridge rotations with advanced gatherings, slow au cortado presses with role into
  QDR push-ups, one-arm NDA lateral push-ups.
