id: ido_another_i
name: Another Workout — Intermediates
modality: movement_skill
category: movement_skill
training_levels:
- intermediate
duration_estimate_minutes: 55
pool_only: true
slots:
- role: joint_mobility
  slot_type: time_domain
  duration_minutes: 5
  exercise_filter:
    exercise_ids:
    - joint_mobility
    ordered: true
  notes: 5 min of total body joint mobility.
- role: wrists
  slot_type: skill_practice
  sets: 1
  duration_minutes: 3
  exercise_filter:
    exercise_ids:
    - wrists_routine
    ordered: true
  notes: Wrists Routine X 1 set.
- role: shoulder_rom
  slot_type: skill_practice
  sets: 1
  duration_minutes: 3
  exercise_filter:
    exercise_ids:
    - shoulder_rom_stabilization
    ordered: true
  notes: Shoulder ROM and Stabilization routine X 1 set.
- role: squat_clinic
  slot_type: skill_practice
  sets: 1
  duration_minutes: 3
  exercise_filter:
    exercise_ids:
    - squat_clinic
    ordered: true
  notes: Ido's Squat Clinic Routine X 1 set.
- role: scapula
  slot_type: skill_practice
  sets: 1
  duration_minutes: 3
  exercise_filter:
    exercise_ids:
    - scapula_mobilization
    ordered: true
  notes: Scapula Mobilization Routine X 1 set.
- role: handstand
  slot_type: static_hold
  sets: 3
  hold_seconds: 25
  rest_sec: 50
  exercise_filter:
    exercise_ids:
    - handstand_wall_drill
    ordered: true
  notes: Handstand Body Line Wall Drill X 20-30 sec X 3 sets / 45-60 sec rest.
- role: qdr_push_up
  slot_type: sets_reps
  sets: 3
  reps: 12
  rest_sec: 60
  exercise_filter:
    exercise_ids:
    - qdr_push_up
    - qdr_push_up_advanced
    ordered: true
  notes: QDR Rotational Push Ups — beginner or advanced variation X 10-14 reps / 3 sets / 60 sec rest.
- role: high_bridge
  slot_type: sets_reps
  sets: 3
  reps: 10
  rest_sec: 60
  exercise_filter:
    exercise_ids:
    - rotations_into_high_bridge
    - rotation_high_bridge_head_qdr_exit
    ordered: true
  notes: Rotations into High Bridge or Rotation Into High Bridge to Head to QDR Exit X 10 reps / 3 sets
    / 60 sec rest.
- role: corta_capim
  slot_type: sets_reps
  sets: 3
  reps: 14
  rest_sec: 45
  exercise_filter:
    exercise_ids:
    - corta_capim_spin
    ordered: true
  notes: Corta Capim Spin X 14 reps / 3 sets / 45 sec rest.
- role: nda
  slot_type: sets_reps
  sets: 3
  reps: 20
  rest_sec: 45
  exercise_filter:
    exercise_ids:
    - nda_lateral_push_up
    ordered: true
  notes: NDA Lateral Push Ups side to side X 20 reps, 3 sets, 45 sec between.
- role: prehab_shoulder
  slot_type: skill_practice
  sets: 2
  duration_minutes: 4
  exercise_filter:
    exercise_ids:
    - shoulder_rom_stabilization
    ordered: true
  notes: Shoulder ROM and Stabilization routine X 1 set with the Scapula Mobilization Routine; 2 supersets,
    no rest.
- role: prehab_scapula
  slot_type: skill_practice
  sets: 2
  duration_minutes: 4
  exercise_filter:
    exercise_ids:
    - scapula_mobilization
    ordered: true
  notes: Scapula Mobilization Routine X 1 set (2 supersets).
required_equipment: []
sources:
- Ido Portal, Floreio Routines (data/portal/Ido Portal Floreio Routines.pdf), p. 13
notes: Handstand wall drill, QDR push-ups, high bridge to head to QDR exit, corta capim spins, NDA lateral
  push-ups.
