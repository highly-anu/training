id: ido_wotd_a
name: Floreio Workout of the Day — Advanced
modality: movement_skill
category: movement_skill
training_levels:
- advanced
- elite
duration_estimate_minutes: 50
pool_only: true
slots:
- role: joint_mobility
  slot_type: time_domain
  duration_minutes: 5
  exercise_filter:
    exercise_ids:
    - joint_mobility
    ordered: true
  notes: 5 min of total body joint mobility.
- role: wrists
  slot_type: skill_practice
  sets: 1
  duration_minutes: 3
  exercise_filter:
    exercise_ids:
    - wrists_routine
    ordered: true
  notes: Wrists Routine X 1 set.
- role: horse_walk
  slot_type: distance
  sets: 1
  distance_m: 20
  exercise_filter:
    exercise_ids:
    - horse_walk
    ordered: true
  notes: Horse Walk from the Locomotion Conditioning Routine X 20 meters.
- role: duck_walk
  slot_type: distance
  sets: 1
  distance_m: 20
  exercise_filter:
    exercise_ids:
    - duck_walk
    ordered: true
  notes: Duck Walk X 20 meters.
- role: ostrich_walk
  slot_type: distance
  sets: 1
  distance_m: 20
  exercise_filter:
    exercise_ids:
    - ostrich_walk
    ordered: true
  notes: Ostrich Walk X 20 meters.
- role: scapula
  slot_type: skill_practice
  sets: 1
  duration_minutes: 3
  exercise_filter:
    exercise_ids:
    - scapula_mobilization
    ordered: true
  notes: Scapula Mobilization Routine X 1 set.
- role: handstand
  slot_type: static_hold
  sets: 2
  hold_seconds: 30
  rest_sec: 60
  exercise_filter:
    exercise_ids:
    - handstand_wall_drill
    ordered: true
  notes: B1. Handstand Body Line Wall Drill X 30 sec; 2 cycles of B1-B2, 60 sec between.
- role: straighten
  slot_type: static_hold
  sets: 2
  hold_seconds: 45
  rest_sec: 60
  exercise_filter:
    exercise_ids:
    - handstand_straighten_into_line
    ordered: true
  notes: B2. Handstand Straighten Into Line X 45 sec total work. Rest 90 sec.
- role: sequence
  slot_type: sets_reps
  sets: 3
  reps: 10/8/6
  rest_sec: 60
  exercise_filter:
    exercise_ids:
    - au_cortado_press_one_arm_bridge
    ordered: true
  notes: 'Au Cortado Press And Rotation Into One Arm Low Bridge: 3 sets of 10, 8, 6 reps / 60 sec rest.'
- role: role_into_qdr
  slot_type: sets_reps
  sets: 3
  reps: 10/8/6
  rest_sec: 60
  exercise_filter:
    exercise_ids:
    - role_into_qdr_push_up
    ordered: true
  notes: 'Role Into QDR Rotational Push Ups: 3 sets of 10, 8, 6 reps / 60 sec rest. Rest 90 sec.'
- role: high_bridge
  slot_type: sets_reps
  sets: 3
  reps: 12/10/8
  rest_sec: 45
  exercise_filter:
    exercise_ids:
    - rotations_into_high_bridge
    ordered: true
  notes: E1. Rotations into High Bridge X 12, 10, 8 reps.
- role: gatherings
  slot_type: sets_reps
  sets: 3
  reps: 12/10/8
  rest_sec: 45
  exercise_filter:
    exercise_ids:
    - gatherings_advanced
    ordered: true
  notes: E2. Gatherings Advanced X 12, 10, 8 reps.
- role: prehab_shoulder
  slot_type: skill_practice
  sets: 2
  duration_minutes: 4
  exercise_filter:
    exercise_ids:
    - shoulder_rom_stabilization
    ordered: true
  notes: Shoulder ROM and Stabilization routine X 2 subsequent sets, no rest.
required_equipment: []
sources:
- Ido Portal, Floreio Routines (data/portal/Ido Portal Floreio Routines.pdf), p. 11
notes: Handstand wall drill and straighten into line, au cortado press into one-arm low bridge, role into
  QDR push-ups, a high bridge and gatherings finisher.
