id: ido_w4_b
name: Floreio Workout Number 4 — Beginner
modality: movement_skill
category: movement_skill
training_levels:
- novice
duration_estimate_minutes: 50
pool_only: true
slots:
- role: joint_mobility
  slot_type: time_domain
  duration_minutes: 5
  exercise_filter:
    exercise_ids:
    - joint_mobility
    ordered: true
  notes: 5 min of total body joint mobility.
- role: wrists
  slot_type: skill_practice
  sets: 1
  duration_minutes: 3
  exercise_filter:
    exercise_ids:
    - wrists_routine
    ordered: true
  notes: Wrists Routine X 1 set.
- role: squat_clinic
  slot_type: skill_practice
  sets: 1
  duration_minutes: 3
  exercise_filter:
    exercise_ids:
    - squat_clinic
    ordered: true
  notes: Ido's Squat Clinic Routine X 1 set.
- role: shoulder_rom
  slot_type: skill_practice
  sets: 1
  duration_minutes: 3
  exercise_filter:
    exercise_ids:
    - shoulder_rom_stabilization
    ordered: true
  notes: Shoulder ROM and Stabilization routine X 1 set.
- role: shoulder_stretch
  slot_type: skill_practice
  sets: 1
  duration_minutes: 3
  exercise_filter:
    exercise_ids:
    - shoulder_rom_stabilization
    ordered: true
  notes: A5. The assisted stretching part of the Shoulder ROM and Stabilization routine only, 1 more set.
    Rest 2 min.
- role: handstand
  slot_type: static_hold
  sets: 5
  hold_seconds: 10
  rest_sec: 50
  exercise_filter:
    exercise_ids:
    - handstand_wall_drill
    ordered: true
  notes: Handstand Body Line Wall Drill X 10 sec X 5 sets / 45-60 sec rest. Rest 3 min.
- role: gatherings
  slot_type: sets_reps
  sets: 5
  reps: 10/8/6/4/2
  exercise_filter:
    exercise_ids:
    - gatherings_beginner
    ordered: true
  notes: C1. Gatherings Beginner Variations.
- role: low_bridge
  slot_type: sets_reps
  sets: 5
  reps: 10/8/6/4/2
  exercise_filter:
    exercise_ids:
    - rotations_into_low_bridge
    - slide_into_low_bridge
    ordered: true
  notes: C2. Rotations Into Low Bridge (or the Slide Into Low Bridge and Rotations Into Arch Using The
    Wall combination).
- role: qdr_push_up
  slot_type: sets_reps
  sets: 5
  reps: 10/8/6/4/2
  rest_sec: 52
  exercise_filter:
    exercise_ids:
    - qdr_push_up
    ordered: true
  notes: C3. QDR Rotational Push Ups. 10, 8, 6, 4, 2 reps per exercise, resting after C3 only for 75,
    60, 45, 30 sec. Rest 2 min.
- role: role
  slot_type: time_domain
  duration_minutes: 3
  exercise_filter:
    exercise_ids:
    - role_basic
    ordered: true
  notes: Role work, in random, as little rest as you can for 3 minutes straight. Flow around the floor.
required_equipment: []
sources:
- Ido Portal, Floreio Routines (data/portal/Ido Portal Floreio Routines.pdf), p. 4
notes: Handstand wall drill, a 10-8-6-4-2 tri-set of gatherings, low bridge and QDR push-ups, three minutes
  of role work.
