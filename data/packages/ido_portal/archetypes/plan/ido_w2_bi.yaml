id: ido_w2_bi
name: Floreio Workout Number 2 — Beginners and Intermediates
modality: movement_skill
category: movement_skill
training_levels:
- novice
- intermediate
duration_estimate_minutes: 35
pool_only: true
slots:
- role: joint_mobility
  slot_type: time_domain
  duration_minutes: 5
  exercise_filter:
    exercise_ids:
    - joint_mobility
    ordered: true
  notes: 5 min of total body joint mobility.
- role: shoulder_rom
  slot_type: skill_practice
  sets: 2
  duration_minutes: 4
  exercise_filter:
    exercise_ids:
    - shoulder_rom_stabilization
    ordered: true
  notes: Shoulder ROM and Stabilization routine X 2 sets / no rest.
- role: squat_clinic
  slot_type: skill_practice
  sets: 1
  duration_minutes: 3
  exercise_filter:
    exercise_ids:
    - squat_clinic
    ordered: true
  notes: Ido's Squat Clinic Routine X 1 set.
- role: low_bridge
  slot_type: static_hold
  sets: 3
  hold_seconds: 25
  exercise_filter:
    exercise_ids:
    - slide_into_low_bridge
    - rotations_into_low_bridge
    ordered: true
  notes: D1. Slide Into Low Bridge X 5 reps of 5-second holds (with D2), or Rotations Into Low Bridge
    X 10 reps.
- role: arch
  slot_type: sets_reps
  sets: 3
  reps: 10
  exercise_filter:
    exercise_ids:
    - rotations_into_arch_wall
    ordered: true
  notes: D2. Rotations Into Arch Using The Wall X 10 reps.
- role: high_bridge
  slot_type: static_hold
  sets: 3
  hold_seconds: 30
  exercise_filter:
    exercise_ids:
    - high_bridge_hold
    - rotations_into_high_bridge
    ordered: true
  notes: D3. High Bridge hold, 30 sec total (break it up if needed), or Rotations into High Bridge X 10
    reps.
- role: au_cortado
  slot_type: sets_reps
  sets: 3
  reps: 14
  exercise_filter:
    exercise_ids:
    - half_au_cortado
    - au_cortado
    ordered: true
  notes: D4. Half Au Cortado X 14 reps, or Au Cortado X 10 reps.
- role: qdr_push_up
  slot_type: sets_reps
  sets: 3
  reps: 10
  rest_sec: 90
  exercise_filter:
    exercise_ids:
    - qdr_push_up
    ordered: true
  notes: D5. QDR Rotational Push Ups — beginner variation X 10 reps. D1-D5 three times, 90 sec after each
    circuit.
required_equipment: []
sources:
- Ido Portal, Floreio Routines (data/portal/Ido Portal Floreio Routines.pdf), p. 3
notes: A five-exercise circuit, three times, no rest between exercises and 90 seconds after each circuit.
