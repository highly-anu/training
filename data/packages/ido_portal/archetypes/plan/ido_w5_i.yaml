id: ido_w5_i
name: Floreio Workout Number 5 — Intermediate
modality: movement_skill
category: movement_skill
training_levels:
- intermediate
duration_estimate_minutes: 40
pool_only: true
slots:
- role: jump_rope
  slot_type: time_domain
  duration_minutes: 5
  exercise_filter:
    exercise_ids:
    - jump_rope
    ordered: true
  notes: 5 min jump rope.
- role: wrists
  slot_type: skill_practice
  sets: 1
  duration_minutes: 3
  exercise_filter:
    exercise_ids:
    - wrists_routine
    ordered: true
  notes: Wrists Routine X 1 set.
- role: squat_clinic
  slot_type: skill_practice
  sets: 1
  duration_minutes: 3
  exercise_filter:
    exercise_ids:
    - squat_clinic
    ordered: true
  notes: Ido's Squat Clinic Routine X 1 set.
- role: shoulder_rom
  slot_type: skill_practice
  sets: 1
  duration_minutes: 3
  exercise_filter:
    exercise_ids:
    - shoulder_rom_stabilization
    ordered: true
  notes: Shoulder ROM and Stabilization routine X 1 set.
- role: bridge
  slot_type: sets_reps
  sets: 3
  reps: 10
  rest_sec: 30
  exercise_filter:
    exercise_ids:
    - rotations_into_high_bridge
    ordered: true
  notes: B1. Rotations into High Bridge X 10 reps; 3 sets of B1-B2, 30 sec in a squat between exercises.
- role: gatherings
  slot_type: sets_reps
  sets: 3
  reps: 10
  rest_sec: 30
  exercise_filter:
    exercise_ids:
    - gatherings_intermediate
    ordered: true
  notes: B2. Gatherings Intermediate Variations X 10 reps. Rest 2 min.
- role: au_cortado
  slot_type: sets_reps
  sets: 3
  reps: 10
  rest_sec: 30
  exercise_filter:
    exercise_ids:
    - au_cortado
    ordered: true
  notes: C1. Au Cortado X 10 reps; 3 sets of C1-C2, 30 sec squatting between.
- role: role_into_qdr
  slot_type: sets_reps
  sets: 3
  reps: 10
  rest_sec: 30
  exercise_filter:
    exercise_ids:
    - role_into_qdr
    ordered: true
  notes: C2. Role Into QDR sequence X 10 reps. Rest 2 min.
- role: nda
  slot_type: sets_reps
  sets: 3
  reps: 20
  rest_sec: 45
  exercise_filter:
    exercise_ids:
    - nda_lateral_push_up
    ordered: true
  notes: D1. NDA Lateral Push Ups side to side X 20 reps, 3 sets, 45 sec between.
required_equipment: []
sources:
- Ido Portal, Floreio Routines (data/portal/Ido Portal Floreio Routines.pdf), p. 6
notes: High bridge rotations with gatherings, au cortado with role into QDR, NDA lateral push-ups.
