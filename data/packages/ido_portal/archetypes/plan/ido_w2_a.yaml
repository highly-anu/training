id: ido_w2_a
name: Floreio Workout Number 2 — Advanced
modality: movement_skill
category: movement_skill
training_levels:
- advanced
- elite
duration_estimate_minutes: 25
pool_only: true
slots:
- role: joint_mobility
  slot_type: time_domain
  duration_minutes: 5
  exercise_filter:
    exercise_ids:
    - joint_mobility
    ordered: true
  notes: 5 min of total body joint mobility.
- role: shoulder_rom
  slot_type: skill_practice
  sets: 2
  duration_minutes: 4
  exercise_filter:
    exercise_ids:
    - shoulder_rom_stabilization
    ordered: true
  notes: Shoulder ROM and Stabilization routine X 2 sets / no rest.
- role: squat_clinic
  slot_type: skill_practice
  sets: 1
  duration_minutes: 3
  exercise_filter:
    exercise_ids:
    - squat_clinic
    ordered: true
  notes: Ido's Squat Clinic Routine X 1 set.
- role: low_bridge
  slot_type: sets_reps
  sets: 1
  reps: 10
  exercise_filter:
    exercise_ids:
    - rotations_into_low_bridge
    ordered: true
  notes: D1. Rotations Into Low Bridge X 10 reps / 1 set.
- role: high_bridge
  slot_type: sets_reps
  sets: 1
  reps: 10
  exercise_filter:
    exercise_ids:
    - rotations_into_high_bridge
    ordered: true
  notes: E1. Rotations Into High Bridge X 10 reps / 1 set.
- role: low_bridge_advanced
  slot_type: sets_reps
  sets: 1
  reps: 10
  exercise_filter:
    exercise_ids:
    - rotations_into_low_bridge_advanced
    ordered: true
  notes: F1. Rotations Into Low Bridge Advanced X 10 reps.
- role: au_cortado
  slot_type: sets_reps
  sets: 1
  reps: 10
  exercise_filter:
    exercise_ids:
    - au_cortado_press
    - au_cortado
    ordered: true
  notes: F2. Au Cortado / Au Cortado Presses X 10 reps.
- role: high_bridge_advanced
  slot_type: sets_reps
  sets: 1
  reps: 10
  exercise_filter:
    exercise_ids:
    - rotations_into_high_bridge_advanced
    ordered: true
  notes: F3. Rotations Into High Bridge Advanced X 10 reps.
- role: qdr_push_up
  slot_type: sets_reps
  sets: 1
  reps: 10
  exercise_filter:
    exercise_ids:
    - qdr_push_up_advanced
    ordered: true
  notes: F4. QDR Rotational Push Ups — advanced variation X 10 reps.
required_equipment: []
sources:
- Ido Portal, Floreio Routines (data/portal/Ido Portal Floreio Routines.pdf), p. 4
notes: Low and high bridge rotations, then advanced bridge rotations, au cortado presses and advanced
  QDR push-ups.
