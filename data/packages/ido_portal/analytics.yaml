# What progress means for Ido Portal's Floreio routines: the routines done as
# written, at the athlete's level, and the holds and practice time they log.
# Moving up a level — the variation one is now capable of — is not tracked yet
# (assessment gating, docs/package-fidelity/ido_portal.md).
id: ido_portal

# The mover's mark: the free handstand, at its ladder's elite rung
# (docs/logic/levels.md). Each routine's level is the source's own version.
elite_standards: [handstand_hold_free_seconds]

progress:
  - id: plan_completion
    label: Routines done as written
    primitive: session_completion
    headline: true

  - id: holds
    label: Holds
    primitive: hold_seconds
    scope: {slot_types: [static_hold]}
    expected: {load_field: hold_seconds}

  - id: practice_time
    label: Practice time
    primitive: duration
    scope: {slot_types: [skill_practice, time_domain]}
    expected: {load_field: duration_minutes}
