# What progress means for Ido Portal's practice. Complexity-based: progress is a
# movement you could not do before, and the practice time that earned it.
id: ido_portal

progress:
  - id: skills
    label: Movements earned
    primitive: unlocks
    headline: true
    scope: {modalities: [movement_skill]}
    min_sessions: 2
    require_clean: true      # earned when owned, not when attended

  - id: practice_time
    label: Practice time
    primitive: duration
    scope: {archetypes: [movement_flow, skill_ladder]}
    expected: {load_field: duration_minutes}

  - id: holds
    label: Holds
    primitive: hold_seconds
    # Ido's holds are skill-practice slots, not static_hold ones (no Ido
    # session has one): scope by the hold exercises themselves.
    scope:
      exercises: [handstand_hold, handstand_freestanding, l_sit, tuck_sit, bridge_low,
                  bridge_high, balance_frog_stance]
      slot_types: [skill_practice]     # not the warm-up and cool-down passes
    expected: {load_field: hold_seconds}

  - id: attendance
    label: Practice attendance
    primitive: session_completion
    scope: {modalities: [movement_skill, mobility]}

movement:
  balance:
    - {a: push, b: pull, min: 0.7, max: 1.4}
