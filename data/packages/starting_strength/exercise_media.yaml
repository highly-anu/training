back_squat:
  animation:
    type: none
  coaching_focus: Think hip hinge loaded onto your back, not a knee bend — sit back and down,
    not just down.
  common_errors:
  - 'Morning star: hips shoot up and chest drops forward — fix with box squat and intentional
    hip-drive cuing'
  - Knees caving medially — cue external rotation, use band above knees as feedback
  - Excessive forward lean — usually ankle dorsiflexion restriction or bar position too high
  - 'Half reps: hip crease above parallel — use a box or depth marker until the habit is built'
  cue_points:
  - 'Brace hard before unracking: 360-degree air pressure through your belt, not just your belly'
  - Break at the hips and knees simultaneously — do not initiate with the knees
  - Push knees out in the direction of your toes throughout the descent
  - Hip crease must pass below the top of the patella at depth
  - Drive the floor away on the ascent — spread the floor, not raise the bar
  - Keep the bar over mid-foot; weight shifts forward or heels rise when this fails
  description: The back squat is the foundational bilateral lower-body strength movement — a
    loaded hip hinge and knee flexion pattern that demands coordinated engagement of the entire
    posterior chain and trunk. Horsemen set the benchmark at 2x bodyweight; Starting Strength
    builds to this from a 3x5 novice progression.
  muscle_diagram:
    highlight_primary:
    - quadriceps
    - glutes
    - erector_spinae
    highlight_secondary:
    - hamstrings
    - adductors
    - core
  muscles_primary:
  - quadriceps
  - glutes
  - erector_spinae
  muscles_secondary:
  - hamstrings
  - adductors
  - core
bench_press:
  animation:
    external_id: Bench_Press_-_Powerlifting
    gif_alt: Bench Press
    gif_source: free_exercise_db
    gif_url: https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Bench_Press_-_Powerlifting/0.jpg
    type: gif
  coaching_focus: Bench pressing is a full-body movement — leg drive and upper-back tightness
    are not optional if you want to press heavy.
  common_errors:
  - Flared elbows at 90 degrees — places the shoulder in an impingement-prone position
  - Butt rising off the bench — usually means the load exceeds current strength
  - Losing upper-back tightness and letting shoulder blades wing under load
  - Bouncing the bar off the chest — catching a bounce trains the wrong quality
  cue_points:
  - 'Grip: roughly 1 finger outside shoulder width; forearms vertical when bar touches chest'
  - Retract and depress the shoulder blades before unracking — hold this through every rep
  - Arch your upper back and keep glutes on the bench; feet drive actively into the floor
  - 'Bar path: slight diagonal from lower chest at the bottom to over the upper chest at the
    top'
  - Touch lower chest or upper sternum — not the clavicle and not the belly
  - Elbows at 45–75 degrees to the torso — straight out stresses the shoulder
  description: The bench press is the foundational horizontal pushing movement — a bilateral
    press where the bar descends to the lower chest and is driven to lockout while the feet
    drive into the floor and the upper back remains tight. The Horsemen goal is 1.5x bodyweight;
    Starting Strength builds from 3x5 linear progression.
  muscle_diagram:
    highlight_primary:
    - pec
    - deltoids
    - triceps
    highlight_secondary:
    - core
    - forearms
  muscles_primary:
  - pec
  - deltoids
  - triceps
  muscles_secondary:
  - core
  - forearms
chin_up:
  animation:
    type: none
  coaching_focus: Every rep from straight arms to the chin over the bar.
  common_errors:
  - Half reps from bent arms
  - Kipping or swinging to finish a rep
  - Craning the neck instead of pulling higher
  cue_points:
  - Start each rep from a dead hang
  - Pull the elbows down to the ribs
  - Chin over the bar, not the head craned up
  description: Hands shoulder-width, palms facing you; from a dead hang, pull until the chin
    clears the bar.
  muscle_diagram:
    highlight_primary:
    - lats
    - biceps
    highlight_secondary:
    - upper_back
    - forearms
  muscles_primary:
  - lats
  - biceps
  muscles_secondary:
  - upper_back
  - forearms
deadlift:
  animation:
    external_id: Axle_Deadlift
    gif_alt: Deadlift
    gif_source: free_exercise_db
    gif_url: https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Axle_Deadlift/0.jpg
    type: gif
  coaching_focus: 'Set the back before you pull: establish your lumbar arch and brace, then
    leg-press the floor away — the back does not initiate the pull.'
  common_errors:
  - 'Hips shooting up first: back rounds as hips rise faster than the bar — corrected by pause
    deadlifts at submaximal load'
  - Bar drifting forward away from the legs — increases moment arm dramatically; keep it dragging
    up the shins
  - Jerking the bar off the floor — causes spinal flexion under rapid load; take slack out first
  - Hyperextending at lockout — squeeze glutes and stand tall, do not lever the lower back
  cue_points:
  - Bar over mid-foot at setup — roughly 1 inch from shins, directly below the scapulae
  - 'Hip hinge to the bar: push the floor away with the legs to find the pull, do not bend and
    grip'
  - 'Establish the arch before pulling: chest up, shoulders slightly in front of the bar, hips
    above knees'
  - 'Take the slack out before pulling: tension the bar against the floor — no jerking'
  - Bar stays in contact with the legs on the way up — a bar path away from the body is a mechanical
    disadvantage
  - Lock out by squeezing glutes and pushing hips forward, not by hyperextending the lower back
  description: The deadlift is the master posterior-chain loading movement and the king of absolute
    strength — the bar is lifted from the floor to hip extension using the legs, hips, and back
    working in concert. Horsemen benchmark is 2.5x bodyweight; Starting Strength programs 1x5
    as the novice primary; Gym Jones builds all Olympic lifting percentages from the tested
    deadlift 1RM.
  muscle_diagram:
    highlight_primary:
    - erector_spinae
    - glutes
    - hamstrings
    highlight_secondary:
    - quadriceps
    - adductors
    - core
    - forearms
  muscles_primary:
  - erector_spinae
  - glutes
  - hamstrings
  muscles_secondary:
  - quadriceps
  - adductors
  - core
  - forearms
power_clean:
  animation:
    external_id: Power_Clean
    gif_alt: Power Clean
    gif_source: free_exercise_db
    gif_url: https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Power_Clean/0.jpg
    type: gif
  coaching_focus: The hips extend violently at the hip crease and the bar is pulled in close
    — any early arm bend kills the pull.
  common_errors:
  - 'Early arm bend: bending the elbows before full hip extension — disconnects hip power from
    the bar'
  - 'Bar swinging away from the body on the first pull: creates a longer lever arm; drag it
    up the thighs'
  - 'Not completing the hip extension: cutting the second pull short means less power transferred
    to the bar'
  - 'Soft elbows in the catch: the front rack must be locked in place before receiving the bar'
  cue_points:
  - 'First pull: identical to deadlift setup — bar over mid-foot, back arched, chest up'
  - The bar must pass the knee before the second pull begins — patience on the first pull
  - At hip contact, extend the hips and shrug explosively; elbows drive high and outside
  - Pull yourself under the bar immediately — do not wait at the top
  - 'Receive in a partial squat: front rack with elbows high, hips above parallel'
  - Stand to full extension before lowering the bar
  description: The power clean pulls the bar from the floor to the front rack in one explosive
    hip-extension-driven movement, receiving it in a partial squat above parallel. It is the
    primary power development movement in the barbell system and a direct training stimulus
    for athletic explosiveness. Starting Strength programs 1x5; Horsemen Olympic Day uses wave
    loading at 80–90%.
  muscle_diagram:
    highlight_primary:
    - glutes
    - hamstrings
    - erector_spinae
    highlight_secondary:
    - quadriceps
    - deltoids
    - core
    - calves
  muscles_primary:
  - glutes
  - hamstrings
  - erector_spinae
  muscles_secondary:
  - quadriceps
  - deltoids
  - core
  - calves
strict_press:
  animation:
    type: none
  coaching_focus: Squeeze your glutes at the top and press your head through the window once
    the bar passes your forehead — do not lean back.
  common_errors:
  - 'Excessive lumbar hyperextension: leaning back to get the bar overhead — work thoracic extension'
  - 'Bar path forward away from vertical: wasted energy; bar should track vertically over midfoot'
  - 'Elbows flaring out and forward: bar rolls off the shoulder shelf before the press begins'
  cue_points:
  - 'Front rack: bar resting on anterior deltoids, elbows slightly in front of the bar'
  - 'Brace hard before pressing: same trunk pressure as a deadlift'
  - Press the bar in a straight line; move your head back to let the bar pass, then press it
    back through
  - Lock out with arms fully extended, bar stacked over the midfoot, glutes squeezed
  - No leg dip — if the hips or knees bend at any point, it becomes a push press
  description: The strict overhead press takes the barbell from a front-rack position to full
    lockout overhead using pure upper-body pressing strength with no leg drive permitted. The
    Horsemen goal is 1x bodyweight; Starting Strength builds from 3x5. It is the prerequisite
    for all push press and jerk variants.
  muscle_diagram:
    highlight_primary:
    - deltoids
    - triceps
    highlight_secondary:
    - core
    - erector_spinae
    - pec
  muscles_primary:
  - deltoids
  - triceps
  muscles_secondary:
  - core
  - erector_spinae
  - pec
