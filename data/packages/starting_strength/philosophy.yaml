id: starting_strength
name: "Starting Strength / Mark Rippetoe"
core_principles:
  - linear_progression_is_fastest_novice_path
  - barbell_compound_lifts_are_primary_stress_stimulus
  - stress_recovery_adaptation_cycle
  - squat_is_proxy_for_overall_development
  - add_weight_every_session_until_stalled
  - form_mastery_before_load_increase
scope:
  - max_strength
bias:
  - max_strength
avoid_with:
  - aerobic_base
  - mixed_modal_conditioning
  - strength_endurance
required_equipment:
  - barbell
  - rack
  - plates
intensity_model: linear_progression
progression_philosophy: load_based
sources:
  - "Starting Strength: Basic Barbell Training (Rippetoe, 3rd ed.)"
  - "data/crossfit/crossfit journal/ — Rippetoe squatting article (2006)"
notes: >
  Strictly a novice-to-early-intermediate barbell methodology. Not designed for
  concurrent training; Rippetoe explicitly argues against mixing heavy conditioning
  with linear progression due to recovery interference. Scope limited to strength
  domains — this philosophy has no conditioning prescription beyond "don't do much."
  Novice completion benchmarks: squat 1.5× BW, deadlift 2× BW, press 0.75× BW.

# Every modality this philosophy's frameworks prescribe has an archetype in
# this package; generation never needs to reach into another philosophy.
self_contained: true

# One continuous phase: linear progression runs until gains stall. Phase text
# is drafted from this package's own notes and framework notes — review before
# relying on it.
primary_track_id: linear_progression
tracks:
  - id: linear_progression
    name: "Linear Progression Program"
    description: >
      The novice barbell program: three full-body sessions a week, weight on
      the bar every session, until it stops going up.
    phases:
      - id: novice_lp
        name: "Novice Linear Progression"
        kind: build
        weeks: 12
        repeatable: true
        framework_id: linear_progression
        focus: "Add weight every session"
        description: >
          Squat 3×5 every session, press or bench 3×5 alternating, deadlift
          1×5. Each session adds weight — about 5 lb on the squat and deadlift,
          2.5 lb on the press. Conditioning stays minimal so recovery goes to
          the bar. The phase runs until a lift stalls for three consecutive
          sessions; that is the end of the novice period.
        adaptations:
          - "Maximal strength in the main barbell lifts"
          - "Technique under progressively heavier loads"
        intensity: "Heavy sets of five, every session"
        # The prose above, in a form tools/check_fidelity.py can test. HLM and
        # 5x5 are the intermediate programs that follow the novice period.
        checks:
          archetypes_required: [3x5_linear]
          archetypes_forbidden: [hlm, 5x5]
          fixed_exercises: true
