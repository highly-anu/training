          rest_sec: 300
          duration_sec: 900
          loaded: true
          notes: A new five-rep max, or within 2 %; warm up with doubles or singles to the work set.
        - role: press
          exercise_id: bench_press
          slot_type: sets_reps
          sets: 1
          reps: 5
          rest_sec: 300
          duration_sec: 900
          loaded: true
          notes: A new five-rep max on Monday's bench.
        - role: power_clean
          exercise_id: power_clean
