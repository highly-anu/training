# What progress means for Starting Strength. Load-based: the bar goes up every
# session in the novice progression, every week in the Texas Method, and each
# progression is over when it has stopped going up.
id: starting_strength

progress:
  - id: bar_load
    label: Load on the bar
    primitive: set_load
    headline: true
    # Every session's bar but the Texas Method's, whose currency is Friday's
    # five-rep max (below); its rows are the texas_method module's.
    scope:
      modalities: [max_strength]
      slot_types: [sets_reps]
      exclude_slot_roles: ["*warm*", "*accessory*", "*prep*", "*chin_ups*", "texas_method_*"]
    expected: achieved_plus_increment
    # A lift missed twice in a row at one weight resets (Alter, "The Reset"):
    # three sessions at one weight is the stall the program answers.
    stall: {sessions: 3, tolerance_pct: 1}

  - id: five_rep_max
    label: Five-rep max
    primitive: set_load
    # The Texas Method's currency is Friday's new five-rep max (Rippetoe).
    scope:
      frameworks: [texas_method]
      archetypes: [tm_intensity]
      slot_types: [sets_reps]
    expected: achieved_plus_increment
    stall: {sessions: 3, tolerance_pct: 1}

  - id: novice_completion
    label: Novice completion standard
    primitive: benchmark_level
    # squat 1.5× BW, deadlift 2× BW, press 0.75× BW — the `intermediate` level
    # of the shared standards, which cite this package as a source.
    benchmarks: [back_squat_bw_ratio, deadlift_bw_ratio, strict_press_bw_ratio]
    target_level: intermediate

# No movement balance declared: 3x5 has no pull slot on purpose, and a push:pull
# warning here would be noise.
benchmarks: [bench_press_bw_ratio, power_clean_bw_ratio]
