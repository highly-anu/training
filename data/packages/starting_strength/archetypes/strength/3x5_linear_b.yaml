id: 3x5_linear_b
name: 3×5 Linear Strength — Workout B
modality: max_strength
category: strength
duration_estimate_minutes: 50
required_equipment:
- barbell
- rack
- plates
applicable_phases:
- base
- build
- peak
- taper
- transition
training_levels:
- novice
sources:
- Starting Strength
- Rippetoe
notes: 'Workout B of the novice program (Rippetoe, "Who Wants to Be a Novice? You Do"):
  squat 3×5 across, bench press 3×5 across, power clean 5×3 across — triples, so fatigue
  does not spoil the technique. Rows are not a substitute. The training contract
  (training_contract.yaml) prescribes it; these slots describe the session.

  '
slots:
- role: squat
  slot_type: sets_reps
  sets: 3
  reps: 5
  intensity: progressing
  rest_sec: 300
  exercise_filter:
    exercise_ids: [back_squat]
  notes: Three sets of five across, after the warm-up; heavier than last time.
- role: bench
  slot_type: sets_reps
  sets: 3
  reps: 5
  intensity: progressing
  rest_sec: 240
  exercise_filter:
    exercise_ids: [bench_press]
  notes: Three sets of five across; workout A presses instead.
- role: power_clean
  slot_type: sets_reps
  sets: 5
  reps: 3
  intensity: progressing
  rest_sec: 180
  exercise_filter:
    exercise_ids: [power_clean]
  notes: Five sets of three across.
