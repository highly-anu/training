id: 3x5_linear
name: 3×5 Linear Strength — Workout A
modality: max_strength
category: strength
duration_estimate_minutes: 60
required_equipment:
- barbell
- rack
- plates
applicable_phases:
- base
- build
- peak
- taper
- transition
training_levels:
- novice
sources:
- Starting Strength
- Rippetoe
notes: 'Workout A of the novice program (Rippetoe, "Who Wants to Be a Novice? You Do"):
  squat 3×5 across, press 3×5 across, one heavy set of five deadlifts, chin-ups three
  sets to failure with five minutes between. Workouts A and B alternate, A-B-A one week
  and B-A-B the next; every lift goes up every time it is trained. The training contract
  (training_contract.yaml) prescribes it; these slots describe the session.

  '
slots:
- role: squat
  slot_type: sets_reps
  sets: 3
  reps: 5
  intensity: progressing
  rest_sec: 300
  exercise_filter:
    exercise_ids: [back_squat]
  notes: Three sets of five across, after the warm-up; heavier than last time.
- role: press
  slot_type: sets_reps
  sets: 3
  reps: 5
  intensity: progressing
  rest_sec: 240
  exercise_filter:
    exercise_ids: [strict_press]
  notes: Three sets of five across; workout B benches instead.
- role: deadlift
  slot_type: sets_reps
  sets: 1
  reps: 5
  intensity: progressing
  rest_sec: 300
  exercise_filter:
    exercise_ids: [deadlift]
  notes: One heavy set of five. Sets across do not work for the deadlift.
- role: chin_ups
  slot_type: sets_reps
  sets: 3
  reps: max
  intensity: bodyweight
  rest_sec: 300
  exercise_filter:
    exercise_ids: [chin_up]
  notes: Three sets to failure, five minutes between them.
