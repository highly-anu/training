#   excluded_tracks: track -> the invention it is
#   source_tests: the tests a rule names as what enforces it
#   inventions: what the app adds that the sources do not contain
#   last_review: kind -> the date of the latest recorded review (S6)

packages:
  bjj:
    status: audited
    shape: contract
    dossier: docs/package-fidelity/bjj.md
    sources_kind: consensus
    debt: []
    currency:
      mat_support: mat_time
    source_tests:
    - test_training_contract.py::test_bjj_conditioning_is_optional_and_never_outnumbers_the_mat
    - test_training_contract.py::test_bjj_mat_time_leads_the_week
    - test_training_contract.py::test_bjj_strength_runs_strengthlogs_cycle_and_the_mat_carries_on
    inventions:
    - 'I1: The class''s blocks and minutes (warm-up, drilling, positional, rolling) are the shape of a
      typical class, not the coach''s plan.'
    - 'I2: The weights are the athlete''s: each lift carries StrengthLog''s rule in its note (R7, R8)
      and the athlete records what they lift; the app prescribes no kilogram, because the article gives
      no starting weights or increments (its app holds them).'
    - 'I3: StrengthLog writes one twelve-week program; it repeats here, its deload week the seventh of
      every twelve, and the competition conditioning deloads in it with the strength work it shares a
      day with. The mat never deloads on a schedule (no source deloads it); an athlete who reports being
      overreached deloads everything, the class then drops live rolling and keeps the drilling, and the
      workouts keep alternating (owner, 2026-10-21).'
    - 'I4: Declared substitutes: positional work or drilling for rolling under an injury; inverted rows
      for pull-ups and the barbell row, Bulgarian split squats for the front squat, a dead hang for the
      plate pinch, a hollow hold for the plank. A lift with no substitute refuses, naming what it needs.'
    - 'I5: Up to four training days, one of the two workouts a week beside the classes, alternating week
      to week: StrengthLog''s two need five days.'
    - 'I6: Competition conditioning is offered from intermediate up; the sources write it for competitors.'
    - 'I7: At six training days, four classes, each on a day of its own, beside two S&C sessions; BJJEE''s
      week has five, Saturday a class and the second S&C session (owner, 2026-10-21: four is fine).'
    - 'I8: The rests are the short end of StrengthLog''s ranges — two minutes on the compound lifts, one
      on the rest — so a workout is about fifty minutes; the notes say up to four. Read as written: "max
      reps" pull-ups are sets to failure, a 20–30-second pinch is a 30-second hold, the weighted plank
      carries a plate, the farmer''s carry is with dumbbells (or kettlebells); the deload notes add an
      easier pull-up and a lower box.'
    next: Exercise media (D3), the output review (S6), and a competition camp if the owner wants one.
