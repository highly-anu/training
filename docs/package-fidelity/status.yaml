# Where every package stands against its source (docs/package-fidelity/README.md).
# tools/check_package_status.py holds this file to the repository: every
# package is listed, and an `audited` one has its dossier, a source test that CI
# runs, no fidelity finding and no orphaned exercise.
#
#   status:  audited | partial | not_started
#   shape:   contract | templates | scheduler   (the engine shape the method needs)
#   source_tests: "file.py::test_name" — the week as the source writes it, pinned
#   inventions: what the app adds that the source does not contain (decided by the owner)

packages:
  wildman_kettlebell:
    status: audited
    shape: contract
    dossier: docs/package-fidelity/wildman_kettlebell.md
    source_tests:
      - test_training_contract.py::test_general_practice_runs_wildmans_phase_two
      - test_training_contract.py::test_source_cycle_retains_movements_and_spacing
      - test_training_contract.py::test_one_tap_confirmation_earns_the_exposure
      - test_training_contract.py::test_pentathlon_keeps_the_five_events_and_test_protocol
    inventions:
      - Pentathlon Prep is built from kettlebell-sport (IKMF) practice; Wildman publishes no pentathlon program.
      - Get-Up and Loaded Mobility and Double-Bell Practice tracks (Codex); his double bells are Phase III, deliberately non-repeating.
      - Clean and press, get-up and deck-squat cycles follow the Nerd Math pattern; his own numbers are in paid programs.
    next: The hand-to-hand option (alternating minutes needs an alternating block); decide the two Codex tracks.

  bjj:
    status: partial
    shape: contract
    dossier: docs/package-fidelity/bjj.md
    source_tests:
      - test_training_contract.py::test_bjj_mat_time_leads_the_week
      - test_training_contract.py::test_bjj_deload_drops_rolling_and_keeps_drilling
      - test_training_contract.py::test_bjj_substitutes_are_declared_and_supporting_blocks_say_when_they_go
    inventions:
      - Class minutes are the shape of a typical class, not the coach's plan.
    next: Five catalog exercises (bear crawl, shuttle sprint, sprawl intervals, takedowns, wall sit) are never prescribed — wire them into a module the sources support, or drop them.

  horsemen_gpp:
    status: partial
    shape: templates
    dossier: docs/package-fidelity/horsemen_gpp.md
    source_tests:
      - test_week_template.py::test_horsemen_runs_the_source_weeks_as_written
      - test_week_template.py::test_horsemen_without_the_equipment_passes_workouts_over
      - test_week_template.py::test_a_regenerate_from_mid_track_carries_on_the_rotation
    inventions:
      - The GPP Circuits track (not in the source) and its archetypes; all 26 fidelity findings are its.
      - The PT test placed on the macro's first and last hard job-specific days (the source never schedules it).
    next: Decide GPP Circuits (rebuild on the source's circuits or drop it); remove the 25 pre-rebuild catalog exercises no workout uses.

  starting_strength:
    status: not_started
    shape: contract
    next: Load per confirmed exposure (add weight after a completed session); A/B alternation is already right; a Texas Method / Heavy-Light-Medium intermediate track.

  uphill_athlete:
    status: not_started
    shape: contract
    next: The weekly volume ramp and the published novice plan; keep declared borrowing.

  marcus_filly:
    status: not_started
    shape: templates
    next: Base Camp's session shape (warm-up, strength by pattern, conditioning); RPE targets from the framework.

  crossfit:
    status: not_started
    shape: templates
    next: The variation policy and the 3-on/1-off pattern with pools of benchmark and mainsite-style workouts.

  gym_jones:
    status: not_started
    shape: templates
    next: Refuse novices (its foundation assumes training history); the published operator templates.

  ido_portal:
    status: not_started
    shape: scheduler
    next: Assessment gating — advancement markers sourced before anything else.

  atg:
    status: not_started
    shape: scheduler
    next: Assessment gating — measurable range and regression gates.

  kelly_starrett:
    status: not_started
    shape: scheduler
    next: Assessment-driven prescription and retesting.
