name: Frontend Build

on:
  pull_request:
    branches: [master]
    paths:
      - 'frontend/**'

jobs:
  build:
    name: TypeScript + Vite build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend

      # Semantic-colour contrast guard. Runs after the build so a compile error
      # is reported first, but it must run on every frontend PR: the class of bug
      # it catches is invisible to tsc, vite and eslint. See docs/frontend-fix-plan.md.
      - name: Test
        run: npm test
        working-directory: frontend
