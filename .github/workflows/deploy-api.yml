name: Deploy API

on:
  push:
    branches: [master]
    paths:
      - 'api.py'
      - 'oauth.py'
      - 'src/**'
      - 'data/**'
      - 'migrations/**'
      - 'requirements.txt'
      - 'Dockerfile'
      - '.dockerignore'
      - 'docs/schemas/**'
      - 'tools/portability_gaps.json'   # served by /api/dev/portability
      - 'fly.toml'

# One deploy at a time. Merging a stack pushes master several times in a row,
# and parallel runs fought over the Fly machines' lease: on 2026-10-31 8 of 13
# failed and production was left on a commit from the middle of the stack. A
# run now waits for the one in flight, and a newer push replaces any run still
# waiting, so the last commit deploys last. A deploy in flight is never
# cancelled, which could leave a release half rolled out.
concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to fly.io
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      # One machine, never more (CLAUDE.md, "Production runs on one machine").
      # --ha=false: a deploy that finds no machine launches one, where flyctl's
      # default also creates a spare. On 2026-10-31 racing deploys left none for
      # a moment, the next run launched two, and production ran on three until
      # the database pooler's 15 sessions were all held and writes failed.
      - run: flyctl deploy --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # Fails the run, which GitHub emails about, when the app is not on one
      # machine; it never scales by itself.
      - name: Check one machine
        run: |
          n=$(flyctl machines list -a training-api -q | grep -c .)
          if [ "$n" -ne 1 ]; then
            echo "::error::training-api runs on $n machines, not 1. Run: fly scale count 1 -a training-api"
            exit 1
          fi
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
