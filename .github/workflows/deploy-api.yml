name: Deploy API

on:
  push:
    branches: [master]
    paths:
      - 'api.py'
      - 'oauth.py'
      - 'src/**'
      - 'data/**'
      - 'migrations/**'
      - 'requirements.txt'
      - 'Dockerfile'
      - '.dockerignore'
      - 'docs/schemas/**'
      - 'tools/portability_gaps.json'   # served by /api/dev/portability
      - 'fly.toml'

jobs:
  deploy:
    name: Deploy to fly.io
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
